EX.push({ id: 'bpe-code4-star', t: 'BPE with a code 4 and a code *', tag: 'Periodontology',
  scenario: `<p>A 52-year-old non-smoker attends as a new patient. Her basic periodontal examination (BPE) is:</p><div class="scroll"><table class="t"><tr><th>UR</th><th>UA</th><th>UL</th></tr><tr><td>3</td><td>2</td><td>4</td></tr><tr><th>LR</th><th>LA</th><th>LL</th></tr><tr><td>3*</td><td>2</td><td>3</td></tr></table></div><p>She has no relevant medical history.</p>`,
  q: 'What is the most appropriate next step in her periodontal assessment?',
  opts: [
    'Repeat the BPE at her next routine recall',
    'Give oral hygiene instruction and record 6-point pocket charts of the upper left sextant only',
    'Give oral hygiene instruction and scale supragingivally, then repeat the BPE in 3 months',
    'Refer to a specialist periodontist without further assessment',
    'Record full-mouth 6-point pocket charts with bleeding, recession, mobility and furcation, plus radiographs to assess bone levels'
  ],
  ans: 4,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for the <b>next step in assessment</b>, not the whole treatment plan. So the answer is about what to record.`, th: ['perio-bpe'] },
    { h: '2 Find the key clue', p: `A <b>code 4</b> (pocket over 5.5 mm, so the black band disappears) in the UL sextant, and a <b>code *</b> (furcation involvement) in the LR sextant.`, th: ['perio-bpe'] },
    { h: '3 Name the rule or guideline', p: `British Society of Periodontology (BSP) BPE guidance (2019). Codes 0 to 2: oral hygiene and risk-factor advice, and removal of plaque-retentive factors. Code 3: initial therapy, then a 6-point chart of that sextant. <b>Code 4 in any sextant</b>: a <b>full-mouth 6-point pocket chart</b> (with bleeding, recession, mobility and furcation) and radiographs to assess bone levels. A * is recorded with the number and treated according to that code, with referral considered. Then diagnose using the 2017 classification.`, th: ['perio-bpe', 'perio-class'] },
    { h: '4 Apply it', p: `One code 4 is enough to need a full-mouth chart, whatever the other sextants score. The 3* in the lower right adds a furcation flag but is not what triggers it. Take radiographs following FGDP(UK) selection criteria, then stage and grade the periodontitis and plan the treatment steps.`, th: ['perio-bpe', 'rad-sel', 'perio-tx'] },
    { h: '5 Eliminate', p: `Sextant-only charting is the code 3 rule. Repeating the BPE or referring blind both skip the assessment the code 4 calls for.`, th: ['perio-bpe'] }
  ],
  wrong: [
    { o: 0, why: `A code 4 shows established periodontitis that needs diagnosing and treating now. Waiting for recall delays care and risks a negligence claim for failure to diagnose.`, th: ['perio-bpe'] },
    { o: 1, why: `Charting only the affected sextant is the approach for code 3. A code 4 or * calls for a full-mouth chart.`, th: ['perio-bpe'] },
    { o: 2, why: `The BPE is a screening tool and does not track response to treatment where pockets are deep. Repeating it does not replace the full charting that codes 4 and * require.`, th: ['perio-bpe', 'perio-tx'] },
    { o: 3, why: `Referral may well be right later, depending on complexity, but the referrer is expected to assess first, with charts, radiographs, a diagnosis and initial oral hygiene work. A referral without them is incomplete.`, th: ['perio-bpe', 'comm-team'] }
  ],
  pattern: 'BPE code 4 anywhere: full-mouth 6-point chart plus radiographs. A * follows its number. Code 3: initial therapy, then a 6-point chart of that sextant. A BPE is a screen, not a diagnosis.'
});

EX.push({ id: 'perio-stage-grade', t: 'Staging and grading periodontitis', tag: 'Periodontology',
  scenario: `<p>A 40-year-old man who has never smoked and does not have diabetes has interproximal bone loss affecting more than 30% of his teeth. The worst site, at the lower right first molar, shows bone loss to the <b>middle third of the root</b>, about 50% of root length on the radiograph. He has lost no teeth to periodontitis. Probing depths are up to 6 mm, with bleeding on probing at several 5 to 6 mm sites.</p>`,
  q: 'Which is the most appropriate diagnosis using the BSP implementation of the 2017 classification?',
  opts: [
    'Generalised periodontitis, stage III, grade B, currently unstable',
    'Generalised periodontitis, stage II, grade C, currently unstable',
    'Generalised periodontitis, stage III, grade C, currently unstable',
    'Generalised periodontitis, stage IV, grade C, currently unstable',
    'Localised periodontitis, stage III, grade A, currently stable'
  ],
  ans: 2,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for a <b>full diagnostic statement</b>: extent, stage, grade and current status. Work out each part separately.`, th: ['perio-class'] },
    { h: '2 Find the key clue', p: `<b>Over 30% of teeth</b> affected, worst bone loss in the <b>middle third of the root</b> (about 50%), <b>age 40</b>, no tooth loss from periodontitis, and pockets of 5 mm or more that bleed.`, th: ['perio-class'] },
    { h: '3 Name the rule or guideline', p: `BSP implementation of the 2017 World Workshop classification. <b>Extent</b>: localised (under 30% of teeth), generalised (30% or more), or molar-incisor pattern. <b>Stage</b> by worst-site radiographic bone loss: I under 15%, II up to the coronal third, III and IV extending to the middle third or beyond (IV is separated from III by tooth loss and complexity, such as five or more teeth lost to periodontitis or masticatory dysfunction). <b>Grade</b> by percentage bone loss divided by age: A under 0.25, B 0.25 to 1.0, C over 1.0. <b>Status</b>: stable when probing depths are 4 mm or less with no bleeding at 4 mm sites and bleeding below 10%. Unstable when any pocket is 5 mm or more, or a 4 mm pocket bleeds.`, th: ['perio-class'] },
    { h: '4 Apply it', p: `Over 30% of teeth means generalised. Middle third of the root means stage III. 50 divided by 40 is 1.25, which is over 1.0, so grade C. Bleeding pockets of 5 to 6 mm mean currently unstable. The BSP flowchart stages on bone loss alone, so tooth loss does not change the stage here.`, th: ['perio-class'] },
    { h: '5 Eliminate', p: `Each wrong option gets one part wrong: the grade (B), the stage (II or IV), or the extent and status (localised, stable).`, th: ['perio-class'] }
  ],
  wrong: [
    { o: 0, why: `Grade B needs a ratio of 0.25 to 1.0. Here 50% divided by 40 years is 1.25, which is grade C (rapid progression).`, th: ['perio-class'] },
    { o: 1, why: `Stage II stops at the coronal third of the root. Bone loss into the middle third is stage III.`, th: ['perio-class'] },
    { o: 3, why: `Stage IV is distinguished from stage III by tooth loss from periodontitis and complexity factors (for example masticatory dysfunction or bite collapse). He has none of these.`, th: ['perio-class'] },
    { o: 4, why: `More than 30% of teeth affected is generalised. A ratio of 1.25 is not grade A. Bleeding 5 to 6 mm pockets make the case unstable.`, th: ['perio-class'] }
  ],
  pattern: 'Stage by worst-site bone loss (under 15% = I, coronal third = II, middle third or beyond = III, with tooth loss and complexity moving it to IV). Grade by % bone loss divided by age (under 0.25 = A, 0.25 to 1.0 = B, over 1.0 = C). Generalised is 30% of teeth or more. Any pocket of 5 mm or more means unstable.'
});

EX.push({ id: 'tongue-ulcer-ng12', t: 'Non-healing ulcer on the lateral tongue', tag: 'Oral medicine · Oral cancer',
  scenario: `<p>A 58-year-old man who smokes 20 cigarettes a day and drinks about 30 units of alcohol a week attends with an ulcer on the right lateral border of the tongue. He first noticed it 4 weeks ago. It is 1 cm across, with a rolled margin and a firm base. There is no sharp tooth or denture nearby. No lymph nodes are palpable.</p>`,
  q: 'What is the most appropriate management?',
  opts: [
    'Refer on the suspected cancer pathway to oral and maxillofacial surgery',
    'Prescribe chlorhexidine mouthwash and review in 3 weeks',
    'Take an incisional biopsy in practice and send it for histopathology',
    'Make a routine referral to oral medicine',
    'Write to his general medical practitioner asking them to refer him'
  ],
  ans: 0,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for <b>management</b>, which here means choosing the referral route and how urgent it is.`, th: ['exam-onc'] },
    { h: '2 Find the key clue', p: `An ulcer that is <b>unexplained</b> (no traumatic cause), present for <b>3 weeks or more</b>, in a high-risk site (<b>lateral tongue</b>), with <b>induration and a rolled margin</b>, in a heavy smoker and drinker.`, th: ['exam-onc', 'omed-ulcer'] },
    { h: '3 Name the rule or guideline', p: `NICE NG12, <i>Suspected cancer: recognition and referral</i>. NG12 (1.8.2) says to consider a suspected cancer pathway referral for unexplained oral ulceration lasting more than 3 weeks. NG12 (1.8.4) also says a dentist should consider this referral for a lump on the lip or in the oral cavity, or a red or red-and-white patch, consistent with oral cancer (erythroplakia or erythroleukoplakia). NG12 now defines the pathway as diagnosis or ruling out of cancer within 28 days of urgent referral. Check your local referral form.`, th: ['exam-onc'] },
    { h: '4 Apply it', p: `He meets the criterion, and the induration makes it more urgent. Refer directly on the suspected cancer pathway to the local oral and maxillofacial (or head and neck) team, using the local proforma. Tell him why, without causing undue alarm, and record the size, site and appearance, ideally with a photograph. Give smoking and alcohol cessation advice too.`, th: ['exam-onc', 'comm-team', 'prev-life'] },
    { h: '5 Eliminate', p: `A further wait, a biopsy in practice, a routine referral and an indirect route through the GP all either delay diagnosis or risk the wrong outcome.`, th: ['exam-onc'] }
  ],
  wrong: [
    { o: 1, why: `A 2-week review fits an ulcer with an obvious traumatic cause that you have removed. This ulcer has already lasted 3 weeks with no cause, so waiting longer delays a possible cancer diagnosis.`, th: ['exam-onc', 'omed-ulcer'] },
    { o: 2, why: `Suspected malignancy should be biopsied by the specialist team, who can choose the site, plan imaging and stage the tumour. A biopsy in practice risks a non-representative sample and delay.`, th: ['exam-onc'] },
    { o: 3, why: `A routine referral is too slow for a lesion that meets the suspected cancer criteria.`, th: ['exam-onc', 'comm-team'] },
    { o: 4, why: `Dentists can refer directly on the suspected cancer pathway. Going through the GP adds a step and delays the referral.`, th: ['exam-onc', 'comm-team'] }
  ],
  pattern: 'Unexplained oral ulcer for 3 weeks or more (especially indurated, or on the lateral tongue or floor of mouth): consider a direct suspected cancer pathway referral (NG12). Do not biopsy and do not wait.'
});

EX.push({ id: 'm3m-ian-coronectomy', t: 'Lower third molar close to the IAN', tag: 'Oral surgery · Third molars',
  scenario: `<p>A 27-year-old woman has had three episodes of pericoronitis around a mesioangular, partially erupted lower right third molar in the past year. The current episode has settled. The tooth is caries-free and not mobile. Her dental panoramic tomograph (DPT) shows darkening of the roots where they cross the inferior alveolar canal, with interruption of the canal's white lines. She is keen to minimise the risk of nerve damage.</p>`,
  q: 'What is the most appropriate treatment?',
  opts: [
    'Surgical removal of the whole tooth with root sectioning',
    'Operculectomy of the overlying soft tissue',
    'Annual radiographic review, with no surgery',
    'Coronectomy',
    'Extraction of the upper right third molar only'
  ],
  ans: 3,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for the <b>most appropriate treatment</b>. Two questions follow: does the tooth need treatment, and if so which operation balances benefit against nerve risk?`, th: ['surg-m3m'] },
    { h: '2 Find the key clue', p: `<b>Recurrent pericoronitis</b> (three episodes) means there is an indication. <b>Darkening of the roots</b> and <b>interruption of the white lines</b> are high-risk radiographic signs of close contact with the inferior alveolar nerve (IAN). The tooth is <b>caries-free and not mobile</b>.`, th: ['surg-m3m', 'rad-interp'] },
    { h: '3 Name the rule or guideline', p: `NICE TA1 (2000): remove third molars only when there is pathology, and recurrent pericoronitis counts. High-risk DPT signs include darkening of the root, interruption of the white lines, diversion of the canal and narrowing of the root. Where these are present, coronectomy is an accepted option. It removes the crown, leaves vital roots below the bone crest and lowers the risk of IAN injury. It is contraindicated with infection around the roots, mobility or pulpal pathology.`, th: ['surg-m3m'] },
    { h: '4 Apply it', p: `An indication is present, the signs are high-risk, the tooth is vital and free of caries, and she wants to minimise nerve risk. Coronectomy is the best fit. Her consent should cover root migration, the chance of a second operation to remove the roots, and failure if the roots are mobilised. Cone beam CT can refine the assessment but is not itself a treatment.`, th: ['surg-m3m', 'prof-consent'] },
    { h: '5 Eliminate', p: `Full removal carries the highest IAN risk. Operculectomy and the upper extraction do not treat the cause. Review alone ignores a clear indication.`, th: ['surg-m3m'] }
  ],
  wrong: [
    { o: 0, why: `Removing the whole tooth is the usual operation, but with high-risk signs it carries the greatest risk of IAN injury. When the tooth is suitable, coronectomy offers lower nerve risk, which is what she has asked for.`, th: ['surg-m3m', 'surg-comp'] },
    { o: 1, why: `The soft tissue usually grows back after operculectomy and pericoronitis recurs. It does not deal with the impacted tooth.`, th: ['surg-m3m'] },
    { o: 2, why: `Monitoring suits disease-free third molars. Three episodes of pericoronitis meet the NICE indication for surgery.`, th: ['surg-m3m'] },
    { o: 4, why: `Removing a traumatising upper molar may help in the short term, but the tooth stays partially erupted and pericoronitis keeps recurring. On its own it is not definitive.`, th: ['surg-m3m', 'surg-inf'] }
  ],
  pattern: 'Indication present plus high-risk IAN signs on the DPT (darkened root, lost white lines, diverted canal) plus a vital, caries-free, non-mobile tooth: coronectomy. Check first for an indication under NICE TA1.'
});

EX.push({ id: 'abscess-no-abx', t: 'Dental abscess without systemic signs', tag: 'Prescribing · Odontogenic infection',
  scenario: `<p>A 34-year-old man has throbbing pain from a lower left first molar with a large carious lesion. There is a small, fluctuant buccal swelling next to the tooth. He is apyrexial, has no trismus, no spreading facial swelling, no lymphadenopathy and feels well. The tooth is tender to percussion and does not respond to sensibility testing. He is fit and well and has no allergies.</p>`,
  q: 'What is the most appropriate management?',
  opts: [
    'Prescribe amoxicillin and review in 5 days before any treatment',
    'Drain the infection by pulp extirpation (or extraction) and incision of the swelling, with analgesia and no antibiotic',
    'Drain the infection and also prescribe phenoxymethylpenicillin for 5 days',
    'Prescribe metronidazole and arrange extraction in 2 weeks',
    'Refer him the same day to the oral and maxillofacial surgery team'
  ],
  ans: 1,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for <b>management</b> of an acute dental abscess. The real decision is whether he needs an antibiotic or just local measures.`, th: ['surg-inf', 'pharm-abx'] },
    { h: '2 Find the key clue', p: `A <b>localised</b>, fluctuant swelling with <b>no systemic signs</b>: no fever, no trismus, no spreading cellulitis, no lymphadenopathy. He is otherwise well.`, th: ['surg-inf'] },
    { h: '3 Name the rule or guideline', p: `SDCEP <i>Drug Prescribing for Dentistry</i> and FGDP(UK) <i>Antimicrobial Prescribing in Dentistry</i>. The first-line treatment for a dental abscess is <b>local</b>: drain it through the root canal, by extraction or by incision. Antibiotics are only for spreading infection or systemic involvement (fever, cellulitis, lymphadenopathy, trismus), for immunocompromised patients, or as an adjunct when drainage cannot be achieved.`, th: ['pharm-abx', 'surg-inf'] },
    { h: '4 Apply it', p: `Localised and no systemic signs, so no antibiotic. Extirpate the pulp (or extract) to drain the infection, incise the fluctuant swelling, and advise ibuprofen and/or paracetamol. Tell him what spreading signs to watch for and when to come back.`, th: ['pharm-abx', 'pharm-analg', 'resto-endo'] },
    { h: '5 Eliminate', p: `Every option with an antibiotic either uses it in place of drainage or adds it without an indication. Hospital referral is for spreading or airway-threatening infection.`, th: ['pharm-abx'] }
  ],
  wrong: [
    { o: 0, why: `Antibiotics do not replace drainage. Delaying local treatment prolongs the infection and is inappropriate antimicrobial use, which drives resistance.`, th: ['pharm-abx'] },
    { o: 2, why: `With effective drainage and no systemic signs, an antibiotic adds no benefit. Its harms (adverse effects, resistance) remain.`, th: ['pharm-abx'] },
    { o: 3, why: `Metronidazole without drainage, followed by a 2-week wait for definitive care, is both unnecessary prescribing and delayed treatment.`, th: ['pharm-abx', 'surg-inf'] },
    { o: 4, why: `Urgent referral is for spreading infection, a threatened airway, difficulty swallowing, or a patient who is systemically very unwell. A localised abscess is managed in practice.`, th: ['surg-inf'] }
  ],
  pattern: 'Dental abscess: drain it (pulp extirpation, extraction or incision). Prescribe an antibiotic only for spreading infection, systemic signs or immunocompromise, or when drainage is impossible. An antibiotic never replaces drainage.'
});

EX.push({ id: 'canine-interceptive', t: 'Unpalpable upper canine at age 10', tag: 'Orthodontics · Developing dentition',
  scenario: `<p>A 10-year-old girl attends for a routine check. You cannot palpate the upper right permanent canine in the buccal sulcus. The upper left canine bulge is palpable. The upper right primary canine is retained and firm. Parallax radiographs show the upper right permanent canine is <b>palatally displaced</b>, with no resorption of the adjacent incisor roots. Both arches are uncrowded and she has a Class I incisor relationship.</p>`,
  q: 'What is the most appropriate interceptive management?',
  opts: [
    'Monitor and re-palpate at age 13, when the canine should erupt',
    'Refer for surgical exposure and orthodontic alignment of the canine now',
    'Extract the upper right first premolar to make space for the canine',
    'Refer for surgical removal of the displaced permanent canine',
    'Extract the upper right primary canine and review radiographically in about 12 months'
  ],
  ans: 4,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for <b>interceptive</b> management. That means a simple step now, to improve the chance that the canine erupts by itself.`, th: ['ortho-inter'] },
    { h: '2 Find the key clue', p: `Age <b>10</b>, an <b>unpalpable</b> canine on one side (asymmetry), canine <b>palatally</b> displaced on radiographs, <b>no crowding</b>, primary canine retained, and no resorption of the incisors.`, th: ['ortho-inter', 'paed-dev'] },
    { h: '3 Name the rule or guideline', p: `RCS England Faculty of Dental Surgery guideline on managing the palatally ectopic maxillary canine. Palpate the canines from about age 10. If a canine is unpalpable or the sides differ, localise it with radiographs (parallax). In an uncrowded arch, aged roughly 10 to 13, with a palatally displaced canine, <b>extracting the primary canine</b> can improve the canine's position. If it has not improved within about 12 months, refer for specialist management. Check the exact review interval and age range in the current RCS guideline.`, th: ['ortho-inter'] },
    { h: '4 Apply it', p: `She fits every criterion: the right age, an uncrowded arch, palatal displacement and no resorption. Extract the upper right primary canine and repeat the radiographs at review. If the canine has not improved, refer to an orthodontist.`, th: ['ortho-inter', 'rad-sel'] },
    { h: '5 Eliminate', p: `Waiting gives up the interceptive window. Exposure and removal are later, specialist options. Extracting the premolar treats a space problem she does not have.`, th: ['ortho-inter'] }
  ],
  wrong: [
    { o: 0, why: `Waiting until 13 loses the window in which extracting the primary canine works best. The displaced canine may also resorb the incisor roots in the meantime.`, th: ['ortho-inter', 'paed-dev'] },
    { o: 1, why: `Exposure and alignment is used when interceptive extraction fails or is not suitable, usually in the permanent dentition with full appliances. It is premature at 10 when a simpler option exists.`, th: ['ortho-inter', 'ortho-iotn'] },
    { o: 2, why: `The arch is uncrowded, and lack of space is not why a canine is palatally displaced. Taking out the premolar does not guide the canine and wastes a healthy tooth.`, th: ['ortho-inter'] },
    { o: 3, why: `Removing the permanent canine is a last resort: for example, if the patient declines orthodontics or the canine is unfavourably placed and cannot be aligned. It is not interceptive.`, th: ['ortho-inter'] }
  ],
  pattern: 'Unpalpable or asymmetric canine at 10 or older: localise it with parallax radiographs. Palatal canine, uncrowded arch, age 10 to 13: extract the primary canine and review radiographically at about 12 months. If it has not improved, refer.'
});

EX.push({ id: 'consent-16yo', t: 'A 16-year-old attending without her parents', tag: 'Professionalism · Consent',
  scenario: `<p>A 16-year-old girl attends alone with toothache from a lower first molar. She needs a pulpotomy and a temporary restoration today. She says she does not want her parents to know she has been to the dentist. She understands the diagnosis, the options (including doing nothing), the risks, and what would happen if she declined. She can weigh this up and tell you her decision.</p>`,
  q: 'What is the most appropriate approach to consent?',
  opts: [
    'Treat only once a parent has given consent, because she is under 18',
    'Assess whether she is Gillick competent before you accept her consent',
    'Accept her own consent and treat her, because at 16 she is presumed to have capacity',
    'Give emergency pain relief only and defer the treatment until a parent can attend',
    'Ask a colleague to witness her consent as a second opinion on her competence'
  ],
  ans: 2,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for the <b>approach to consent</b>. The key fact is her age, because the legal test depends on it.`, th: ['prof-consent'] },
    { h: '2 Find the key clue', p: `She is <b>16</b>. She clearly understands, retains and weighs the information and can communicate a decision.`, th: ['prof-consent'] },
    { h: '3 Name the rule or guideline', p: `In England and Wales, people aged <b>16 and 17</b> are <b>presumed to have capacity</b> to consent to treatment (Family Law Reform Act 1969 and the Mental Capacity Act (MCA) 2005, which applies from 16). <b>Gillick competence</b> is the test for children <b>under 16</b>. The GDC <i>Standards for the Dental Team</i> also require you to respect her confidentiality. The law in Scotland differs (the Age of Legal Capacity (Scotland) Act 1991).`, th: ['prof-consent', 'prof-conf', 'prof-gdc'] },
    { h: '4 Apply it', p: `She is 16, so presume she has capacity. She shows she has it anyway. Take her consent, record the discussion, and treat. Encourage her to involve her parents, but respect her wish for confidentiality unless there is a safeguarding concern.`, th: ['prof-consent', 'prof-conf', 'exam-safeg'] },
    { h: '5 Eliminate', p: `Parental consent is not needed. Gillick is the wrong test at 16. Delay and witnesses add nothing the law requires.`, th: ['prof-consent'] }
  ],
  wrong: [
    { o: 0, why: `There is no rule that under-18s need parental consent. From 16 a young person can consent to their own treatment.`, th: ['prof-consent'] },
    { o: 1, why: `This is the classic trap. Gillick competence is the test for under-16s. At 16 the MCA 2005 applies and capacity is presumed.`, th: ['prof-consent'] },
    { o: 3, why: `Delaying needed treatment when she has capacity and has consented is not in her interest. Insisting on a parent breaches her confidentiality.`, th: ['prof-consent', 'prof-conf'] },
    { o: 4, why: `A witness is not a legal requirement for consent and does not change whether she has capacity. Good records of the conversation are what matters.`, th: ['prof-consent'] }
  ],
  pattern: 'Aged 16 or over: presume capacity (MCA 2005) and test it only if in doubt. Under 16: assess Gillick competence. Parental consent is not needed if a young person has capacity, but encourage them to involve their family.'
});

EX.push({ id: 'la-max-dose-child', t: 'Maximum LA dose for a 20 kg child', tag: 'Local anaesthesia · Paediatric',
  scenario: `<p>A healthy 6-year-old boy weighing <b>20 kg</b> needs several extractions under local anaesthesia. You are using <b>2% lidocaine with 1:80,000 adrenaline</b> in <b>2.2 mL</b> cartridges. Your practice protocol sets the maximum lidocaine dose at <b>4.4 mg/kg</b>.</p>`,
  q: 'What is the maximum number of whole cartridges you can give?',
  opts: [
    '1 cartridge',
    '2 cartridges',
    '3 cartridges',
    '4 cartridges',
    '20 cartridges'
  ],
  ans: 1,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for the maximum number of <b>whole cartridges</b>. So work out the mg limit, then the mg in each cartridge, then divide and round <b>down</b>.`, th: ['pain-la'] },
    { h: '2 Find the key clue', p: `<b>20 kg</b>, <b>2%</b>, <b>2.2 mL</b> cartridge and <b>4.4 mg/kg</b>. The stem gives every figure you need.`, th: ['pain-la'] },
    { h: '3 Name the rule or guideline', p: `A 2% solution contains 2 g per 100 mL, which is <b>20 mg/mL</b>. Maximum dose in mg is the weight in kg times the dose in mg/kg. The UK maximum quoted for lidocaine with adrenaline varies by source: 4.4 mg/kg is widely used in UK dental teaching, while the general UK lidocaine SmPC allows up to 7 mg/kg with adrenaline and the BNF refers dental prescribers to expert dental sources. That is why the stem states the limit. Check the product SmPC and your local protocol.`, th: ['pain-la'] },
    { h: '4 Apply it', p: `<b>Mg per cartridge</b>: 20 mg/mL times 2.2 mL = <b>44 mg</b>. <b>Maximum dose</b>: 4.4 mg/kg times 20 kg = <b>88 mg</b>. <b>Cartridges</b>: 88 divided by 44 = <b>2</b>. Adrenaline check: 1:80,000 is 1 g in 80,000 mL, which is 12.5 micrograms/mL, so about 27.5 micrograms per cartridge. That is well within safe limits at this volume.`, th: ['pain-la'] },
    { h: '5 Eliminate', p: `Each wrong answer comes from a typical slip: a decimal error in the concentration, using a different mg/kg figure, or halving the dose.`, th: ['pain-la'] }
  ],
  wrong: [
    { o: 0, why: `One cartridge (44 mg) is only half the 88 mg limit. You would get this answer by using 2.2 mg/kg or by mixing up mL and mg.`, th: ['pain-la'] },
    { o: 2, why: `Three cartridges (132 mg) is over the 88 mg limit set in the stem. You would get this answer by using a higher mg/kg figure, such as 7 mg/kg.`, th: ['pain-la'] },
    { o: 3, why: `Four cartridges comes from taking 2% as 10 mg/mL (22 mg per cartridge). 2% is 20 mg/mL, so this dose is double the limit.`, th: ['pain-la'] },
    { o: 4, why: `Twenty cartridges comes from taking 2% as 2 mg/mL, a tenfold error. That would be a lethal overdose of 880 mg.`, th: ['pain-la', 'pain-sed'] }
  ],
  pattern: 'Percentage times 10 = mg/mL (2% = 20 mg/mL). Mg per cartridge = mg/mL times volume. Maximum cartridges = (mg/kg times kg) divided by mg per cartridge, rounded down. 1:80,000 adrenaline = 12.5 micrograms/mL.'
});

EX.push({ id: 'needlestick-first-aid', t: 'Needlestick injury from a used needle', tag: 'Health and safety · Infection control',
  scenario: `<p>While re-sheathing a needle after an inferior alveolar nerve block, a dental nurse pricks her finger through her glove. The needle had been used on a patient whose bloodborne virus status is unknown. The skin is punctured and bleeding slightly. It is 11.00 am and the patient is still in the chair.</p>`,
  q: 'What is the most appropriate immediate action?',
  opts: [
    'Scrub the wound with a nail brush and alcohol hand rub, then finish the session',
    'Suck the wound, apply a plaster and report it at the end of the day',
    'Apply chlorhexidine and wait for the source patient\'s blood test results before seeking advice',
    'Encourage bleeding, wash under running water with soap, cover it, report it at once and get urgent occupational health or A&E assessment',
    'Squeeze the wound hard and give her a dose of antiretroviral drugs from the practice emergency kit'
  ],
  ans: 3,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for the <b>immediate action</b>: first aid, then the urgent next step.`, th: ['mgmt-hs'] },
    { h: '2 Find the key clue', p: `A <b>percutaneous</b> injury from a <b>used</b> needle, a source whose bloodborne virus status is <b>unknown</b>, and the source patient is <b>still present</b>, so a source risk assessment is possible.`, th: ['mgmt-hs', 'mgmt-ipc'] },
    { h: '3 Name the rule or guideline', p: `UK sharps injury guidance (UK Health Security Agency, the Health and Safety (Sharp Instruments in Healthcare) Regulations 2013, and the practice inoculation injury policy). <b>First aid</b>: encourage gentle bleeding, wash with soap and running water, do not scrub or suck, then cover. <b>Report it at once</b> and get an <b>urgent</b> assessment the same day (occupational health, or A&E out of hours). HIV post-exposure prophylaxis (PEP) works best when started as early as possible, preferably within 24 hours, and is not started beyond 72 hours (BASHH/BHIVA 2021 guideline).`, th: ['mgmt-hs', 'mgmt-ipc'] },
    { h: '4 Apply it', p: `Do the first aid, stop work and report to the clinician in charge. Ask the source patient, with their consent, for a risk history and blood test. Send the nurse for urgent assessment. Record the incident, check her hepatitis B immunity, and review why re-sheathing by hand happened. Use a safety device or a one-handed technique.`, th: ['mgmt-hs', 'mgmt-gov'] },
    { h: '5 Eliminate', p: `Scrubbing, sucking, squeezing hard, waiting, and taking drugs without assessment are all wrong.`, th: ['mgmt-hs'] }
  ],
  wrong: [
    { o: 0, why: `Scrubbing damages the skin and can increase uptake of the virus. Finishing the session delays assessment and possible PEP.`, th: ['mgmt-hs'] },
    { o: 1, why: `Sucking the wound is contraindicated, and leaving the report until later wastes the hours when PEP works best.`, th: ['mgmt-hs'] },
    { o: 2, why: `Antiseptics do not replace washing. Waiting for the source results can delay PEP past the time when it is most effective, so seek assessment at once.`, th: ['mgmt-hs'] },
    { o: 4, why: `Hard squeezing or milking is not advised. PEP is started after a risk assessment by occupational health or an emergency department, not from a dental practice kit.`, th: ['mgmt-hs', 'emerg-drugs'] }
  ],
  pattern: 'Sharps injury: bleed, wash and cover. No scrubbing or sucking. Report at once and get urgent same-day assessment for PEP (the earlier the better, usually within 72 hours). Risk-assess the source, record the incident, then fix the system.'
});

EX.push({ id: 'ppv-2x2', t: 'Positive predictive value from a 2×2 table', tag: 'Evidence-based practice · Statistics',
  scenario: `<p>A new chairside test for oral dysplasia is compared with biopsy (the reference standard) in 200 patients with oral white patches.</p><div class="scroll"><table class="t"><tr><th></th><th>Biopsy: dysplasia</th><th>Biopsy: no dysplasia</th><th>Total</th></tr><tr><td>Test positive</td><td>40</td><td>10</td><td>50</td></tr><tr><td>Test negative</td><td>20</td><td>130</td><td>150</td></tr><tr><td>Total</td><td>60</td><td>140</td><td>200</td></tr></table></div>`,
  q: 'What is the positive predictive value of the test?',
  opts: [
    '80%',
    '67%',
    '87%',
    '93%',
    '85%'
  ],
  ans: 0,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for the <b>positive predictive value (PPV)</b>: if the test is positive, how likely is it that the patient has the disease? It is a question about a <b>row</b> of the table (test positive), not a column.`, th: ['prof-ebp'] },
    { h: '2 Find the key clue', p: `Label the cells. True positives (TP) = 40, false positives (FP) = 10, false negatives (FN) = 20, true negatives (TN) = 130. The test-positive row total is <b>50</b>.`, th: ['prof-ebp'] },
    { h: '3 Name the rule or guideline', p: `<b>PPV</b> = TP divided by (TP + FP), working across the row. <b>NPV</b> = TN divided by (TN + FN), across the row. <b>Sensitivity</b> = TP divided by (TP + FN), down the column. <b>Specificity</b> = TN divided by (TN + FP), down the column. Predictive values change with prevalence. Sensitivity and specificity do not.`, th: ['prof-ebp'] },
    { h: '4 Apply it', p: `PPV = 40 divided by (40 + 10) = 40 divided by 50 = <b>80%</b>.`, th: ['prof-ebp'] },
    { h: '5 Eliminate', p: `Work out the other statistics. Sensitivity = 40/60 = 67%. NPV = 130/150 = 87%. Specificity = 130/140 = 93%. Accuracy = (40 + 130)/200 = 85%. Each distractor is the answer to a different question.`, th: ['prof-ebp'] }
  ],
  wrong: [
    { o: 1, why: `67% is the sensitivity (40/60), worked down the disease column instead of across the test-positive row.`, th: ['prof-ebp'] },
    { o: 2, why: `87% is the negative predictive value (130/150): the chance of no disease given a negative test.`, th: ['prof-ebp'] },
    { o: 3, why: `93% is the specificity (130/140), the proportion of people without dysplasia who test negative.`, th: ['prof-ebp'] },
    { o: 4, why: `85% is the overall accuracy ((40 + 130)/200), the proportion of all results that are correct.`, th: ['prof-ebp'] }
  ],
  pattern: 'Predictive values go across the rows (test result). Sensitivity and specificity go down the columns (true disease). PPV = TP/(TP + FP). Prevalence changes PPV and NPV but not sensitivity or specificity.'
});

OSCE.push({ id: 'consent-m3m', t: 'Consent for lower third molar surgery', short: 'Explain surgical removal of LR8 and obtain valid consent, covering material risks and alternatives.',
  domains: ['Information imparting', 'Patient communication'],
  brief: `<p>Mr Daniel Okafor, 26, has had three episodes of pericoronitis around a partially erupted, mesioangular LR8 in the last year. The panoramic radiograph shows the roots overlying the inferior alveolar canal with darkening of the roots. He has been listed for surgical removal under local anaesthetic. Obtain his consent. You do not need to examine him.</p>`,
  actor: `<p>You are a delivery driver and play five-a-side football. You read online that "people end up with a numb face forever". You want to know how long you will be off work and whether you can drive afterwards. You ask: "Can't you just give me antibiotics every time it flares up?" If the risk of nerve injury is explained clearly and honestly, you agree. If the candidate is vague, you say you want to think about it.</p>`,
  approach: [
    `Introduce yourself, confirm identity, explain the purpose: to talk through the operation so he can decide.`,
    `Check what he knows and what worries him (ideas, concerns, expectations).`,
    `Explain why removal is advised: recurrent pericoronitis meets NICE TA1 criteria; prophylactic removal is not recommended.`,
    `Describe the procedure: local anaesthetic, gum flap, possible bone removal and sectioning, stitches; a few minutes to about 20 minutes or more for a difficult tooth.`,
    `Common effects: pain, swelling, bruising, limited opening for a few days; bleeding; infection; dry socket.`,
    `Material risks: inferior alveolar nerve injury (numb lip and chin) and lingual nerve injury (numb tongue, altered taste), mostly temporary, rarely permanent. Give figures honestly and explain the radiographic signs raise his risk.`,
    `Alternatives: no treatment (further infections, possible spreading infection), antibiotics only for acute episodes (not a long-term solution), coronectomy (lower nerve risk, root left behind, small chance of later removal), referral for cone beam CT.`,
    `Practical points: time off work (a few days), driving after LA is fine but not if in significant pain or taking drowsy medicines, avoid sport for a few days, post-operative instructions and analgesia.`,
    `Chunk and check; use teach-back for the nerve risk. Offer a leaflet and time to think; consent can be withdrawn.`,
    `Summarise and record the discussion, risks given, alternatives and his decision.`
  ],
  marks: [
    `Confirms identity and explores the patient's understanding and concerns`,
    `Gives a clear indication for removal consistent with NICE TA1`,
    `Explains the procedure in lay terms`,
    `Discloses nerve injury risk honestly, distinguishing temporary from permanent`,
    `Offers reasonable alternatives including no treatment and coronectomy`,
    `Answers the antibiotic question correctly (not a long-term solution)`,
    `Checks understanding (teach-back), offers written information and time`,
    `States that consent will be documented and can be withdrawn`
  ],
  phrases: [
    `"Before I explain, can I ask what you already know about the operation?"`,
    `"Most people who get numbness find it settles within weeks or months, but in a small number it can be permanent."`,
    `"Just so I know I've explained it well, can you tell me in your own words what the risks to the nerve are?"`,
    `"You don't have to decide today."`
  ],
  traps: [
    `Saying "it is a routine procedure" or "nerve damage never happens"`,
    `Skipping alternatives, especially no treatment and coronectomy`,
    `Using jargon such as "mesioangular" or "IAN" without explanation`,
    `Getting the signature without checking understanding`
  ],
  check: `BAOMS patient information (checked October 2026) gives: inferior dental nerve risk under 1% if the tooth is away from the nerve, up to about 9% if in very close contact; lingual nerve under 0.5%; recovery can take up to 18 months and rarely is incomplete; dry socket about 2%; after coronectomy under 3% chance that the roots need removing later. Other sources give different figures, so use your unit's consent form.`,
  th: ['surg-m3m', 'prof-consent'] });

OSCE.push({ id: 'bad-news-usc', t: 'Breaking bad news: urgent suspected cancer referral', short: 'Tell a patient you are referring a non-healing ulcer urgently, without false reassurance or premature diagnosis.',
  domains: ['Patient communication', 'Information imparting', 'Management'],
  brief: `<p>Mrs Jean Harris, 62, has a 1.5 cm indurated ulcer on the left lateral border of the tongue that has not healed in 4 weeks despite smoothing a sharp tooth. She smokes 20 cigarettes a day. You have decided to make an urgent suspected cancer referral to the oral and maxillofacial surgery department. Explain this to her.</p>`,
  actor: `<p>You came in expecting the dentist to say it had healed. Your husband died of lung cancer two years ago. If the candidate mentions cancer without warning, you become tearful and quiet. When ready, you ask: "Is it cancer? Am I going to die?" You are worried about who will look after your dog if you go into hospital. You calm down if the candidate is honest, kind and gives a clear plan.</p>`,
  approach: [
    `Setting: private, sit down, no interruptions; ask if she would like someone with her.`,
    `Perception: ask what she thinks is happening with the ulcer.`,
    `Invitation: ask how much detail she would like.`,
    `Knowledge: give a warning shot ("I'm a little concerned"), then explain the ulcer has not healed and needs a specialist to examine it and probably take a biopsy.`,
    `Be honest when asked about cancer: it is one of the things the specialist needs to rule out; you cannot tell today; many ulcers turn out not to be cancer, but it is important to check quickly.`,
    `Emotions: acknowledge tears, allow silence, respond to her husband's history.`,
    `Strategy: urgent suspected cancer referral, letter sent today, hospital should contact her soon; ask her to contact you if she has not heard within the expected time.`,
    `Explain a biopsy simply if asked. Mention smoking support sensitively, not as blame.`,
    `Summary: check understanding, give written information, offer a follow-up call, inform her GP.`
  ],
  marks: [
    `Prepares the setting and asks about a companion`,
    `Establishes the patient's perception before giving news`,
    `Uses a warning shot and plain language`,
    `Answers "is it cancer?" honestly without diagnosing or falsely reassuring`,
    `Acknowledges and responds to emotion; allows silence`,
    `Explains the urgent referral pathway and timescale`,
    `Safety-nets: who to contact if no appointment arrives`,
    `Documents and plans follow-up; offers support`
  ],
  phrases: [
    `"I'm afraid the ulcer hasn't healed the way I hoped, and that concerns me."`,
    `"I can't tell you today what it is. That's why I want a specialist to see you quickly."`,
    `"I can see this is very hard, especially after what happened to your husband."`,
    `"If you haven't heard from the hospital within two weeks, please ring me and I'll chase it."`
  ],
  traps: [
    `Saying "I'm sure it's nothing" or, at the other extreme, "You have cancer"`,
    `Using the phrase "two-week wait" without explaining what it means`,
    `Ignoring the emotional cue about her husband`,
    `Lecturing about smoking at the wrong moment`
  ],
  check: `NICE NG12 (page last updated 15 April 2026), checked in full: 1.8.2 says consider a suspected cancer pathway referral for oral cancer in people with unexplained oral ulceration lasting more than 3 weeks or a persistent unexplained neck lump; 1.8.3 says consider an urgent referral for assessment for possible oral cancer by a dentist for a lump on the lip or in the oral cavity or a red or red-and-white patch; 1.8.4 says consider a suspected cancer pathway referral by the dentist when the dentist assesses a lump or patch as consistent with oral cancer. All three say "consider". NG12 now defines a suspected cancer pathway referral as diagnosis or ruling out of cancer within 28 days (Faster Diagnosis Standard) and "urgent" as before 2 weeks, so check the local pathway and timescale.`,
  th: ['exam-onc', 'comm-pt'] });

OSCE.push({ id: 'angry-complaint', t: 'An angry patient with a complaint', short: 'De-escalate an angry patient whose crown has failed and explain the complaints procedure.',
  domains: ['Patient communication', 'Management'],
  brief: `<p>Mr Steve Patel, 48, had an NHS crown on UL6 fitted by your colleague 4 months ago. It has come off twice. He has asked to see "someone in charge" and is shouting in reception. The practice manager has asked you to speak to him in a private room. Your colleague is on holiday.</p>`,
  actor: `<p>You are furious. You lost a day's pay last time. You say: "That dentist is useless, I want my money back and I'm reporting her." You calm down if you feel listened to and receive an apology. If the candidate blames the colleague or argues, you get louder. You want the crown sorted quickly and an explanation. You ask how to complain properly.</p>`,
  approach: [
    `Ensure safety: private room, sit at the same level, keep an exit; a colleague nearby.`,
    `Introduce yourself and your role. Let him speak without interruption.`,
    `Acknowledge feelings and apologise for his experience without admitting fault or criticising the colleague.`,
    `Clarify the facts and what he wants (crown fixed, explanation, compensation).`,
    `Offer practical help now: an appointment to assess and re-cement or remake the crown.`,
    `Explain NHS rules if relevant: restorations under the NHS in England carry a 12-month guarantee for replacement in many cases.`,
    `Explain the complaints procedure: written policy, acknowledgment within 3 working days, investigation and response; escalation to the ICB and then the Ombudsman.`,
    `Explain that GDC referral is for fitness to practise concerns, not refunds, without discouraging him.`,
    `Summarise, agree next steps, document, and inform the practice manager and colleague.`
  ],
  marks: [
    `Maintains safety and a calm, non-defensive manner`,
    `Allows the patient to express his concerns fully`,
    `Acknowledges emotion and apologises appropriately`,
    `Does not criticise the colleague or speculate about blame`,
    `Offers a practical remedy`,
    `Accurately explains the complaints route and timescales`,
    `Summarises and agrees a plan; documents`
  ],
  phrases: [
    `"I can see how frustrating this has been, especially losing time off work."`,
    `"I'm sorry this has happened. I want to help put it right."`,
    `"I can't comment on what happened at your previous visits until I've looked into it, but I can see you today."`,
    `"Here is our complaints procedure. You'll hear from us within three working days."`
  ],
  traps: [
    `Arguing or becoming defensive`,
    `Blaming or defending the colleague`,
    `Promising a refund you cannot authorise`,
    `Stating the wrong escalation route`
  ],
  check: `Checked: Schedule 3 paragraph 11 of the GDS Contracts Regulations 2005 requires the contractor to repair or replace a filling, root filling, inlay, porcelain veneer or crown at no charge when this is needed within 12 months of it being provided, subject to exceptions (for example where the repair is needed because of trauma). It does not cover bridges or dentures.`,
  th: ['comm-hard', 'mgmt-gov'] });

OSCE.push({ id: 'anxious-sedation', t: 'An anxious patient: sedation options', short: 'Explore anxiety and explain sedation choices, safety requirements and alternatives.',
  domains: ['Patient communication', 'Information gathering', 'Information imparting'],
  brief: `<p>Ms Chloe Evans, 31, needs two restorations and an extraction of LL6. She has avoided dentistry for 6 years. Her Modified Dental Anxiety Scale (MDAS) score is 22. She is fit and well and takes no medicines. Explore her anxiety and discuss options, including sedation.</p>`,
  actor: `<p>You fainted during an extraction as a teenager and hate needles and the sound of the drill. You want to be "knocked out". You live alone, drive to work and look after your 4-year-old son. If asked, you say you might be pregnant: your period is a week late. You would accept sedation if it is explained well.</p>`,
  approach: [
    `Introduce, build rapport, use open questions to explore the cause of anxiety.`,
    `Acknowledge her courage in attending; normalise anxiety.`,
    `Take a relevant history: medical, medicines, pregnancy possibility, alcohol, escort and childcare.`,
    `Explain non-drug options: tell-show-do, stop signal, short appointments, topical anaesthetic, music, CBT referral.`,
    `Explain conscious sedation: she stays awake and able to respond but relaxed; often little memory afterwards.`,
    `Compare inhalation sedation (nitrous oxide and oxygen, quick recovery) with intravenous midazolam (more effective for severe anxiety, cannula, escort needed).`,
    `Explain why general anaesthesia is not first choice in primary care: needs hospital referral and justification, higher risk.`,
    `Address possible pregnancy: confirm before sedation; defer elective sedation.`,
    `Safety: assessment visit, written consent, escort for IV sedation, no driving, machinery, alcohol, signing legal documents or caring alone for her child for 24 hours.`,
    `Summarise, check understanding, give written information, agree a plan.`
  ],
  marks: [
    `Explores the cause of anxiety with empathy`,
    `Takes a focused medical and social history, including pregnancy`,
    `Offers non-pharmacological options`,
    `Explains conscious sedation accurately (not general anaesthesia)`,
    `Compares inhalation and intravenous sedation clearly`,
    `Gives accurate pre- and post-operative instructions, including escort and childcare`,
    `Responds correctly to possible pregnancy`,
    `Checks understanding and agrees a plan`
  ],
  phrases: [
    `"Can you tell me what it is about the dentist that worries you most?"`,
    `"With sedation you'll be relaxed and drowsy, but still able to talk to me. It isn't the same as being put to sleep."`,
    `"You'll need a responsible adult to take you home and stay with you, and someone else to look after your son."`
  ],
  traps: [
    `Promising she will be "knocked out"`,
    `Missing the pregnancy and childcare issues`,
    `Forgetting the 24-hour restrictions`,
    `Jumping straight to sedation without exploring anxiety`
  ],
  check: `Checked in SDCEP Conscious Sedation in Dentistry (3rd edition 2017, reviewed unchanged 2022): written consent is required for sedation (GDC 3.1.6); a responsible adult escort is needed for anything other than inhalation sedation and should stay with the patient for the rest of the day; general anaesthesia is not permitted in primary dental care; non-drug options include cognitive behavioural therapy. The detailed patient instructions (the 24-hour restrictions, fasting, age thresholds, pregnancy) sit in the IACSD report (Standards for Conscious Sedation in the Provision of Dental Care, 2015), which was not read, so check it. An MDAS score of 19 or more is the cut-off for high dental anxiety in UK population data.`,
  th: ['pain-sed', 'comm-hard'] });

OSCE.push({ id: 'missing-lateral', t: 'Replacing a missing upper lateral incisor', short: 'Explain options to replace a missing UL2 to a young adult, with pros, cons and costs.',
  domains: ['Information imparting', 'Patient communication'],
  brief: `<p>Miss Aisha Rahman, 19, has a congenitally missing UL2. The space is 5 mm. UL1 and UL3 are unrestored and healthy. She wears a removable acrylic denture, which she dislikes. Her oral hygiene is good. Explain the options for replacing the tooth.</p>`,
  actor: `<p>You are a university student. You want "the best option" but have limited money. You have heard implants last forever. You ask whether you could have it done before your graduation in 3 months. If asked, you say you finished brace treatment at 15.</p>`,
  approach: [
    `Introduce, explore her concerns and expectations, and what she dislikes about the denture.`,
    `Explain that there are several options, each with pros and cons, and that one size does not fit all.`,
    `Accept the gap or continue the denture: cheap, reversible, but she dislikes it.`,
    `Orthodontics: space closure with canine substitution or space redistribution (may need further treatment first).`,
    `Resin-bonded bridge, usually a cantilever from UL3: minimal tooth preparation, quick, good success; can debond.`,
    `Conventional bridge: destroys healthy tooth tissue; generally avoided on unrestored teeth.`,
    `Implant: no preparation of adjacent teeth; needs enough bone and space (often a minimum width), completed facial growth, surgery, months of treatment, higher cost; not "forever" (peri-implantitis, aesthetic risks).`,
    `Address the 3-month timescale realistically: resin-bonded bridge is achievable; an implant may not be.`,
    `Mention NHS availability versus private cost, honestly and without pressure.`,
    `Check understanding, give written information, offer time to decide; record.`
  ],
  marks: [
    `Explores expectations and concerns`,
    `Covers all reasonable options including no treatment`,
    `Gives balanced pros and cons for each`,
    `Recognises the role of growth and space/bone for implants`,
    `Recommends minimally invasive options for unrestored abutments`,
    `Addresses cost and timescale honestly`,
    `Checks understanding and supports her decision`
  ],
  phrases: [
    `"There isn't one best option for everyone; it depends on what matters most to you."`,
    `"An implant is a good option for many people, but it isn't maintenance-free and needs enough space and bone."`,
    `"A bonded bridge involves very little drilling of the neighbouring tooth."`
  ],
  traps: [
    `Recommending a conventional bridge on healthy teeth`,
    `Overselling implants or ignoring cost and time`,
    `Omitting orthodontic and no-treatment options`
  ],
  check: `Minimum mesiodistal space for a narrow implant (often quoted around 5.5 to 6 mm) and the usual minimum age for implants (after growth, often 18 or older, later in some) vary; confirm with current restorative guidance.`,
  th: ['prosth-imp', 'comm-pt'] });

OSCE.push({ id: 'anaphylaxis-la', t: 'Medical emergency: anaphylaxis after local anaesthetic', short: 'Lead the team through anaphylaxis using ABCDE and the Resuscitation Council UK algorithm.',
  domains: ['Applied clinical knowledge', 'Management', 'Peer communication'],
  brief: `<p>You have just given an inferior dental block to Mr Tom Wright, 45. Two minutes later he says he feels unwell. He is flushed, has a widespread rash and wheeze, and his lips are swelling. Your dental nurse is with you. Manage the situation, talking the examiner through each step. A manikin and emergency kit are available.</p>`,
  actor: `<p>Examiner gives findings when asked: airway patent but voice hoarse; respiratory rate 28, wheeze, oxygen saturation 90%; pulse 130, blood pressure 80/50; alert but anxious; widespread urticaria. If adrenaline is given correctly, after 5 minutes there is little change. After a second dose he improves. He mentions he had a latex reaction once.</p>`,
  approach: [
    `Stop treatment, remove anything from the mouth, call for help, ask the nurse to bring the emergency kit and oxygen.`,
    `Assess ABCDE quickly. Recognise anaphylaxis: sudden airway or breathing or circulation problem with skin changes.`,
    `Ask someone to call 999 and say "anaphylaxis".`,
    `Position: lie flat with legs raised; sit up if breathing is difficult; do not stand him up.`,
    `Give intramuscular adrenaline 1:1000, 500 micrograms (0.5 mL) into the anterolateral thigh.`,
    `High-flow oxygen 15 L/min via non-rebreathe mask.`,
    `Remove the trigger: consider latex gloves; change to non-latex.`,
    `Reassess ABCDE; repeat adrenaline after 5 minutes if no improvement.`,

    `Hands over and documents; plans allergy referral`
  ],
  phrases: [
    `"Sarah, please call 999, say anaphylaxis, then bring the emergency kit."`,

  ],
  traps: [

OSCE.push({ id: 'doac-history', t: 'Medical history and risk assessment: patient on a DOAC', short: 'Take a focused history and plan an extraction for a patient on apixaban.',
  domains: ['Information gathering', 'Diagnosis', 'Management'],
  brief: `<p>Mrs Margaret Lewis, 74, needs extraction of a carious, non-restorable LR6. Her medical history form says "blood thinner". Take a focused medical history, assess her bleeding risk and explain how you will manage the extraction.</p>`,
  actor: `<p>You take apixaban 5 mg twice daily for atrial fibrillation, started 2 years ago. You also take ramipril and atorvastatin. You had a minor stroke 3 years ago. You have no kidney or liver disease. You often take ibuprofen for your knees. You ask: "Should I stop my tablets for a week before?"</p>`,
  approach: [
    `Introduce; take a structured medical history: the anticoagulant, dose and timing, indication, prescriber.`,
    `Ask about other drugs that increase bleeding (antiplatelets, NSAIDs, SSRIs), kidney and liver disease, bleeding history, alcohol.`,
    `Assess procedure risk: check the extraction. A simple extraction of 1 to 3 teeth with a restricted wound is low risk in SDCEP 2022, so the DOAC is not changed. A complex or surgical extraction, many teeth or a large wound is higher risk.`,
    `Explain the plan: do not stop apixaban for days. For a low-risk extraction she takes it as usual. Only if the procedure is higher risk does she miss the morning dose on the day and take her evening dose at the usual time. (The "no earlier than 4 hours after haemostasis" rule applies to the delayed morning dose of once-daily rivaroxaban or edoxaban.)`,
    `Plan the procedure: early in the day and early in the week, atraumatic technique, local haemostatic measures (packing with an absorbable haemostat, sutures), confirm haemostasis before she leaves.`,
    `Analgesia: paracetamol; avoid NSAIDs such as ibuprofen.`,
    `Post-operative instructions: pressure with gauze, avoid rinsing and hot drinks, who to contact out of hours.`,
    `Explain why not to stop the drug: stroke risk outweighs bleeding risk.`,
    `Check understanding and document; liaise with the prescriber only if unusual factors exist.`
  ],
  marks: [
    `Identifies the drug, dose, indication and timing`,
    `Asks about other drugs and conditions that affect bleeding`,
    `Correctly classifies the procedure bleeding risk`,
    `Gives correct DOAC advice per SDCEP`,
    `Describes local haemostatic measures and timing`,
    `Advises against NSAIDs and suggests paracetamol`,
    `Explains thrombotic risk of stopping`,
    `Gives clear post-operative and emergency advice`
  ],
  phrases: [
    `"Please don't stop your apixaban for a week. That would put you at risk of another stroke."`,
    `"For a simple extraction you take your tablets as normal. If I had to do something bigger, you would skip the morning tablet and take your evening tablet at the usual time."`,
    `"For pain afterwards, use paracetamol rather than ibuprofen."`
  ],
  traps: [
    `Advising her to stop the anticoagulant for several days`,
    `Asking for an INR (not useful for DOACs)`,
    `Missing the NSAID use`,
    `Giving the rivaroxaban advice (delay dose) for apixaban (miss dose)`
  ],
  check: `Checked in SDCEP Management of Dental Patients Taking Anticoagulants or Antiplatelet Drugs (2nd ed, 2022) and its quick reference guide: apixaban and dabigatran (twice daily) miss the morning dose and take the evening dose at the usual time; rivaroxaban and edoxaban (once daily, morning) delay the morning dose until at least 4 hours after haemostasis. Low-risk procedures (for example simple extractions of 1 to 3 teeth with a restricted wound) are treated without interrupting the DOAC. The guidance advises paracetamol rather than NSAIDs.`,
  th: ['med-bleed', 'exam-hx'] });

OSCE.push({ id: 'sbar-omfs', t: 'Telephone referral to on-call OMFS using SBAR', short: 'Refer a patient with a spreading odontogenic infection by phone, clearly and concisely.',
  domains: ['Peer communication', 'Diagnosis', 'Management'],
  brief: `<p>Mr James Kelly, 34, attends with a 3-day history of increasing swelling of the left submandibular region from a carious LL7. He has a temperature of 38.7°C, pulse 112, mouth opening of 15 mm, a raised floor of mouth and pain on swallowing. He has type 1 diabetes. You decide he needs urgent hospital assessment. Telephone the on-call oral and maxillofacial surgery (OMFS) registrar. The examiner plays the registrar.</p>`,
  actor: `<p>You are the busy on-call registrar. You interrupt after 30 seconds if the candidate has not said why they are calling. You ask: "Is his airway OK?", "What are his observations?", "Has he had any antibiotics?", "Can he get here himself?" You accept him for assessment in the emergency department and ask the candidate not to give anything by mouth.</p>`,
  approach: [
    `Prepare: notes, observations, medical history in front of you.`,
    `Situation: introduce yourself, practice, patient name and age; state the concern: spreading infection with possible airway risk; request urgent assessment.`,
    `Background: tooth, duration, medical history (type 1 diabetes), medicines, allergies, any antibiotics taken.`,
    `Assessment: temperature, pulse, trismus, floor of mouth swelling, dysphagia; any dyspnoea, stridor, voice change or drooling.`,
    `Recommendation: ask for immediate assessment; agree transport (ambulance if airway compromise).`,
    `Answer the registrar's questions; read back the plan; record the name, time and advice.`,
    `Tell the patient the plan; nil by mouth; send a referral letter and copies of radiographs.`
  ],
  marks: [
    `States the reason for calling within the first sentences`,
    `Gives a concise, relevant background including diabetes`,
    `Reports observations and red flags accurately`,
    `Makes a clear request with urgency`,
    `Agrees safe transport`,
    `Reads back and records the plan`
  ],
  phrases: [
    `"I'm calling because I'm worried about a spreading dental infection that may affect his airway."`,
    `"His temperature is 38.7, pulse 112, he can only open 15 millimetres and the floor of his mouth is raised."`,
    `"Can I confirm: you'd like him sent to the emergency department now, nil by mouth?"`
  ],
  traps: [
    `Opening with a long history before the reason for calling`,
    `Forgetting observations or the diabetes`,
    `Sending the patient home with oral antibiotics`,
    `Not recording who you spoke to`
  ],
  th: ['comm-team', 'surg-inf'] });

OSCE.push({ id: 'impaired-colleague', t: 'Peer communication: colleague suspected to be impaired by alcohol', short: 'Speak privately to a colleague who smells of alcohol, protect patients and escalate.',
  domains: ['Peer communication', 'Management'],
  brief: `<p>You are an associate. Dr Mark Shaw, another associate, arrived late this morning. Your nurse tells you he smells strongly of alcohol and his hands are shaking. He has a full list including an extraction at 10:30. Speak to him. The examiner plays Dr Shaw.</p>`,
  actor: `<p>You are going through a divorce and have been drinking heavily. You had "a few" last night. You become defensive: "I'm fine, mind your own business." If the candidate is supportive and non-judgemental, you admit you are struggling and agree not to treat patients today. You ask the candidate not to tell anyone.</p>`,
  approach: [
    `Speak in private, at once, before he treats more patients.`,
    `Open with concern, not accusation; state what has been observed.`,
    `Listen; respond with empathy to his personal situation.`,
    `Be clear that patient safety comes first: he should not treat patients today.`,
    `Arrange cover: inform the practice owner or manager; reschedule or reallocate patients.`,
    `Do not promise confidentiality; explain that you have a duty to raise concerns (GDC Principle 8).`,
    `Offer support: GP, occupational health, the Dentists' Health Support Programme or Practitioner Health; his indemnity provider.`,
    `Ensure he does not drive home.`,
    `Escalate: practice owner, and if needed the commissioner or the GDC if patients are at risk and the problem continues. Document.`

  phrases: [
    `"Mark, can I have a quiet word? I'm a bit worried about you."`,

  traps: [

OSCE.push({ id: 'avulsion-phone', t: 'Telephone advice: avulsed permanent incisor', short: 'Advise a parent on the phone to replant or store an avulsed tooth and attend urgently.',
  domains: ['Information gathering', 'Information imparting', 'Patient communication'],
  brief: `<p>The receptionist puts through a call from Mrs Clare Murphy. Her son Ben, 9, fell off his scooter 10 minutes ago and knocked out a front tooth. She has the tooth in her hand. Give advice over the phone.</p>`,
  actor: `<p>You are panicking. The tooth is dirty with grit. Ben is crying but alert, did not lose consciousness and has not vomited. His chin is grazed. You say: "Should I wrap it in tissue?" If asked to replant, you say you are scared to hurt him. If told to store it, you have milk in the fridge.</p>`,
  approach: [
    `Calm the parent; get name, child's age and a contact number.`,
    `Check for head injury red flags: loss of consciousness, vomiting, drowsiness, confusion, amnesia; if any, go to the emergency department.`,
    `Confirm it is a permanent tooth (age 9, a front tooth) and ask how long since the injury.`,
    `Advise: hold the tooth by the crown, not the root.`,
    `If dirty, rinse gently in milk, saline or the child's saliva; do not scrub the root.`,
    `Replant it immediately if she can, gently, the right way round; have Ben bite on a clean cloth.`,
    `If she cannot replant: store it in milk (best), or saline, or the child's saliva spat into a clean container. Water is a poor medium, though better than letting the tooth dry out; never leave it dry.`,
    `Come to the practice immediately; bring the tooth.`,
    `Explain what will happen: assessment, radiographs, flexible splint for about 2 weeks, tetanus check, possible antibiotics and follow-up. Root canal treatment depends on root development: within about 2 weeks for a closed apex; an immature open apex is monitored for revascularisation and treated if pulp necrosis or infection develops.`,
    `Check understanding by asking her to repeat the key steps.`
  ],
  marks: [
    `Screens for head injury`,
    `Confirms a permanent tooth and the time out of the mouth`,
    `Advises holding by the crown`,
    `Correct cleaning advice`,
    `Encourages immediate replantation`,
    `Gives correct storage medium if not replanted`,
    `Arranges immediate attendance`,
    `Uses teach-back`
  ],
  phrases: [
    `"Hold the tooth by the white part only, not the root."`,
    `"If it is dirty, rinse it gently in milk or saline, then push it gently back into the gap the right way round."`,
    `"If you can't, put it in a cup of milk and come straight here."`
  ],
  traps: [
    `Advising to wrap the tooth in tissue or store it dry`,
    `Scrubbing the root`,
    `Forgetting head injury screening`,
    `Delaying the appointment`
  ],
  check: `Checked in the IADT 2020 avulsion guideline (Fouad and colleagues, Dental Traumatology): hold by the crown; replant at the site if possible; if dirty, rinse gently in milk, saline or saliva; flexible splint for 2 weeks; root canal treatment within 2 weeks for a closed apex; for an open apex, revascularisation is the aim and endodontic treatment starts when necrosis or infection is identified; tetracyclines such as doxycycline are generally not recommended under 12 years. Check the guideline for the antibiotic choice in younger children.`,
  th: ['paed-trauma', 'comm-pt'] });

OSCE.push({ id: 'vba-perio', t: 'Smoking cessation very brief advice and periodontitis diagnosis', short: 'Explain a periodontitis diagnosis and deliver very brief advice (Ask, Advise, Act).',
  domains: ['Information imparting', 'Patient communication', 'Diagnosis'],
  brief: `<p>Mr Paul Green, 45, has generalised bleeding gums. Basic periodontal examination (BPE) scores are 4 in every sextant. Radiographs show bone loss to the middle third of the roots. He smokes 15 cigarettes a day. Your diagnosis is generalised periodontitis, stage III, grade C, currently unstable, with smoking as a risk factor. Explain the diagnosis and give smoking cessation advice.</p>`,
  actor: `<p>You thought bleeding gums were normal. You have tried to stop smoking before, cold turkey, and failed. You ask: "Will vaping help?" and "Will my teeth fall out?" You are open to help if the candidate is not preachy.</p>`,
  approach: [
    `Introduce; ask what he knows about his gums.`,
    `Explain periodontitis in plain terms: gum and bone infection around teeth caused by plaque bacteria and the body's response.`,
    `Explain staging (how much damage: stage III is severe bone loss) and grading (how fast: grade C, partly because he smokes 10 or more a day).`,
    `Explain the prognosis honestly: treatment can stabilise it; some teeth may be at risk.`,
    `Ask: confirm smoking status and record it.`,
    `Advise: the best way to stop is with stop smoking support and medication or a vaping product; it greatly improves the chance of success and helps his gums heal.`,
    `Act: offer a referral to the local stop smoking service; discuss nicotine replacement and e-cigarettes as aids.`,
    `Explain the treatment plan: oral hygiene, professional mechanical plaque removal, subgingival instrumentation, review and supportive care.`,
    `Check understanding; give written information; agree a plan.`
  ],
  marks: [
    `Explores the patient's understanding`,
    `Explains periodontitis, stage and grade clearly`,
    `Links smoking to grade and outcome`,
    `Delivers Ask, Advise, Act in a non-judgemental way`,
    `Offers a referral to a stop smoking service`,
    `Answers the vaping question accurately`,
    `Outlines the treatment plan and patient's role`
  ],
  phrases: [
    `"Bleeding gums aren't normal. They're a sign of inflammation."`,
    `"The best way of stopping smoking is with a combination of medication and specialist support. Would you like me to refer you?"`,
    `"Vaping is less harmful than smoking, though not harmless, and it can help people quit."`
  ],
  traps: [
    `Lecturing about the dangers of smoking instead of offering help`,
    `Using "stage" and "grade" without explanation`,
    `Telling him he will lose all his teeth, or that all will be fine`,
    `Saying vaping is as harmful as smoking`
  ],
  check: `Checked in the NCSCT very brief advice (VBA+) briefing (March 2026): Ask and record smoking status, Advise that the best way to quit is specialist support plus medication or a nicotine vape, Act on the response; the briefing says patients are three times more likely to quit with support and a stop smoking aid. The NHS describes vaping as less harmful than smoking but not harmless.`,
  th: ['prev-life', 'perio-class'] });

OSCE.push({ id: 'safeguarding-child', t: 'Safeguarding concern: child with unexplained injuries', short: 'Gather information about a child with unexplained bruising, discuss concerns with the parent and plan referral.',
  domains: ['Information gathering', 'Patient communication', 'Management'],
  brief: `<p>Lily, 3, attends with her mother's partner for a check-up. You notice bruising on both ears and the side of her neck, and a torn upper labial frenum. The partner says she "fell off the sofa". Lily is quiet and withdrawn. Talk to the partner and then explain to the examiner what you will do.</p>`,
  actor: `<p>You are the mother's partner, not her father. You become irritable if pushed: "Kids fall over all the time." You say her mother is at work. You give a vague account of when the fall happened. You ask whether you can go now.</p>`,
  approach: [
    `Stay calm and non-accusatory; ask open questions about how and when the injuries happened.`,
    `Note who is with the child and whether they have parental responsibility.`,
    `Recognise concerning features: bruising to ears and neck in a child under 4, frenum tear, vague history, withdrawn child.`,
    `Do not examine beyond your scope or try to investigate; do not promise confidentiality.`,
    `Record carefully: exact words, measurements, a body map or diagram, time and who was present.`,
    `Explain to the adult that you are concerned and need to share information to make sure Lily is safe, unless doing so would put her at greater risk.`,
    `Discuss with the practice safeguarding lead and refer to children's social care the same day; follow local safeguarding partnership procedures.`,
    `If the child is in immediate danger, call 999.`,
    `Follow up the referral in writing; inform the GP or health visitor as advised; continue dental care.`
  ],
  marks: [
    `Recognises indicators of possible physical abuse`,
    `Gathers history in a non-judgemental way`,
    `Checks who has parental responsibility`,
    `Documents accurately and objectively`,
    `Does not promise confidentiality or confront`,
    `Refers promptly via the correct route`,
    `Knows the emergency route`,
    `Follows up and continues care`
  ],
  phrases: [
    `"Can you tell me how Lily got these bruises?"`,
    `"I've noticed some injuries that concern me, and I have a duty to make sure children are safe."`,
    `"I'll be speaking to our safeguarding lead and to children's social care today."`
  ],
  traps: [
    `Accepting the explanation without question`,
    `Accusing the adult of abuse`,
    `Delaying referral until the next appointment`,
    `Recording opinions rather than facts`
  ],
  check: `NICE CG89 (updated December 2025) supports suspecting maltreatment for bruises on non-bony areas including the ears, neck bruises that look like attempted strangulation, and an oral injury with an absent or unsuitable explanation. The TEN-4-FACESp bruising rule is not in NICE and its details were not checked against the original paper; confirm it there and in current UK child protection guidance (Child Protection and the Dental Team; local safeguarding partnership procedures) before relying on it.`,
  th: ['exam-safeg', 'prof-conf'] });

function flowHTML(steps) {
  return steps.map((s, i) => {
    const arrow = i ? '<div class="farrow" aria-hidden="true"></div>' : '';
    if (s.branches) return arrow + `<div class="fbranches">${s.branches.map(b => `<div class="fbranch"><div class="lab">${b.lab}</div><div class="flow">${flowHTML(b.steps)}</div></div>`).join('')}</div>`;
    return arrow + `<div class="fnode ${s.k}">${s.text}</div>`;
  }).join('');
}
function mapHTML() {
  const card = id => { const n = N[id]; const lv = n.kids.length ? n.kids : [id];
    const nd = lv.filter(k => done[k]).length;
    return `<div class="mapcard"><h3><a href="#n-${id}">${shortName(n)}</a> <span class="cnt">${nd}/${lv.length}</span></h3><div class="leaves">${lv.map(k => `<a href="#n-${k}" class="${done[k] ? 'd' : ''}">${shortName(N[k])}</a>`).join('')}</div></div>`; };
  return N.root.kids.map(top => `<p class="maptop"><a href="#n-${top}">${N[top].t}</a></p>` +
    (top === 'clin' ? `<div class="map">${N.clin.kids.map(card).join('')}</div>` : `<div class="map">${card(top)}</div>`)).join('');
}
