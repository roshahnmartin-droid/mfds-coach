<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MFDS Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: sticky tab bar; "Learn" = syllabus tree on the left, nested breadcrumb + lesson on the right. Examples, quiz and stations link back to lessons through gold "theory" chips. */
:root {
  --c1: #0d6b75; --c2: #23784a; --c3: #9a6410; --c4: #8a3f8f;
  --bg: #f2f4f8; --surface: #ffffff; --ink: #1a2232; --muted: #586377; --line: #d8dde7;
  --accent: #0d6b75; --accent-soft: #dcf0f1; --gold: #9a6410; --gold-soft: #fbefd9;
  --good: #23784a; --good-soft: #e1f3e8; --bad: #b0392f; --bad-soft: #fbe6e3;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151e; --surface: #19202d; --ink: #e5e9f1; --muted: #9ba5b8; --line: #2b3445;
  --accent: #6fd0d6; --accent-soft: #15363a; --gold: #e6b562; --gold-soft: #382c18;
  --good: #6fc795; --good-soft: #17301f; --bad: #f08b80; --bad-soft: #3a1d1a; --c1: #6fd0d6; --c2: #6fc795; --c3: #e6b562; --c4: #d79be0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151e; --surface: #19202d; --ink: #e5e9f1; --muted: #9ba5b8; --line: #2b3445;
  --accent: #6fd0d6; --accent-soft: #15363a; --gold: #e6b562; --gold-soft: #382c18;
  --good: #6fc795; --good-soft: #17301f; --bad: #f08b80; --bad-soft: #3a1d1a; --c1: #6fd0d6; --c2: #6fc795; --c3: #e6b562; --c4: #d79be0; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
.brand .dolls { display: inline-flex; align-items: flex-end; gap: 2px; }
.brand .dolls i { display: block; border-radius: 3px; background: var(--accent); }
.brand .dolls i:nth-child(1) { width: 14px; height: 20px; }
.brand .dolls i:nth-child(2) { width: 11px; height: 15px; opacity: .75; }
.brand .dolls i:nth-child(3) { width: 8px; height: 11px; opacity: .5; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
nav.tabs button { font: inherit; font-size: .95rem; border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
nav.tabs button:hover { color: var(--ink); }

main { padding-block: 24px 64px; }
.lede { max-width: 68ch; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.flag { display: inline-block; font-size: .78rem; font-weight: 700; color: var(--gold); background: var(--gold-soft); border-radius: 6px; padding: 1px 8px; }
.note-check { background: var(--gold-soft); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }

/* Start tab */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-block: 16px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.fact b { display: block; font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.fact span { color: var(--muted); font-size: .9rem; }
.weights { display: grid; gap: 8px; margin-top: 8px; }
.wrow { display: grid; grid-template-columns: 110px 1fr 48px; gap: 10px; align-items: center; font-size: .95rem; }
.wbar { height: 14px; background: var(--accent-soft); border-radius: 7px; overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--accent); border-radius: 7px; }
.wrow em { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
.grid2 > * { min-width: 0; }
ol.routine { padding-left: 1.3em; margin: 8px 0 0; display: grid; gap: 6px; }

/* Learn tab */
.learn { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.tree { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto; padding: 12px; }
.tree ul { list-style: none; margin: 0; padding-left: 14px; }
.tree > ul { padding-left: 0; }
.tree a { display: flex; justify-content: space-between; gap: 6px; text-decoration: none; color: var(--ink); padding: 3px 8px; border-radius: 6px; font-size: .92rem; }
.tree a:hover { background: var(--accent-soft); }
.tree a.on { background: var(--accent); color: var(--surface); }
.tree a .tick { color: var(--good); font-weight: 700; }
.tree a.on .tick { color: var(--surface); }
.tree .lvl0 > a { font-weight: 700; }
.tree li.l1 > a { font-weight: 700; margin-top: 4px; }
.treetoggle { display: none; }

.doll { border: 2px solid var(--accent); border-radius: 18px; padding: 8px 10px 10px; background: var(--surface); }
.doll .doll { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); border-radius: 15px; margin-top: 4px; }
.doll .doll .doll { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.doll .doll .doll .doll { border-color: var(--line); }
.doll > .dl { font-size: .8rem; color: var(--muted); }
.doll > .dl a { color: var(--accent); text-decoration: none; font-weight: 700; }
.doll.cur { background: var(--accent-soft); }
.lesson { margin-top: 14px; }
.lesson h2 { font-size: 1.9rem; margin-block: 6px 4px; }
.lesson .short { font-size: 1.12rem; color: var(--muted); margin: 0 0 12px; max-width: 65ch; }
.lesson .bodytext { max-width: 68ch; }
.lesson .bodytext p { margin: 0 0 12px; }
.lesson .bodytext ul, .lesson .bodytext ol { margin: 0 0 12px; padding-left: 1.3em; }
.boxes { display: grid; gap: 12px; margin-top: 12px; max-width: 72ch; }
.box { border-radius: 10px; padding: 12px 14px; }
.box h4 { font-size: .95rem; margin-bottom: 4px; }
.box.trap { background: var(--bad-soft); }
.box.trap h4 { color: var(--bad); }
.box.manual { background: var(--accent-soft); }
.box.spot { background: var(--good-soft); }
.box.spot h4 { color: var(--good); }
.box p { margin: 0; }
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 18px; }
.kid { text-align: left; font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; color: var(--ink); }
.kid:hover { border-color: var(--accent); }
.kid b { display: block; font-family: var(--display); }
.kid span { font-size: .88rem; color: var(--muted); }
.usedin { margin-top: 18px; }
.usedin a { display: inline-block; margin: 4px 6px 0 0; }
.rowbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.btn { font: inherit; font-size: .95rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
table.t { border-collapse: collapse; width: 100%; font-size: .93rem; }
table.t th, table.t td { border-bottom: 1px solid var(--line); text-align: left; padding: 6px 8px; vertical-align: top; }
table.t th { font-family: var(--display); }
.scroll { overflow-x: auto; margin-bottom: 12px; }

/* Theory chip */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; font-weight: 700; color: var(--gold); background: var(--gold-soft); border-radius: 999px; padding: 1px 10px; text-decoration: none; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 9px; border-radius: 50% 50% 40% 40%; background: currentColor; }
.chip:hover { text-decoration: underline; }

/* Examples */
.exlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
.excard { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; }
.excard:hover { border-color: var(--accent); }
.excard b { font-family: var(--display); font-size: 1.05rem; }
.excard span { font-size: .88rem; color: var(--muted); }
.ex { max-width: 820px; }
.ex h2 { font-size: 1.7rem; margin-block: 6px 12px; }
.scenario { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 10px; padding: 14px 16px; }
.scenario p { margin: 0 0 8px; }
.qtext { font-weight: 700; margin: 16px 0 8px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; gap: 10px; }
.opt .L { font-weight: 700; color: var(--muted); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.steps { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 10px; counter-reset: s; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 52px; position: relative; counter-increment: s; }
.step::before { content: counter(s); position: absolute; left: 14px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--surface); font-weight: 700; display: grid; place-items: center; font-size: .9rem; }
.step h4 { font-size: 1rem; margin-bottom: 4px; }
.step p { margin: 0 0 6px; }
.step .uses { font-size: .85rem; color: var(--muted); }
.wrongs { margin-top: 16px; }
.wrongs li { margin-bottom: 6px; }
.pattern { margin-top: 16px; background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.pattern b { font-family: var(--display); }
.revealrow { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.match td select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* Quiz */
.qcard { margin-top: 14px; }
.qhead { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: .9rem; }
.feedback { margin-top: 12px; border-radius: 10px; padding: 12px 14px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback p { margin: 0 0 6px; }
.score { font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }

/* Games */
.flash { display: grid; gap: 8px; place-items: center; text-align: center; width: 100%; min-height: 170px; font: inherit; color: var(--ink); background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 14px; padding: 18px; cursor: pointer; margin-top: 8px; }
.flash.back { background: var(--gold-soft); border-color: var(--gold); }
.flash .ftext { font-family: var(--display); font-size: 1.25rem; }
.sortcard { background: var(--bg); border: 1px dashed var(--muted); border-radius: 12px; padding: 16px; font-size: 1.05rem; font-weight: 700; }
.bins { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.bins .btn { flex: 1 1 140px; }

/* Focus and diagrams */
.src { display: inline-block; font-family: var(--body); font-size: .72rem; font-weight: 700; letter-spacing: .02em; border-radius: 6px; padding: 1px 7px; vertical-align: middle; }
.src.S1 { background: var(--good-soft); color: var(--good); }
.src.S2 { background: var(--accent-soft); color: var(--accent); }
.src.S3 { background: var(--gold-soft); color: var(--gold); }
.srclegend { margin-top: 18px; font-size: .9rem; color: var(--muted); }
.timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 16px; }
.timeline > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.timeline > div.now { border-color: var(--accent); background: var(--accent-soft); }
.timeline b { font-family: var(--display); font-size: 1.1rem; }
.timeline span { font-size: .92rem; }
.elstrip { display: flex; flex-wrap: wrap; gap: 6px; }
.elstrip .el { flex: 1 1 120px; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: .9rem; }
.elstrip .el.hit { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.fsec { margin-top: 18px; max-width: 72ch; }
.fsec h3 { margin-bottom: 6px; }
.fsec p, .fsec ul { margin: 0 0 10px; }
.dnav { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.dsec { margin-top: 26px; }
.dsec h2 { font-size: 1.4rem; }
.dsec .how { color: var(--muted); max-width: 75ch; margin: 6px 0 10px; }
.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.diagram svg { display: block; min-width: 860px; height: auto; }
.diagram svg a:hover rect, .diagram svg a:focus rect { stroke: var(--accent); stroke-width: 2.5; }

/* Summaries */
.cnt { font-size: .78rem; opacity: .75; }
.sumjump { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0 4px; font-size: .9rem; }
.sumjump a { color: var(--accent); }
.sumlist { display: grid; gap: 18px; margin-top: 14px; }
.sumcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 80px); }
.sumcard h2 { font-size: 1.45rem; margin: 2px 0 4px; }
.sumcard .one { margin: 0 0 10px; color: var(--muted); font-size: 1.05rem; max-width: 70ch; }
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.sumgrid > * { min-width: 0; }
.sumgrid h3 { font-size: 1rem; margin: 6px 0 6px; }
.sumgrid ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.prodchips { display: flex; flex-wrap: wrap; gap: 6px; }
.prodchips span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; }
.sumfoot { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 14px; }

/* Plan */
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; margin-top: 16px; }
.day h3 { font-size: 1.3rem; margin-bottom: 6px; }
.day ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.day label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.day input { margin-top: 5px; accent-color: var(--accent); }
.day .hrs { color: var(--muted); font-size: .88rem; }

@media (max-width: 820px) {
  .learn { grid-template-columns: 1fr; }
  .tree { position: static; max-height: none; display: none; }
  .tree.open { display: block; }
  .treetoggle { display: inline-block; margin-bottom: 10px; }
  .lesson h2 { font-size: 1.5rem; }
  .wrow { grid-template-columns: 90px 1fr 44px; }
}
@media (prefers-reduced-motion: no-preference) { .lesson, .ex, .qcard { animation: rise .25s ease-out; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

/* ---- MFDS additions ---- */
.brand svg { width: 22px; height: 24px; fill: var(--accent); }
.box.src-box { background: var(--accent-soft); }
.notice { background: var(--gold-soft); border-radius: 12px; padding: 12px 16px; margin-top: 16px; max-width: 80ch; }
.notice p { margin: 0 0 6px; } .notice p:last-child { margin: 0; }
.qtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; }
.qtools select { font: inherit; font-size: .95rem; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.qtools label { display: inline-flex; gap: 6px; align-items: center; font-size: .95rem; color: var(--muted); }
.bar { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* Part 2 stations */
.domains { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
.domains span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 700; }
.brief { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.brief p { margin: 0 0 8px; } .brief p:last-child { margin: 0; }
.timer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.timer .clock { font-family: var(--display); font-size: 1.8rem; font-variant-numeric: tabular-nums; min-width: 4.5ch; }
.timer .clock.low { color: var(--bad); }
.ocols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.ocols > * { min-width: 0; }
.ocols h3 { font-size: 1.05rem; margin-bottom: 6px; }
.ocols ol, .ocols ul { margin: 0; padding-left: 1.2em; display: grid; gap: 5px; }
.marks { list-style: none; padding: 0 !important; }
.marks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.marks input { margin-top: 5px; accent-color: var(--accent); }
.phr li { font-style: italic; }

/* Flowcharts */
.flow { display: grid; gap: 0; justify-items: center; margin-top: 6px; }
.fnode { border-radius: 12px; padding: 10px 14px; max-width: 640px; width: 100%; text-align: center; border: 2px solid var(--line); background: var(--surface); }
.fnode.start { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; border-radius: 999px; }
.fnode.q { border-color: var(--gold); background: var(--gold-soft); font-weight: 700; }
.fnode.warn { border-color: var(--bad); background: var(--bad-soft); }
.farrow { width: 2px; height: 18px; background: var(--muted); position: relative; }
.farrow::after { content: ""; position: absolute; bottom: -2px; left: -5px; border: 6px solid transparent; border-top-color: var(--muted); border-bottom: 0; }
.fbranches { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; width: 100%; }
.fbranch { display: grid; gap: 0; justify-items: center; align-content: start; }
.fbranch > .lab { font-size: .82rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0 2px; }
.fbranch .fnode { text-align: left; }
.fbranch .fnode ul { margin: 0; padding-left: 1.1em; }
.fnode.end { border-color: var(--good); background: var(--good-soft); }
.diagbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

/* Syllabus map */
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.mapcard h3 { font-size: 1rem; margin-bottom: 6px; }
.mapcard h3 a { color: var(--ink); text-decoration: none; }
.mapcard .leaves { display: flex; flex-wrap: wrap; gap: 6px; }
.mapcard .leaves a { font-size: .82rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; text-decoration: none; color: var(--ink); }
.mapcard .leaves a.d { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
.maptop { font-family: var(--display); font-size: 1.15rem; margin: 18px 0 8px; }

/* ---- Tools, sources and progress ---- */
.srcrow { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: .9rem; }
.srclink { display: inline-block; font-size: .82rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
.srclink::after { content: " ↗"; }
.srclink:hover { text-decoration: underline; }
.vbadge { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: 6px; padding: 1px 7px; vertical-align: middle; }
.vbadge.v { background: var(--good-soft); color: var(--good); }
.vbadge.c { background: var(--accent-soft); color: var(--accent); }
.vbadge.u { background: var(--gold-soft); color: var(--gold); }
.srcbox { margin-top: 12px; max-width: 72ch; }
.srcbox h4 { font-size: .95rem; margin-bottom: 6px; }

.pviz { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; }
.ring svg { width: 110px; height: 110px; display: block; }
.pbars { display: grid; gap: 4px; min-width: 0; }
.prow { display: grid; grid-template-columns: minmax(90px, 1.1fr) 2fr 38px; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); font-size: .88rem; padding: 1px 0; }
.prow:hover .pname { text-decoration: underline; }
.pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbar { position: relative; height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
.pbar i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 5px; }
.pbar .pt { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.pnum { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

.bpegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.sext { font: inherit; text-align: left; cursor: pointer; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 6px; min-height: 96px; align-content: space-between; }
.sext .sn { font-size: .82rem; color: var(--muted); }
.sext .sc { font-family: var(--display); font-size: 2.2rem; line-height: 1; }
.sext.c0 { border-color: var(--line); } .sext.c1 { border-color: var(--good); background: var(--good-soft); }
.sext.c2 { border-color: var(--gold); background: var(--gold-soft); } .sext.c3 { border-color: var(--gold); background: var(--gold-soft); }

.slrow { display: grid; gap: 4px; margin-top: 10px; } .slrow input[type=range] { width: 100%; accent-color: var(--accent); }
.chk { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; cursor: pointer; } .chk input { margin-top: 5px; accent-color: var(--accent); }
.rootbar { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.rootbar .seg { padding: 8px 6px; font-size: .8rem; text-align: center; color: var(--muted); border-right: 1px solid var(--line); background: var(--surface); }
.rootbar .seg:last-of-type { border-right: 0; }

.cartrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.cartrow i { width: 14px; height: 38px; border-radius: 4px 4px 7px 7px; background: var(--accent); display: block; }
.dotgrid { display: grid; grid-template-columns: repeat(50, 1fr); gap: 2px; margin-top: 14px; max-width: 760px; }
.dotgrid i { aspect-ratio: 1; border-radius: 50%; display: block; }
.dotgrid .tp, .legend .tp { background: var(--good); } .dotgrid .fn, .legend .fn { background: var(--bad); }
.dotgrid .fp, .legend .fp { background: var(--gold); } .dotgrid .tn, .legend .tn { background: var(--line); }

.walkask { text-align: center; background: var(--gold-soft); border: 2px dashed var(--gold); border-radius: 12px; padding: 12px 16px; max-width: 640px; width: 100%; }
.walkask p { margin: 0; font-weight: 700; } .walkend { color: var(--muted); text-align: center; }
.teethrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }

<script>
/* ============ CORE: data containers, the top of the syllabus tree, the study plan ============
   Content files (content/*.js) are inlined after this by build.py and push into these arrays.
   Based on the RCS England MFDS syllabus and candidate guidance (legacy format). */

const N = {}; // id -> node
function node(id, parent, t, short, body, extra) {
  N[id] = Object.assign({ id, parent, t, short, body, kids: [] }, extra || {});
  if (parent) N[parent].kids.push(id);
}
const SUMS = [], QZ = [], FLASH = [], SORTS = [], EX = [], OSCE = [];

node('root', null, 'MFDS: the whole syllabus', 'What the MFDS tests, how the syllabus is organised, and how to work through it.', `
<p>The <b>MFDS</b> (Membership of the Faculty of Dental Surgery) of the Royal College of Surgeons of England is the first postgraduate diploma for dentists after foundation training. It tests the <b>knowledge, applied knowledge and professional skills</b> set out in the Dental Foundation Training curriculum, with some Dental Core Training content.</p>
<p>RCS England groups the syllabus into four areas. This guide follows the same structure:</p>
<div class="scroll"><table class="t">
<tr><th>Area</th><th>What it covers</th></tr>
<tr><td><a href="#n-clin">Clinical dentistry</a></td><td>Examination and diagnosis, radiography, prevention, emergencies, prescribing, anaesthesia and sedation, medically compromised patients, and every clinical specialty</td></tr>
<tr><td><a href="#n-comm">Communication</a></td><td>With patients and carers, with the team and peers, and with other professionals</td></tr>
<tr><td><a href="#n-prof">Professionalism</a></td><td>Ethics, GDC standards, consent, confidentiality, raising concerns, and evidence-based practice</td></tr>
<tr><td><a href="#n-mgmt">Management and leadership</a></td><td>Infection control, health and safety, legislation, governance and audit</td></tr>
</table></div>
<p><b>Part 1</b> examines all four areas with single best answer questions. <b>Part 2</b> tests the same syllabus in 14 stations, with the weight on communication, diagnosis and management. Most Part 1 questions are clinical, but professionalism, law and statistics questions come up in every paper and are easy marks if you have learned them.</p>
`, { spot: 'Every SBA is really asking: what is the safest, guideline-based thing a competent dentist just out of foundation training would do or conclude here?', src: 'RCS England MFDS syllabus and candidate guidance; COPDEND Dental Foundation Training curriculum.' });

node('clin', 'root', 'Clinical dentistry', 'The largest part of the syllabus: assessment, prevention, emergencies, prescribing and every clinical specialty.', `
<p>The clinical syllabus follows a patient's journey: <b>assess</b> them (history, examination, radiographs), <b>keep them safe</b> (medical emergencies, prescribing, anaesthesia, medical conditions), <b>prevent</b> disease, then <b>treat</b> across the specialties.</p>
<p>Work through the safety sections first. They are high-yield, rule-based, and come up across every specialty:</p>
<ul>
<li><a href="#n-emerg">Medical emergencies</a>, <a href="#n-pharm">prescribing</a> and <a href="#n-pain">local anaesthesia</a>: doses and first actions.</li>
<li><a href="#n-medcomp">Medically compromised patients</a>: anticoagulants, MRONJ, diabetes, cardiac conditions.</li>
<li><a href="#n-exam">Examination and diagnosis</a>: medical history, cancer referral, safeguarding.</li>
</ul>
<p>Then move through the specialties: <a href="#n-perio">perio</a>, <a href="#n-surg">oral surgery</a>, <a href="#n-omed">oral medicine</a>, <a href="#n-paed">paediatrics</a>, <a href="#n-ortho">orthodontics</a>, <a href="#n-resto">restorative</a> and <a href="#n-prosth">prosthodontics</a>.</p>
`, { spot: 'Most clinical stems give an age, a medical history and one key finding. The age and the medical history usually decide the answer.', trap: 'Choosing the most heroic or most specialist option. The MFDS rewards the safe, guideline-led first step for a dentist at your level, which often means referring.', src: 'RCS England MFDS syllabus (Clinical domain).' });

/* ============ STUDY PLAN ============ */
const PLAN = [
{ d: 'Week 1: safety first', hrs: 'about 8 to 10 hours', items: [
  'Read "Start here" and learn the SBA routine (20 min)',
  'Medical emergencies: learn every drug, dose and route. Do the flowchart (2 hr)',
  'Prescribing: antibiotics, analgesics and interactions (1.5 hr)',
  'Local anaesthesia, sedation and GA (1 hr)',
  'Medically compromised patients: anticoagulants, MRONJ, diabetes, cardiac (2 hr)',
  'Examination, cancer referral and safeguarding (1.5 hr)',
  'Do the worked examples on those topics, then 25 SBAs on them' ] },
{ d: 'Week 2: the big specialties', hrs: 'about 10 hours', items: [
  'Periodontology: BPE, staging and grading, treatment steps (2 hr)',
  'Oral surgery: third molars, complications, infections (1.5 hr)',
  'Oral medicine and pathology: ulcers, white patches, cysts, pain, salivary (2.5 hr)',
  'Radiography: selection criteria, the IR(ME)R roles, reading radiographs (1.5 hr)',
  'Prevention: DBOH fluoride table and lifestyle advice (1 hr)',
  'Read the Summary card for each section done so far; 30 SBAs' ] },
{ d: 'Week 3: children, teeth and the rest', hrs: 'about 10 hours', items: [
  'Paediatrics and dental trauma (IADT): learn the splint times (2 hr)',
  'Orthodontics: IOTN and interceptive treatment (1 hr)',
  'Restorative: caries, materials, tooth wear, endodontics, indirects (2.5 hr)',
  'Prosthodontics: dentures, bridges, implants (1 hr)',
  'Communication, professionalism, consent, confidentiality (2 hr)',
  'Statistics: do the 2×2 table and NNT examples until they are automatic (30 min)',
  'Infection control, health and safety, governance (1 hr)' ] },
{ d: 'Week 4: exam practice', hrs: 'about 12 hours', items: [
  'Do the whole SBA bank on shuffle, timed at about 70 seconds a question',
  'For every wrong answer, open the linked lesson and re-read its exam trap',
  'Do one full mock paper from a question bank (150 questions, 3 hours)',
  'Flashcards and the three Sort it games every day',
  'Read every Summary card once, start to finish',
  'If Part 2 is next: do 2 stations a day out loud with the 10-minute timer',
  'Day before: light review only, check your ID and the remote exam set-up, sleep' ] }
];
const CRASH = [
  'Medical emergencies flowchart and drug doses',
  'Anticoagulant and antibiotic flowcharts',
  'Avulsion and BPE flowcharts',
  'All Summary cards, Clinical group first',
  'SBA bank on shuffle: aim for 50 questions, review every wrong answer',
  'Flashcards: once through',
  'Professionalism, consent and statistics summary cards'
];

/* MFDS Coach: Clinical sections A (exam, rad, prev, emerg, pharm, pain, medcomp) */

/* ===================== EXAMINATION ===================== */

node('exam', 'clin', 'Examination, diagnosis and records', 'History, risk grading, oral cancer referral and safeguarding: the information-gathering skills behind every clinical decision.', `
<p>Most SBA stems start with a history. The exam tests whether you can pull out the one finding that changes management: a medical condition, a red-flag lesion or a sign of abuse.</p>
<ul>
<li><a href="#n-exam-hx">History, medical history and risk (ASA)</a>: structured history, the American Society of Anesthesiologists (ASA) physical status grades and record keeping.</li>
<li><a href="#n-exam-onc">Oral cancer: screening and urgent referral</a>: risk factors, suspicious features and the NICE NG12 triggers.</li>
<li><a href="#n-exam-safeg">Safeguarding children and adults</a>: signs of abuse and neglect and the steps to act on them.</li>
</ul>
<p>In Part 2, history-taking and safeguarding stations reward a calm, ordered approach and clear documentation.</p>
`, {
  spot: 'Stems that give a long medical or social history, a non-healing lesion, or an injury with an odd explanation.',
  trap: 'Jumping to treatment before the history has been checked for a factor that changes it.',
  src: 'FGDP(UK) Clinical Examination and Record-Keeping; NICE NG12; GDC Standards for the Dental Team; Working Together to Safeguard Children (England).'
});

node('exam-hx', 'exam', 'History, medical history and risk (ASA)', 'A structured history, an updated medical history every course of treatment, and ASA grading to judge fitness for treatment and sedation.', `
<p><b>Structure.</b> Presenting complaint; history of presenting complaint (for pain use SOCRATES: site, onset, character, radiation, associations, time course, exacerbating/relieving factors, severity); medical history; drug history and allergies; dental history; social history (tobacco, alcohol, diet, occupation, support).</p>
<p><b>Medical history.</b> Take it at the first visit and update it at every course of treatment (and when the patient reports change). Ask the patient to confirm and sign or record that it was checked. Ask about anticoagulants, antiresorptives, steroids, cardiac conditions, diabetes, bleeding disorders, allergies, pregnancy and recent hospital admissions.</p>
<p><b>Examination.</b> Extraoral (face, lymph nodes, temporomandibular joints, muscles of mastication), intraoral soft tissues (systematic, every site), then teeth and periodontium with a basic periodontal examination (BPE). Record findings positive and negative.</p>
<p><b>ASA physical status classification</b> (American Society of Anesthesiologists, examples updated 2020):</p>
<div class="scroll"><table class="t">
<tr><th>Grade</th><th>Definition</th><th>Typical examples</th></tr>
<tr><td>ASA I</td><td>Normal healthy patient</td><td>Fit, non-smoker, minimal alcohol</td></tr>
<tr><td>ASA II</td><td>Mild systemic disease, no functional limitation</td><td>Current smoker, social drinker, pregnancy, obesity (BMI 30 to under 40), well-controlled diabetes or hypertension, mild lung disease</td></tr>
<tr><td>ASA III</td><td>Severe systemic disease, functional limitation</td><td>Poorly controlled diabetes or hypertension, COPD, BMI 40 or more, active hepatitis, alcohol dependence, pacemaker, history (over 3 months) of MI, stroke or coronary stents</td></tr>
<tr><td>ASA IV</td><td>Severe systemic disease that is a constant threat to life</td><td>Recent (under 3 months) MI, stroke or stents; ongoing cardiac ischaemia; severe valve dysfunction; sepsis</td></tr>
<tr><td>ASA V</td><td>Moribund, not expected to survive without the operation</td><td>Ruptured aortic aneurysm</td></tr>
<tr><td>ASA VI</td><td>Brain-dead organ donor</td><td>-</td></tr>
</table></div>
<p>An "E" suffix marks an emergency procedure. In UK practice, conscious sedation in primary care is usually for ASA I and II; ASA III and above are usually treated in a hospital or specialist setting (see <a href="#n-pain-sed">sedation</a>).</p>
<p><b>Risk assessment.</b> Record caries, periodontal, tooth wear and oral cancer risk. These drive recall: NICE CG19 sets recall intervals of 3 to 24 months for adults and 3 to 12 months for under-18s, based on risk.</p>
<p><b>Records.</b> Contemporaneous, legible, dated and attributable. Record what was discussed, options, risks and the patient's decision, as well as findings. Never alter an old entry; add a dated correction.</p>
`, {
  spot: 'A stem listing a patient\'s conditions then asking for their ASA grade, or asking what must be done before treating a patient whose history was taken a year ago.',
  trap: 'Grading a smoker or a pregnant woman as ASA I (both are ASA II), or grading well-controlled diabetes as ASA III.',
  src: 'ASA Physical Status Classification System (examples updated 2020); FGDP(UK) Clinical Examination and Record-Keeping; NICE CG19 Dental recall (2004).'
});

node('exam-onc', 'exam', 'Oral cancer: screening and urgent referral', 'Know the risk factors, the suspicious features and the NICE NG12 triggers for urgent suspected-cancer referral.', `
<p><b>Epidemiology.</b> Over 90% of oral cancers are squamous cell carcinoma (SCC). Common sites are the lateral border of the tongue and floor of mouth. Oropharyngeal cancer linked to human papillomavirus (HPV, mainly type 16) is rising rapidly in all four UK countries; HPV-related cases are diagnosed only slightly younger than other oral cancers.</p>
<p><b>Risk factors.</b> Tobacco (smoked and smokeless), alcohol (synergistic with tobacco), areca (betel) nut, HPV, increasing age, male sex, social deprivation, immunosuppression, and oral potentially malignant disorders (see <a href="#n-omed-white">white and red patches</a>).</p>
<p><b>Suspicious features.</b> Ulcer with rolled or everted margins and induration; red or speckled red-white patch; fixation to deeper tissues; unexplained tooth mobility or non-healing socket; numbness (for example mental nerve paraesthesia); hard, fixed, non-tender neck node; dysphagia, odynophagia, persistent hoarseness, referred otalgia, trismus.</p>
<p><b>NICE NG12 (suspected cancer: recognition and referral).</b></p>
<div class="scroll"><table class="t">
<tr><th>Who refers</th><th>Finding</th><th>Action</th></tr>
<tr><td>GP</td><td>Unexplained ulceration in the oral cavity lasting more than 3 weeks, or a persistent unexplained lump in the neck</td><td>Consider a suspected-cancer pathway referral for oral cancer (diagnosis or ruling out of cancer within 28 days)</td></tr>
<tr><td>GP</td><td>Lump on the lip or in the oral cavity, or red or red-and-white patch consistent with erythroplakia or erythroleukoplakia</td><td>Consider urgent referral for assessment by a dentist (NG12 defines urgent as before 2 weeks)</td></tr>
<tr><td>Dentist</td><td>Lump on the lip or in the oral cavity consistent with oral cancer, or red or red-and-white patch consistent with erythroplakia or erythroleukoplakia</td><td>Consider suspected-cancer pathway referral (diagnosis or ruling out of cancer within 28 days)</td></tr>
<tr><td>Any clinician</td><td>Age 45 or over with persistent unexplained hoarseness or unexplained neck lump</td><td>Consider suspected-cancer pathway referral for laryngeal cancer</td></tr>
</table></div>
<p><b>Practical steps.</b> Remove any obvious cause (for example a sharp cusp or denture flange) and review a possibly traumatic ulcer within 2 to 3 weeks; if it has not healed, refer. Do not biopsy a lesion you suspect is malignant in primary care: refer it. Use the local suspected head and neck cancer referral form, mark it urgent, phone or send electronically, and record the referral. Tell the patient honestly why you are referring without speculating, and check they have received an appointment.</p>
<p><b>UK differences.</b> Since October 2023 NG12 defines a suspected cancer pathway referral by the 28-day Faster Diagnosis Standard (a diagnosis or ruling out of cancer within 28 days of urgent referral) instead of the old two-week wait; in NG12, "urgent" means before 2 weeks. Scotland uses the Scottish Referral Guidelines for Suspected Cancer.</p>
`, {
  spot: 'A smoker or heavy drinker with a non-healing ulcer, an indurated lesion, a red patch, or a neck lump; lead-in asks for the most appropriate next step.',
  trap: 'Choosing "review in 6 months" or "biopsy in practice" rather than urgent suspected-cancer referral; or prescribing antibiotics/antifungals for an indurated ulcer.',
  src: 'NICE NG12 Suspected cancer: recognition and referral (2015, with later updates); Scottish Referral Guidelines for Suspected Cancer.',
  check: 'NG12 has been updated several times; confirm current wording of the oral and head and neck recommendations on the NICE website. Confirm current England cancer waiting-time standards (28-day Faster Diagnosis Standard) with NHS England.'
});

node('exam-safeg', 'exam', 'Safeguarding children and adults', 'Recognise signs of abuse and neglect, never ignore a concern, record it, discuss with the safeguarding lead and refer to social care or police.', `
<p><b>Duty.</b> The GDC requires every registrant to raise concerns when a child or adult may be at risk. You do not need proof: acting on reasonable concern is the test. The welfare of the child is paramount and overrides confidentiality.</p>
<p><b>Child physical abuse: warning signs.</b> Head, face and neck injuries are common in physical abuse.</p>
<ul>
<li>Bruising in a baby who is not yet mobile ("those who don't cruise rarely bruise").</li>
<li>Torn labial frenum in a non-mobile infant (forced feeding or a blow).</li>
<li>Bruises on the ears, neck, cheeks or soft areas; finger-tip or slap marks; bite marks; burns (cigarette, immersion).</li>
<li>Palatal petechiae or unexplained oral lesions (possible sexual abuse).</li>
<li>Injuries of different ages, a history that changes or does not fit the injury, or delay in seeking care.</li>
</ul>
<p><b>Dental neglect.</b> Persistent failure to meet a child's basic oral health needs, likely to result in serious impairment of oral or general health. Signs: untreated caries causing pain, repeated "was not brought" appointments, failure to complete treatment. Use a staged approach: preventive team support first, then liaison with the health visitor, school nurse or GP, then a child protection referral if there is no improvement or harm is significant.</p>
<p><b>Adults at risk.</b> The Care Act 2014 (England) lists types: physical, domestic, sexual, psychological, financial or material, modern slavery, discriminatory, organisational, neglect and self-neglect. Make safeguarding personal: involve the adult and respect a capacitous decision unless others are at risk.</p>
<p><b>Steps to act.</b></p>
<ol>
<li><b>Observe and listen.</b> Let the person speak; ask open questions; do not lead or interrogate. Do not promise to keep a secret.</li>
<li><b>Record.</b> Contemporaneously, in the person's own words, with measurements and diagrams; facts, not opinion.</li>
<li><b>Discuss.</b> With the practice safeguarding lead (and the named safeguarding professional if needed). Do not let discussion delay urgent action.</li>
<li><b>Refer.</b> Immediate danger: call 999. Otherwise refer to the local authority children's or adult social care team by phone, then confirm in writing. You can share information without consent when needed to protect someone.</li>
<li><b>Follow up.</b> Check the referral was received and record the outcome.</li>
</ol>
<p><b>Female genital mutilation (FGM).</b> In England and Wales, regulated health professionals must report to the police (101) known cases in girls under 18 (disclosed by the girl or seen) under the mandatory reporting duty. Report as soon as possible, ideally by the close of the next working day, and within one month at the most. The duty does not cover suspected or at-risk cases, which follow normal safeguarding procedures.</p>
<p><b>Nations.</b> England: Working Together to Safeguard Children (2026 edition, replacing the 2023 edition). Scotland: National Guidance for Child Protection (2021, updated 2023). Wales: Wales Safeguarding Procedures.</p>
`, {
  spot: 'A child with facial bruising and an inconsistent story, a torn frenum in a baby, repeated missed appointments with untreated caries, or an older adult whose relative controls their money.',
  trap: 'Confronting the parent, investigating yourself, or waiting for "more evidence" before referring. Also: promising a child confidentiality.',
  src: 'GDC Standards for the Dental Team (standard 8.5); COPDEND/Department of Health Child Protection and the Dental Team; Working Together to Safeguard Children (2026 edition); Care Act 2014; Serious Crime Act 2015 (FGM mandatory reporting).',
  check: 'Confirm the expected time frame for written confirmation of a phone referral in local safeguarding partnership procedures (often within 48 hours), and the safeguarding training level required for dental staff in the current Intercollegiate Documents.'
});

/* ===================== RADIOGRAPHY ===================== */

node('rad', 'clin', 'Radiography and radiology', 'Choosing the right radiograph at the right interval under IRR17 and IR(ME)R, then reading what you see.', `
<p>Radiography questions test two things: law and selection, and interpretation.</p>
<ul>
<li><a href="#n-rad-sel">Selection criteria and radiation law</a>: FGDP(UK) selection criteria, bitewing intervals by caries risk, IRR17 and IR(ME)R 2017 duty holders, quality grading.</li>
<li><a href="#n-rad-interp">Reading radiographs</a>: classic appearances of cysts, tumours and bone lesions.</li>
</ul>
<p>Every exposure must be justified, optimised (ALARP: as low as reasonably practicable) and clinically evaluated, and the evaluation recorded. In Part 2 you may be asked to explain to a worried patient why a radiograph is needed and how small the dose is. Keep it simple: justify the benefit, explain the precautions, and record the discussion.</p>
`, {
  spot: 'Stems asking who is responsible for a task under radiation law, how often to take bitewings, or what a described radiographic lesion is.',
  trap: 'Mixing up IRR17 (protects staff and public; employer, RPA, RPS) with IR(ME)R (protects patients; referrer, practitioner, operator).',
  src: 'FGDP(UK) Selection Criteria for Dental Radiography (3rd ed, 2018); IRR17; IR(ME)R 2017; Guidance Notes for Dental Practitioners on the Safe Use of X-ray Equipment (PHE, 2020).'
});

node('rad-sel', 'rad', 'Selection criteria and radiation law', 'Justify every exposure, select by caries risk, and know the IRR17 and IR(ME)R duty holders and what each one does.', `
<p><b>Selection (FGDP(UK) Selection Criteria for Dental Radiography).</b> No routine radiographs: each must follow a history and examination and be justified for that patient. Bitewings are the main caries-detection view; periapicals for apical, endodontic and localised periodontal assessment; dental panoramic tomograph (DPT/OPT) not as a screening tool, but for example before third molar surgery or orthodontic assessment; cone beam CT (CBCT) only where conventional imaging is inadequate.</p>
<div class="scroll"><table class="t">
<tr><th>Caries risk</th><th>Posterior bitewing interval (recall patients)</th></tr>
<tr><td>High</td><td>6 months (children and adults) until no new or active lesions</td></tr>
<tr><td>Moderate</td><td>12 months</td></tr>
<tr><td>Low</td><td>Children: 12 to 18 months (primary teeth), about 2 years (permanent teeth). Adults: about 2 years, longer when risk is consistently low</td></tr>
</table></div>
<p><b>Two sets of regulations.</b></p>
<div class="scroll"><table class="t">
<tr><th>Role</th><th>Regulations</th><th>What they do</th></tr>
<tr><td>Employer (legal person, e.g. practice owner)</td><td>IRR17 and IR(ME)R</td><td>Registers the use of X-rays with the HSE; appoints RPA and RPS; provides written procedures (employer's procedures), local rules, training, quality assurance, diagnostic reference levels; investigates and notifies incidents</td></tr>
<tr><td>Radiation protection adviser (RPA)</td><td>IRR17</td><td>External expert the employer must consult: risk assessment, controlled areas, critical examination of new equipment, local rules</td></tr>
<tr><td>Radiation protection supervisor (RPS)</td><td>IRR17</td><td>Usually a dentist in the practice; makes sure local rules are followed day to day</td></tr>
<tr><td>Referrer</td><td>IR(ME)R</td><td>Requests the exposure and supplies enough clinical information</td></tr>
<tr><td>Practitioner</td><td>IR(ME)R</td><td>Justifies the exposure (benefit outweighs risk)</td></tr>
<tr><td>Operator</td><td>IR(ME)R</td><td>Carries out any practical aspect: positioning, exposing, processing, clinical evaluation. Can authorise under the practitioner's written guidelines</td></tr>
<tr><td>Medical physics expert (MPE)</td><td>IR(ME)R</td><td>Advises on optimisation, dosimetry, quality assurance and equipment</td></tr>
</table></div>
<p>In general practice one dentist is usually referrer, practitioner and operator for the same exposure. Each role needs adequate training.</p>
<p><b>Optimisation.</b> Rectangular collimation (reduces dose substantially versus round), 60 to 70 kV, digital receptors, film holders, correct exposure settings. Lead aprons are not needed for routine dental radiography (abdominal protection is only for the rare view that puts the abdomen in the primary beam). In pregnancy dental radiography need not be delayed, but offer the option of delaying non-urgent images.</p>
<p><b>Controlled area.</b> For intraoral sets, defined in the local rules, typically within 1.5 m of the tube and patient and along the primary beam.</p>
<p><b>Incidents.</b> A significant accidental or unintended exposure to a patient is notified to the relevant regulator (CQC in England, HIS in Scotland, HIW in Wales, RQIA in Northern Ireland).</p>
<p><b>Quality.</b> The FGDP criteria rate intraoral images 1 (excellent), 2 (diagnostically acceptable) or 3 (unacceptable), with audit targets of at least 70% grade 1, no more than 20% grade 2 and no more than 10% grade 3. For CBCT the target is at least 95% acceptable and no more than 5% unacceptable. Audit image quality regularly.</p>
`, {
  spot: 'A stem asking who justifies an exposure, who the employer must consult before installing a new set, or how often a high-caries-risk patient should have bitewings.',
  trap: 'Saying the operator justifies the exposure (the practitioner does), or that the RPS is an external adviser (that is the RPA). Also: ordering an OPT as a routine new-patient screen.',
  src: 'FGDP(UK) Selection Criteria for Dental Radiography (3rd ed, 2018); Ionising Radiations Regulations 2017; Ionising Radiation (Medical Exposure) Regulations 2017; PHE Guidance Notes for Dental Practitioners on the Safe Use of X-ray Equipment (2020).',
  check: 'Confirm the low-risk bitewing intervals for children and adults in the current FGDP(UK) Selection Criteria. Confirm the controlled-area distance in your practice local rules and the PHE/UKHSA Guidance Notes.'
});

node('rad-interp', 'rad', 'Reading radiographs: lucencies, cysts and lesions', 'Describe systematically, then match the classic appearance: location, margin, locularity, effect on teeth and age group.', `
<p><b>Describe before you diagnose.</b> Site and size; single or multiple; radiolucent, radiopaque or mixed; margin (well defined and corticated, well defined not corticated, or poorly defined); shape and locularity; effect on surrounding structures (tooth displacement, root resorption, expansion, cortical perforation); relationship to teeth.</p>
<p>Corticated, slow-growing lesions are usually benign. Poorly defined, moth-eaten margins, root spiking or widened periodontal ligament (PDL) spaces suggest infection or malignancy.</p>
<div class="scroll"><table class="t">
<tr><th>Lesion</th><th>Classic radiographic picture</th></tr>
<tr><td>Radicular (periapical) cyst</td><td>Commonest jaw cyst. Round, corticated lucency at the apex of a non-vital tooth; continuous with the PDL</td></tr>
<tr><td>Dentigerous cyst</td><td>Lucency around the crown of an unerupted tooth, attached at the cemento-enamel junction; often lower 8s or upper 3s</td></tr>
<tr><td>Odontogenic keratocyst</td><td>Posterior mandible and ramus; grows along the bone with little expansion; scalloped margin; may be multilocular; high recurrence. Multiple in Gorlin-Goltz syndrome</td></tr>
<tr><td>Ameloblastoma</td><td>Posterior mandible; multilocular "soap-bubble" lucency, expansion, knife-edge root resorption</td></tr>
<tr><td>Simple (solitary) bone cyst</td><td>Young patients; lucency that scallops up between roots of vital teeth; often empty at surgery</td></tr>
<tr><td>Nasopalatine duct cyst</td><td>Midline anterior maxilla; heart-shaped lucency; incisors vital</td></tr>
<tr><td>Stafne bone defect</td><td>Well-defined lucency below the inferior alveolar canal near the angle; lingual salivary gland tissue; leave alone</td></tr>
<tr><td>Cemento-osseous dysplasia</td><td>Periapical, often mandibular incisors; lucent then mixed then opaque; teeth vital; do not treat endodontically</td></tr>
<tr><td>Idiopathic osteosclerosis / condensing osteitis</td><td>Dense opacity; osteosclerosis with a vital tooth and no cause; condensing osteitis at the apex of an inflamed or non-vital tooth</td></tr>
<tr><td>Odontome</td><td>Compound: tooth-like denticles, anterior maxilla. Complex: amorphous opaque mass, posterior mandible. Both can block eruption</td></tr>
<tr><td>Fibrous dysplasia</td><td>"Ground-glass", poorly defined, blends into normal bone; maxilla</td></tr>
<tr><td>Paget's disease</td><td>"Cotton-wool" opacities, hypercementosis, loss of lamina dura; raised alkaline phosphatase</td></tr>
<tr><td>Osteosarcoma</td><td>"Sunray" spicules; symmetrical PDL widening of affected teeth</td></tr>
<tr><td>Hyperparathyroidism</td><td>Loss of lamina dura; brown tumours (lucent)</td></tr>
<tr><td>Antral mucous retention cyst</td><td>Dome-shaped soft-tissue opacity on the floor of the maxillary sinus; usually incidental</td></tr>
</table></div>
<p><b>Caries depth.</b> Radiographs underestimate depth. A lesion in the outer half of dentine on a bitewing usually means cavitation is likely.</p>
<p><b>Action.</b> An unexplained lesion with aggressive features, or any lesion you cannot identify, needs referral to oral surgery or oral and maxillofacial radiology. Record the report for every image.</p>
`, {
  spot: 'A description such as "multilocular radiolucency in the ramus with root resorption" or "lucency around the crown of an unerupted lower third molar".',
  trap: 'Calling cemento-osseous dysplasia a periapical infection and starting root canal treatment on a vital tooth; or confusing keratocyst (little expansion) with ameloblastoma (expansion and root resorption).',
  src: 'WHO Classification of Head and Neck Tumours (5th ed, 2022) for odontogenic lesions; standard UK dental radiology texts; FGDP(UK) Selection Criteria (clinical evaluation).'
});

node('prev', 'clin', 'Prevention and health promotion', 'Delivering Better Oral Health v4 fluoride and diet advice, very brief advice on tobacco and alcohol, and reducing inequalities.', `
<p>Prevention is high-yield in both parts. Part 1 asks for exact fluoride concentrations by age and risk; Part 2 stations often ask you to give diet or smoking advice to an actor.</p>
<p>Tailor advice to the patient's age and risk, keep it short and practical, and record what was given. Prevention should be part of every treatment plan, not an afterthought.</p>
<ul>
<li><a href="#n-prev-dboh">Fluoride and caries prevention (DBOH)</a>: toothpaste strengths, varnish, mouthrinse, high-fluoride prescriptions, fissure sealants and diet.</li>
<li><a href="#n-prev-life">Tobacco, alcohol, diet and inequalities</a>: very brief advice, alcohol units, the common risk factor approach and population measures.</li>
</ul>
`, {
  spot: 'Stems naming a child\'s age and caries risk and asking for the fluoride advice, or a smoker asking for help.',
  trap: 'Giving a high-strength toothpaste or mouthrinse below its minimum age.',
  src: 'Delivering Better Oral Health: an evidence-based toolkit for prevention (v4, 2021); NCSCT very brief advice; UK Chief Medical Officers\' low-risk drinking guidelines (2016).'
});

node('prev-dboh', 'prev', 'Fluoride and caries prevention (DBOH)', 'DBOH v4: toothpaste strength by age, varnish at least twice yearly, mouthrinse from 8, 2,800 ppm from 10 and 5,000 ppm from 16.', `
<p><b>Advice for everyone.</b> Brush twice daily (last thing at night and at one other time) with fluoride toothpaste. Spit, don't rinse. Reduce the amount and frequency of sugary food and drink. Parents brush or supervise children's brushing.</p>
<div class="scroll"><table class="t">
<tr><th>Group</th><th>Everyone</th><th>Extra for higher risk (or giving concern)</th></tr>
<tr><td>Children 0 to 3 years</td><td>Brush as soon as teeth erupt; smear of toothpaste with at least 1,000 ppm fluoride</td><td>Toothpaste of 1,350 to 1,500 ppm (smear); fluoride varnish 2 or more times a year</td></tr>
<tr><td>Children 3 to 6 years</td><td>Pea-sized amount of toothpaste with at least 1,000 ppm fluoride; fluoride varnish 2 times a year</td><td>Pea-sized amount of 1,350 to 1,500 ppm toothpaste; varnish 2 or more times a year</td></tr>
<tr><td>Children 7 years and young people</td><td>1,350 to 1,500 ppm toothpaste; fluoride varnish 2 times a year</td><td>Varnish 2 or more times a year. From 8: daily fluoride mouthrinse (0.05% sodium fluoride, 230 ppm) at a different time from brushing. From 10: 2,800 ppm toothpaste. From 16: 2,800 or 5,000 ppm toothpaste. Fissure seal permanent molars</td></tr>
<tr><td>Adults</td><td>1,350 to 1,500 ppm toothpaste</td><td>Varnish 2 times a year. For active coronal or root caries, consider a daily 0.05% fluoride rinse (230 ppm) and 2,800 or 5,000 ppm toothpaste on prescription</td></tr>
</table></div>
<p><b>Fluoride varnish.</b> 22,600 ppm (5% sodium fluoride). Check medical history: the most commonly used varnish contains colophony, so avoid it with allergy to sticking plaster or severe allergy or asthma needing hospital admission, and avoid varnish in ulcerative gingivitis or stomatitis.</p>
<p><b>Fissure sealants.</b> DBOH strongly recommends resin-based sealants on eruption of permanent molars in higher-risk children (evidence for glass ionomer is inconclusive). SDCEP Dental Caries in Children advises resin as first choice and glass ionomer as a temporary sealant on partially erupted first and second permanent molars.</p>
<p><b>Diet.</b> Free sugars should be no more than 5% of daily energy for everyone aged 2 and over. Keep sugary items to mealtimes; water or plain milk between meals. Babies: no sugar in feeds; introduce a free-flow cup from 6 months and discourage bottle feeding from 12 months. Use sugar-free medicines.</p>
<p><b>Fluoride toxicity.</b> The probably toxic dose is about 5 mg fluoride per kg body weight. Give calcium (milk) by mouth, and refer to hospital if the dose may exceed this.</p>
<p><b>Water fluoridation.</b> Target about 1 mg/L (1 ppm). Only a minority of the UK population is covered.</p>
`, {
  spot: 'A child of a stated age with active caries: lead-in asks which fluoride product or concentration is appropriate.',
  trap: 'Prescribing 5,000 ppm toothpaste to a 12-year-old (minimum age 16) or mouthrinse to a 6-year-old (from 8). Also: advising rinsing after brushing.',
  src: 'Delivering Better Oral Health: an evidence-based toolkit for prevention, version 4 (OHID/DHSC, 2021); SACN Carbohydrates and Health (2015).',
  check: 'The fluoride toxicity dose (about 5 mg/kg) and the water fluoridation target (about 1 mg/L) are not in DBOH: confirm them in a paediatric dentistry text, TOXBASE or UKHSA guidance. Confirm fluoride toxicity thresholds and management in a current paediatric dentistry text or TOXBASE.'
});

node('prev-life', 'prev', 'Tobacco, alcohol, diet and inequalities', 'Very brief advice (Ask, Advise, Act), alcohol 14 units a week, the common risk factor approach and upstream action on inequalities.', `
<p><b>Smoking: very brief advice (VBA).</b> About 30 seconds, for every smoker at every opportunity.</p>
<ol>
<li><b>Ask</b> about and record smoking status.</li>
<li><b>Advise</b> that the best way to stop is with a combination of stop-smoking medication and specialist support. Do not lecture about harms.</li>
<li><b>Act</b> on the response: refer to the local stop-smoking service, or signpost to NHS resources. If the patient is not ready, record it and ask again next time.</li>
</ol>
<p>Stop-smoking aids: nicotine replacement therapy (NRT), varenicline (prescribed by GP or pharmacist), and e-cigarettes. UK public health bodies regard vaping as far less harmful than smoking but not risk-free, and not for non-smokers or children.</p>
<p><b>Oral effects of tobacco.</b> Oral cancer, leukoplakia, periodontitis (reduced bleeding masks inflammation), poor healing, staining, smoker's keratosis. Smokeless tobacco and areca nut (paan, gutkha) cause submucous fibrosis and cancer; ask about them, especially in South Asian communities.</p>
<p><b>Alcohol.</b> UK Chief Medical Officers' guideline: no more than 14 units a week for men and women, spread over 3 or more days, with some drink-free days. One unit is 10 mL (8 g) of pure alcohol. No alcohol is the safest approach in pregnancy. Screen with AUDIT-C and give brief advice.</p>
<p><b>Diet.</b> See <a href="#n-prev-dboh">DBOH</a>. Free sugars no more than 5% of energy; also erosion advice (acidic drinks with meals, use a straw, do not brush straight after).</p>
<p><b>HPV vaccination.</b> Offered to all adolescents (girls and boys) at 12 to 13 years in the UK.</p>
<p><b>Inequalities.</b> Oral disease follows a social gradient: worse with deprivation.</p>
<div class="scroll"><table class="t">
<tr><th>Concept</th><th>Meaning</th></tr>
<tr><td>Common risk factor approach</td><td>Target shared risks (sugar, tobacco, alcohol, hygiene) that cause oral and general disease</td></tr>
<tr><td>Proportionate universalism</td><td>Universal action, with intensity scaled to need (Marmot)</td></tr>
<tr><td>Upstream versus downstream</td><td>Upstream: policy and environment (water fluoridation, Soft Drinks Industry Levy, supervised toothbrushing). Downstream: individual chairside advice</td></tr>
<tr><td>Ottawa Charter (1986)</td><td>Build healthy public policy; create supportive environments; strengthen community action; develop personal skills; reorient health services</td></tr>
</table></div>
<p>National programmes: Childsmile (Scotland), Designed to Smile (Wales), supervised toothbrushing schemes (England).</p>
`, {
  spot: 'A patient who smokes "but isn\'t interested in stopping", or a question on which measure best reduces inequalities.',
  trap: 'Spending time listing smoking harms instead of giving VBA and offering referral. Choosing individual chairside education as the best way to reduce inequalities (upstream measures are).',
  src: 'National Centre for Smoking Cessation and Training (NCSCT) Very Brief Advice; NICE NG209 Tobacco (2021); UK CMOs\' Low Risk Drinking Guidelines (2016); Delivering Better Oral Health v4 (2021); Marmot Review (2010).',
  check: 'Confirm the AUDIT-C threshold for further assessment (commonly 5 or more) in current OHID guidance.'
});

node('emerg', 'clin', 'Medical emergencies', 'The Resuscitation Council UK drug list and doses, ABCDE assessment and basic life support for adults and children.', `
<p>Every dental team must manage emergencies until help arrives, and train together at least annually. Questions test the drug, dose, route and the next step.</p>
<ul>
<li><a href="#n-emerg-drugs">Emergency drugs and doses</a>: anaphylaxis by age, angina, MI, asthma, hypoglycaemia, seizures, adrenal crisis.</li>
<li><a href="#n-emerg-collapse">Collapse, ABCDE and basic life support</a>: faint, CPR ratios, AED, choking.</li>
</ul>
<p>The routine is always the same: recognise, call for help, assess with ABCDE, give the right drug by the right route, and record what happened. Most emergencies in the dental chair are preventable with a good medical history and a calm, well-planned appointment.</p>
`, {
  spot: 'A patient becomes unwell in the chair: the stem gives signs and asks for the first drug, dose or action.',
  trap: 'Choosing the right drug but the wrong route or dose (for example IV adrenaline in practice).',
  src: 'Resuscitation Council UK: Quality Standards for CPR practice and training (primary dental care); RCUK Emergency treatment of anaphylaxis (2021); RCUK Resuscitation Guidelines; BNF.'
});

node('emerg-drugs', 'emerg', 'Emergency drugs and doses', 'Dental emergency drug list (BNF, SDCEP): adrenaline, aspirin, glucagon, oral glucose, GTN, buccal midazolam, oxygen and salbutamol, with route and dose.', `
<p><b>The emergency drugs for dental practice (BNF and SDCEP; the RCUK dental standard covers equipment and defers to the BNF for drugs):</b> adrenaline 1 mg/mL (1:1,000) for IM injection; aspirin 300 mg dispersible; glucagon 1 mg for IM injection; oral glucose (gel, tablets or powder); glyceryl trinitrate (GTN) spray 400 micrograms per dose; midazolam oromucosal (buccal) solution; oxygen; salbutamol inhaler 100 micrograms per actuation (with spacer).</p>
<div class="scroll"><table class="t">
<tr><th>Emergency</th><th>Drug and dose</th></tr>
<tr><td>Anaphylaxis</td><td>IM adrenaline 1 mg/mL, anterolateral thigh. Adult and child 12 years and over: 500 micrograms (0.5 mL; 300 micrograms if the child is small or prepubertal). Child 6 to 11 years: 300 micrograms (0.3 mL). Child 6 months to 5 years: 150 micrograms (0.15 mL). Under 6 months: 100 to 150 micrograms (0.1 to 0.15 mL). Repeat after 5 minutes if no improvement. High-flow oxygen; call 999</td></tr>
<tr><td>Angina</td><td>GTN spray 400 micrograms sublingually, 1 to 2 sprays; repeat after 5 minutes. No relief: treat as myocardial infarction</td></tr>
<tr><td>Myocardial infarction (acute coronary syndrome)</td><td>Call 999. Aspirin 300 mg chewed or dispersed (unless allergic). GTN. Oxygen 15 L/min (SDCEP); the BNF dental section reserves it for a patient who is cyanosed or whose conscious level is falling</td></tr>
<tr><td>Acute asthma</td><td>Salbutamol 100 micrograms per puff via a large-volume spacer, one puff at a time (2 to 10 puffs), repeated every 10 to 20 minutes if needed. Oxygen. Call 999 if severe or not responding</td></tr>
<tr><td>Hypoglycaemia (blood glucose below 4 mmol/L)</td><td>Conscious and cooperative: 15 to 20 g fast-acting oral glucose; repeat after 15 minutes if needed, up to 3 treatments in total; once above 4 mmol/L and recovered, give a longer-acting carbohydrate snack. Unconscious or unable to swallow: glucagon IM 1 mg for an adult. Child doses are by age and weight (a lower dose for a small child): look them up in the BNF</td></tr>
<tr><td>Prolonged seizure (5 minutes or more)</td><td>Buccal midazolam: adult and child 10 years or over 10 mg; 5 to 9 years 7.5 mg; 1 to 4 years 5 mg; 3 to 11 months 2.5 mg. Call 999. Protect from injury; recovery position after</td></tr>
<tr><td>Adrenal crisis</td><td>Call 999; lie flat; oxygen; urgent transfer to hospital (BNF dental advice). Hydrocortisone is not on the dental emergency drug list</td></tr>
</table></div>
<p><b>Oxygen.</b> 15 L/min via a non-rebreathe mask with reservoir for the acutely ill. Target saturations 94 to 98% (BNF, acute asthma); a lower target of 88 to 92% is used in patients at risk of hypercapnic respiratory failure such as severe COPD (BTS guidance; check). Never withhold oxygen from a hypoxic patient.</p>
<p><b>Anaphylaxis recognition.</b> Sudden airway and/or breathing and/or circulation problems, usually with skin or mucosal changes (urticaria, angio-oedema). Skin changes alone are not anaphylaxis. If there is no improvement after two IM doses, this is refractory anaphylaxis and needs specialist IV adrenaline. Antihistamines and steroids are not first-line.</p>
<p><b>GTN cautions.</b> Hypotension and recent use of phosphodiesterase-5 inhibitors (sildenafil, tadalafil).</p>
`, {
  spot: 'A patient who is wheezy with lip swelling after latex gloves; a diabetic who is confused and sweaty; a patient with central chest pain; a seizure lasting over 5 minutes.',
  trap: 'Using 1:10,000 adrenaline or the IV route; giving chlorphenamine first; giving glucagon to a conscious, cooperative hypoglycaemic patient instead of oral glucose.',
  src: 'Resuscitation Council UK: Emergency treatment of anaphylaxis (2021) and Quality Standards: primary dental care; SDCEP Drug Prescribing for Dentistry (Medical emergencies); BNF (Prescribing in dental practice; Medical emergencies in the community).',
  check: 'Confirm the salbutamol regimen (sources differ on puff number and interval: SDCEP, RCUK and local flowcharts) and buccal midazolam age bands and repeat-dose advice in the current BNF and RCUK dental quality standards. Confirm glucagon age and weight bands in the BNF. Confirm whether hydrocortisone is part of the current RCUK dental drug list (it is not in the core list).'
});

node('emerg-collapse', 'emerg', 'Collapse, ABCDE and basic life support', 'Assess with ABCDE, lie the fainting patient flat, and run CPR at 30:2 for adults and 15:2 after 5 rescue breaths for children.', `
<p><b>ABCDE approach</b> (Resuscitation Council UK). Check for danger and response, call for help early, then assess and treat in order.</p>
<div class="scroll"><table class="t">
<tr><th>Step</th><th>Look for</th><th>Act</th></tr>
<tr><td>A Airway</td><td>Obstruction, stridor, swelling, vomit</td><td>Head tilt and chin lift or jaw thrust; suction; airway adjunct; treat anaphylaxis</td></tr>
<tr><td>B Breathing</td><td>Rate, effort, wheeze, SpO2</td><td>Oxygen; salbutamol for asthma</td></tr>
<tr><td>C Circulation</td><td>Pulse, capillary refill (normally under 2 seconds), BP, skin colour</td><td>Lie flat, raise legs; treat cause</td></tr>
<tr><td>D Disability</td><td>ACVPU (alert, new confusion, voice, pain, unresponsive), pupils, blood glucose</td><td>Glucose or glucagon; midazolam for prolonged seizure</td></tr>
<tr><td>E Exposure</td><td>Rash, swelling, bleeding</td><td>Keep warm, preserve dignity</td></tr>
</table></div>
<p><b>Vasovagal syncope.</b> The commonest collapse in the dental chair. Pale, sweaty, nauseous, slow pulse, brief loss of consciousness. Lie flat and raise the legs; recovery is quick. If the patient does not recover quickly, reassess: think hypoglycaemia, cardiac arrest, stroke.</p>
<p><b>Cardiac arrest: adult basic life support.</b> Unresponsive and not breathing normally (agonal gasps count as abnormal): call 999 and get the automated external defibrillator (AED). Chest compressions at 30:2 with ventilations, rate 100 to 120 per minute, depth 5 to 6 cm, full recoil, minimal interruptions. Attach the AED as soon as it arrives and follow its prompts. In the dental chair, lie the chair flat and start CPR there if the patient cannot be moved safely to the floor.</p>
<p><b>Paediatric basic life support (healthcare professionals).</b> Open the airway, give 5 rescue breaths, then 15 compressions to 2 breaths, rate 100 to 120 per minute, depth at least one third of the chest, never more than 6 cm (adult depth of 5 to 6 cm in adolescents). Infant: two-thumb encircling technique. Rescuers trained only in adult BLS may use 30:2 for children, starting with 5 rescue breaths.</p>
<p><b>Choking.</b> Effective cough: encourage coughing. Ineffective cough, conscious: adult or child over 1 year, up to 5 back blows then up to 5 abdominal thrusts, repeated; infant, 5 back blows then 5 chest thrusts. Unconscious: start CPR. Swallowed or inhaled dental items: refer for chest or abdominal radiograph as appropriate.</p>
<p><b>Equipment</b> (RCUK dental quality standards): AED with spare pads, scissors and razor, oxygen cylinder able to deliver 15 L/min with masks and reservoir, adult and child self-inflating bags with face masks, oropharyngeal airways, portable suction and a pocket mask with oxygen port. Drugs (including a spacer for salbutamol) come from the BNF and SDCEP lists. Check resuscitation equipment at least weekly and audit the checks. Train the whole team at least annually.</p>
`, {
  spot: 'A patient slumps in the chair: lead-in asks for the first action or the compression ratio for a child.',
  trap: 'Waiting to check for a pulse before starting CPR in an unresponsive patient with agonal breathing; using 30:2 without rescue breaths in a child when you are a healthcare professional.',
  src: 'Resuscitation Council UK Resuscitation Guidelines (Adult and Paediatric Basic Life Support); RCUK Quality Standards for CPR practice and training: primary dental care.',
  check: 'Checked against the RCUK 2025 Guidelines (adult and paediatric BLS, published 27 October 2025): the ratios, rate, depth and choking sequences here match. The 2025 adult guideline now says to call 999 for any unresponsive person before assessing breathing.'
});
