{ q: `A 42-year-old woman smokes 15 cigarettes a day. You have asked about and recorded her smoking status. Following the very brief advice (VBA) model, what is the most appropriate next step?`,
  opts: [`Advise that the most effective way to stop is with support from a stop smoking service, and offer a referral`, `Tell her she must stop smoking before any further treatment`, `Advise her to cut down gradually on her own`, `Ask her to come back when she feels ready to quit`, `Give a detailed explanation of every tobacco-related oral disease`],
  ans: 0, why: `VBA is Ask, Advise, Act. Advise that stopping with specialist support and medication is the most effective method, then act by offering referral. Lengthy lectures or making treatment conditional do not help.`, th: ['prev-life'] },

{ q: `A 50-year-old man drinks wine most evenings and asks what a safe level is. Based on the UK Chief Medical Officers' low-risk drinking guidelines, what should you advise?`,
  opts: [`No more than 21 units a week`, `No more than 14 units a week, spread over 3 or more days`, `No more than 28 units a week`, `No more than 14 units a week, drunk in one or two sessions`, `No more than 7 units a week`],
  ans: 1, why: `The UK CMO guideline (2016) is the same for men and women: no more than 14 units a week regularly, spread over 3 or more days. Drinking it in one or two heavy sessions raises risk.`, th: ['prev-life'] },

{ q: `A 7-year-old boy at high caries risk has partially erupted lower first permanent molars with deep fissures. He is cooperative, but moisture control is poor because of the operculum. What is the most appropriate preventive measure for these teeth?`,
  opts: [`Resin-based fissure sealant`, `Preventive resin restoration with fissure preparation`, `Glass ionomer fissure sealant`, `Defer sealing until the teeth are fully erupted`, `Occlusal amalgam restoration`],
  ans: 2, why: `Resin sealant is the first choice (DBOH, SDCEP), but SDCEP Dental Caries in Children advises glass ionomer as a temporary sealant on partially erupted first and second permanent molars, which suits this poorly isolated tooth. Deferring leaves a high-risk fissure unprotected.`, th: ['prev-dboh'] },

// ---------- Medical emergencies ----------
{ q: `A 35-year-old woman develops wheeze, facial swelling, an urticarial rash and a weak, rapid pulse minutes after the nurse puts on latex gloves. An ambulance has been called. What is the most appropriate first drug?`,
  opts: [`Chlorphenamine 10 mg intramuscularly`, `Hydrocortisone 200 mg intramuscularly`, `Salbutamol by inhaler`, `Adrenaline 0.5 mg (0.5 ml of 1:1,000) intramuscularly`, `Adrenaline 0.5 mg (5 ml of 1:10,000) intravenously`],
  ans: 3, why: `Resuscitation Council UK (2021): intramuscular adrenaline 1:1,000 is the first-line drug in anaphylaxis, 500 micrograms for adults. Antihistamines and steroids are not first-line, and IV adrenaline is for specialists only.`, th: ['emerg-drugs'] },

{ q: `A 60-year-old man with insulin-treated diabetes becomes confused and then unresponsive in the chair. He is breathing and his capillary blood glucose is 2.1 mmol/l. He cannot swallow safely. What is the most appropriate drug?`,
  opts: [`Oral glucose gel 15–20 g`, `Adrenaline 0.5 mg intramuscularly`, `Midazolam 10 mg buccally`, `Glyceryl trinitrate spray sublingually`, `Glucagon 1 mg intramuscularly`],
  ans: 4, why: `Hypoglycaemia in a patient who cannot swallow safely is treated with glucagon 1 mg IM. Oral glucose is only for a conscious, cooperative patient.`, th: ['emerg-drugs'] },

{ q: `A 68-year-old man with known stable angina develops central chest tightness while waiting for treatment. He is alert and his blood pressure is 140/85 mmHg. What is the most appropriate first drug?`,
  opts: [`Glyceryl trinitrate (GTN) spray sublingually`, `Adrenaline 0.5 mg intramuscularly`, `Glucagon 1 mg intramuscularly`, `Midazolam 10 mg buccally`, `Salbutamol by inhaler`],
  ans: 0, why: `Angina is treated with sublingual GTN, with the patient sitting. If pain is not relieved, suspect myocardial infarction: call 999 and give aspirin 300 mg to chew if not contraindicated.`, th: ['emerg-drugs', 'emerg-collapse'] },

{ q: `A 30-year-old woman with epilepsy has a tonic-clonic seizure in the dental chair. After 5 minutes she is still fitting. What is the most appropriate drug?`,
  opts: [`Diazepam 10 mg orally`, `Midazolam 10 mg buccally`, `Flumazenil 200 micrograms intravenously`, `Glucagon 1 mg intramuscularly`, `Adrenaline 0.5 mg intramuscularly`],
  ans: 1, why: `A seizure lasting 5 minutes or more is treated with buccal midazolam (10 mg for an adult) and an ambulance. Nothing should be given by mouth to a fitting patient.`, th: ['emerg-drugs', 'emerg-collapse'] },

{ q: `A 19-year-old man with asthma becomes breathless and wheezy during scaling. He can still speak in full sentences and is not cyanosed. What is the most appropriate first step?`,
  opts: [`Give adrenaline 0.5 mg intramuscularly`, `Lay him flat with his legs raised`, `Give salbutamol by inhaler through a large-volume spacer`, `Give oxygen only and wait for him to settle`, `Give hydrocortisone intramuscularly`],
  ans: 2, why: `Sit the patient up and give salbutamol via a spacer, repeating as needed. Adrenaline is reserved for anaphylaxis; lying flat worsens breathlessness.`, th: ['emerg-collapse'] },

// ---------- Prescribing ----------
{ q: `A 40-year-old man has a localised, fluctuant swelling buccal to a non-vital lower first molar. His temperature is normal, there is no lymphadenopathy or trismus, and he feels well. What is the most appropriate management?`,
  opts: [`Amoxicillin 500 mg three times daily for 5 days and review`, `Metronidazole 400 mg three times daily for 5 days and review`, `Amoxicillin plus metronidazole and review`, `Drainage through the root canal or by incision, or extraction, without antibiotics`, `Urgent referral to oral and maxillofacial surgery`],
  ans: 3, why: `SDCEP Drug Prescribing for Dentistry: localised infection is treated by local measures (drainage, pulp extirpation or extraction). Antibiotics are only an adjunct when there is spreading infection or systemic involvement.`, th: ['pharm-abx', 'surg-inf'] },

{ q: `A 28-year-old woman has a dental abscess with spreading facial cellulitis and a temperature of 38.3°C. She can swallow, has no breathing difficulty and has no drug allergies. The abscess has been drained. Which antibiotic regimen is most appropriate?`,
  opts: [`Amoxicillin 250 mg three times daily for 3 days`, `Amoxicillin 3 g as a single dose`, `Amoxicillin 1 g twice daily for 14 days`, `Phenoxymethylpenicillin 250 mg four times daily for 3 days`, `Amoxicillin 500 mg three times daily for 5 days`],
  ans: 4, why: `SDCEP: amoxicillin 500 mg three times daily for 5 days (or phenoxymethylpenicillin 500 mg four times daily for 5 days) as an adjunct to drainage, with review at about 3 days. SDCEP names phenoxymethylpenicillin as the first choice and amoxicillin as the alternative; courses are usually 3 to 5 days.`, th: ['pharm-abx'] },

{ q: `A 45-year-old man with necrotising gingivitis and systemic involvement is prescribed an antibiotic. You warn him not to drink alcohol during the course and for 48 hours afterwards. Which antibiotic has been prescribed?`,
  opts: [`Metronidazole`, `Amoxicillin`, `Phenoxymethylpenicillin`, `Clarithromycin`, `Doxycycline`],
  ans: 0, why: `Metronidazole causes a disulfiram-like reaction with alcohol (flushing, nausea, vomiting); the BNF advises avoiding alcohol during treatment and for 48 hours after.`, th: ['pharm-abx', 'pharm-int'] },

{ q: `A 72-year-old woman taking warfarin for atrial fibrillation has denture stomatitis that persists despite good denture hygiene. Which antifungal is most appropriate?`,
  opts: [`Miconazole oromucosal gel`, `Nystatin oral suspension`, `Fluconazole capsules`, `Itraconazole capsules`, `Ketoconazole tablets`],
  ans: 1, why: `Azoles, including topical miconazole gel, markedly enhance the effect of warfarin and can cause dangerous bleeding. Nystatin is not absorbed and does not interact.`, th: ['pharm-int', 'med-bleed'] },

{ q: `A 60-year-old man who had anaphylaxis to penicillin takes simvastatin 40 mg daily. After drainage of a dental abscess, he still has spreading swelling and a fever. Which antibiotic is most appropriate?`,
  opts: [`Clarithromycin 500 mg twice daily for 5 days`, `Erythromycin 500 mg four times daily for 5 days`, `Metronidazole 400 mg three times daily for 5 days`, `Amoxicillin 500 mg three times daily for 5 days`, `Phenoxymethylpenicillin 500 mg four times daily for 5 days`],
  ans: 2, why: `Penicillins are contraindicated. Macrolides inhibit simvastatin metabolism and risk myopathy and rhabdomyolysis, so metronidazole, which SDCEP lists as the alternative in penicillin allergy, is the safest choice. SDCEP says not to prescribe macrolides to patients taking statins.`, th: ['pharm-abx', 'pharm-int'] },

// ---------- Local anaesthesia and sedation ----------
{ q: `A 70 kg adult needs extensive treatment under local anaesthesia. You are using 4% articaine with 1:100,000 adrenaline in 2.2 ml cartridges. Taking the maximum recommended dose as 7 mg/kg, what is the maximum number of whole cartridges you can give?`,
  opts: [`2`, `3`, `4`, `5`, `7`],
  ans: 3, why: `4% = 40 mg/ml, so one 2.2 ml cartridge = 88 mg. Maximum dose = 7 × 70 = 490 mg. 490 ÷ 88 = 5.6, so 5 whole cartridges.`, th: ['pain-la'] },

{ q: `A 20 kg child needs treatment under local anaesthesia. You are using 2% lidocaine with 1:80,000 adrenaline in 2.2 ml cartridges. Taking the maximum dose as 4.4 mg/kg, what is the maximum number of whole cartridges?`,
  opts: [`Half a cartridge`, `1`, `3`, `4`, `2`],
  ans: 4, why: `2% = 20 mg/ml, so one 2.2 ml cartridge = 44 mg. Maximum dose = 4.4 × 20 = 88 mg. 88 ÷ 44 = 2 cartridges.`, th: ['pain-la'] },

{ q: `A few minutes after a right inferior alveolar nerve block, a 30-year-old man cannot close his right eye and the right corner of his mouth droops. What is the most likely cause?`,
  opts: [`Anaesthetic deposited in the parotid gland, affecting the facial nerve`, `Intravascular injection into the inferior alveolar artery`, `Needle trauma to the lingual nerve`, `Allergic reaction to the local anaesthetic`, `Stroke`],
  ans: 0, why: `Injecting too far posteriorly deposits anaesthetic in the parotid capsule, causing a temporary lower motor neurone facial palsy. Protect the eye (tape it closed or use a patch) and reassure; it resolves as the anaesthetic wears off.`, th: ['pain-la'] },

{ q: `During intravenous sedation with midazolam, a 45-year-old woman becomes unresponsive and her breathing slows. You have stimulated her, supported the airway and given oxygen. Which drug should be given to reverse the sedation?`,
  opts: [`Naloxone`, `Flumazenil`, `Adrenaline`, `Glucagon`, `Atropine`],
  ans: 1, why: `Flumazenil is the benzodiazepine antagonist. Naloxone reverses opioids. Flumazenil is shorter-acting than midazolam, so monitor for re-sedation.`, th: ['pain-sed'] },

{ q: `A fit and well 9-year-old girl is anxious about two restorations. She allows an examination but behaviour management alone has not been enough. What is the most appropriate sedation technique in primary care?`,
  opts: [`Intravenous midazolam`, `Oral midazolam`, `Inhalation sedation with nitrous oxide and oxygen`, `Referral for general anaesthesia`, `Intranasal midazolam`],
  ans: 2, why: `IACSD standards: inhalation sedation with nitrous oxide/oxygen is the standard technique for children. Midazolam techniques for children are usually reserved for specialist settings, and GA is a last resort.`, th: ['pain-sed', 'paed-tx'] },

// ---------- Medically compromised patients ----------
{ q: `A 70-year-old man taking warfarin for atrial fibrillation needs one lower premolar extracted. His INR, checked yesterday, is 3.1 and has been stable. What is the most appropriate management?`,
  opts: [`Ask him to stop warfarin for 5 days before the extraction`, `Ask his GP to switch him to heparin`, `Defer the extraction until his INR is below 2`, `Proceed without interrupting warfarin, using local haemostatic measures`, `Refer to hospital for the extraction`],
  ans: 3, why: `SDCEP (2022): if the INR is below 4, checked ideally within 24 hours (up to 72 hours if stable), extract in practice without interrupting warfarin. Use local measures such as packing and suturing.`, th: ['med-bleed'] },

{ q: `A 65-year-old woman takes apixaban twice daily for atrial fibrillation. She needs three teeth extracted at one visit, a procedure with a higher risk of bleeding. According to SDCEP, what should you advise?`,
  opts: [`Stop apixaban for 3 days before the appointment`, `Take apixaban as usual with no change`, `Take an extra dose the night before`, `Stop apixaban for 48 hours after the extractions`, `Miss the morning dose on the day of treatment and take the next dose at the usual time`],
  ans: 4, why: `SDCEP (2022): for higher bleeding-risk procedures, patients on twice-daily apixaban or dabigatran miss the morning dose and restart at the usual time (at least 4 hours after haemostasis). Low-risk procedures need no change.`, th: ['med-bleed'] },

{ q: `Five patients need dental extractions. According to SDCEP (2017), which patient is in the higher-risk group for medication-related osteonecrosis of the jaw (MRONJ)?`,
  opts: [`A 70-year-old woman taking oral alendronate for 2 years plus long-term prednisolone`, `A 65-year-old woman taking oral alendronate for 3 years and no other relevant drugs`, `A 55-year-old woman taking hormone replacement therapy`, `A 72-year-old woman taking calcium and vitamin D only`, `A 68-year-old woman who has taken oral risedronate for 4 years`],
  ans: 0, why: `Higher risk: antiresorptives for cancer, previous MRONJ, oral bisphosphonates for 5 years or more, or any duration with systemic glucocorticoids. The woman on alendronate with prednisolone is higher risk; the others under 5 years without steroids are low risk.`, th: ['med-mronj'] },

{ q: `A 62-year-old man finished radiotherapy for oropharyngeal cancer 2 years ago; the field included the mandible. His lower right first molar is unrestorable. What is the most appropriate management?`,
  opts: [`Extract it in practice with antibiotic cover`, `Refer to the specialist team for extraction because of the risk of osteoradionecrosis`, `Extract it in practice after a chlorhexidine mouthwash`, `Leave it and review in 12 months`, `Extract it in practice after a 2-week course of amoxicillin`],
  ans: 1, why: `Extraction in an irradiated mandible carries a lifelong risk of osteoradionecrosis. It should be planned by the specialist (restorative or oral and maxillofacial) team; antibiotic cover in practice does not remove the risk.`, th: ['med-mronj'] },

{ q: `A 25-year-old man had a ventricular septal defect fully repaired in childhood. He has no residual defect and no history of infective endocarditis. He needs subgingival instrumentation. What is the most appropriate approach to endocarditis prophylaxis?`,
  opts: [`Amoxicillin 3 g orally 1 hour before treatment`, `Clindamycin 600 mg orally 1 hour before treatment`, `No antibiotic prophylaxis`, `Chlorhexidine mouthwash before treatment`, `Refer to hospital for treatment`],
  ans: 2, why: `NICE CG64: antibiotic prophylaxis and chlorhexidine are not recommended routinely for dental procedures. A fully repaired VSD is not even an at-risk condition.`, th: ['med-other'] },

{ q: `A 28-year-old woman who is 8 weeks pregnant needs two non-urgent restorations. She has no pain. When is the most appropriate time to place them?`,
  opts: [`Immediately, in the first trimester`, `After delivery`, `In the third trimester`, `In the second trimester`, `After she stops breastfeeding`],
  ans: 3, why: `Elective treatment is best done in the second trimester: organogenesis is complete and the patient is usually comfortable lying back. Urgent care should never be delayed.`, th: ['med-other'] },

// ---------- Periodontology ----------
{ q: `A 48-year-old new patient has a basic periodontal examination (BPE) code 4 in the upper right sextant and codes 2 and 3 elsewhere. According to the British Society of Periodontology (BSP), what charting is needed?`,
  opts: [`A 6-point pocket chart of the upper right sextant only`, `A 6-point chart of only the sextants scoring 3 or 4`, `No further charting`, `Radiographs only`, `A full-mouth 6-point pocket chart`],
  ans: 4, why: `BSP: a code 4 in any sextant requires a full-mouth 6-point pocket chart, plus radiographs to assess bone levels. Code 3 alone needs a 6-point chart of that sextant after initial therapy.`, th: ['perio-bpe'] },

{ q: `A 9-year-old boy attends for a routine examination. How should his periodontal screening be recorded according to BSP and British Society of Paediatric Dentistry guidance?`,
  opts: [`Use BPE codes 0–2 only on the six index teeth`, `Use the full BPE codes 0–4 and * on all teeth`, `Do not screen children under 12`, `Use the full BPE codes 0–4 and * on the six index teeth`, `Record a full 6-point pocket chart`],
  ans: 0, why: `For ages 7–11 a simplified BPE uses codes 0–2 on the index teeth (UR6, UR1, UL6, LL6, LL1, LR6), to avoid false pockets in erupting teeth. From 12 to 17 the full codes are used on the index teeth.`, th: ['perio-bpe', 'paed-tx'] },

{ q: `A 40-year-old non-smoker without diabetes has interproximal bone loss affecting most teeth. At the worst site, bone loss is 30% of the root length (coronal third). Maximum probing depth is 5 mm and no teeth have been lost to periodontitis. What is the most appropriate diagnosis according to the BSP implementation of the 2017 classification?`,
  opts: [`Generalised periodontitis stage II grade A`, `Generalised periodontitis stage II grade B`, `Generalised periodontitis stage III grade B`, `Localised periodontitis stage II grade C`, `Generalised periodontitis stage I grade B`],
  ans: 1, why: `Bone loss in the coronal third (15–33%) is stage II. Grade is % bone loss divided by age: 30 ÷ 40 = 0.75, which falls in 0.25–1.0, grade B. Most teeth affected makes it generalised.`, th: ['perio-class'] },

{ q: `A 35-year-old smoker is newly diagnosed with generalised periodontitis stage III grade C. According to the BSP UK version of the EFP S3 guideline, what is the most appropriate first step of treatment?`,
  opts: [`Systemic amoxicillin and metronidazole`, `Periodontal flap surgery`, `Oral hygiene instruction, smoking cessation support and supragingival professional mechanical plaque removal`, `Extraction of the teeth with the deepest pockets`, `Locally delivered antimicrobials`],
  ans: 2, why: `Step 1 of the S3 guideline is behaviour change: oral hygiene instruction, risk factor control (smoking, diabetes) and supragingival plaque removal. Subgingival instrumentation is step 2, surgery step 3.`, th: ['perio-tx'] },

{ q: `A 22-year-old student who smokes has had 3 days of painful, bleeding gums and bad breath during exam season. The interdental papillae are punched out and covered by a grey slough. What is the most likely diagnosis?`,
  opts: [`Primary herpetic gingivostomatitis`, `Desquamative gingivitis`, `Plaque-induced gingivitis`, `Necrotising gingivitis`, `Pericoronitis`],
  ans: 3, why: `Pain, bleeding, halitosis and punched-out necrotic papillae in a stressed smoker are classic necrotising gingivitis. Herpetic gingivostomatitis causes vesicles and ulcers across the mucosa with fever, usually in children.`, th: ['perio-class', 'perio-tx'] },

// ---------- Oral surgery ----------
{ q: `A 26-year-old man has a partially erupted lower left third molar. According to NICE TA1 (2000), which finding is an indication for removing it?`,
  opts: [`Asymptomatic mesioangular impaction with no pathology`, `One mild episode of pericoronitis that settled with irrigation`, `Worry that the tooth will crowd his lower incisors`, `A wish to avoid problems while travelling abroad`, `A second episode of pericoronitis`],
  ans: 4, why: `NICE TA1 advises against prophylactic removal. Recurrent pericoronitis (or one severe episode) is an indication; a first mild episode is not.`, th: ['surg-m3m'] },

{ q: `A 32-year-old smoker returns 3 days after a lower first molar extraction. He has severe throbbing pain radiating to his ear and bad breath. The socket is empty with exposed bone. There is no swelling and he has no fever. What is the most appropriate management?`,
  opts: [`Irrigate with warm saline, place an antiseptic dressing and advise analgesia`, `Prescribe amoxicillin 500 mg three times daily for 5 days`, `Prescribe metronidazole 400 mg three times daily for 3 days`, `Take a radiograph and refer to oral surgery`, `Prescribe chlorhexidine mouthwash and review in 2 weeks`],
  ans: 0, why: `This is alveolar osteitis (dry socket). Treat with irrigation, an antiseptic dressing and analgesia. SDCEP: antibiotics are not indicated without systemic involvement.`, th: ['surg-comp'] },

{ q: `While extracting an upper left first molar in a 45-year-old woman, you see a large oroantral communication (about 10 mm). No root has been displaced into the sinus. What is the most appropriate management?`,
  opts: [`Leave it to heal spontaneously`, `Close it immediately with a buccal advancement flap and give sinus precautions`, `Pack the socket with an antiseptic dressing`, `Refer routinely to an ear, nose and throat surgeon`, `Cover it with a partial denture`],
  ans: 1, why: `Small communications may heal on their own, but a large one should be closed primarily at the time, usually with a buccal advancement flap. Add advice not to blow the nose, and consider a decongestant.`, th: ['surg-comp'] },

{ q: `A 30-year-old man has a firm bilateral submandibular swelling, a raised floor of mouth, drooling, difficulty swallowing and a hoarse voice. His temperature is 39°C. What is the most appropriate action?`,
  opts: [`Prescribe amoxicillin and metronidazole and review in 24 hours`, `Incise and drain intraorally in the practice`, `Arrange immediate transfer to hospital by emergency ambulance`, `Refer to oral and maxillofacial surgery by letter`, `Take a panoramic radiograph`],
  ans: 2, why: `This is Ludwig's angina, which threatens the airway. The patient needs emergency transfer to hospital for airway protection, drainage and IV antibiotics.`, th: ['surg-inf', 'emerg-collapse'] },

{ q: `After surgical removal of a lower right third molar, a 27-year-old woman has numbness of the right side of the front of her tongue and altered taste. Which nerve is most likely injured?`,
  opts: [`Inferior alveolar nerve`, `Long buccal nerve`, `Mylohyoid nerve`, `Lingual nerve`, `Glossopharyngeal nerve`],
  ans: 3, why: `The lingual nerve supplies sensation to the anterior two-thirds of the tongue and carries chorda tympani taste fibres. Inferior alveolar injury numbs the lip and chin.`, th: ['surg-m3m', 'surg-comp'] },

// ---------- Oral medicine and pathology ----------
{ q: `A 64-year-old woman has had sore gums for 6 months. She has desquamative gingivitis, occasional blood-filled blisters on the palate and gritty eyes with conjunctival scarring. What is the most likely diagnosis?`,
  opts: [`Pemphigus vulgaris`, `Oral lichen planus`, `Erythema multiforme`, `Primary herpetic gingivostomatitis`, `Mucous membrane pemphigoid`],
  ans: 4, why: `Subepithelial blistering with intact (often blood-filled) blisters, desquamative gingivitis and conjunctival scarring in an older woman is mucous membrane pemphigoid. Refer to oral medicine and ophthalmology. Pemphigus blisters are intraepithelial and rupture quickly.`, th: ['omed-ulcer'] },

{ q: `A 50-year-old woman has a white, lace-like patch on the left buccal mucosa only. It lies in direct contact with a large, old amalgam restoration on the lower left second molar. The rest of the mucosa is normal and she takes no new medicines. What is the most likely diagnosis?`,
  opts: [`Oral lichenoid reaction to amalgam`, `Oral lichen planus`, `Leukoplakia`, `Frictional keratosis`, `Pseudomembranous candidosis`],
  ans: 0, why: `A unilateral reticular lesion confined to mucosa touching amalgam suggests a contact lichenoid reaction. Lichen planus is usually bilateral and symmetrical.`, th: ['omed-white'] },

{ q: `A 62-year-old man who smokes has a white plaque on the floor of his mouth. It cannot be wiped off, has no red areas, and there are no sharp teeth or other obvious cause. What is the most likely clinical diagnosis?`,
  opts: [`Frictional keratosis`, `Leukoplakia`, `Pseudomembranous candidosis`, `White sponge naevus`, `Oral lichen planus`],
  ans: 1, why: `Leukoplakia is a white plaque of questionable risk once other known causes are excluded. It is potentially malignant and, on the floor of mouth, needs referral for biopsy.`, th: ['omed-white'] },

{ q: `A 60-year-old woman has attacks of severe, electric shock-like pain over her right cheek lasting a few seconds. They are triggered by washing her face. Dental examination and radiographs are normal. What is the most appropriate first-line drug?`,
  opts: [`Amitriptyline`, `Ibuprofen`, `Carbamazepine`, `Codeine phosphate`, `Diazepam`],
  ans: 2, why: `This is trigeminal neuralgia; carbamazepine is first-line (NICE CKS). Arrange referral, as new trigeminal neuralgia needs investigation. Simple and opioid analgesics do not help.`, th: ['omed-pain'] },

{ q: `A 24-year-old woman has bilateral aching in front of her ears that is worse in the morning, tender masseter muscles and painless clicking of the left joint. Mouth opening is normal. What is the most appropriate initial management?`,
  opts: [`Occlusal adjustment by selective grinding`, `Referral for arthrocentesis`, `Botulinum toxin injections`, `Reassurance and self-management advice: soft diet, jaw rest, avoiding parafunction and simple analgesia`, `Replacement of all posterior restorations`],
  ans: 3, why: `Myofascial temporomandibular disorder (TMD) is managed first with reassurance and self-care; most cases settle. Irreversible occlusal treatment is not supported.`, th: ['omed-pain'] },

{ q: `A 72-year-old woman has had a new right-sided temporal headache for 2 weeks. Her scalp is tender when she brushes her hair and her jaw aches when she chews, easing with rest. What is the most likely diagnosis?`,
  opts: [`Temporomandibular disorder`, `Trigeminal neuralgia`, `Dental abscess`, `Migraine`, `Giant cell arteritis`],
  ans: 4, why: `New headache, scalp tenderness and jaw claudication in an older patient indicate giant cell arteritis. She needs urgent same-day action because of the risk of permanent sight loss: same-day ophthalmology assessment if she has visual symptoms, otherwise urgent specialist discussion and the fast-track GCA pathway.`, th: ['omed-pain'] },

{ q: `A 15-year-old boy has a painless, bluish, fluctuant 8 mm swelling on his lower lip. It appeared after he bit his lip and varies in size. What is the most likely diagnosis?`,
  opts: [`Mucocele (mucous extravasation cyst)`, `Haemangioma`, `Pleomorphic adenoma`, `Fibroepithelial polyp`, `Squamous cell carcinoma`],
  ans: 0, why: `A mucocele follows trauma to a minor salivary gland duct and is commonest on the lower lip. A fibroepithelial polyp is firm and pink; salivary tumours are rare on the lower lip.`, th: ['omed-saliv'] },

// ---------- Paediatric dentistry ----------
{ q: `A 3-year-old girl fell 20 minutes ago and knocked out her upper right primary central incisor. Her parents have brought the tooth in milk. What is the most appropriate management?`,
  opts: [`Replant and splint for 2 weeks`, `Do not replant; check for injuries and missing fragments, and advise on soft diet and cleaning`, `Replant without a splint`, `Replant and prescribe antibiotics`, `Store the tooth in saline and replant at the next visit`],
  ans: 1, why: `IADT 2020: avulsed primary teeth are not replanted, because replantation can damage the developing permanent successor.`, th: ['paed-trauma'] },

{ q: `An 8-year-old has demarcated creamy-yellow and brown opacities on all four first permanent molars and the labial surfaces of the upper central incisors. One lower molar has broken down after eruption and is sensitive. The primary teeth are normal. What is the most likely diagnosis?`,
  opts: [`Dental fluorosis`, `Amelogenesis imperfecta`, `Molar-incisor hypomineralisation`, `Dentinogenesis imperfecta`, `Erosion`],
  ans: 2, why: `Demarcated opacities limited to first permanent molars and incisors are molar-incisor hypomineralisation. Fluorosis gives diffuse symmetrical mottling; amelogenesis imperfecta affects all teeth in both dentitions.`, th: ['paed-dev'] },

{ q: `A 6-year-old has an asymptomatic occlusoproximal carious lesion in his lower right first primary molar. The radiograph shows the lesion in dentine with no signs of pulpal involvement. He has never had pain, and he would cope poorly with local anaesthesia. What is the most appropriate management?`,
  opts: [`Extraction under local anaesthesia`, `Pulpotomy and a preformed metal crown`, `Pulpectomy`, `Hall technique: a preformed metal crown cemented without caries removal or local anaesthesia`, `Fissure sealant`],
  ans: 3, why: `For an asymptomatic primary molar with dentine caries and no pulpal signs, the Hall technique seals the lesion without anaesthesia or caries removal. It is well tolerated and has good outcomes (SDCEP Prevention and Management of Dental Caries in Children).`, th: ['paed-tx'] },

{ q: `A mother phones to say her 9-year-old son knocked out his upper permanent central incisor at the park 5 minutes ago. The tooth is whole and she is holding it by the crown. What is the most appropriate advice?`,
  opts: [`Put the tooth in water and come to the practice`, `Wrap the tooth in a tissue and come to the practice`, `Put the tooth in milk and come within the next few hours`, `Scrub the tooth clean and keep it dry`, `If it is dirty, rinse it gently in milk, saline or saliva, replant it now, have him bite on a cloth and come straight in`],
  ans: 4, why: `IADT 2020: immediate replantation at the scene gives the best prognosis. If that is impossible, store the tooth in milk (not water) and attend urgently.`, th: ['paed-trauma'] },

{ q: `A 10-year-old has a lateral luxation injury to the upper left permanent central incisor, which you have repositioned. According to IADT 2020, how should it be splinted?`,
  opts: [`Flexible splint for 4 weeks`, `Flexible splint for 2 weeks`, `Rigid splint for 4 weeks`, `Rigid splint for 4 months`, `No splint`],
  ans: 0, why: `IADT 2020: lateral luxation needs a passive, flexible splint for 4 weeks. Extrusion and avulsion need 2 weeks.`, th: ['paed-trauma'] },

// ---------- Orthodontics ----------
{ q: `A 12-year-old has a Class II division 1 malocclusion with an overjet of 10 mm and incompetent lips. What is the Index of Orthodontic Treatment Need (IOTN) Dental Health Component grade?`,
  opts: [`Grade 3a`, `Grade 5a`, `Grade 4a`, `Grade 2a`, `Grade 5i`],
  ans: 1, why: `An overjet greater than 9 mm is grade 5a. 4a is more than 6 mm up to 9 mm; 5i is impeded eruption.`, th: ['ortho-iotn'] },

{ q: `An 11-year-old has an unerupted upper left permanent canine that cannot be palpated buccally. Parallax radiographs show it is palatally displaced. The upper arch is uncrowded and the primary canine is present. What is the most appropriate interceptive measure?`,
  opts: [`Extract the upper left first premolar`, `Review again in 2 years`, `Extract the upper left primary canine and review the permanent canine radiographically`, `Arrange immediate surgical exposure`, `Extract the permanent canine`],
  ans: 2, why: `RCS guidance: in an uncrowded arch aged about 10–13, extracting the primary canine improves the chance of the palatal canine erupting. Re-image after about 12 months and refer if it has not improved.`, th: ['ortho-inter'] },

{ q: `An 8-year-old has the upper left permanent central incisor in crossbite. The mandible displaces forwards on closing, there is enough overbite to hold the correction and there is no crowding. What is the most appropriate management?`,
  opts: [`Wait until the permanent dentition is complete`, `Full upper and lower fixed appliances`, `A twin-block functional appliance`, `An upper removable appliance with a Z-spring and posterior bite plane`, `Extraction of a lower incisor`],
  ans: 3, why: `An anterior crossbite with displacement should be corrected early to remove the displacement and protect the incisors from wear and recession. A simple URA with a Z-spring and bite plane is the usual treatment.`, th: ['ortho-inter'] },

{ q: `A 9-year-old has a lower left first permanent molar with a poor long-term prognosis because of severe molar-incisor hypomineralisation. You want the lower second molar to drift into the space after extraction. What is the best radiographic indicator for timing the extraction?`,
  opts: [`When the lower second molar has erupted`, `When the lower second molar roots are complete`, `Before age 6`, `When the lower third molar crypt first appears`, `When calcification of the lower second molar bifurcation is beginning`],
  ans: 4, why: `RCS guidance on first permanent molars of poor prognosis: the best spontaneous space closure occurs when the bifurcation of the lower second molar has started to calcify, usually around 8–10 years.`, th: ['ortho-inter', 'paed-dev'] },

// ---------- Restoration of teeth ----------
{ q: `A 30-year-old man has deep occlusal caries in the lower right first molar. The tooth is asymptomatic, responds normally to sensibility testing and shows no periapical change. The radiograph shows caries in the inner quarter of dentine, close to the pulp. What is the most appropriate management?`,
  opts: [`Selective caries removal, leaving soft or leathery dentine over the pulp, and a well-sealed restoration`, `Non-selective caries removal to hard dentine`, `Elective root canal treatment`, `Extraction`, `Pulpotomy`],
  ans: 0, why: `In a deep lesion in a vital, symptom-free tooth, selective caries removal avoids pulp exposure and keeps the pulp healthy. A good peripheral seal is the key to success.`, th: ['resto-caries'] },

{ q: `Under current UK regulations on dental amalgam (in force since July 2018), in which patient should amalgam not be used unless the dentist considers it strictly necessary?`,
  opts: [`A 40-year-old man needing a large MOD restoration on a lower second molar`, `A 14-year-old girl needing a restoration on a lower first molar`, `A 75-year-old woman with root caries`, `A 55-year-old man with a fractured cusp`, `A 30-year-old man who grinds his teeth`],
  ans: 1, why: `Following the Minamata Convention, amalgam should not be used for primary teeth, children under 15, or pregnant or breastfeeding women unless strictly necessary because of the patient's specific medical needs.`, th: ['resto-mat'] },

{ q: `A 22-year-old woman has smooth, glazed loss of enamel on the palatal surfaces of her upper incisors and premolars. The labial surfaces are unaffected and there are no wear facets. What is the most likely cause?`,
  opts: [`Excessive toothbrushing`, `Nocturnal bruxism`, `Recurrent vomiting, for example in bulimia nervosa`, `Habitual lemon sucking`, `Abrasive whitening toothpaste`],
  ans: 2, why: `Palatal erosion of upper teeth points to intrinsic acid from vomiting or reflux. Dietary acids usually affect labial surfaces; bruxism causes matching facets.`, th: ['resto-tsl'] },

{ q: `A 55-year-old man has localised palatal wear of his upper anterior teeth. The posterior teeth are not worn and there is no space for restorations in the intercuspal position. He wants the teeth restored. What is the most appropriate way to gain space?`,
  opts: [`Crown lengthening of the worn teeth`, `Elective root canal treatment and posts`, `Full-mouth rehabilitation at an increased occlusal vertical dimension`, `Dahl approach: direct composite restorations placed high on the worn teeth`, `Reduction of the opposing lower incisors`],
  ans: 3, why: `For localised anterior wear, the Dahl approach places restorations at an increased local vertical dimension; teeth move axially and the posterior occlusion re-establishes. It is conservative and predictable.`, th: ['resto-tsl'] },

{ q: `A 35-year-old man has spontaneous, throbbing pain in his lower left first molar that keeps him awake and lingers after a cold stimulus. There is no swelling and he is well. The radiograph shows deep caries with no periapical change. What is the most appropriate emergency management?`,
  opts: [`Amoxicillin 500 mg three times daily for 5 days`, `Metronidazole 400 mg three times daily for 5 days`, `Advise ibuprofen and review in 1 week`, `Place a sedative dressing without pulp treatment`, `Pulp extirpation and a dressing`],
  ans: 4, why: `This is symptomatic irreversible pulpitis. Remove the pulp (pulpotomy or extirpation). SDCEP: antibiotics do not relieve pulpitis and are not indicated.`, th: ['resto-endo', 'pharm-abx'] },

{ q: `A root-filled upper right central incisor is to be restored with a post-retained crown. Which feature most improves the restored tooth's resistance to fracture?`,
  opts: [`A circumferential ferrule of sound coronal dentine`, `A longer post`, `A wider post`, `A metal-ceramic rather than all-ceramic crown`, `A threaded (active) post`],
  ans: 0, why: `A ferrule of sound tooth tissue embraced by the crown is the most important factor in fracture resistance. Longer, wider or threaded posts increase the risk of root fracture.`, th: ['resto-ind', 'resto-endo'] },

// ---------- Replacement of teeth ----------
{ q: `A 68-year-old woman needs a lower partial denture. She has lost all her lower molars and premolars on both sides; the six anterior teeth remain. What is the Kennedy classification?`,
  opts: [`Class II`, `Class I`, `Class III`, `Class IV`, `Class III modification 1`],
  ans: 1, why: `Kennedy Class I is bilateral free-end saddles behind the remaining teeth. Class II is unilateral free-end; Class IV is a single anterior saddle crossing the midline.`, th: ['prosth-rpd'] },

{ q: `A 75-year-old man has had new complete dentures for 2 weeks. His teeth click when he talks, his jaw muscles ache and his face looks strained at rest. What is the most likely cause?`,
  opts: [`Occlusal vertical dimension too low`, `Poor retention of the upper denture`, `Occlusal vertical dimension too high, with too little freeway space`, `Incorrect shade of teeth`, `Overextended lingual flange`],
  ans: 2, why: `Clicking teeth during speech, muscle fatigue and a strained look are signs of an excessive vertical dimension with no freeway space. A low vertical dimension gives a collapsed appearance and angular cheilitis.`, th: ['prosth-rpd'] },

{ q: `A 55-year-old woman had an implant crown placed 3 years ago. The peri-implant mucosa is red and bleeds on gentle probing, probing depth is 4 mm, and radiographs show no bone loss beyond initial remodelling. What is the most likely diagnosis?`,
  opts: [`Peri-implantitis`, `Healthy peri-implant tissues`, `Implant fracture`, `Peri-implant mucositis`, `Retrograde peri-implantitis`],
  ans: 3, why: `Inflammation and bleeding without progressive bone loss is peri-implant mucositis, which is reversible. Peri-implantitis also needs bone loss beyond initial remodelling.`, th: ['prosth-imp', 'perio-class'] },

{ q: `A 20-year-old has a congenitally missing upper left lateral incisor. After orthodontics the space is ideal, the adjacent central incisor and canine are healthy and unrestored, and he does not want an implant. What is the most appropriate fixed replacement?`,
  opts: [`Conventional fixed-fixed bridge from the central incisor and canine`, `Fixed-fixed resin-bonded bridge from the central incisor and canine`, `Conventional cantilever bridge with a full-coverage crown on the canine`, `Conventional bridge using both the canine and first premolar as abutments`, `Cantilever resin-bonded bridge with a single retainer`],
  ans: 4, why: `A single-retainer cantilever resin-bonded bridge is minimally invasive and debonds less often than fixed-fixed designs. Conventional bridges destroy sound tooth tissue in a young patient.`, th: ['prosth-imp'] },

// ---------- Communication ----------
{ q: `A 45-year-old woman had hoped to keep her lower first molar, but it now has a vertical root fracture and cannot be saved. You have ensured privacy and are sitting down with her. What is the most appropriate next step in breaking this news?`,
  opts: [`Ask her what she understands about the tooth so far`, `Give the full treatment plan and costs straight away`, `Hand her a leaflet about extractions`, `Explain that it happened because she grinds her teeth`, `Suggest she gets a second opinion`],
  ans: 0, why: `In the SPIKES framework, after setting up comes Perception: find out what the patient already knows before giving the news. This lets you pitch the information at the right level for her.`, th: ['comm-pt'] },

{ q: `A patient arrives at reception shouting that his new crown has fallen off for the second time. Other patients are waiting. What is the most appropriate initial response?`,
  opts: [`Ask him to leave the practice`, `Take him to a private room, listen without interrupting and acknowledge his frustration`, `Explain that the crown failed because of his diet`, `Offer an immediate full refund`, `Tell him to put his complaint in writing`],
  ans: 1, why: `De-escalate first: move somewhere private, listen actively and acknowledge feelings. An apology for his experience is not an admission of liability. Defensiveness or dismissal escalates the situation.`, th: ['comm-hard'] },

{ q: `An NHS dental practice in England receives a written complaint. Under the NHS complaints regulations, within what time must the complaint be acknowledged?`,
  opts: [`24 hours`, `10 working days`, `3 working days`, `28 days`, `6 months`],
  ans: 2, why: `The 2009 NHS complaints regulations (England) require acknowledgement within 3 working days, with an offer to discuss how the complaint will be handled. The other UK nations have their own procedures.`, th: ['comm-hard', 'mgmt-gov'] },

{ q: `A 6-year-old girl is nervous about her first restoration but is cooperative. Which behaviour management technique is most appropriate for introducing the handpiece?`,
  opts: [`Inhalation sedation`, `Clinical holding`, `Referral for general anaesthesia`, `Tell-show-do`, `Voice control`],
  ans: 3, why: `Tell-show-do (explain, demonstrate, then perform) is the basic communicative technique for a cooperative but anxious child. Pharmacological or restrictive approaches are not needed.`, th: ['comm-pt', 'paed-tx'] },

{ q: `A 40-year-old woman who speaks little English needs an extraction. Her 12-year-old son offers to translate the consent discussion. What is the most appropriate action?`,
  opts: [`Accept her son's offer`, `Proceed using gestures and diagrams`, `Use an online translation app for the whole discussion`, `Ask a receptionist who speaks some of the language`, `Arrange a professional interpreter, face to face or by telephone`],
  ans: 4, why: `Valid consent needs accurate two-way communication. Using a child or untrained staff risks errors, breaches confidentiality and puts an inappropriate burden on the child.`, th: ['comm-pt', 'prof-consent'] },

{ q: `You are discussing removal of a lower third molar with a 30-year-old professional trumpet player. Following Montgomery v Lanarkshire Health Board (2015), which risks must you discuss?`,
  opts: [`Any material risk: one a reasonable person in his position would consider significant, or that you know or should know he would`, `Only risks occurring in more than 1% of cases`, `Only risks a responsible body of dentists would mention`, `Only serious risks such as death`, `Only the risks he asks about`],
  ans: 0, why: `Montgomery replaced the Bolam test for consent with a patient-centred test of material risk. For a trumpet player, even a small risk of lip or tongue numbness is material.`, th: ['comm-pt', 'prof-consent'] },

{ q: `A new patient asks: "Did my old dentist do a bad job? This filling only lasted a year." The restoration has failed with recurrent caries. What is the most appropriate response?`,
  opts: [`Agree that the previous dentist was negligent`, `Explain factually what you see and the treatment options, without making unjustified comments about the previous dentist`, `Refuse to discuss the previous treatment`, `Advise her to report the previous dentist to the GDC`, `Tell her the previous work was perfect`],
  ans: 1, why: `GDC Standards: be honest (1.3) but do not make disparaging remarks about colleagues (9.1.2), as you do not know the circumstances. If you have real concerns about patient safety, raise them properly (Principle 8).`, th: ['comm-hard', 'prof-gdc'] },

{ q: `You are phoning the on-call oral and maxillofacial registrar about a patient with a rapidly spreading facial swelling. Which structured communication tool is most appropriate?`,
  opts: [`SPIKES`, `ICE (ideas, concerns, expectations)`, `SBAR (situation, background, assessment, recommendation)`, `SMART`, `Calgary–Cambridge`],
  ans: 2, why: `SBAR is designed for concise, urgent clinician-to-clinician handover and referral. SPIKES is for breaking bad news; ICE explores the patient's perspective.`, th: ['comm-team'] },

{ q: `After giving post-extraction instructions to a 70-year-old woman, what is the most appropriate way to check she has understood?`,
  opts: [`Ask "Do you understand?"`, `Give her a leaflet and no further discussion`, `Repeat the instructions more loudly`, `Ask her to explain in her own words what she will do when she gets home`, `Ask her relative to sign that they understand`],
  ans: 3, why: `Teach-back (the patient explains in their own words) reliably shows gaps in understanding. A yes/no question usually gets a polite "yes".`, th: ['comm-pt'] },

{ q: `A 25-year-old man with a mild learning disability attends with his support worker to discuss treatment for a carious tooth. What is the most appropriate approach?`,
  opts: [`Speak only to the support worker`, `Ask the support worker to sign the consent form`, `Assume he lacks capacity and decide in his best interests`, `Postpone until a parent can attend`, `Speak directly to him in simple language with visual aids, involving the support worker as he wishes`],
  ans: 4, why: `The Mental Capacity Act 2005 presumes capacity and requires all practicable steps to help a person decide. A support worker cannot consent for an adult.`, th: ['comm-pt', 'prof-consent'] },

// ---------- Professionalism, ethics, law and statistics ----------
{ q: `A 48-year-old man with a severe learning disability lacks capacity to consent to extraction of a painful, abscessed tooth. He has no lasting power of attorney or deputy. His mother is closely involved in his care. What is the most appropriate action?`,
  opts: [`Make a best-interests decision, consulting his mother and care team, and record it`, `Ask his mother to sign the consent form as next of kin`, `Wait until he regains capacity`, `Apply to the Court of Protection before any treatment`, `Treat only if he does not physically resist`],
  ans: 0, why: `Under the Mental Capacity Act 2005, the clinician decides in the person's best interests after consulting those close to him. Next of kin cannot consent for an adult. The Court of Protection is for disputed or exceptional decisions.`, th: ['prof-consent'] },

{ q: `A 15-year-old girl attends alone asking for extraction of a painful tooth. She understands the nature, purpose, risks and alternatives, and does not want her parents told. What is the position on consent?`,
  opts: [`Parental consent is always needed under 16`, `She can give valid consent if she is Gillick competent`, `Treatment can only proceed in a life-threatening emergency`, `A court order is required`, `Treatment must wait until she is 16`],
  ans: 1, why: `Under Gillick, a child under 16 with sufficient understanding and maturity can consent. Encourage her to involve her parents, but respect confidentiality unless there is a safeguarding concern.`, th: ['prof-consent'] },

{ q: `The wife of a 50-year-old patient phones to ask whether her husband attended yesterday and what treatment he had. He has not given permission to share information. What is the most appropriate response?`,
  opts: [`Tell her, since she is his wife`, `Confirm he attended but not what treatment he had`, `Explain that you cannot share any information without his consent`, `Post her a copy of his records`, `Invite her in to see his notes`],
  ans: 2, why: `GDC Standard 4: patient information, including whether they attended, is confidential. Being a spouse gives no right to it without consent.`, th: ['prof-conf'] },

{ q: `A practice laptop holding unencrypted patient records is stolen. The breach is likely to risk patients' rights and freedoms. Under UK GDPR, when must it be reported to the Information Commissioner's Office (ICO)?`,
  opts: [`Within 24 hours`, `Within 7 days`, `Within 1 month`, `Within 72 hours of becoming aware of it`, `It does not need reporting`],
  ans: 3, why: `UK GDPR requires notification to the ICO within 72 hours of becoming aware of a reportable breach. Affected patients must also be told without undue delay if the risk is high.`, th: ['prof-conf'] },

{ q: `At 8.30 am an associate smells strongly of alcohol and is slurring his speech. He is about to start his clinical session. What is the most appropriate first action?`,
  opts: [`Report him to the GDC before doing anything else`, `Observe him for a week to gather evidence`, `Say nothing, as it is not your business`, `Raise it at the next practice meeting`, `Act now to protect patients by telling the person in charge so he does not treat patients`],
  ans: 4, why: `GDC Standard 8: put patients first and raise concerns promptly. Immediate risk needs immediate action locally; a GDC referral may follow, but patient safety comes first.`, th: ['prof-concerns'] },

{ q: `You extract the lower right second premolar instead of the planned first premolar in a 30-year-old woman. What is the most appropriate action?`,
  opts: [`Tell her promptly, apologise, explain what happened and what will be done, and record it`, `Wait to see if she notices`, `Extract the correct tooth and say nothing`, `Tell her the second premolar needed removing anyway`, `Ask the nurse to tell her after you leave`],
  ans: 0, why: `The professional duty of candour (GDC) requires you to be open and honest, apologise, explain and offer a remedy when something goes wrong. The incident should also be recorded and reported locally.`, th: ['prof-concerns'] },

{ q: `Under the GDC enhanced continuing professional development (CPD) scheme, how many hours of verifiable CPD must a dentist complete in each 5-year cycle?`,
  opts: [`75 hours`, `100 hours`, `150 hours`, `50 hours`, `250 hours`],
  ans: 1, why: `Dentists need at least 100 hours per 5-year cycle, with at least 10 hours in every 2-year period. Therapists and hygienists need 75 hours; dental nurses 50.`, th: ['prof-gdc'] },

{ q: `A new screening test for oral cancer is evaluated in 200 people. Biopsy shows 50 have cancer; the test is positive in 40 of them. Of the 150 without cancer, the test is positive in 15. What is the sensitivity of the test?`,
  opts: [`73%`, `90%`, `80%`, `93%`, `27%`],
  ans: 2, why: `Sensitivity = true positives ÷ all with disease = 40 ÷ 50 = 80%. 90% is specificity (135 ÷ 150) and 73% is the positive predictive value (40 ÷ 55).`, th: ['prof-ebp'] },

{ q: `A test is used in 1,000 people, 100 of whom have the disease. It is positive in 90 of those with the disease and in 90 of those without. What is the positive predictive value (PPV)?`,
  opts: [`90%`, `10%`, `99%`, `50%`, `81%`],
  ans: 3, why: `PPV = true positives ÷ all positives = 90 ÷ (90 + 90) = 50%. Sensitivity and specificity are both 90%; low prevalence drags the PPV down.`, th: ['prof-ebp'] },

{ q: `In a hypothetical randomised trial, 20% of patients in the control group develop a post-operative complication compared with 10% of those given a new mouthwash. What is the number needed to treat (NNT) to prevent one complication?`,
  opts: [`2`, `5`, `20`, `50`, `10`],
  ans: 4, why: `Absolute risk reduction = 20% − 10% = 10% (0.1). NNT = 1 ÷ 0.1 = 10. The relative risk reduction is 50%, which tempts candidates towards 2.`, th: ['prof-ebp'] },

{ q: `A researcher wants to know whether a rare salivary gland tumour is linked to past occupational exposure to a chemical. What is the most appropriate study design?`,
  opts: [`Case-control study`, `Randomised controlled trial`, `Prospective cohort study`, `Cross-sectional survey`, `Case series`],
  ans: 0, why: `For a rare outcome, a case-control study compares past exposure in people with and without the disease efficiently. A cohort would need huge numbers, and randomising people to a harmful exposure is unethical.`, th: ['prof-ebp'] },

{ q: `Which source provides the highest level of evidence on whether fluoride varnish prevents caries in children?`,
  opts: [`A single large randomised controlled trial`, `A systematic review and meta-analysis of randomised controlled trials`, `A prospective cohort study`, `Expert opinion from a consensus panel`, `A case-control study`],
  ans: 1, why: `In the hierarchy of evidence for treatment effectiveness, a well-conducted systematic review of RCTs sits above any single trial.`, th: ['prof-ebp'] },

// ---------- Management and leadership ----------
{ q: `A dental nurse gets a needlestick injury from a used local anaesthetic needle. What is the most appropriate first action?`,
  opts: [`Suck the wound`, `Scrub the wound with a nail brush and apply alcohol`, `Encourage gentle bleeding, wash under running water with soap and cover`, `Complete the incident form first`, `Take a blood sample from the source patient immediately`],
  ans: 2, why: `First aid comes first: encourage bleeding, wash with soap and running water, don't scrub or suck, and cover. Then report it and get urgent occupational health or A&E advice for risk assessment and possible post-exposure prophylaxis.`, th: ['mgmt-hs'] },

{ q: `Which incident must be reported to the Health and Safety Executive under RIDDOR?`,
  opts: [`A patient faints in the chair and recovers fully`, `A nurse is off work for 2 days after a cut finger`, `A needlestick injury from a clean, unused needle`, `A needlestick injury from a source patient known to have hepatitis C`, `A minor burn treated with first aid`],
  ans: 3, why: `A sharps injury from a source known to carry a blood-borne virus is a reportable dangerous occurrence. Injuries causing more than 7 days' incapacity are reportable; fainting patients and minor injuries are not.`, th: ['mgmt-hs'] },

{ q: `Under the Ionising Radiation (Medical Exposure) Regulations 2017 (IR(ME)R), which duty holder is responsible for justifying an individual dental radiographic exposure?`,
  opts: [`The referrer`, `The operator`, `The Radiation Protection Supervisor`, `The Radiation Protection Adviser`, `The IR(ME)R practitioner`],
  ans: 4, why: `The IR(ME)R practitioner justifies each exposure. The referrer supplies clinical information, and the operator carries out practical aspects. In dentistry one dentist often holds all three roles.`, th: ['rad-sel', 'mgmt-gov'] },

{ q: `Under the Ionising Radiations Regulations 2017 (IRR17), who in the practice supervises day-to-day compliance with the local rules?`,
  opts: [`The Radiation Protection Supervisor (RPS)`, `The Radiation Protection Adviser (RPA)`, `The Medical Physics Expert`, `The referrer`, `The Care Quality Commission inspector`],
  ans: 0, why: `The RPS is appointed in-house to make sure work follows the local rules. The RPA is an external expert the employer must consult on compliance with IRR17.`, th: ['rad-sel', 'mgmt-hs'] },

{ q: `A practice wants to wrap instruments before sterilisation so they can be stored. According to HTM 01-05, which type of steriliser is needed?`,
  opts: [`Type N (non-vacuum) steriliser`, `Type B (vacuum) steriliser`, `Hot air oven`, `Ultrasonic bath`, `Washer-disinfector`],
  ans: 1, why: `Wrapped and hollow loads need air removal, which a vacuum (type B) steriliser provides. Type N sterilisers are for unwrapped solid instruments only.`, th: ['mgmt-ipc'] },

{ q: `A dental nurse removes her gloves and finds her hands are visibly soiled with blood. What is the most appropriate hand hygiene?`,
  opts: [`Alcohol hand rub`, `Put on a new pair of gloves`, `Wash with liquid soap and water`, `Wipe with a disinfectant surface wipe`, `Surgical scrub with a nail brush`],
  ans: 2, why: `Visibly soiled hands must be washed with liquid soap and water; alcohol rub is only for visibly clean hands. Nail brushes damage skin and are not used routinely.`, th: ['mgmt-ipc'] },

{ q: `A practice audit of bitewing quality finds that standards are not met. Training is given and new positioning aids are bought. What is the next step in the audit cycle?`,
  opts: [`Publish the results`, `Stop, as the changes have been made`, `Set higher standards`, `Re-audit to measure the effect of the changes`, `Report the dentists to the GDC`],
  ans: 3, why: `The audit cycle is: set standards, measure, compare, implement change, then re-audit to close the loop.`, th: ['mgmt-gov'] },

{ q: `A dentist is opening a new private dental practice in England. With which body must the provider register to carry out regulated activities?`,
  opts: [`The General Dental Council`, `NHS England`, `The British Dental Association`, `The Health and Safety Executive`, `The Care Quality Commission (CQC)`],
  ans: 4, why: `In England, dental providers register with the CQC. Individual professionals register with the GDC. In Wales, Scotland and Northern Ireland, other inspectorates do this job (HIW, HIS, RQIA).`, th: ['mgmt-gov'] }
);

FLASH.push(
{ f: `Adrenaline IM dose for anaphylaxis by age (BNF)?`, b: `Adult and child 12 and over: 500 micrograms (0.5 ml of 1:1,000; 300 micrograms if the child is small or prepubertal). 6–11 years: 300 micrograms (0.3 ml). 6 months–5 years: 150 micrograms (0.15 ml). Repeat after 5 minutes if no better.`, th: ['emerg-drugs'] },
{ f: `Glucagon dose for severe hypoglycaemia?`, b: `Adults and children aged 9 years and over (or 25 kg and over): 1 mg IM. Children aged 8 years and under (or under 25 kg): 500 micrograms IM.`, th: ['emerg-drugs'] },
{ f: `Hypoglycaemia in a conscious, cooperative patient: what do you give?`, b: `Oral glucose (15–20 g), such as gel, tablets or a sugary drink, then a longer-acting carbohydrate. Glucagon IM if they cannot swallow safely.`, th: ['emerg-drugs'] },
{ f: `Status epilepticus drug and adult dose in the dental surgery?`, b: `Buccal midazolam 10 mg for an adult if the seizure lasts 5 minutes or more (or repeated seizures). Call 999.`, th: ['emerg-drugs', 'emerg-collapse'] },
{ f: `Suspected myocardial infarction: which drug and dose besides GTN and oxygen if hypoxic?`, b: `Aspirin 300 mg, chewed, unless allergic. Call 999.`, th: ['emerg-drugs'] },
{ f: `Adult BLS: compression rate, depth and ratio?`, b: `100–120 per minute, 5–6 cm deep, 30 compressions to 2 breaths. Attach an AED as soon as it arrives.`, th: ['emerg-collapse'] },
{ f: `Vasovagal syncope: first management?`, b: `Lay the patient flat and raise the legs to restore cerebral blood flow; loosen tight clothing; give oxygen if slow to recover.`, th: ['emerg-collapse'] },
{ f: `Oxygen flow rate in a dental emergency?`, b: `15 litres per minute via a non-rebreathing mask with reservoir.`, th: ['emerg-drugs'] },
{ f: `SDCEP adult amoxicillin regimen for dental infection?`, b: `500 mg three times daily for 5 days, as an adjunct to local measures when infection is spreading or systemic. Review.`, th: ['pharm-abx'] },
{ f: `SDCEP adult phenoxymethylpenicillin regimen?`, b: `500 mg four times daily for 5 days.`, th: ['pharm-abx'] },
{ f: `SDCEP adult metronidazole regimen for dental infection?`, b: `400 mg three times daily for 5 days (3 days for necrotising gingivitis or pericoronitis with systemic involvement). Avoid alcohol during and for 48 hours after.`, th: ['pharm-abx'], check: `Confirm the 3-day metronidazole course for necrotising gingivitis and pericoronitis in the current SDCEP Drug Prescribing for Dentistry.` },
{ f: `SDCEP adult clarithromycin regimen (second-line antibiotic)?`, b: `500 mg twice daily for 5 days, second line only after first-line failure and specialist advice. Do not prescribe with statins (myopathy) or warfarin.`, th: ['pharm-abx', 'pharm-int'] },
{ f: `Adult ibuprofen and paracetamol doses for dental pain (SDCEP)?`, b: `Ibuprofen 400 mg four times daily, preferably after food. Paracetamol 1 g four times daily (maximum 4 g in 24 hours; reduce in low body weight or liver risk).`, th: ['pharm-analg'] },
{ f: `Which antifungal is safe for a patient on warfarin?`, b: `Nystatin. Miconazole (even as oral gel) and fluconazole markedly raise the INR.`, th: ['pharm-int', 'med-bleed'] },
{ f: `How many mg of anaesthetic in one 2.2 ml cartridge of 2% lidocaine? Of 4% articaine?`, b: `2% = 20 mg/ml, so 44 mg. 4% = 40 mg/ml, so 88 mg. (Percentage × 10 = mg/ml.)`, th: ['pain-la'] },
{ f: `Maximum dose of articaine with adrenaline?`, b: `7 mg/kg is the figure commonly quoted (max 500 mg).`, th: ['pain-la'], check: `Not verified for dental articaine cartridges: confirm against the product SmPC. The BNF refers dental prescribers to expert dental sources.` },
{ f: `Maximum dose of lidocaine with adrenaline commonly used in UK dental teaching?`, b: `4.4 mg/kg is the figure commonly taught in UK dental schools.`, th: ['pain-la'], check: `UK sources differ (4.4 mg/kg versus 7 mg/kg, with an absolute cap). Check the SPC and BNF, and expect an exam question to state the figure.` },
{ f: `Flumazenil dose to reverse midazolam?`, b: `200 micrograms IV, then 100 micrograms at 1-minute intervals as needed. It is shorter-acting than midazolam, so watch for re-sedation.`, th: ['pain-sed'] },
{ f: `After IV sedation, how long must a patient avoid driving, machinery, alcohol and important decisions?`, b: `The rest of the day (often taught as 24 hours), with a responsible adult escort home. Follow the IACSD standards and local protocol.`, th: ['pain-sed'] },
{ f: `Warfarin and extractions: INR rule (SDCEP 2022)?`, b: `Check INR ideally within 24 hours (up to 72 hours if stable). If below 4, treat without interrupting warfarin and use local haemostatic measures. If 4 or above, delay or refer.`, th: ['med-bleed'] },
{ f: `DOACs before higher bleeding-risk dental treatment (SDCEP 2022)?`, b: `Apixaban or dabigatran (twice daily): miss the morning dose. Rivaroxaban or edoxaban (once daily): if taken in the morning, delay the dose until 4 hours after haemostasis. Low-risk procedures: no change.`, th: ['med-bleed'] },
{ f: `Antiplatelets (aspirin, clopidogrel, dual therapy) before extractions?`, b: `Do not stop them. Treat with local haemostatic measures, and plan for more bleeding with dual therapy.`, th: ['med-bleed'] },
{ f: `MRONJ: who is in the higher-risk group (SDCEP 2017)?`, b: `Antiresorptive or antiangiogenic drugs for cancer; previous MRONJ; oral bisphosphonates for 5 years or more; any duration with systemic glucocorticoids. Low risk: osteoporosis drugs under 5 years without steroids.`, th: ['med-mronj'] },
{ f: `Definition of MRONJ?`, b: `Exposed bone (or bone probed through a fistula) in the maxillofacial region for more than 8 weeks, in a patient with antiresorptive or antiangiogenic therapy and no radiotherapy to the jaws.`, th: ['med-mronj'] },
{ f: `Infective endocarditis prophylaxis for dental treatment (NICE CG64)?`, b: `Not recommended routinely, nor is chlorhexidine mouthwash. Explain this to at-risk patients and advise on the symptoms of endocarditis.`, th: ['med-other'], check: `NICE CG64 stands, but SDCEP implementation advice (2nd edition, March 2026) recommends prophylaxis for high-risk patients (for example previous endocarditis or a prosthetic valve) before extractions and oral surgery, after shared decision-making.` },
{ f: `IADT 2020 splint times: avulsion, extrusion, lateral luxation?`, b: `Avulsion: 2 weeks flexible. Extrusion: 2 weeks flexible. Lateral luxation: 4 weeks flexible.`, th: ['paed-trauma'] },
{ f: `IADT 2020 splint times: root fracture and alveolar fracture?`, b: `Root fracture: 4 weeks flexible (up to 4 months if near the cervical third). Alveolar fracture: 4 weeks.`, th: ['paed-trauma'] },
{ f: `Best storage medium for an avulsed tooth if it cannot be replanted at once?`, b: `Milk (or saliva, or saline). Not water. Replant as soon as possible.`, th: ['paed-trauma'] },
{ f: `Avulsed primary tooth: replant?`, b: `No. Replanting a primary tooth risks harming the permanent successor.`, th: ['paed-trauma'] },
{ f: `BPE codes 0–4 and *?`, b: `0: healthy. 1: bleeding, no calculus, black band visible. 2: calculus or overhang, black band visible. 3: black band partly visible (3.5–5.5 mm). 4: black band disappears (over 5.5 mm). *: furcation involvement.`, th: ['perio-bpe'] },
{ f: `BPE code 3 versus code 4: what charting (BSP)?`, b: `Code 3: OHI and root surface debridement, then a 6-point pocket chart of that sextant after initial therapy. Code 4: full-mouth 6-point chart and radiographs.`, th: ['perio-bpe'] },
{ f: `BPE in children (BSP/BSPD)?`, b: `Ages 7–11: codes 0–2 on index teeth UR6, UR1, UL6, LL6, LL1, LR6. Ages 12–17: full codes on the same index teeth.`, th: ['perio-bpe'] },
{ f: `Periodontitis grade from % bone loss ÷ age (BSP)?`, b: `Under 0.25: grade A. 0.25–1.0: grade B. Over 1.0: grade C.`, th: ['perio-class'] },
{ f: `Periodontitis stage from worst-site bone loss (BSP)?`, b: `Stage I: under 15%. Stage II: coronal third. Stage III: middle third. Stage IV: also middle third or beyond, plus tooth loss and complexity (five or more teeth lost, masticatory dysfunction). Stage III: middle third or beyond.`, th: ['perio-class'] },
{ f: `Gingivitis: localised versus generalised (2017 classification)?`, b: `Gingivitis is bleeding on probing at 10% of sites or more. Localised: 10–30%. Generalised: over 30%.`, th: ['perio-class'] },
{ f: `IOTN overjet grades?`, b: `5a: over 9 mm. 4a: over 6 mm up to 9 mm. 3a: over 3.5 mm up to 6 mm with incompetent lips. 2a: over 3.5 mm up to 6 mm with competent lips.`, th: ['ortho-iotn'] },
{ f: `IOTN 5i, 5h, 5p, 5s?`, b: `5i: impeded eruption (except third molars). 5h: extensive hypodontia needing pre-restorative orthodontics. 5p: cleft lip and/or palate. 5s: submerged primary teeth.`, th: ['ortho-iotn'] },
{ f: `Who qualifies for NHS orthodontic treatment by IOTN?`, b: `Dental Health Component 4 or 5, or 3 with an Aesthetic Component of 6 or more.`, th: ['ortho-iotn'] },
{ f: `Fluoride toothpaste for children under 7 (DBOH v4)?`, b: `Under 3: at least 1,000 ppm, a smear. 3–6: at least 1,000 ppm, a pea-sized amount (1,350–1,500 ppm if higher risk). Spit, don't rinse; supervise brushing.`, th: ['prev-dboh'] },
{ f: `Fluoride toothpaste for age 7+ and prescription strengths (DBOH v4)?`, b: `1,350–1,500 ppm for all aged 7 and over. High risk: 2,800 ppm from age 10; 2,800 or 5,000 ppm from age 16.`, th: ['prev-dboh'] },
{ f: `Fluoride varnish frequency (DBOH v4)?`, b: `22,600 ppm varnish twice a year for all children from age 3; two or more times a year for higher-risk children; twice a year for higher-risk adults.`, th: ['prev-dboh'] },
{ f: `Fluoride mouthwash (DBOH v4)?`, b: `0.05% sodium fluoride (230 ppm) daily for those aged 8 and over at high risk, used at a different time from toothbrushing.`, th: ['prev-dboh'] },
{ f: `Bitewing intervals by caries risk (FGDP(UK))?`, b: `High risk: 6 months. Moderate: 12 months. Low: 24 months for adults; 12–18 months (primary) or 24 months (permanent) for children.`, th: ['rad-sel'] },
{ f: `IR(ME)R duty holders and what each does?`, b: `Employer: procedures and framework. Referrer: supplies clinical information. Practitioner: justifies the exposure. Operator: carries out any practical aspect, such as positioning or processing.`, th: ['rad-sel'] },
{ f: `RPA versus RPS (IRR17)?`, b: `Radiation Protection Adviser: external expert who advises the employer on compliance. Radiation Protection Supervisor: in-house person who makes sure local rules are followed.`, th: ['rad-sel', 'mgmt-hs'] },
{ f: `UK CMO low-risk drinking guideline?`, b: `No more than 14 units a week for men and women, spread over 3 or more days.`, th: ['prev-life'] },
{ f: `GDC CPD hours per 5-year cycle?`, b: `Dentists 100; dental therapists, dental hygienists, orthodontic therapists and clinical dental technicians 75; dental nurses and dental technicians 50. At least 10 verifiable hours in every 2 years.`, th: ['prof-gdc'] },
{ f: `Amalgam restrictions (since July 2018)?`, b: `Not for primary teeth, children under 15, or pregnant or breastfeeding women, unless strictly necessary for the patient's medical needs. Use pre-encapsulated amalgam and amalgam separators.`, th: ['resto-mat'] },
{ f: `NICE NG12: when should a dentist refer on the suspected cancer pathway for oral cancer?`, b: `Consider it for a lump on the lip or in the oral cavity, or a red or red and white patch, consistent with oral cancer (erythroplakia or erythroleukoplakia). Unexplained ulceration over 3 weeks and an unexplained neck lump are also NG12 triggers to consider the pathway.`, th: ['exam-onc'] },
{ f: `RIDDOR: over-3-day versus over-7-day injuries?`, b: `Over 7 days' incapacity: report to the HSE (within 15 days). Over 3 days: record in the accident book but don't report.`, th: ['mgmt-hs'] }
);

EX.push({ id: 'warfarin-inr', t: 'Warfarin and an extraction', tag: 'Medically compromised · Oral surgery',
  scenario: `<p>A 68-year-old man takes warfarin for atrial fibrillation. His international normalised ratio (INR) has been stable between 2.0 and 3.0 for the past year. He needs a single extraction of a carious, unrestorable lower first molar. His INR, checked by the anticoagulation clinic 20 hours ago, was 3.4. He has no other bleeding history and takes no other medicines.</p>`,
  q: 'What is the most appropriate management?',
  opts: [
    'Ask him to stop warfarin for 3 days and extract when the INR is below 2.0',
    'Defer the extraction until his INR is below 2.5',
    'Extract without interrupting warfarin, using local haemostatic measures',
    'Refer him to hospital for the extraction because his INR is above 3.0',
    'Arrange bridging with low molecular weight heparin before the extraction'
  ],
  ans: 2,
  steps: [
    { h: '1 Read the lead-in', p: `It asks for <b>management</b> of a planned extraction in an anticoagulated patient. So the answer is a decision: treat now, delay, change the drug, or refer.`, th: ['med-bleed'] },
    { h: '2 Find the key clue', p: `Two numbers matter: the INR is <b>3.4</b>, and it was taken <b>20 hours</b> ago in a patient whose INR is stable. The procedure is a <b>single</b> extraction.`, th: ['med-bleed'] },
    { h: '3 Name the rule or guideline', p: `SDCEP <i>Management of Dental Patients Taking Anticoagulants or Antiplatelet Drugs</i> (2nd ed, 2022): do not interrupt warfarin for dental treatment. Check the INR ideally within 24 hours before treatment (up to 72 hours is acceptable if the INR is stable). If the INR is <b>below 4</b>, treat in primary care with local haemostatic measures. If it is 4 or more, delay and contact the anticoagulation service.`, th: ['med-bleed'] },
    { h: '4 Apply it', p: `3.4 is below 4 and the reading is recent. So extract today without stopping warfarin. Pack the socket with a haemostatic agent (for example oxidised cellulose or collagen) and suture, give post-operative advice, and suggest paracetamol rather than an NSAID for pain. Treat early in the day and early in the week, so that any bleeding can be dealt with.`, th: ['med-bleed', 'surg-comp'] },
    { h: '5 Eliminate', p: `Every other option either stops the anticoagulant or sets a lower INR threshold than the guideline. Stopping warfarin raises the risk of a stroke more than continuing it raises the risk of a dental bleed.`, th: ['med-bleed'] }
  ],
  wrong: [
    { o: 0, why: `Stopping warfarin exposes him to a thromboembolic risk (stroke), and the guideline says interruption is not needed for dental work when the INR is below 4. Dentists should not change the anticoagulant regimen anyway.`, th: ['med-bleed'] },
    { o: 1, why: `2.5 is not a threshold in the SDCEP guidance. An INR of 3.4 is within the safe range for primary-care extraction, so delaying only prolongs his dental pain and infection risk.`, th: ['med-bleed'] },
    { o: 3, why: `With an INR of 4 or more SDCEP says to delay invasive treatment, and to refer only if treatment is urgent. Advice or referral is also considered for other bleeding risk factors such as a bleeding disorder, liver disease or extensive surgery. A single extraction at INR 3.4 belongs in practice.`, th: ['med-bleed'] },
    { o: 4, why: `Bridging with heparin is a medical decision for major surgery, not dental extractions. It adds bleeding risk and is not part of the dental guidance.`, th: ['med-bleed', 'pharm-int'] }
  ],
  pattern: 'Warfarin: INR recent (ideally within 24 h) and below 4, so treat without stopping it and use local measures. Never stop an anticoagulant for routine dental work.'
});

});

  steps: [
    { h: '1 Read the lead-in', p: `It asks for <b>management</b>: whether to replant, which splint and for how long, and what to do about the pulp.`, th: ['paed-trauma'] },
    { h: '2 Find the key clue', p: `<b>Closed apex</b>, stored in <b>milk</b> (a physiological storage medium) almost at once, and a total extraoral time of <b>under 60 minutes</b>. The periodontal ligament cells are probably still viable.`, th: ['paed-trauma'] },
    { h: '3 Name the rule or guideline', p: `IADT guidelines 2020 (avulsion of permanent teeth). Mature tooth kept in a physiological medium or dry for under 60 minutes: clean the root with saline, give local anaesthetic, irrigate the socket, replant, and check the position radiographically. Apply a <b>flexible splint for 2 weeks</b>. Closed apex: the pulp will not revascularise, so <b>start root canal treatment within 2 weeks</b>. Consider systemic antibiotics, check tetanus cover, and give chlorhexidine mouthwash and a soft diet.`, th: ['paed-trauma'] },
    { h: '4 Apply it', p: `Replant now. Use a passive, flexible splint (for example a wire and composite splint) for 2 weeks. Plan pulp extirpation within 2 weeks, using calcium hydroxide (or an antibiotic-corticosteroid paste), and follow up clinically and radiographically under the IADT schedule.`, th: ['paed-trauma', 'resto-endo'] },
    { h: '5 Eliminate', p: `Four-week splints are for other injuries (lateral luxation, root fracture and alveolar fracture). IADT 2020 does not recommend rigid splints for avulsion. Revascularisation is only possible with an open apex. Endodontic treatment outside the mouth adds time out of the socket and is not standard for this case.`, th: ['paed-trauma'] }
  ],
  wrong: [
    { o: 0, why: `Rigid splinting promotes replacement resorption (ankylosis), and 4 weeks is too long. A tooth with a closed apex will not revascularise, so waiting for it lets the necrotic pulp drive inflammatory resorption.`, th: ['paed-trauma'] },
    { o: 2, why: `Replantation is the right choice for an avulsed permanent tooth in nearly every case. Delayed replantation is still advised for a tooth that has been dry for over 60 minutes. Here the tooth was kept in milk.`, th: ['paed-trauma'] },
    { o: 3, why: `IADT advises 2 weeks of flexible splinting for avulsion. The pulp of a mature replanted tooth is assumed to be non-vital, so root canal treatment should be started within 2 weeks, not after signs appear.`, th: ['paed-trauma', 'resto-endo'] },
    { o: 4, why: `Extraoral root canal treatment lengthens the time out of the socket and damages periodontal ligament cells. IADT advises replanting first and starting endodontics within 2 weeks.`, th: ['paed-trauma'] }
  ],
  pattern: 'Avulsion: replant almost always. Splint flexibly for 2 weeks (4 weeks for lateral luxation, root fracture and alveolar fracture). Closed apex: start root canal treatment within 2 weeks. Open apex: monitor for revascularisation.'
});
