node('prosth-rpd', 'prosth', 'Removable partial and complete dentures', `Kennedy classes, partial denture design steps, freeway space of 2 to 4 mm, and denture stomatitis from Candida and poor denture hygiene.`, `
<p><b>Kennedy classification</b> of partially dentate arches:</p>
<div class="scroll"><table class="t">
<tr><th>Class</th><th>Description</th></tr>
<tr><td>I</td><td>Bilateral free-end saddles</td></tr>
<tr><td>II</td><td>Unilateral free-end saddle</td></tr>
<tr><td>III</td><td>Unilateral bounded saddle (teeth on both sides)</td></tr>
<tr><td>IV</td><td>Single bounded anterior saddle crossing the midline</td></tr>
</table></div>
<p><b>Applegate's rules:</b> classify after any planned extractions; ignore missing third molars that won't be replaced (a missing second molar is ignored only if its opposing second molar is also missing and not replaced); the most posterior saddle decides the class; other saddles are "modifications" (count them). Class IV can have no modifications.</p>
<p><b>Partial denture design sequence:</b> saddles, support, retention, bracing (with reciprocation), connectors, then reassess.</p>
<ul>
<li><b>Support:</b> tooth-borne (rests), mucosa-borne or both. Free-end saddles are tooth-and-mucosa supported and rotate, so use stress-relieving designs (for example the RPI system: mesial Rest, distal Proximal plate, I-bar clasp).</li>
<li><b>Retention:</b> direct (clasps into undercuts found by surveying; cobalt-chromium clasps need small undercuts because the alloy is stiff), indirect (to resist rotation away from the tissues), guide planes and a defined path of insertion.</li>
<li><b>Connectors:</b> a lingual bar needs enough depth between the gingival margin and the floor of mouth; otherwise use a lingual plate. Keep connectors clear of gingival margins where possible.</li>
<li><b>Materials:</b> cobalt-chromium (thin, rigid, tooth-supported, kinder to the periodontium) versus acrylic (cheap, easy to add to, often mucosa-borne "gum strippers").</li>
</ul>
<p><b>Complete dentures.</b> The <b>freeway space</b> (interocclusal rest space) is the gap between the teeth at rest: about <b>2 to 4 mm</b>. Occlusal vertical dimension (OVD) equals rest vertical dimension minus freeway space.</p>
<div class="scroll"><table class="t">
<tr><th>OVD too high (freeway space too small)</th><th>OVD too low (freeway space too big)</th></tr>
<tr><td>Sore ridges, clicking teeth, strained lips, tired muscles, "too many teeth", difficulty with speech</td><td>Angular cheilitis, poor chewing, collapsed or aged look, thin lips, chin close to nose</td></tr>
</table></div>
<p>Other problems: <b>looseness</b> (poor peripheral seal, under-extension, no post dam, poor tooth position outside the neutral zone, dry mouth), <b>pain</b> (over-extension, pressure points, high OVD), <b>gagging</b>, and speech. Lower dentures are less retentive than uppers. For older patients, copy (replica) dentures keep familiar features.</p>
<p><b>Denture stomatitis</b> (chronic erythematous candidosis): erythema of the palate under an upper denture, usually painless. Newton types: I pinpoint, II diffuse, III granular or papillary. Causes: Candida (mainly albicans), poor denture hygiene, wearing dentures at night, ill fit, and predisposing factors (diabetes, steroid inhalers, anaemia, broad-spectrum antibiotics).</p>
<ul>
<li>Leave dentures out at night; brush and soak them (chlorhexidine, or dilute hypochlorite for acrylic-only dentures; hypochlorite damages cobalt-chromium).</li>
<li>Brush the palate; correct fit or remake.</li>
<li>Antifungal if needed: miconazole oral gel applied to the fitting surface; fluconazole is for extensive or severe infection or when miconazole is unsuitable (BNF). Both interact with warfarin and with some statins: check the drug history (see <a href="#n-pharm-int">drug interactions</a>).</li>
<li>Angular cheilitis often coexists: treat Candida and Staphylococcus aureus, and check OVD and haematinics.</li>
</ul>
`, {
  spot: `An arch with missing molars on both sides (Kennedy I); a denture wearer with sore ridges and clicking teeth (OVD too high); a red palate matching the denture outline.`,
  trap: `Prescribing miconazole to a patient on warfarin; or calling a missing 8 a free-end saddle.`,
  src: `Standard prosthodontics texts (Kennedy 1925; Applegate's rules); SDCEP Drug Prescribing for Dentistry (antifungals); BNF interactions.`,
  check: `Confirm the antifungal regimens (miconazole oral gel and fluconazole dose and duration) in the current BNF and SDCEP Drug Prescribing for Dentistry.`
});

node('prosth-imp', 'prosth', 'Bridges and implants', `Resin-bonded cantilever bridges are conservative and reliable; implants need stable perio, good bone and no uncontrolled risk factors; mucositis is reversible, peri-implantitis loses bone.`, `
<p><b>Bridges.</b></p>
<div class="scroll"><table class="t">
<tr><th>Type</th><th>Features</th></tr>
<tr><td>Resin-bonded (adhesive)</td><td>Minimal or no preparation; metal or zirconia wing bonded to the abutment. A <b>cantilever single-retainer</b> design (for example replacing an upper lateral incisor from the canine) performs at least as well as fixed-fixed and avoids partial debonds going unnoticed.</td></tr>
<tr><td>Conventional fixed-fixed</td><td>Full-coverage retainers each side; strongest, but destructive and both abutments must share a path of insertion.</td></tr>
<tr><td>Conventional cantilever</td><td>One abutment carries the pontic; keep the span short and the occlusal load light.</td></tr>
<tr><td>Fixed-movable</td><td>A key and keyway (movable joint) allows for abutments that don't share a path, or for a long span.</td></tr>
</table></div>
<p><b>Pontic designs:</b> modified ridge-lap (aesthetic zone), ovate (best aesthetics, needs a prepared ridge), hygienic or sanitary (no ridge contact, lower posterior). Pontics must be cleanable: teach superfloss or interdental brushes.</p>
<p><b>Implants.</b> Indications: missing teeth where adjacent teeth are unrestored, patient preference, enough bone (or bone that can be grafted), a stable periodontium and good oral hygiene. A two-implant mandibular overdenture is the first-choice standard of care for an edentulous mandible (McGill consensus, 2002).</p>
<p><b>Risk factors and contraindications</b> (mostly relative): smoking; history of periodontitis or uncontrolled periodontal disease; uncontrolled diabetes; antiresorptive drugs, especially intravenous (medication-related osteonecrosis of the jaw (MRONJ) risk: see <a href="#n-med-mronj">MRONJ</a>); radiotherapy to the jaws; bruxism; immunosuppression; and growth not yet complete in adolescents (the implant behaves like an ankylosed tooth and ends up in infraocclusion).</p>
<p><b>Peri-implant health and disease (2017 World Workshop):</b></p>
<div class="scroll"><table class="t">
<tr><th></th><th>Peri-implant mucositis</th><th>Peri-implantitis</th></tr>
<tr><td>Signs</td><td>Bleeding and/or suppuration on gentle probing, redness, swelling</td><td>As mucositis, plus increased probing depth</td></tr>
<tr><td>Bone</td><td>No bone loss beyond initial remodelling</td><td>Progressive bone loss</td></tr>
<tr><td>Without baseline records</td><td>-</td><td>Bone level 3 mm or more apical to the most coronal intraosseous part of the implant, <b>and</b> probing depth 6 mm or more with bleeding</td></tr>
<tr><td>Reversible?</td><td>Yes, with plaque control</td><td>No; aim to arrest</td></tr>
<tr><td>Treatment</td><td>Oral hygiene instruction, professional mechanical cleaning, risk-factor control</td><td>Non-surgical debridement first, then surgical (access, resective or regenerative) if needed; usually specialist</td></tr>
</table></div>
<p>Risk factors for peri-implantitis: history of periodontitis, poor plaque control, no supportive care, smoking, diabetes, and excess cement left under the mucosa. Take baseline probing and a radiograph after the restoration is fitted, then review implants in supportive care like teeth. Probe implants gently.</p>
`, {
  spot: `Bleeding around an implant with no bone loss (mucositis); bone loss to the third thread with suppuration (peri-implantitis); a missing upper lateral with an unrestored canine (resin-bonded cantilever).`,
  trap: `Placing an implant in a 15-year-old, or diagnosing peri-implantitis without evidence of bone loss.`,
  src: `2017 World Workshop consensus on peri-implant diseases (Berglundh et al., 2018); EFP S3 guideline on prevention and treatment of peri-implant diseases (Herrera et al., 2023); McGill consensus statement (2002).`,
  check: `Confirm the implant spacing and healing-time figures in your course text if you need them; this lesson avoids quoting them.`
});

node('comm', 'root', 'Communication', 'How to explain, consent, break bad news, calm anger and hand over clearly to colleagues: tested in SBAs and in most Part 2 stations.', `
<p>Communication sits in the syllabus as three areas: with patients and carers, with the clinical team and peers, and with other professionals. In Part 1 it appears as "what is the most appropriate next step" stems. In Part 2 nearly every station has a communication mark, even the clinical ones.</p>
<ul>
<li><a href="#n-comm-pt">Explaining, consent talks and bad news</a>: chunk and check, teach-back, Calgary-Cambridge, SPIKES.</li>
<li><a href="#n-comm-hard">Anxious, angry and upset patients; complaints</a>: de-escalation, apology and the NHS complaints timescales.</li>
<li><a href="#n-comm-team">Team working, referrals and letters</a>: SBAR, telephone handover and what a good referral letter contains.</li>
</ul>
<p>The legal side of consent is in <a href="#n-prof-consent">Consent and capacity</a>. Learn the models here as routines you can run under time pressure.</p>
`, {

node('comm-pt', 'comm', 'Explaining, consent talks and bad news', 'Structure the consultation (Calgary-Cambridge), give information in chunks, confirm with teach-back, and use SPIKES for bad news.', `
<p><b>Calgary-Cambridge</b> is the consultation model examiners expect. Five stages run in order, with two threads throughout.</p>
<div class="scroll"><table class="t">
<tr><th>Stage</th><th>What you do</th></tr>
<tr><td>1 Initiating the session</td><td>Introduce yourself and your role, confirm identity, agree the agenda.</td></tr>
<tr><td>2 Gathering information</td><td>Open questions first, then closed. Explore ideas, concerns and expectations (ICE).</td></tr>
<tr><td>3 Physical examination</td><td>Explain what you are about to do and why.</td></tr>
<tr><td>4 Explanation and planning</td><td>Chunk and check, use plain words, share the decision.</td></tr>
<tr><td>5 Closing the session</td><td>Summarise, agree next steps, safety-net, invite questions.</td></tr>
<tr><td>Throughout</td><td><i>Providing structure</i> (signposting, summarising) and <i>building the relationship</i> (empathy, non-verbal skills).</td></tr>
</table></div>
<p><b>Chunk and check.</b> Give one small piece of information, then pause and check: "Does that make sense so far?" Avoid jargon. Say "gum disease", not "periodontitis", until you have explained the word.</p>
<p><b>Teach-back</b> is a stronger check. Ask the patient to explain the plan in their own words: "So I know I have explained it well, can you tell me what you will do if it bleeds tonight?" It tests your explanation, not the patient. If the answer is wrong, re-explain and ask again.</p>
<p><b>A consent conversation</b> covers: the diagnosis, what the treatment involves, its benefits, the material risks, the reasonable alternatives (including no treatment), and the cost. Give time to think. Record what was said. See <a href="#n-prof-consent">Consent and capacity</a> for the Montgomery test.</p>
<p><b>SPIKES</b> for bad news (for example a suspicious ulcer needing an urgent suspected cancer referral, see <a href="#n-exam-onc">Oral cancer</a>):</p>
<ol>
<li><b>S</b>etting: private room, sit down, no interruptions, offer a companion.</li>
<li><b>P</b>erception: "What have you been told / what do you think is going on?"</li>
<li><b>I</b>nvitation: find how much they want to know.</li>
<li><b>K</b>nowledge: warning shot ("I am concerned about what I have found"), then plain facts in chunks.</li>
<li><b>E</b>motions: name and acknowledge feelings, allow silence.</li>
<li><b>S</b>trategy and summary: the plan, the timescale, written information, how to contact you.</li>
</ol>
<p>Do not give a diagnosis you cannot yet make. Say that the change needs a specialist to look at it urgently and that cancer is one of the things they will rule out. Never offer false reassurance.</p>
`, {
  spot: `A patient who "nods but looks confused", a stem asking how to confirm understanding, or a patient with a lesion you must refer urgently.`,
  trap: `Picking "ask if they have understood" (closed question) over teach-back. Or telling the patient "it is probably nothing" before referral.`,
  src: `Kurtz, Silverman and Draper, Calgary-Cambridge guide; Baile and colleagues, SPIKES (2000); GDC Standards Principle 2 (communicate effectively) and Principle 3 (valid consent).`
});

node('comm-hard', 'comm', 'Anxious, angry and upset patients; complaints', 'De-escalate anger, apologise without wrongly admitting fault, follow the complaints procedure and know the NHS timescales.', `
<p><b>Angry patient: a routine.</b></p>
<ol>
<li>Stay calm and safe. Move to a private room; keep an exit; get help if there is any threat.</li>
<li>Let them speak without interrupting. Listen for the real concern.</li>
<li>Acknowledge the emotion: "I can see this has been really upsetting."</li>
<li>Apologise for their experience: "I am sorry this has happened." An apology is not an admission of liability (Compensation Act 2006 in England and Wales; Apologies (Scotland) Act 2016). Do not speculate about blame or criticise a colleague.</li>
<li>Clarify the facts and what they want (an explanation, a remedy, a refund, an apology).</li>
<li>Offer what you can now. Explain the practice complaints procedure and give it in writing.</li>
<li>Document the conversation.</li>
</ol>
<p><b>Anxious patient.</b> Explore the cause (needles, drill noise, gagging, past trauma, loss of control). The Modified Dental Anxiety Scale (MDAS) has five questions scored 1 to 5, so the total runs from 5 to 25; a score of 19 or more is the usual UK cut-off for high dental anxiety. Options: tell-show-do, agreed stop signal, short appointments, distraction, cognitive behavioural therapy (CBT), and conscious sedation (see <a href="#n-pain-sed">Conscious sedation</a>).</p>
<p><b>NHS complaints in England</b> follow the Local Authority Social Services and NHS Complaints (England) Regulations 2009.</p>
<div class="scroll"><table class="t">
<tr><th>Step</th><th>Rule</th></tr>
<tr><td>Time limit to complain</td><td>12 months from the event, or from when the patient became aware of it (can be extended if reasonable).</td></tr>
<tr><td>Acknowledgement</td><td>Within 3 working days, offering to discuss how it will be handled.</td></tr>
<tr><td>Response</td><td>Agree a timescale with the patient. If no response within 6 months, write to explain why.</td></tr>
<tr><td>Who to complain to</td><td>The practice, or the commissioner (in England, the integrated care board, ICB, since dental commissioning was delegated in 2023).</td></tr>
<tr><td>Escalation</td><td>Parliamentary and Health Service Ombudsman (PHSO).</td></tr>
<tr><td>Private treatment</td><td>Practice first, then the Dental Complaints Service (DCS).</td></tr>
<tr><td>Fitness to practise concerns</td><td>The General Dental Council (GDC), not a route for refunds.</td></tr>
</table></div>
<p>GDC Principle 5 says you must make sure there is an effective written complaints procedure and follow it, and respond within its time limits. You should display it, analyse complaints and share the lessons, and keep a record of complaints separate from clinical records so that patients are not discouraged from complaining.</p>
<p>Wales uses NHS Putting Things Right; Scotland uses the NHS Model Complaints Handling Procedure (Scottish Public Services Ombudsman); Northern Ireland uses HSC complaints and the NI Public Services Ombudsman.</p>
`, {
  spot: `A patient shouting at reception, a patient wanting a refund, or a question on "who handles a complaint about private treatment".`,
  trap: `Thinking any apology admits negligence, or sending private-treatment complaints to the Ombudsman or the GDC first.`,
  src: `Local Authority Social Services and NHS Complaints (England) Regulations 2009; GDC Standards Principle 5; GDC guidance on complaints handling; Compensation Act 2006 s2.`,
  check: `Checked against the 2009 Regulations (regs 12 to 14) and GDC Standards 5.3.4 to 5.3.6: the time limits come from the complaints procedure you follow (for the NHS, 3 working days to acknowledge and 6 months to respond or explain the delay); GDC guidance only adds that if a complaint cannot be resolved in the usual time you should update the patient at least every 10 days. The DCS covers private care only (DCS website). The regulations were read in their original form; check legislation.gov.uk for later amendments.`
});

node('comm-team', 'comm', 'Team working, referrals and letters', 'Use SBAR for urgent handover, write referral letters that answer a clear question, and work in a way that keeps patients safe.', `
<p><b>SBAR</b> structures a telephone call to a colleague, for example the on-call oral and maxillofacial surgery (OMFS) registrar.</p>
<div class="scroll"><table class="t">
<tr><th>Letter</th><th>Content</th><th>Example</th></tr>
<tr><td><b>S</b>ituation</td><td>Who you are, who the patient is, why you are calling.</td><td>"I am a dentist at X practice. I have a 34-year-old man with a spreading lower left facial swelling. I would like him assessed today."</td></tr>
<tr><td><b>B</b>ackground</td><td>Relevant history, medical history, drugs, allergies.</td><td>"Painful LL8 for a week, on amoxicillin 3 days. Type 1 diabetes."</td></tr>
<tr><td><b>A</b>ssessment</td><td>Your findings and observations.</td><td>"Temperature 38.6, trismus 15 mm, floor of mouth swelling, difficulty swallowing."</td></tr>
<tr><td><b>R</b>ecommendation</td><td>What you want and by when.</td><td>"Can I send him to the emergency department now? Should he travel by ambulance?"</td></tr>
</table></div>
<p>Before you call, have the notes and observations in front of you. At the end, read back the plan and record the name of the person you spoke to and the time.</p>
<p><b>What a good referral letter contains.</b></p>
<ul>
<li>Patient: full name, date of birth, address, phone, NHS number (or CHI number in Scotland).</li>
<li>Referrer: name, GDC number, practice address, contact details.</li>
<li>Urgency, stated clearly (for example "urgent suspected cancer").</li>
<li>The reason and a specific question: what you want the specialist to do.</li>
<li>History of the complaint, what you have done so far, and the response.</li>
<li>Medical history, medicines, allergies, social history (smoking, alcohol).</li>
<li>Examination findings, with site and size; radiographs and reports enclosed or sent electronically.</li>
<li>That the patient knows about and agrees to the referral; any needs (interpreter, access, anxiety, sedation).</li>
</ul>
<p>Most English regions now use electronic referral systems with locally set forms. Send a copy to the patient's general medical practitioner where relevant.</p>
<p><b>Team working.</b> GDC Principle 6: work with colleagues in patients' best interests, delegate only to people who are trained and competent and within their scope of practice, and communicate well with the team. You should work with another appropriately trained team member whenever you treat patients, except in limited circumstances the GDC describes. Disagreements are discussed privately and never in front of patients.</p>
`, {
  spot: `A call to a hospital team about an urgent patient, or a stem listing letter contents and asking which item is essential.`,
  trap: `Starting the phone call with a long history instead of the Situation. Or writing a letter with no clear question or urgency.`,
  src: `NHS Improvement SBAR communication tool; GDC Standards Principle 6 and GDC Scope of Practice; NICE NG12 for urgent suspected cancer referral.`
});

node('prof', 'root', 'Professionalism, ethics and law', 'The GDC standards, consent, confidentiality, data protection, raising concerns, candour and the statistics behind evidence-based practice.', `
<p>This section covers the ethics and law that every station and many SBAs rely on. The GDC's <i>Standards for the Dental Team</i> (2013) is the core text: nine principles, each with standards that say what you <b>must</b> do.</p>
<ul>
<li><a href="#n-prof-gdc">GDC standards, CPD and fitness to practise</a></li>
<li><a href="#n-prof-consent">Consent and capacity</a>: Montgomery, Gillick, Fraser, parental responsibility, the Mental Capacity Act 2005.</li>
<li><a href="#n-prof-conf">Confidentiality and data protection</a>: disclosure, UK GDPR, subject access requests.</li>
<li><a href="#n-prof-concerns">Raising concerns and duty of candour</a></li>
<li><a href="#n-prof-ebp">Evidence-based practice and statistics</a></li>
</ul>
<p>Law differs between UK nations for capacity and some candour rules. The exam is set by RCS England, so England is the default.</p>
`, {
  spot: `Stems that say "what should the dentist do", involving a child, a relative, the police, a colleague, an error or a data request.`,
  trap: `Answering from personal ethics instead of the GDC standard. "Must" in the standards is a duty; "should" is expected unless there is good reason.`,
  src: `GDC Standards for the Dental Team (2013); Mental Capacity Act 2005; UK GDPR and Data Protection Act 2018; Public Interest Disclosure Act 1998.`
});

node('prof-gdc', 'prof', 'GDC standards, CPD and fitness to practise', 'Know the 9 GDC principles by number and the enhanced CPD scheme: 100 hours over 5 years, a PDP and an annual statement.', `
<p><b>The 9 principles</b> of GDC <i>Standards for the Dental Team</i> (2013):</p>
<ol>
<li>Put patients' interests first.</li>
<li>Communicate effectively with patients.</li>
<li>Obtain valid consent.</li>
<li>Maintain and protect patients' information.</li>
<li>Have a clear and effective complaints procedure.</li>
<li>Work with colleagues in a way that is in patients' best interests.</li>
<li>Maintain, develop and work within your professional knowledge and skills.</li>
<li>Raise concerns if patients are at risk.</li>
<li>Make sure your personal behaviour maintains patients' confidence in you and the dental profession.</li>
</ol>
<p>Principle 1 also requires appropriate indemnity or insurance, and putting patients' interests before financial gain. Principle 9 covers behaviour outside work, including social media, and the duty to tell the GDC if you are charged with or convicted of a criminal offence, or have restrictions imposed elsewhere.</p>
<p><b>Enhanced continuing professional development (CPD)</b>, in force since 2018 for dentists:</p>
<div class="scroll"><table class="t">
<tr><th>Item</th><th>Requirement for dentists</th></tr>
<tr><td>Cycle</td><td>5 years. The first cycle starts at the start of your first full year of registration; the dentists' CPD year is 1 January to 31 December.</td></tr>
<tr><td>Hours</td><td>At least 100 verifiable hours per cycle (dental care professionals: 75 or 50).</td></tr>
<tr><td>Spread</td><td>At least 10 hours in every 2 consecutive years.</td></tr>
<tr><td>Personal development plan (PDP)</td><td>Required. Plan CPD against your field of practice and the development outcomes.</td></tr>
<tr><td>Annual statement</td><td>Declare hours every year at annual renewal, even if zero. For dentists the deadline is 28 January (28 days after the CPD year ends); for dental care professionals 28 August.</td></tr>
<tr><td>Development outcomes</td><td>A communication; B management and leadership; C knowledge and skills in your field; D professional behaviour and ethics. Each CPD activity maps to at least one.</td></tr>
<tr><td>Records</td><td>Keep the evidence (certificates, PDP, reflection). The GDC can audit.</td></tr>
</table></div>
<p><b>Highly recommended topics</b> (with hours): medical emergencies (at least 10 hours per cycle, including at least 2 hours every year), disinfection and decontamination (at least 5 hours per cycle), and radiography and radiation protection (at least 5 hours per cycle, if you take radiographs). <b>Recommended topics</b> (no set hours): legal and ethical issues, complaints handling, early detection of oral cancer, and safeguarding children and young people and vulnerable adults. The IR(ME)R 2017 and IRR17 rules make radiation training a legal duty for those who take radiographs.</p>
<p><b>Fitness to practise (FtP).</b> The GDC investigates concerns about a registrant's conduct, performance or health. Stages: initial assessment, investigation, case examiners, then a practice committee hearing if needed. Outcomes range from no action or advice to conditions, suspension or erasure. Interim orders can restrict practice during an investigation. The test is current impairment of fitness to practise.</p>
`, {
  spot: `Any question naming a GDC principle by number, CPD hours, the annual statement deadline, or a dentist convicted of drink-driving.`,
  trap: `Mixing up the old scheme (250 hours, 75 verifiable) with enhanced CPD (100 verifiable hours, all must be verifiable). Or thinking the recommended topics are compulsory hours.`,
  src: `GDC Standards for the Dental Team (2013); GDC Enhanced CPD guidance (2018); GDC Fitness to Practise guidance.`,
  check: `Checked on the GDC website (October 2026): the hours, the 10-hours-in-any-2-years rule, the 28 January statement deadline and the topic list above match the CPD scheme pages, and the 2013 Standards for the Dental Team were still the live version. Re-check the GDC website for any revised Standards before the exam.`
});

node('prof-consent', 'prof', 'Consent and capacity', 'Valid consent is voluntary, informed and given by someone with capacity: Montgomery, Gillick, parental responsibility and the MCA 2005.', `
<p><b>Valid consent</b> needs three things: it is given <b>voluntarily</b>, the patient is <b>informed</b>, and the patient has <b>capacity</b>. It is a process, not a signature. It can be withdrawn at any time.</p>
<p><b>Montgomery v Lanarkshire Health Board (2015, UK Supreme Court)</b> replaced the Bolam test for risk disclosure. You must take reasonable care that the patient knows about any <b>material risk</b> and any reasonable alternatives. A risk is material if a reasonable person in the patient's position would attach significance to it, or if you know (or should know) that this particular patient would. The therapeutic exception is narrow.</p>
<p><b>Children (England and Wales).</b></p>
<div class="scroll"><table class="t">
<tr><th>Concept</th><th>What it means</th></tr>
<tr><td>Age 16 and 17</td><td>Presumed able to consent to treatment (Family Law Reform Act 1969). The MCA 2005 applies from 16.</td></tr>
<tr><td>Gillick competence</td><td>From Gillick v West Norfolk and Wisbech AHA (1985). A child under 16 can consent if they have enough understanding and intelligence to understand fully what is proposed. Decision-specific.</td></tr>
<tr><td>Fraser guidelines</td><td>Narrower: from the same case, about giving contraception or sexual health advice to under-16s without parental knowledge. Not the test for dental treatment.</td></tr>
<tr><td>Refusal</td><td>For 16 and 17 year olds, NHS guidance says a refusal can be overruled only in exceptional circumstances (by the courts, where refusal may lead to death or severe permanent injury). For a Gillick-competent child under 16 the law is more complex: take advice from your indemnity provider.</td></tr>
</table></div>
<p><b>Parental responsibility (PR).</b> The mother always has it. The father has it if married to the mother at the birth, or named on the birth certificate (registered after 1 December 2003 in England and Wales), or by a PR agreement or court order. Others: adoptive parents, a step-parent or civil partner by agreement or order, special guardians, and a local authority under a care order (shared). Grandparents and other carers do not have it automatically. Consent from one person with PR is usually enough.</p>
<p><b>Mental Capacity Act (MCA) 2005</b> (England and Wales, age 16+). The 5 principles:</p>
<ol>
<li>Assume capacity unless it is shown to be lacking.</li>
<li>Take all practicable steps to help the person decide before treating them as unable.</li>
<li>An unwise decision does not mean a lack of capacity.</li>
<li>Any act for a person who lacks capacity must be in their best interests.</li>
<li>Choose the option least restrictive of their rights and freedom.</li>
</ol>
<p>Capacity is decision-specific and time-specific. A person cannot decide if they cannot <b>understand</b>, <b>retain</b>, <b>use or weigh</b> the information, or <b>communicate</b> a decision, because of an impairment or disturbance of the mind or brain. <b>Best interests</b>: consider the person's past and present wishes, beliefs and values; consult carers and anyone holding a health and welfare lasting power of attorney (LPA); check for an advance decision; consider waiting if capacity may return. Involve an independent mental capacity advocate (IMCA) for serious treatment when no one else can be consulted.</p>
<p><b>Scotland:</b> Adults with Incapacity (Scotland) Act 2000. An adult is 16+. Treatment needs a certificate of incapacity (section 47); a registered dentist can sign one for dental treatment after training. Under-16s in Scotland can consent if capable of understanding (Age of Legal Capacity (Scotland) Act 1991). Northern Ireland has the Mental Capacity Act (Northern Ireland) 2016, which came into operation in stages from 1 October and 2 December 2019.</p>
`, {
  spot: `A 14-year-old attending alone, a grandmother bringing a child, a patient with dementia needing an extraction, or "which risks must be disclosed?"`,
  trap: `Citing Fraser guidelines for dental consent (use Gillick). Or assuming a relative can consent for an adult who lacks capacity (only an LPA for health and welfare, or a deputy, can).`,
  src: `Montgomery v Lanarkshire Health Board [2015] UKSC 11; Gillick v West Norfolk and Wisbech AHA [1985]; Mental Capacity Act 2005 and Code of Practice; Adults with Incapacity (Scotland) Act 2000; GDC Standards Principle 3.`,
  check: `Checked: England and Wales 1 December 2003 (Children Act 1989 s4 as amended); Scotland 4 May 2006 (Family Law (Scotland) Act 2006 s23); Northern Ireland, births on or after 15 April 2002 (nidirect). The Mental Capacity Act (Northern Ireland) 2016 commencement orders show operation from 1 October and 2 December 2019: check the NI Department of Health for the current position of each Part.`
});

node('prof-conf', 'prof', 'Confidentiality and data protection', 'Keep information confidential, disclose only with consent, by law or in the public interest, and answer subject access requests within one month.', `
<p><b>Confidentiality</b> (GDC Principle 4) continues after the patient's death. You may disclose information only in these situations:</p>
<div class="scroll"><table class="t">
<tr><th>Route</th><th>Examples</th></tr>
<tr><td>With consent</td><td>Referral letters (implied consent for direct care), reports to insurers or solicitors (explicit consent).</td></tr>
<tr><td>Required by law</td><td>A court order; a statutory duty such as notifying certain infectious diseases, or giving driver identity to police under the Road Traffic Act.</td></tr>
<tr><td>Public interest</td><td>To prevent serious harm to the patient or others, or to prevent or detect serious crime; safeguarding concerns.</td></tr>
</table></div>
<p>When you disclose: share the minimum necessary, tell the patient where it is safe to do so, and record what you shared, with whom and why. If unsure, ask your indemnity provider. A police request without a court order is not by itself a legal requirement. The Caldicott principles (8) guide NHS information sharing, and each NHS body has a Caldicott guardian.</p>
<p><b>UK GDPR and the Data Protection Act (DPA) 2018.</b> Health data is <b>special category</b> data. You need a lawful basis under Article 6 (for example public task for NHS care, or contract or legitimate interests for private care) and a condition under Article 9 (provision of health care). Key duties:</p>
<ul>
<li>Pay the data protection fee to the Information Commissioner's Office (ICO).</li>
<li>Have a privacy notice telling patients how their data is used.</li>
<li>NHS contractors count as public authorities and must appoint a data protection officer (DPO).</li>
<li>Report a personal data breach likely to risk people's rights to the ICO within 72 hours of becoming aware.</li>
<li>Keep data secure, accurate, and no longer than necessary.</li>
</ul>
<p><b>Right of access (subject access request, SAR).</b> Patients can ask for a copy of their records, in writing or verbally. Respond without undue delay and within <b>one month</b>. You can extend by up to two further months if the request is complex or there are many. It is normally <b>free</b>; a reasonable fee is allowed only if the request is manifestly unfounded or excessive, or for further copies. You may withhold information likely to cause serious harm, or that identifies third parties (not health professionals involved in care). Records of deceased patients are accessed under the Access to Health Records Act 1990.</p>
<p>Other rights: rectification, erasure (limited for health records), restriction, objection and data portability.</p>
`, {
  spot: `A police officer, solicitor, parent or spouse asking for information, a lost laptop, or a patient asking for a copy of their notes and radiographs.`,
  trap: `Charging the old £10 or £50 fee, or allowing 40 days (old DPA 1998 rules). Or giving information to police just because they asked.`,
  src: `GDC Standards Principle 4; UK GDPR and Data Protection Act 2018; ICO guidance on the right of access; Access to Health Records Act 1990; Caldicott principles (2020 revision).`,
  check: `The Data (Use and Access) Act 2025 amended parts of UK GDPR (including subject access searches and when the time limit starts). The ICO subject access guidance (page updated 16 July 2026) still gives one month, an extension of up to two further months for complex requests, a clock that pauses while you ask for clarification, a reasonable and proportionate search, and a fee only if a request is manifestly unfounded or excessive or for further copies; re-check the ICO website for later changes. Record retention periods (for example adult dental records and children's records) vary by guidance; confirm in the NHS England Records Management Code of Practice.`
});

node('prof-concerns', 'prof', 'Raising concerns and duty of candour', 'You must raise concerns when patients are at risk, PIDA protects you, and you must be open with patients when things go wrong.', `
<p><b>Raising concerns</b> (GDC Principle 8). You must raise concerns if patients are at risk, even if you are not sure the concern is justified. The duty overrides personal and professional loyalty. Raise it promptly; you do not need proof.</p>
<p><b>Escalation route.</b></p>
<ol>
<li>If patients are at immediate risk, act now (for example stop a colleague who appears impaired from treating).</li>
<li>Raise within the practice: the practice owner, manager or clinical lead, or the Freedom to Speak Up guardian in larger organisations.</li>
<li>If that fails, or if those people are involved: the commissioner (ICB or NHS England), the Care Quality Commission (CQC), or the GDC.</li>
<li>Record what you raised, when and with whom.</li>
</ol>
<p><b>Whistleblowing and the Public Interest Disclosure Act (PIDA) 1998.</b> PIDA protects workers from detriment or dismissal when they make a protected disclosure in the public interest about wrongdoing, such as a danger to health and safety or a breach of a legal duty. Disclosure to the employer or to a "prescribed person" (the GDC and CQC are prescribed) is protected. You do not have to prove the concern; you must reasonably believe it. Employers cannot use gagging clauses to stop protected disclosures.</p>
<p><b>Duty of candour: two duties.</b></p>
<div class="scroll"><table class="t">
<tr><th></th><th>Professional duty</th><th>Statutory duty (England)</th></tr>
<tr><td>Applies to</td><td>Every individual registrant</td><td>The organisation (CQC-registered provider)</td></tr>
<tr><td>Source</td><td>GDC standards and GDC guidance <i>Being open and honest with patients when something goes wrong</i> (in effect from 1 July 2016)</td><td>Regulation 20, Health and Social Care Act 2008 (Regulated Activities) Regulations 2014</td></tr>
<tr><td>Trigger</td><td>Something goes wrong that has caused, or could cause, harm or distress</td><td>A notifiable safety incident. For providers that are not NHS bodies (which includes dental practices) this is an unintended or unexpected incident that, in a health professional's reasonable opinion, appears to have caused death, an impairment lasting at least 28 days, a change to body structure, prolonged pain or psychological harm (28 days or more) or shortened life expectancy, or that needs treatment to prevent those outcomes</td></tr>
<tr><td>Action</td><td>Tell the patient, apologise, offer a remedy or support, explain the likely effects; report errors and near misses</td><td>Tell the person as soon as reasonably practicable, apologise, give a true account, follow up in writing, keep records</td></tr>
<tr><td>Enforced by</td><td>GDC</td><td>CQC (can be a criminal offence)</td></tr>
</table></div>
<p>Scotland and Wales have their own organisational duties (Health (Tobacco, Nicotine etc. and Care) (Scotland) Act 2016; Health and Social Care (Quality and Engagement) (Wales) Act 2020). Being open includes near misses: report them so the team learns (see <a href="#n-mgmt-gov">significant event analysis</a>).</p>
`, {
  spot: `A wrong tooth extracted, a broken file left in a canal, a colleague with a pattern of poor care, or a nurse fearing dismissal for reporting.`,
  trap: `Waiting for proof before raising a concern, or thinking the statutory duty of candour applies only to NHS work. It applies to CQC-registered providers whatever the funding.`,
  src: `GDC Standards Principle 8 and GDC guidance on raising concerns; GDC guidance Being open and honest with patients when something goes wrong (2016); Regulations 20 and 22 of the Health and Social Care Act 2008 (Regulated Activities) Regulations 2014; Public Interest Disclosure Act 1998.`,
  check: `The notifiable safety incident definition above is taken from Regulation 20(9) as amended in 2015 on legislation.gov.uk; the CQC website could not be opened for this check, so read CQC's own guidance on Regulation 20 for examples.`
});

node('prof-ebp', 'prof', 'Evidence-based practice and statistics', 'Rank study designs, name the biases, and calculate sensitivity, specificity, PPV, NPV and NNT from a 2×2 table.', `
<p><b>Evidence hierarchy</b> (highest first): systematic review and meta-analysis of randomised controlled trials (RCTs); RCT; cohort study; case-control study; cross-sectional survey; case series and case reports; expert opinion.</p>
<div class="scroll"><table class="t">
<tr><th>Design</th><th>Best for</th><th>Note</th></tr>
<tr><td>RCT</td><td>Effect of a treatment</td><td>Randomisation balances confounders</td></tr>
<tr><td>Cohort</td><td>Incidence, risk factors, prognosis</td><td>Prospective or retrospective; gives relative risk</td></tr>
<tr><td>Case-control</td><td>Rare diseases</td><td>Starts with outcome; gives odds ratio; recall bias</td></tr>
<tr><td>Cross-sectional</td><td>Prevalence</td><td>One time point; cannot show cause</td></tr>
</table></div>
<p><b>Bias types.</b> Selection (groups differ at the start), performance (groups treated differently apart from the intervention; reduce with blinding), detection or observer (outcome measured differently), attrition (drop-outs differ), reporting and publication (positive results more often published), recall (cases remember exposures better), lead-time (earlier diagnosis seems to lengthen survival). A confounder is linked to both exposure and outcome (for example smoking in alcohol and oral cancer studies).</p>
<p><b>Worked 2×2 table.</b> 1000 people screened; prevalence 10%; test sensitivity 90%, specificity 80%.</p>
<div class="scroll"><table class="t">
<tr><th></th><th>Disease present</th><th>Disease absent</th><th>Total</th></tr>
<tr><td>Test positive</td><td>TP 90</td><td>FP 180</td><td>270</td></tr>
<tr><td>Test negative</td><td>FN 10</td><td>TN 720</td><td>730</td></tr>
<tr><td>Total</td><td>100</td><td>900</td><td>1000</td></tr>
</table></div>
<ul>
<li><b>Sensitivity</b> = TP / (TP + FN) = 90/100 = 90%. Rules disease out when negative (SnNout).</li>
<li><b>Specificity</b> = TN / (TN + FP) = 720/900 = 80%. Rules disease in when positive (SpPin).</li>
<li><b>Positive predictive value (PPV)</b> = TP / (TP + FP) = 90/270 = 33%.</li>
<li><b>Negative predictive value (NPV)</b> = TN / (TN + FN) = 720/730 = 98.6%.</li>
</ul>
<p>Sensitivity and specificity belong to the test. PPV and NPV change with prevalence: in a low-prevalence population PPV falls.</p>
<p><b>Number needed to treat (NNT)</b> = 1 / absolute risk reduction (ARR). If 20% of controls and 15% of treated patients have the event, ARR = 5% (0.05), NNT = 20. Relative risk reduction = 5/20 = 25%. Round NNT up.</p>
<p><b>p-value versus confidence interval (CI).</b> The p-value is the probability of a result at least this extreme if the null hypothesis were true; p &lt; 0.05 is the usual cut-off. A 95% CI gives the range of plausible true values and shows size and precision. For a difference, a CI crossing 0 is not significant; for a ratio (relative risk, odds ratio), a CI crossing 1 is not significant. Statistical significance is not the same as clinical importance.</p>
`, {
  spot: `A table of numbers with a lead-in asking for PPV or NNT, or "which study design is most appropriate to investigate a rare condition?"`,
  trap: `Mixing PPV with sensitivity, or forgetting that a ratio CI must cross 1 (not 0) to be non-significant.`,
  src: `Oxford Centre for Evidence-Based Medicine levels of evidence; Cochrane Handbook (risk of bias); standard epidemiology texts.`
});

node('mgmt-ipc', 'mgmt', 'Infection control and decontamination', 'HTM 01-05: essential quality requirements versus best practice, the decontamination cycle, autoclave parameters and the testing schedule.', `
<p><b>HTM 01-05</b> (<i>Decontamination in primary care dental practices</i>, England, 2013 edition) has two levels:</p>
<ul>
<li><b>Essential quality requirements (EQR)</b>: the minimum every practice must meet. A washer-disinfector is the preferred cleaning method but is not essential: an ultrasonic bath or manual cleaning to a written protocol is acceptable, with inspection using a magnifier and task lighting. Instruments go through a validated steam steriliser, decontamination is separated from clinical work by physical or temporal means with a clean-to-dirty flow, the process is audited every six months, and the practice has a plan to move towards best practice.</li>
<li><b>Best practice (BP)</b>: practices should plan to move towards it. A dedicated decontamination room separate from the surgery, a validated washer-disinfector, and wrapped instrument storage away from the clinical area.</li>
</ul>
<p><b>The decontamination cycle:</b> acquisition, transport, cleaning, disinfection, inspection, packaging, sterilisation, transport, storage, use, then reuse or disposal. Inspect under illuminated magnification after cleaning. Single-use items (marked with a crossed-out 2) are never reprocessed. Endodontic files and reamers are treated as single use (single patient use) because of prion risk.</p>
<div class="scroll"><table class="t">
<tr><th>Item</th><th>Key figures and tests</th></tr>
<tr><td>Steam sterilisation cycle</td><td>134 to 138°C for a minimum of 3 minutes (HTM 01-05). The main text gives no single pressure figure: check the temperature, pressure and hold time your steriliser records against the manufacturer's specification.</td></tr>
<tr><td>Autoclave types</td><td>Type N (non-vacuum): solid unwrapped instruments only. Type B (vacuum): wrapped and hollow (lumened) instruments.</td></tr>
<tr><td>Daily (autoclave)</td><td>Automatic control test (record temperature, pressure, time); steam penetration test (Helix or Bowie-Dick) for vacuum autoclaves.</td></tr>
<tr><td>Weekly (autoclave)</td><td>Air leakage test (types B and S); residual air test (types N and S). The quarterly thermometric test and annual validation are done by a competent person or service engineer.</td></tr>
<tr><td>Washer-disinfector</td><td>Daily cycle checks; weekly protein residue test; quarterly thermometric test.</td></tr>
<tr><td>Ultrasonic bath</td><td>Daily checks; quarterly activity (foil ablation or soil) test.</td></tr>
<tr><td>Validation and inspection</td><td>Annual validation by a competent person; pressure vessel examination under a written scheme (Pressure Systems Safety Regulations 2000).</td></tr>
<tr><td>Dental unit waterlines</td><td>Flush at the start and end of the day and between patients; Legionella risk assessment.</td></tr>
</table></div>
<p><b>Hand hygiene.</b> Use the World Health Organization (WHO) 5 moments: before patient contact, before an aseptic task, after body fluid exposure risk, after patient contact, after touching patient surroundings. Bare below the elbows; remove hand and wrist jewellery (a single plain ring such as a wedding band is allowed but must be moved or removed for hand hygiene); short clean nails, no artificial nails or nail products. Alcohol hand rub for visibly clean hands; soap and water if hands are visibly soiled, and for outbreaks of Clostridioides difficile or norovirus (alcohol does not kill spores). Gloves are not a substitute for hand hygiene. Use a surgical scrub or surgical rub before surgical procedures.</p>
<p>Wales, Scotland and Northern Ireland have their own versions (for example WHTM 01-05 in Wales).</p>
`, {
  spot: `Stems about which test runs daily, which autoclave suits handpieces, whether a practice must have a washer-disinfector, or when to use soap rather than alcohol rub.`,
  trap: `Thinking a washer-disinfector or separate decontamination room is an essential requirement (they are best practice). Or putting wrapped or hollow items in a type N autoclave.`,
  src: `Department of Health HTM 01-05 Decontamination in primary care dental practices (2013 edition); WHO Guidelines on Hand Hygiene in Health Care (2009); National Infection Prevention and Control Manual for England.`,
  check: `Checked against the 2013 edition of HTM 01-05, which was still the edition on the NHS England website (page updated 26 January 2024): 134 to 138°C for at least 3 minutes; wrapped instruments stored up to 1 year, unwrapped up to 1 day in a clinical area or 1 week in a non-clinical area; dental unit waterlines flushed for at least 2 minutes at the start and end of the day and 20 to 30 seconds between patients. The text gives no single steriliser pressure. Check whether an updated edition has been published.`
});

node('mgmt-hs', 'mgmt', 'Health and safety, incidents and sharps', 'Run the sharps injury protocol, refer within the PEP window, check hepatitis B response, and know what RIDDOR and COSHH require.', `
<p><b>Sharps (inoculation) injury protocol.</b></p>
<ol>
<li>Stop work. Encourage the wound to bleed gently; do not suck or scrub.</li>
<li>Wash with soap and warm running water; cover with a waterproof dressing. Splashes to eyes or mouth: irrigate with water.</li>
<li>Tell the senior person. Identify the source patient and assess risk (known HIV, hepatitis B or C, injecting drug use). Ask the source for consent to a blood test; you cannot test without consent.</li>
<li>Contact occupational health or, out of hours, the emergency department <b>straight away</b>.</li>
<li>Record the incident, investigate, and check whether RIDDOR applies.</li>
</ol>
<div class="scroll"><table class="t">
<tr><th>Virus</th><th>Post-exposure action</th></tr>
<tr><td>HIV</td><td>Post-exposure prophylaxis (PEP) as soon as possible (do not delay), preferably within 24 hours and not beyond 72 hours; course of 28 days. Offered when the source is known to be HIV-positive with a detectable or unknown viral load. Generally not indicated if the source has been on treatment for at least 6 months with an undetectable viral load (decided case by case), and generally not recommended when the source's status is unknown unless there are extra risk factors.</td></tr>
<tr><td>Hepatitis B</td><td>Depends on the injured person's vaccine response: booster or accelerated course, plus hepatitis B immunoglobulin (HBIG) for known non-responders when the source is HBsAg-positive or of unknown status.</td></tr>
<tr><td>Hepatitis C</td><td>No PEP. Follow-up testing so early treatment can start if infection occurs.</td></tr>
</table></div>
<p><b>Hepatitis B vaccination response</b> (anti-HBs measured 1 to 2 months after the course):</p>
<ul>
<li><b>Responder</b>: anti-HBs 100 mIU/mL or more.</li>
<li><b>Low responder</b>: 10 to 99 mIU/mL; give one additional dose of vaccine (no further testing is needed).</li>
<li><b>Non-responder</b>: below 10 mIU/mL; test for current or past infection, repeat the course, and if still non-responsive give HBIG after any exposure.</li>
</ul>
<p>New staff who will perform exposure-prone procedures (EPPs) need health clearance for HIV, hepatitis B and hepatitis C.</p>
<p><b>RIDDOR 2013</b> (Reporting of Injuries, Diseases and Dangerous Occurrences Regulations). Report to the Health and Safety Executive (HSE): deaths and specified injuries (without delay, online or by phone; the report must be received within 10 days); injuries causing more than 7 days off normal work (within 15 days); occupational diseases; and dangerous occurrences. A sharps injury is reportable as a dangerous occurrence only if the source is known to carry a blood-borne virus; if the worker develops an infection it is reportable as a disease. Keep records of over-3-day injuries. RIDDOR 2013 applies in Great Britain; Northern Ireland has its own regulations (RIDDOR (NI) 1997, reported to HSENI).</p>
<p><b>COSHH 2002</b> (Control of Substances Hazardous to Health). Identify hazardous substances (mercury, disinfectants, acid etch, nitrous oxide, latex), read the safety data sheets, carry out and record a risk assessment, apply controls (eliminate, substitute, engineering controls, then personal protective equipment), train staff and review. Have a mercury spillage kit and clear spillage procedure.</p>
`, {
  spot: `A nurse with a needlestick from a patient with known hepatitis C, a staff member with anti-HBs of 50, or "which injury must be reported to HSE?"`,
  trap: `Waiting until the end of the session to report a sharps injury (PEP is time-critical). Or reporting every sharps injury under RIDDOR.`,
  src: `UKHSA Green Book chapter 18 (hepatitis B); BHIVA/UK guidance on PEP after occupational exposure; UKHSA integrated guidance on health clearance of healthcare workers; RIDDOR 2013 (HSE guidance); COSHH Regulations 2002.`,
  check: `Checked against Green Book chapter 18 (version dated 5 February 2026): immunocompetent healthcare workers who have responded to the course do not need routine boosters (the old five-yearly booster is no longer recommended), and a post-course anti-HBs test is read at 1 to 2 months. HIV PEP timing, 28-day duration and source criteria were checked against the BASHH/BHIVA 2021 guideline; check for any later update.`
});

node('mgmt-gov', 'mgmt', 'Clinical governance, audit and the NHS', 'Clinical governance pillars, the audit cycle and SEA; CQC in England; and the NHS dental contract with its UDA bands.', `
<p><b>Clinical governance</b> is the framework by which organisations are accountable for improving quality and keeping standards high. One commonly taught version has 7 pillars: clinical effectiveness, clinical audit, risk management, education and training, patient and public involvement, staffing and staff management, and information use (including openness).</p>
<p><b>The audit cycle</b> compares practice with a standard.</p>
<ol>
<li>Choose a topic (for example radiograph quality, record keeping, antibiotic prescribing).</li>
<li>Set the standard or criteria, ideally from guidance.</li>
<li>Collect data.</li>
<li>Compare with the standard.</li>
<li>Agree and put changes in place.</li>
<li>Re-audit to close the loop.</li>
</ol>
<p>Audit measures against a known standard; research creates new knowledge; a service evaluation describes current practice without a standard.</p>
<p><b>Significant event analysis (SEA)</b> is a structured team review of a single event (good or bad): record the facts, meet without blame, ask what happened and why, agree learning and actions, write it up and review later. Patient safety incidents in NHS care in England are recorded on the Learn from Patient Safety Events (LFPSE) service.</p>
<p><b>Care Quality Commission (CQC)</b> regulates providers of regulated activities in England, including all dental practices (NHS and private). It registers providers, inspects and enforces the fundamental standards. It asks five key questions: is the service <b>safe, effective, caring, responsive and well-led</b>? Check the CQC website for whether dental providers receive a rating. Other nations: Healthcare Inspectorate Wales (HIW), Healthcare Improvement Scotland and health boards, and the Regulation and Quality Improvement Authority (RQIA) in Northern Ireland.</p>
<p><b>NHS dental contract in England (2006)</b>. Practices agree a number of units of dental activity (UDAs) per year at a contract value.</p>
<div class="scroll"><table class="t">
<tr><th>Band</th><th>Includes</th><th>UDAs</th></tr>
<tr><td>Band 1</td><td>Examination, diagnosis, radiographs, scale and polish, preventive advice, fluoride varnish (from April 2026 a stand-alone fluoride varnish course by a dental nurse for children is a Band 1 course). Fissure sealants became Band 2 treatments from April 2026.</td><td>1</td></tr>
<tr><td>Band 2a</td><td>All Band 2 courses other than 2b and 2c (for example one or two fillings or extractions)</td><td>3</td></tr>
<tr><td>Band 2b</td><td>Non-molar root canal treatment on permanent teeth, or three or more teeth needing permanent fillings or extractions</td><td>5</td></tr>
<tr><td>Band 2c</td><td>Molar root canal treatment</td><td>7</td></tr>
<tr><td>Band 3</td><td>Crowns, bridges, dentures and other laboratory work</td><td>12</td></tr>
<tr><td>Urgent</td><td>Urgent treatment (a specified set of treatments)</td><td>1.2 until 31 March 2026. From 1 April 2026 replaced by a £75 payment per urgent course, or £15 fixed plus £60 per course for contractors with a required number of urgent treatments, converted to UDAs</td></tr>
</table></div>
<p>The Band 2 split was introduced in November 2022. Patients pay one charge per course of treatment at the highest band; exemptions include under-18s (and under-19s in full-time education), pregnant women and those who have had a baby in the last 12 months, and people on certain benefits. Wales, Scotland and Northern Ireland use different contracts and fee systems.</p>
`, {
  spot: `A practice reviewing its radiograph reject rate, a wrong-site extraction review, CQC key questions, or UDA values for a band.`,
  trap: `Calling a one-off data collection with no standard an "audit", or thinking CQC registers dentists (the GDC does; CQC registers the provider).`,
  src: `CQC guidance for dental providers and the single assessment framework; NHS (General Dental Services Contracts) Regulations 2005 and 2022 amendments; NHS England LFPSE guidance; FGDP(UK) Clinical Examination and Record-Keeping.`,
  check: `UDA values (1, 3, 5, 7, 12) and the Band 2 sub-bands were checked in the NHS England Digital dental statistics guidance; the April 2026 changes to fissure sealants, fluoride varnish and urgent care payments were checked in NHS England's contractual guidance for the quality and payment reforms (version 2, June 2026). Patient charge amounts change each April: take them from the NHS website. The CQC website could not be opened for this check, so confirm the five key questions and the position on dental ratings there. The 7-pillar list varies between sources.`
});

// MFDS Coach: SBA quiz, flashcards and sorting games.

QZ.push(

// ---------- Examination, diagnosis and records ----------
{ q: `A 58-year-old man who smokes 20 cigarettes a day has a painless ulcer on the left lateral border of his tongue. It has been present for 5 weeks, has a rolled, indurated margin and there is no traumatic cause. What is the most appropriate next step?`,
  opts: [`Refer using the suspected cancer pathway`, `Smooth the adjacent cusps and review in 3 weeks`, `Prescribe a topical corticosteroid and review in 2 weeks`, `Send a routine referral letter to oral medicine`, `Prescribe chlorhexidine mouthwash and review in 1 week`],
  ans: 0, why: `NICE NG12 (1.8.2): consider a suspected cancer pathway referral for unexplained oral ulceration lasting more than 3 weeks. With no traumatic cause, a rolled indurated margin and a high-risk site this is clearly the best option. Another review period, or a routine letter, delays diagnosis of a likely squamous cell carcinoma.`, th: ['exam-onc'] },

{ q: `A 52-year-old woman has type 2 diabetes controlled with metformin. Her diabetes is well controlled and she has no other medical problems and no functional limitation. What is her American Society of Anesthesiologists (ASA) physical status?`,
  opts: [`ASA I`, `ASA II`, `ASA III`, `ASA IV`, `ASA V`],
  ans: 1, why: `Well-controlled diabetes without functional limitation is mild systemic disease: ASA II. ASA III would need severe systemic disease, such as poorly controlled diabetes with complications.`, th: ['exam-hx'] },

{ q: `A 7-year-old boy attends with his stepfather. You notice bruising on both ears and finger-shaped bruises on the side of his neck. The stepfather says he fell off his bike. What is the most appropriate action?`,
  opts: [`Record the findings and review at the next recall`, `Ask the stepfather to bring the child back with his mother`, `Refer to children's social care the same day, following the local safeguarding procedure`, `Write a routine letter to the child's GP`, `Tell the stepfather you suspect abuse and will call the police`],
  ans: 2, why: `Bruising to the ears and neck with an implausible explanation is a recognised sign of physical abuse. Follow local safeguarding procedures and refer to children's social care the same day (discussing with the practice safeguarding lead). Confronting the carer may put the child at greater risk.`, th: ['exam-safeg'] },

{ q: `A 66-year-old woman has a painless 1.5 cm speckled red and white patch on the floor of her mouth. She had not noticed it. What is the most appropriate management?`,
  opts: [`Review at her next 6-month recall`, `Prescribe miconazole gel and review in 2 weeks`, `Send a routine referral to oral medicine`, `Refer using the suspected cancer pathway`, `Photograph the lesion and review in 3 months`],
  ans: 3, why: `NICE NG12 (1.8.4): a dentist should consider a suspected cancer pathway referral for a red, or red and white, patch consistent with erythroplakia or erythroleukoplakia. The floor of mouth is a high-risk site, so watchful waiting or a routine letter is not appropriate.`, th: ['exam-onc', 'omed-white'] },

// ---------- Radiography ----------
{ q: `A 34-year-old man has three new carious lesions and is assessed as high caries risk. Posterior bitewings were taken today. According to FGDP(UK) Selection Criteria for Dental Radiography, when should bitewings next be considered?`,
  opts: [`24 months`, `18 months`, `12 months`, `3 months`, `6 months`],
  ans: 4, why: `FGDP(UK) selection criteria: high caries risk, bitewings at 6-month intervals until risk falls. Moderate risk is 12 months; low-risk adults 24 months.`, th: ['rad-sel'] },

{ q: `A 24-year-old woman needs removal of her lower right third molar after recurrent pericoronitis. The panoramic radiograph shows darkening of the roots where they cross the inferior alveolar canal and interruption of the white lines of the canal. What is the most appropriate next step?`,
  opts: [`Take a cone beam CT (CBCT) scan of the area`, `Proceed with surgical removal without further imaging`, `Take a bitewing radiograph`, `Take a lateral cephalometric radiograph`, `Repeat the panoramic radiograph in 6 months`],
  ans: 0, why: `Darkening of the root and interruption of the canal's white lines suggest a close relationship with the inferior alveolar nerve. The panoramic radiograph cannot show this reliably. FGDP(UK) advises a second radiograph with different projection geometry or, if available, a localised CBCT when the result is likely to change surgical management (for example coronectomy or modified consent). Of the options listed, CBCT is the best.`, th: ['rad-sel', 'surg-m3m'] },

{ q: `A 16-year-old boy has an unerupted lower left third molar. A panoramic radiograph shows a well-defined unilocular radiolucency surrounding the crown and attached at the cemento-enamel junction. What is the most likely diagnosis?`,
  opts: [`Radicular cyst`, `Dentigerous cyst`, `Ameloblastoma`, `Stafne bone cavity`, `Lateral periodontal cyst`],
  ans: 1, why: `A unilocular radiolucency around the crown of an unerupted tooth, attached at the cemento-enamel junction, is the classic dentigerous cyst. A radicular cyst is at the apex of a non-vital tooth.`, th: ['rad-interp', 'omed-cyst'] },

{ q: `A 35-year-old man has a slowly enlarging, painless swelling of the right posterior mandible. Radiographs show a multilocular "soap-bubble" radiolucency with buccal and lingual expansion and resorption of the adjacent molar roots. What is the most likely diagnosis?`,
  opts: [`Odontogenic keratocyst`, `Radicular cyst`, `Ameloblastoma`, `Simple bone cyst`, `Cemento-osseous dysplasia`],
  ans: 2, why: `Multilocular radiolucency, marked expansion and root resorption in the posterior mandible point to ameloblastoma. An odontogenic keratocyst tends to grow along the bone with little expansion and rarely resorbs roots.`, th: ['rad-interp', 'omed-cyst'] },

// ---------- Prevention ----------
{ q: `An 11-year-old girl has active caries in three teeth and is assessed as high caries risk. According to Delivering Better Oral Health (DBOH) v4, which toothpaste should be prescribed?`,
  opts: [`1,000 ppm fluoride`, `1,350 ppm fluoride`, `1,450 ppm fluoride`, `2,800 ppm fluoride`, `5,000 ppm fluoride`],
  ans: 3, why: `DBOH: children aged 10 and over at high caries risk can be prescribed 2,800 ppm toothpaste. 5,000 ppm is for those aged 16 and over.`, th: ['prev-dboh'] },

{ q: `A 4-year-old boy with no caries and low caries risk attends for a check-up. According to DBOH v4, how often should fluoride varnish (22,600 ppm) be applied?`,
  opts: [`Not indicated, as he is low risk`, `Once a year`, `Every 3 months`, `Every month`, `Twice a year`],
