/* ============ TOOLS: interactive calculators, charts and walk-through flowcharts ============
   Facts used here (TD) are filled from the verified sources; each tool shows its source keys.
   SOURCES / NODE_SOURCES / LEDGER come from content/sources.js (built from the verification ledgers). */

const SOURCES = (typeof SRC_DATA !== 'undefined' ? SRC_DATA.sources : {});
const NODE_SOURCES = (typeof SRC_DATA !== 'undefined' ? SRC_DATA.nodeSources : {});
const LEDGER = (typeof SRC_DATA !== 'undefined' ? SRC_DATA.ledger : {});
function srcLinks(keys) {
  const k = (keys || []).filter(x => SOURCES[x]);
  if (!k.length) return '';
  return k.map(x => `<a class="srclink" href="${SOURCES[x].url}" target="_blank" rel="noopener">${SOURCES[x].label}</a>`).join('');
}
function verifyBadge(loc) {
  const st = (typeof SRC_DATA !== 'undefined' && SRC_DATA.stats) ? SRC_DATA.stats[loc] : null;
  if (st) {
    const ok = st[0] + st[1], tot = ok + st[2];
    return `<span class="vbadge ${st[2] ? 'u' : 'v'}" title="Claims in this lesson compared with the primary source">${ok} of ${tot} claims checked${st[1] ? ', ' + st[1] + ' corrected' : ''}${st[2] ? ', ' + st[2] + ' unconfirmed' : ''}</span>`;
  }
  const e = LEDGER[loc];
  if (!e) return '<span class="vbadge u" title="No primary-source check recorded">Not yet checked</span>';
  if (e === 'verified') return '<span class="vbadge v" title="Checked against the primary source">Checked against source</span>';
  if (e === 'corrected') return '<span class="vbadge c" title="Corrected after checking the primary source">Corrected after check</span>';
  return '<span class="vbadge u" title="Could not be confirmed in a primary source">Unconfirmed: check</span>';
}

/* ---------- walk-through flowcharts ---------- */
const walk = {};
function walkStart(id) { const f = FLOWS.find(x => x.id === id); walk[id] = { todo: f.steps.slice(), shown: [], ask: null }; walkAdvance(id); }
function walkAdvance(id) {
  const w = walk[id];
  while (w.todo.length) {
    const s = w.todo.shift();
    if (s.branches) { w.ask = s; return; }
    w.shown.push(s);
  }
  w.ask = null;
}
function walkHTML(id) {
  const w = walk[id];
  const nodes = w.shown.map((s, i) => (i ? '<div class="farrow"></div>' : '') + `<div class="fnode ${s.k}">${s.text}</div>`).join('');
  const ask = w.ask ? `${w.shown.length ? '<div class="farrow"></div>' : ''}<div class="walkask"><p>Which applies?</p><div class="rowbtns" style="margin:6px 0 0;justify-content:center">${w.ask.branches.map((b, i) => `<button class="btn primary" data-wb="${i}">${b.lab}</button>`).join('')}</div></div>` : '<p class="walkend">End of this path.</p>';
  return `<div class="flow">${nodes}${ask}</div><div class="rowbtns" style="justify-content:center"><button class="btn" data-wreset="1">Start again</button></div>`;
}
function bindWalk(box, id) {
  const paint = () => {
    box.innerHTML = walkHTML(id);
    box.querySelectorAll('[data-wb]').forEach(b => b.onclick = () => { const w = walk[id]; const br = w.ask.branches[+b.dataset.wb]; w.shown.push({ k: 'pick', text: br.lab }); w.todo = br.steps.slice().concat(w.todo); walkAdvance(id); paint(); });
    box.querySelector('[data-wreset]').onclick = () => { walkStart(id); paint(); };
  };
  walkStart(id); paint();
}

/* ---------- progress dashboard ---------- */
function progressData() {
  const secs = N.clin.kids.map(k => ({ id: k, name: shortName(N[k]) })).concat(['comm', 'prof', 'mgmt'].map(k => ({ id: k, name: shortName(N[k]) })));
  return secs.map(s => {
    const ls = leaves(s.id), ld = ls.filter(i => done[i]).length;
    const qs = QZ.filter(q => (q.th || []).some(t => path(t).includes(s.id)));
    const tried = qs.filter(q => qres[qkey(q)] !== undefined), right = tried.filter(q => qres[qkey(q)]);
    return { name: s.name, id: s.id, lessons: ls.length, lessonsDone: ld, qs: qs.length, tried: tried.length, right: right.length };
  });
}
function progressViz() {
  const d = progressData();
  const tot = d.reduce((a, x) => a + x.lessons, 0), dn = d.reduce((a, x) => a + x.lessonsDone, 0);
  const R = 42, C = 2 * Math.PI * R, frac = tot ? dn / tot : 0;
  const rows = d.map(x => {
    const acc = x.tried ? x.right / x.tried : null;
    const col = acc === null ? 'var(--line)' : acc >= .75 ? 'var(--good)' : acc >= .5 ? 'var(--gold)' : 'var(--bad)';
    return `<a class="prow" href="#n-${x.id}" title="Open ${x.name}"><span class="pname">${x.name}</span>
      <span class="pbar" aria-label="${x.name}: ${x.tried} of ${x.qs} questions tried"><i class="pt" style="width:${x.qs ? x.tried / x.qs * 100 : 0}%"></i><i class="pr" style="width:${x.qs ? x.right / x.qs * 100 : 0}%;background:${col}"></i></span>
      <span class="pnum">${acc === null ? '–' : Math.round(acc * 100) + '%'}</span></a>`;
  }).join('');
  return `<div class="pviz"><div class="ring"><svg viewBox="0 0 100 100" role="img" aria-label="Lessons done: ${dn} of ${tot}"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--accent-soft)" stroke-width="10"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${dn}/${tot}</text><text x="50" y="64" text-anchor="middle" font-size="9" fill="var(--muted)">lessons</text></svg></div>
  <div class="pbars"><p class="eyebrow" style="margin:0 0 6px">SBA accuracy by section (faint = tried, solid = correct)</p>${rows}</div></div>`;
}

/* ---- Stage and grade ---- */
const stSt = { loss: 20, age: 45, teeth: 0, complex: false };
function toolStage() {
  const s = stSt;
  let stage = s.loss < 15 ? 'I' : s.loss <= 33 ? 'II' : (s.teeth >= 5 || s.complex) ? 'IV' : 'III';
  const ratio = s.age ? s.loss / s.age : 0;
  const grade = ratio < 0.25 ? 'A' : ratio <= 1 ? 'B' : 'C';
  const why = s.loss < 15 ? 'Bone loss under 15% at the worst site.' : s.loss <= 33 ? 'Bone loss reaches the coronal third.' : (s.teeth >= 5 || s.complex) ? 'Bone loss reaches the middle third or beyond, and there is tooth loss or complexity that moves it from stage III to IV.' : 'Bone loss reaches the middle third or beyond, with fewer than 5 teeth lost to periodontitis and no complexity factors.';
  const marker = Math.min(100, s.loss);
  app.innerHTML = toolShell('stage', `
    <div class="slrow"><label for="sl1">Worst-site radiographic bone loss: <b>${s.loss}%</b> of root length</label><input type="range" id="sl1" min="0" max="100" value="${s.loss}"></div>
    <div class="slrow"><label for="sl2">Age: <b>${s.age}</b></label><input type="range" id="sl2" min="15" max="90" value="${s.age}"></div>
    <div class="slrow"><label for="sl3">Teeth lost to periodontitis: <b>${s.teeth}</b></label><input type="range" id="sl3" min="0" max="12" value="${s.teeth}"></div>
    <label class="chk"><input type="checkbox" id="sl4" ${s.complex ? 'checked' : ''}> Complexity factors (for example masticatory dysfunction, bite collapse)</label>
    <div class="rootbar" aria-hidden="true"><div class="seg">Coronal third</div><div class="seg">Middle third</div><div class="seg">Apical third</div><i style="left:${marker}%"></i></div>

      <div class="fact"><span>Grade</span><b>${grade}</b><span>Bone loss % divided by age = ${ratio.toFixed(2)}. A under 0.25, B 0.25 to 1.0, C over 1.0.</span></div>

/* ---- Statistics lab ---- */
const sSt = { prev: 10, sens: 90, spec: 80 };
function toolStats() {
  const N1 = 1000, dis = Math.round(N1 * sSt.prev / 100), hl = N1 - dis;
  const tp = Math.round(dis * sSt.sens / 100), fn = dis - tp, tn = Math.round(hl * sSt.spec / 100), fp = hl - tn;
  const ppv = tp + fp ? tp / (tp + fp) : 0, npv = tn + fn ? tn / (tn + fn) : 0;
  const dots = []; for (let i = 0; i < tp; i++) dots.push('tp'); for (let i = 0; i < fn; i++) dots.push('fn'); for (let i = 0; i < fp; i++) dots.push('fp'); for (let i = 0; i < tn; i++) dots.push('tn');
  app.innerHTML = toolShell('stats', `
    <div class="slrow"><label for="s1">Prevalence of the disease: <b>${sSt.prev}%</b></label><input type="range" id="s1" min="1" max="60" value="${sSt.prev}"></div>
    <div class="slrow"><label for="s2">Sensitivity: <b>${sSt.sens}%</b></label><input type="range" id="s2" min="50" max="100" value="${sSt.sens}"></div>
    <div class="slrow"><label for="s3">Specificity: <b>${sSt.spec}%</b></label><input type="range" id="s3" min="50" max="100" value="${sSt.spec}"></div>
    <div class="dotgrid" role="img" aria-label="1000 people: ${tp} true positive, ${fp} false positive, ${fn} false negative, ${tn} true negative">${dots.map(c => `<i class="${c}"></i>`).join('')}</div>
    <div class="legend"><span><i class="tp"></i>True positive ${tp}</span><span><i class="fp"></i>False positive ${fp}</span><span><i class="fn"></i>False negative ${fn}</span><span><i class="tn"></i>True negative ${tn}</span></div>
    <div class="scroll"><table class="t"><tr><th></th><th>Disease present</th><th>Disease absent</th></tr><tr><td><b>Test positive</b></td><td>${tp} (TP)</td><td>${fp} (FP)</td></tr><tr><td><b>Test negative</b></td><td>${fn} (FN)</td><td>${tn} (TN)</td></tr></table></div>
    <div class="grid2"><div class="fact"><span>Positive predictive value</span><b>${(ppv * 100).toFixed(0)}%</b><span>TP ÷ (TP + FP) = ${tp} ÷ ${tp + fp}</span></div><div class="fact"><span>Negative predictive value</span><b>${(npv * 100).toFixed(0)}%</b><span>TN ÷ (TN + FN) = ${tn} ÷ ${tn + fn}</span></div></div>
    <p style="color:var(--muted);font-size:.95rem">Sensitivity = TP ÷ (TP + FN) = ${tp} ÷ ${tp + fn}. Specificity = TN ÷ (TN + FP) = ${tn} ÷ ${tn + fp}. Lower the prevalence and watch the positive predictive value fall while sensitivity and specificity stay the same.</p>`, ['arithmetic', 'cebm'], '');
  [['s1', 'prev'], ['s2', 'sens'], ['s3', 'spec']].forEach(([i, k]) => document.getElementById(i).oninput = e => { sSt[k] = +e.target.value; toolStats(); document.getElementById(i).focus(); });
}

  app.innerHTML = toolShell('sim', `<section class="panel"><p class="eyebrow">${sc.t} · step ${simSt.step + 1} of ${sc.steps.length}</p><div class="scenario">${simSt.step === 0 ? sc.intro : ''}<p><b>${st.situation}</b></p></div>
    <div class="opts" style="margin-top:12px">${st.opts.map((o, i) => `<button class="opt" data-so="${i}"><span class="L">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div><div id="sfb2"></div></section>`, TD.simSrc, TD.simCheck);
  app.querySelectorAll('[data-so]').forEach(b => b.onclick = () => {
    const o = st.opts[+b.dataset.so], best = st.opts.findIndex(x => x.best);
    app.querySelectorAll('[data-so]').forEach(x => { x.disabled = true; if (+x.dataset.so === best) x.classList.add('right'); });
    if (!o.best) b.classList.add('wrong'); else simSt.score++;
    simSt.log.push(`${st.situation} → ${st.opts[best].t}`);
    document.getElementById('sfb2').innerHTML = `<div class="feedback ${o.best ? 'ok' : 'no'}"><p><b>${o.best ? 'Best choice.' : 'Not the best choice.'}</b> ${o.why}</p></div><div class="rowbtns"><button class="btn primary" id="sn">${simSt.step < sc.steps.length - 1 ? 'Next step' : 'Finish'}</button></div>`;
    document.getElementById('sn').onclick = () => { simSt.step++; toolSim(); };
  });
}

/* ---- SBA quiz ---- */
let quizFilter = 'all', quizShuffle = false, quizState = null;
function quizPool() {
  let idx = QZ.map((_, i) => i);
  if (quizFilter.startsWith('node:')) { const id = quizFilter.slice(5); idx = idx.filter(i => (QZ[i].th || []).includes(id)); }
  else if (quizFilter === 'wrong') idx = idx.filter(i => qres[qkey(QZ[i])] === false);
  else if (quizFilter === 'new') idx = idx.filter(i => qres[qkey(QZ[i])] === undefined);
  else if (quizFilter !== 'all') idx = idx.filter(i => (QZ[i].th || []).some(t => sectionOf(t) === quizFilter || path(t)[1] === quizFilter));
  if (quizShuffle) for (let k = idx.length - 1; k > 0; k--) { const r = Math.floor(Math.random() * (k + 1)); [idx[k], idx[r]] = [idx[r], idx[k]]; }
  return idx;
}
function resetQuiz() { quizState = { pool: quizPool(), i: 0, score: 0, missed: [], t0: Date.now() }; }
function filterOptions() {
  const secs = N.clin.kids.map(k => [k, 'Clinical: ' + shortName(N[k])]);
  const tops = ['comm', 'prof', 'mgmt'].filter(k => N[k]).map(k => [k, shortName(N[k])]);
  const opts = [['all', 'All topics'], ['new', 'Questions I have not tried'], ['wrong', 'Questions I got wrong last time'], ['clin', 'All clinical']].concat(secs, tops);
  if (quizFilter.startsWith('node:')) opts.push([quizFilter, 'Lesson: ' + shortName(N[quizFilter.slice(5)])]);
  return opts.map(([v, l]) => `<option value="${v}"${v === quizFilter ? ' selected' : ''}>${l}</option>`).join('');
}
function renderQuiz() {
  if (!quizState) resetQuiz();
  const s = quizState;
  const tools = `<div class="qtools"><select id="qf" aria-label="Choose topic">${filterOptions()}</select>
    <label><input type="checkbox" id="qs" ${quizShuffle ? 'checked' : ''}> Shuffle</label>
    <button class="btn" id="qr">Restart</button></div>`;
  const bindTools = () => {
    document.getElementById('qf').onchange = ev => { quizFilter = ev.target.value; resetQuiz(); renderQuiz(); };
    document.getElementById('qs').onchange = ev => { quizShuffle = ev.target.checked; resetQuiz(); renderQuiz(); };
    document.getElementById('qr').onclick = () => { resetQuiz(); renderQuiz(); };
  };
  if (!s.pool.length) {
    app.innerHTML = `<p class="eyebrow">SBA practice</p>${tools}<section class="panel qcard" style="max-width:760px"><p>No questions match this choice yet. Pick another topic.</p></section>`;
    return bindTools();
  }
  if (s.i >= s.pool.length) {
    const n = s.pool.length, pct = Math.round(s.score / n * 100), secs = Math.round((Date.now() - s.t0) / 1000 / n);
    app.innerHTML = `<p class="eyebrow">SBA practice</p>${tools}<section class="panel qcard" style="max-width:760px"><p class="score">${s.score} / ${n} (${pct}%)</p>
    <p>Average time: <b>${secs} seconds</b> a question. The real paper allows about 72.</p>
    <p>${pct >= 75 ? 'Strong. Move on to a timed mixed set, or a topic you have not tried.' : 'Open the gold links on the questions you missed, re-read each exam trap, then try the ones you got wrong again.'}</p>
    <p style="color:var(--muted);font-size:.95rem">RCS England sets the pass mark for each paper by standard setting, so there is no fixed percentage. Aim to score well above 70% here before the exam.</p>
    ${s.missed.length ? `<h3 style="margin-top:14px">You missed</h3><ul>${s.missed.map(i => `<li>${QZ[i].q.slice(0, 110)}... ${chips(QZ[i].th)}</li>`).join('')}</ul>` : ''}
    <div class="rowbtns"><button class="btn primary" id="again">Start again</button>${s.missed.length ? '<button class="btn" id="retry">Retry the ones I missed</button>' : ''}</div></section>`;
    bindTools();
    document.getElementById('again').onclick = () => { resetQuiz(); renderQuiz(); };
    const rt = document.getElementById('retry'); if (rt) rt.onclick = () => { quizState = { pool: s.missed.slice(), i: 0, score: 0, missed: [], t0: Date.now() }; renderQuiz(); };
    return;
  }
  const qi = s.pool[s.i], q = QZ[qi];
  app.innerHTML = `<p class="eyebrow">SBA practice</p>${tools}
  <section class="panel qcard" style="max-width:760px">
    <div class="qhead"><span>Question ${s.i + 1} of ${s.pool.length}</span><span>Score ${s.score}</span></div>
    <p class="qtext" style="font-size:1.08rem;font-weight:400">${q.q}</p>
    <div class="opts">${q.opts.map((o, j) => `<button class="opt" data-o="${j}"><span class="L">${L5[j]}</span><span>${o}</span></button>`).join('')}</div>
    <div id="fb"></div></section>`;
  bindTools();
  app.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const j = +b.dataset.o, ok = j === q.ans;
    if (ok) s.score++; else s.missed.push(qi);
    qres[qkey(q)] = ok; store.set('qres', qres);
    app.querySelectorAll('[data-o]').forEach(x => { x.disabled = true; if (+x.dataset.o === q.ans) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    document.getElementById('fb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><p><b>${ok ? 'Correct.' : 'Not quite. The answer is ' + L5[q.ans] + '.'}</b> ${q.why}</p>${(q.th || []).length ? `<p>Read more: ${chips(q.th)}</p>` : ''}<p style="font-size:.88rem;color:var(--muted)">${verifyBadge('qz:' + qi)} ${srcLinks([].concat(...(q.th || []).map(t => NODE_SOURCES[t] || [])).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3))}</p></div><div class="rowbtns"><button class="btn primary" id="next">${s.i < s.pool.length - 1 ? 'Next question' : 'See my score'}</button></div>`;
    document.getElementById('next').onclick = () => { s.i++; renderQuiz(); };
  });
}

      <button class="flash${flashFlip ? ' back' : ''}" id="flash"><span class="eyebrow">${flashFlip ? 'Answer' : 'Question'}</span><span class="ftext">${flashFlip ? c.b : c.f}</span></button>

      ${card ? `<p style="margin:12px 0 6px;color:var(--muted)">${g.prompt} Card ${sortI + 1} of ${g.cards.length} · Score ${sortScore}</p>
        <div class="sortcard">${card.text}</div>
        <div class="bins">${g.bins.map((b, j) => `<button class="btn bin" data-b="${j}">${b}</button>`).join('')}</div><div id="sfb"></div>`
      : `<p class="score" style="margin-top:12px">${sortScore} / ${g.cards.length}</p><button class="btn primary" id="sagain">Play again</button>`}
    </section>` : ''}
  </div>`;
  const f = document.getElementById('flash');

    document.getElementById('fprev').onclick = () => { flashI = (flashI - 1 + FLASH.length) % FLASH.length; flashFlip = false; renderGames(); };
    document.getElementById('fshuf').onclick = () => { FLASH.sort(() => Math.random() - 0.5); flashI = 0; flashFlip = false; renderGames(); };
  }
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { sortG = +b.dataset.g; sortI = 0; sortScore = 0; renderGames(); });
  const again = document.getElementById('sagain'); if (again) again.onclick = () => { sortI = 0; sortScore = 0; renderGames(); };
  app.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    const ok = +b.dataset.b === card.bin; if (ok) sortScore++;
    app.querySelectorAll('[data-b]').forEach(x => { x.disabled = true; if (+x.dataset.b === card.bin) x.classList.add('done'); });
    document.getElementById('sfb').innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><p><b>${ok ? 'Correct.' : 'Not quite. It is ' + g.bins[card.bin] + '.'}</b> ${card.why}</p>${(card.th || []).length ? `<p>Read more: ${chips(card.th)}</p>` : ''}</div><div class="rowbtns"><button class="btn primary" id="snext">Next card</button></div>`;
    document.getElementById('snext').onclick = () => { sortI++; renderGames(); };
  });
}

  };
  document.getElementById('treset').onclick = () => { stopTimer(); timerLeft = 600; paint(); go.textContent = 'Start 10 minutes'; };
  document.getElementById('ract').onclick = () => { document.getElementById('actor').hidden = false; };
  document.getElementById('rall').onclick = () => { document.getElementById('model').hidden = false; document.getElementById('model').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const ms = () => { const n = Object.values(ticked).filter(Boolean).length; document.getElementById('mscore').textContent = `${n} of ${o.marks.length} points ticked.`; };
  ms();
  app.querySelectorAll('[data-m]').forEach(c => c.onchange = () => { ticked[c.dataset.m] = c.checked; store.set('om-' + id, ticked); ms(); });
  app.querySelectorAll('[data-os]').forEach(b => b.onclick = () => location.hash = 'o-' + b.dataset.os);
  document.getElementById('mark').onclick = () => { done['o-' + id] = !done['o-' + id]; store.set('done', done); renderOsce(id); };
}

/* ---- Plan ---- */
function renderPlan() {
  app.innerHTML = `<p class="eyebrow">Study plan</p><h1 style="font-size:2rem;margin:4px 0 8px">Four weeks, safety first</h1>
  <p class="lede">Week 1 covers the rule-based safety topics that turn up across every specialty. Weeks 2 and 3 work through the specialties and the professional topics. Week 4 is timed practice. Ticks are saved in this browser.</p>
  <div class="days">${PLAN.map((d, di) => `<section class="panel day"><h3>${d.d}</h3><p class="hrs">${d.hrs}</p><ul>${d.items.map((it, ii) => { const k = di + '-' + ii; return `<li><label><input type="checkbox" data-k="${k}" ${planDone[k] ? 'checked' : ''}><span>${it}</span></label></li>`; }).join('')}</ul></section>`).join('')}</div>
  <section class="panel day" style="margin-top:16px;max-width:640px"><h3>Only a few days left?</h3><p class="hrs">Do these, in this order</p><ul>${CRASH.map((it, ii) => { const k = 'c-' + ii; return `<li><label><input type="checkbox" data-k="${k}" ${planDone[k] ? 'checked' : ''}><span>${it}</span></label></li>`; }).join('')}</ul></section>`;
  app.querySelectorAll('input[data-k]').forEach(c => c.onchange = () => { planDone[c.dataset.k] = c.checked; store.set('plan', planDone); });
}

route();
</script>
