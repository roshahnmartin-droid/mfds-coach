node('omed', 'clin', 'Oral medicine and pathology', `Ulcers, white and red patches, jaw cysts and tumours, facial pain and salivary disease: recognise the pattern, investigate sensibly, refer at the right speed.`, `
<p>Oral medicine SBAs are pattern recognition. The stem gives you age, site, duration and one or two key features. You name the condition, then choose the test or the referral.</p>
<ul>
<li><a href="#n-omed-ulcer">Ulcers and blistering disease</a>: recurrent aphthous stomatitis, primary herpes, pemphigus versus mucous membrane pemphigoid, lichen planus, haematinics.</li>
<li><a href="#n-omed-white">White and red patches</a>: leukoplakia, erythroplakia and malignant transformation risk.</li>
<li><a href="#n-omed-cyst">Cysts and tumours of the jaws</a>: radicular, dentigerous, odontogenic keratocyst, ameloblastoma, giant cell lesions and bone disease.</li>
<li><a href="#n-omed-pain">Orofacial pain and TMD</a>: trigeminal neuralgia, temporomandibular disorders, burning mouth, giant cell arteritis.</li>
<li><a href="#n-omed-saliv">Salivary glands and dry mouth</a>: mucocele, ranula, stones, Sjögren's and tumours.</li>
</ul>
<p>Urgent cancer referral rules are in <a href="#n-exam-onc">oral cancer</a>, and radiographic description in <a href="#n-rad-interp">reading radiographs</a>.</p>
`, {
  src: `NICE NG12 Suspected cancer (with updates); NICE Clinical Knowledge Summaries (aphthous ulcer, trigeminal neuralgia, giant cell arteritis); WHO Classification of Head and Neck Tumours (5th ed, 2022); British Society for Oral Medicine (BSOM) guidance.`,
  spot: `A described lesion with age, site, duration and one distinguishing feature.`,
  trap: `Missing the referral urgency: an unexplained ulcer over 3 weeks should prompt a suspected cancer pathway referral, not routine review (SDCEP says any ulcer lasting over 3 weeks must be referred for biopsy); a red patch or lump needs urgent assessment or referral. NG12 words all of these as "consider".`
});

node('omed-ulcer', 'omed', 'Ulcers and blistering disease', `RAS comes in minor, major and herpetiform types; screen haematinics and coeliac serology. Pemphigus splits within the epithelium; pemphigoid splits beneath it.`, `
<p><b>Recurrent aphthous stomatitis (RAS)</b> starts in childhood or adolescence. Ulcers are round, with a yellow-grey base and red halo, on non-keratinised mucosa.</p>
<div class="scroll"><table class="t">
<tr><th>Type</th><th>Size and number</th><th>Healing</th></tr>
<tr><td>Minor (about 80%)</td><td>Under 10 mm, a few at a time</td><td>7 to 14 days, no scar</td></tr>
<tr><td>Major</td><td>Over 10 mm; can affect keratinised mucosa, soft palate, fauces</td><td>About 10 days to 6 weeks, occasionally longer; often scars</td></tr>
<tr><td>Herpetiform</td><td>Many (up to 100) pinpoint 1 to 2 mm ulcers that merge</td><td>About 1 to 2 weeks</td></tr>
</table></div>
<p><b>Haematinic screen:</b> full blood count, ferritin, vitamin B12 and folate. Add coeliac serology (tissue transglutaminase IgA with total IgA). Ask about bowel symptoms (Crohn's, coeliac), genital ulcers and eye symptoms (Behçet's), and fevers (periodic fever, aphthous stomatitis, pharyngitis and adenitis (PFAPA) syndrome in children). Manage with chlorhexidine or benzydamine for symptoms, and topical corticosteroids (for example hydrocortisone mucoadhesive buccal tablets, or a betamethasone mouthwash). Refer if atypical, severe or systemic features.</p>
<p><b>Primary herpetic gingivostomatitis</b> (herpes simplex virus type 1): usually a child aged 6 months to 5 years. Fever, malaise, cervical lymphadenopathy, acute gingivitis and vesicles that rupture into ulcers on both keratinised and non-keratinised mucosa. Self-limiting in 10 to 14 days. Manage with fluids, rest, paracetamol or ibuprofen and soft diet. Aciclovir is for the immunocompromised or severe, early cases. Recurrence is herpes labialis.</p>
<p><b>Pemphigus versus mucous membrane pemphigoid</b></p>
<div class="scroll"><table class="t">
<tr><th></th><th>Pemphigus vulgaris</th><th>Mucous membrane pemphigoid (MMP)</th></tr>
<tr><td>Split</td><td>Intraepithelial (suprabasal), acantholysis</td><td>Subepithelial</td></tr>
<tr><td>Target</td><td>Desmoglein 3 (and 1)</td><td>Basement membrane proteins (BP180, laminin 332)</td></tr>
<tr><td>Direct immunofluorescence</td><td>Intercellular IgG, "chicken wire"</td><td>Linear IgG and C3 at the basement membrane</td></tr>
<tr><td>Clinical</td><td>Middle age; fragile blisters rarely seen intact; ragged erosions; skin often involved; Nikolsky positive</td><td>Older women; intact, sometimes blood-filled blisters; desquamative gingivitis; scarring</td></tr>
<tr><td>Key risk</td><td>Life-threatening without systemic treatment</td><td>Eye scarring (symblepharon) and blindness: refer to ophthalmology</td></tr>
</table></div>
<p>Biopsy: perilesional tissue for histology in formalin, plus a separate sample for direct immunofluorescence sent fresh (in saline, if it reaches the laboratory within about 24 hours) or in Michel's medium, never in formalin. For suspected oral pemphigus the British Association of Dermatologists guideline takes the immunofluorescence sample from an uninvolved area, ideally the buccal mucosa; follow your laboratory's protocol for pemphigoid. Serum for indirect immunofluorescence helps in pemphigus.</p>
<p><b>Oral lichen planus (OLP):</b> bilateral white lacy striae (Wickham's striae) on the buccal mucosa, with reticular, plaque, atrophic and erosive forms, and desquamative gingivitis. Histology: band-like T-cell infiltrate and basal cell degeneration. A unilateral lesion next to an amalgam, or one starting after a new drug (for example non-steroidal anti-inflammatory drugs, beta-blockers, antimalarials), suggests a lichenoid reaction. OLP is an oral potentially malignant disorder: biopsy if atypical and review long term (see <a href="#n-omed-white">white patches</a>).</p>
`, {
  spot: `Recurrent small ulcers since school with a low ferritin (RAS); a febrile toddler with gingivitis and ulcers (primary herpes); an older woman with peeling gums and a gritty eye (MMP).`,
  trap: `Sending the immunofluorescence biopsy in formalin; or mixing up the split level (pemphigus is intraepithelial, pemphigoid is subepithelial).`,
  src: `NICE CKS Aphthous ulcer; NICE CKS Herpes simplex (oral); SDCEP Drug Prescribing for Dentistry; BSOM guidance on vesiculobullous disease.`,
  check: `Confirm topical steroid preparations and doses, and the aciclovir regimen, in the current BNF and SDCEP Drug Prescribing for Dentistry.`
});

node('omed-white', 'omed', 'White and red patches; potentially malignant disorders', `Erythroplakia carries the highest malignant risk; dysplasia grade is the strongest predictor. A red or red-and-white patch should prompt a suspected cancer pathway referral (NG12 says "consider").`, `
<p><b>Definitions (WHO).</b> Leukoplakia is a white plaque of questionable risk once other definable conditions have been excluded. Erythroplakia is a red patch that cannot be characterised as another condition. Both are oral potentially malignant disorders (OPMDs). Others include proliferative verrucous leukoplakia, oral lichen planus and oral lichenoid lesions, oral submucous fibrosis, actinic cheilitis and oral chronic graft-versus-host disease. The 2021 WHO Collaborating Centre report did not accept chronic hyperplastic candidosis as an OPMD (insufficient evidence).</p>
<p><b>First rule out the benign white lesions:</b> frictional keratosis (cheek biting, sharp tooth: remove the cause and review), leukoedema (disappears when stretched), white sponge naevus (bilateral, from childhood, family history), candidosis (pseudomembranous wipes off), hairy leukoplakia (lateral tongue, Epstein-Barr virus, immunosuppression), and lichen planus.</p>
<p><b>Risk factors for malignant transformation</b></p>
<div class="scroll"><table class="t">
<tr><th>Factor</th><th>Higher risk</th></tr>
<tr><td>Appearance</td><td>Erythroplakia; speckled or non-homogeneous leukoplakia; verrucous surface</td></tr>
<tr><td>Histology</td><td>Epithelial dysplasia, especially moderate or severe (the strongest single predictor)</td></tr>
<tr><td>Site</td><td>Floor of mouth, ventral and lateral tongue, soft palate complex</td></tr>
<tr><td>Size</td><td>Large lesions (often quoted as over 200 mm squared)</td></tr>
<tr><td>Patient</td><td>Female; non-smoker with idiopathic leukoplakia; older age</td></tr>
<tr><td>Behaviour</td><td>Multifocal, spreading (proliferative verrucous leukoplakia), long duration</td></tr>
<tr><td>Associated</td><td>Candida infection</td></tr>
</table></div>
<p><b>Exposures</b> that cause the lesions and raise oral cancer risk: tobacco (smoked and smokeless), alcohol (synergistic with tobacco), areca (betel) nut, high-risk human papillomavirus (mainly oropharynx), sunlight for the lip, and immunosuppression.</p>
<p><b>Referral.</b> NICE NG12 tells dentists to consider a suspected cancer pathway referral for a lump on the lip or in the mouth consistent with oral cancer, and for a red or red-and-white patch consistent with erythroplakia or erythroleukoplakia. For unexplained ulceration lasting over 3 weeks, NG12 also says to consider a suspected cancer pathway referral (SDCEP: refer any ulcer lasting over 3 weeks for biopsy). A homogeneous white patch with no red element is usually referred routinely or soon to oral medicine or oral and maxillofacial surgery for biopsy, depending on site and risk. Never biopsy a suspected cancer yourself in practice; refer.</p>
<p><b>Specialist management:</b> incisional biopsy of the most suspicious area, risk-factor cessation (smoking, alcohol), and either surveillance or excision depending on dysplasia. Proliferative verrucous leukoplakia needs long-term review because of its very high transformation rate. Record photos and measurements in the notes and give smoking-cessation advice every time (see <a href="#n-prev-life">tobacco and alcohol</a>).</p>
`, {
  spot: `A white patch with red speckles on the lateral tongue of a 60-year-old woman who doesn't smoke; a velvety red patch in the floor of mouth.`,
  trap: `Choosing "review in 2 weeks" for a red patch, or thinking smokers' leukoplakias are more likely to transform than idiopathic lesions in non-smokers.`,
  src: `WHO Collaborating Centre consensus on oral potentially malignant disorders (Warnakulasuriya et al., 2021); NICE NG12 Suspected cancer: recognition and referral.`,
  check: `The 200 mm squared size threshold and quoted transformation rates (for leukoplakia roughly 1% a year, much higher for erythroplakia and PVL) vary between studies; check a current oral medicine text before quoting figures.`
});

node('omed-cyst', 'omed', 'Cysts and tumours of the jaws', `Radicular cysts sit on non-vital teeth; dentigerous cysts attach at the ACJ; OKCs recur and suggest Gorlin; ameloblastoma is multilocular and resorbs roots.`, `
<div class="scroll"><table class="t">
<tr><th>Lesion</th><th>Key features</th><th>Management</th></tr>
<tr><td><b>Radicular cyst</b></td><td>Commonest jaw cyst. Apex of a non-vital tooth. From epithelial rests of Malassez. Round, well-defined, corticated, continuous with the lamina dura. A residual cyst stays after extraction.</td><td>Root canal treatment or extraction, with enucleation if large.</td></tr>
<tr><td><b>Dentigerous cyst</b></td><td>Around the crown of an unerupted tooth (lower 8, upper 3), attached at the amelocemental junction (ACJ). From reduced enamel epithelium. Eruption cyst is the soft-tissue version in children.</td><td>Enucleation with the tooth, or marsupialisation to let the tooth erupt.</td></tr>
<tr><td><b>Odontogenic keratocyst (OKC)</b></td><td>Posterior mandible body and ramus. Grows along the bone with little expansion. Thin parakeratinised lining with a corrugated surface and palisaded basal layer; satellite cysts. High recurrence. PTCH1 gene.</td><td>Enucleation with adjunct (for example peripheral ostectomy); long follow-up.</td></tr>
<tr><td><b>Ameloblastoma</b></td><td>Commonest clinically significant odontogenic tumour. Posterior mandible, 30s to 50s. Multilocular "soap bubble" lucency, expansion, knife-edge root resorption. Benign but locally aggressive. Unicystic type in younger patients.</td><td>Resection with a margin of normal bone; refer.</td></tr>
<tr><td><b>Central giant cell granuloma</b></td><td>Under 30, female, anterior mandible, often crossing the midline. Multilocular. Histology identical to the brown tumour of hyperparathyroidism.</td><td>Check calcium, phosphate, parathyroid hormone (PTH), alkaline phosphatase (ALP). Curettage.</td></tr>
<tr><td><b>Fibrous dysplasia</b></td><td>Young patient, painless maxillary swelling. "Ground glass" with a poorly defined margin blending into normal bone. GNAS mutation. Stops growing at skeletal maturity. McCune-Albright: polyostotic, café-au-lait spots, endocrine problems.</td><td>Observe; recontour after growth if needed.</td></tr>
<tr><td><b>Paget's disease of bone</b></td><td>Older adult. Enlarging maxilla, dentures no longer fit, hat size increases. "Cotton wool" radiopacity, hypercementosis. Raised ALP with normal calcium and phosphate.</td><td>Extractions can bleed and heal poorly. Often on bisphosphonates: assess medication-related osteonecrosis of the jaw (MRONJ) risk.</td></tr>
<tr><td><b>Stafne defect</b> (lingual salivary gland depression)</td><td>Well-defined, corticated, ovoid lucency <b>below</b> the inferior alveolar canal near the angle. A lingual concavity containing gland tissue. Symptom-free.</td><td>No treatment.</td></tr>
</table></div>
<p><b>Gorlin-Goltz syndrome</b> (naevoid basal cell carcinoma syndrome, autosomal dominant, PTCH1): multiple OKCs, often in children; multiple basal cell carcinomas; bifid ribs; calcified falx cerebri; palmar and plantar pits; frontal bossing and wide-set eyes. Multiple OKCs, or an OKC in a child, should prompt referral to look for it. Avoid unnecessary radiation where possible, because of skin cancer risk.</p>
<p><b>Other lesions to know:</b> nasopalatine duct cyst (heart-shaped midline lucency, vital incisors); simple bone cyst (young patient, scalloping between roots, empty at surgery); cemento-osseous dysplasia (lucent then mixed lesions at apices of <b>vital</b> lower anterior teeth: don't root treat); compound odontome (anterior maxilla, tooth-like pieces) and complex odontome (posterior mandible, disorganised mass). Approach to description: <a href="#n-rad-interp">reading radiographs</a>.</p>
`, {
  spot: `A young person with several jaw cysts and skin lesions (Gorlin); a multilocular lucency resorbing lower molar roots in a 40-year-old (ameloblastoma); an older man whose denture no longer fits and whose ALP is raised (Paget's).`,
  trap: `Root treating vital teeth with apical lucencies (cemento-osseous dysplasia); or forgetting to check calcium and PTH for a giant cell lesion.`,
  src: `WHO Classification of Head and Neck Tumours (5th ed, 2022), odontogenic and maxillofacial bone tumours; standard oral pathology texts.`,
  check: `The WHO moved OKC from tumour (2005, as keratocystic odontogenic tumour) back to cyst (2017); confirm the label used by your current text.`
});

node('omed-pain', 'omed', 'Orofacial pain and TMD', `Trigeminal neuralgia gives brief electric shocks; TMD is managed conservatively; burning mouth is a diagnosis of exclusion; GCA risks blindness and needs same-day action.`, `
<div class="scroll"><table class="t">
<tr><th>Condition</th><th>Key features</th><th>Management</th></tr>
<tr><td><b>Trigeminal neuralgia (TN)</b></td><td>Unilateral, paroxysmal, electric-shock pain lasting seconds up to 2 minutes. Usually second or third division. Triggered by light touch: washing, shaving, eating, wind. Pain-free between attacks. Usually over 50.</td><td>Carbamazepine first line (monitor full blood count, sodium and liver function; watch for rash and interactions). Refer to neurology or oral medicine. Surgery (microvascular decompression) for refractory cases.</td></tr>
<tr><td><b>Temporomandibular disorders (TMD)</b></td><td>Pain in the muscles or joint, clicking, limited or deviated opening, worse with chewing. Often linked to parafunction and stress.</td><td>Conservative: reassurance, soft diet, avoid wide opening and gum, jaw exercises, heat, short-term non-steroidal anti-inflammatory drugs, stabilisation splint. Cognitive behavioural approaches. Refer if no improvement.</td></tr>
<tr><td><b>Burning mouth syndrome</b></td><td>Usually a postmenopausal woman. Bilateral burning, often the tongue, normal-looking mucosa. Often worse by evening and eased by eating.</td><td>Exclude causes: haematinic deficiency, diabetes, candida, dry mouth, drugs (such as angiotensin-converting enzyme (ACE) inhibitors), allergy, parafunction. Reassure. Specialist options include clonazepam and cognitive behavioural therapy.</td></tr>
<tr><td><b>Giant cell arteritis (GCA)</b></td><td>Over 50. New temporal headache, scalp tenderness, <b>jaw claudication</b> (pain on chewing that builds and eases at rest), visual symptoms, raised erythrocyte sedimentation rate (ESR) and C-reactive protein (CRP). Linked to polymyalgia rheumatica.</td><td>Urgent, same-day action. New visual symptoms: same-day ophthalmology assessment. No visual symptoms: urgent specialist discussion and the local fast-track GCA pathway (specialist review within 3 working days). If GCA is strongly suspected, high-dose oral prednisolone (40 to 60 mg daily) is started without waiting for test results (NICE CKS).</td></tr>
</table></div>
<p><b>Trigeminal neuralgia red flags.</b> Onset under 40, bilateral pain, sensory loss, or other neurological signs suggest a secondary cause, such as multiple sclerosis or a tumour, and need MRI via neurology.</p>
<p><b>TMD subtypes</b> (Diagnostic Criteria for TMD): myofascial pain; arthralgia; disc displacement with reduction (reciprocal click); disc displacement without reduction (closed lock: sudden limited opening, deviation to the affected side, the click stops); and degenerative joint disease (crepitus). Avoid irreversible treatment such as occlusal adjustment.</p>
<p><b>TMD red flags</b> needing referral: progressive trismus, numbness, swelling, unilateral hearing loss or ear symptoms, systemic symptoms, or features of GCA. Think of malignancy (for example a nasopharyngeal tumour) when trismus has no clear cause.</p>
<p><b>Other diagnoses</b> in the differential: persistent idiopathic facial pain, post-herpetic neuralgia, cluster headache (male, eye-centred pain with lacrimation and nasal congestion), cardiac pain referred to the jaw on exertion, and sinusitis (several upper posterior teeth tender, worse bending forward).</p>
`, {
  spot: `Electric shocks when shaving (TN); a 70-year-old with pain on chewing that eases at rest and a tender scalp (GCA); a woman with a burning tongue and normal mucosa.`,
  trap: `Extracting teeth for TN pain, or treating jaw claudication as TMD and missing GCA.`,
  src: `NICE CKS Trigeminal neuralgia; NICE CKS Giant cell arteritis; British Society of Rheumatology guideline on GCA (2020); Diagnostic Criteria for TMD (DC/TMD, 2014).`,
  check: `Check whether carbamazepine is listed in the current Dental Practitioners' Formulary and the starting dose in the BNF; also the HLA-B*1502 testing advice for patients of Han Chinese or Thai origin.`
});

node('omed-saliv', 'omed', 'Salivary glands and dry mouth', `Mucocele on the lower lip, ranula in the floor of mouth, mostly submandibular stones, and Sjögren's with its lymphoma risk.`, `
<div class="scroll"><table class="t">
<tr><th>Condition</th><th>Key features</th><th>Management</th></tr>
<tr><td><b>Mucocele</b></td><td>Bluish, fluctuant swelling, usually lower lip, often after trauma. Mucus extravasation from a minor gland.</td><td>Excise with the feeding minor glands; may recur.</td></tr>
<tr><td><b>Ranula</b></td><td>Large bluish swelling in the floor of mouth, to one side, from the sublingual gland. A "plunging" ranula passes through mylohyoid and presents in the neck.</td><td>Refer: excision of the sublingual gland.</td></tr>
<tr><td><b>Sialolithiasis</b> (stones)</td><td>Most in the submandibular gland: long uphill duct, more mucous and alkaline saliva. "Mealtime syndrome": pain and swelling when eating.</td><td>Imaging: lower true occlusal radiograph, ultrasound, sialography. Hydration, massage, sour sweets (sialogogues). Anterior duct stone: removal through the duct. Refer.</td></tr>
<tr><td><b>Acute bacterial sialadenitis</b></td><td>Painful parotid swelling with pus from the duct, often in a dehydrated or older patient.</td><td>Rehydrate, antibiotics, refer if severe.</td></tr>
<tr><td><b>Mumps</b></td><td>Bilateral painful parotids in a child or young adult, fever.</td><td>Supportive; notifiable disease.</td></tr>
</table></div>
<p><b>Sjögren's syndrome</b> is an autoimmune exocrinopathy, mostly in middle-aged women. Primary Sjögren's affects the glands (dry eyes and dry mouth). It can occur alongside other autoimmune disease, such as rheumatoid arthritis or lupus (previously called secondary). Investigations: anti-Ro (SSA) and anti-La (SSB) antibodies, rheumatoid factor, antinuclear antibody, Schirmer test for tear flow, salivary flow rate and labial gland biopsy showing focal lymphocytic sialadenitis. The key long-term risk is <b>non-Hodgkin B-cell lymphoma of mucosa-associated lymphoid tissue (MALT)</b>: refer persistent gland enlargement. Dental care: high caries risk, so high-fluoride toothpaste (5000 ppm), fluoride varnish, diet advice, saliva substitutes, sugar-free gum, frequent recalls, and treat candidosis.</p>
<p><b>Dry mouth (xerostomia)</b> causes: drugs (anticholinergics, antidepressants, antihistamines, diuretics), head and neck radiotherapy, Sjögren's, dehydration, diabetes, anxiety and mouth breathing. Pilocarpine is a specialist option. See <a href="#n-med-mronj">head and neck radiotherapy</a>.</p>
<p><b>Salivary tumours.</b> Most occur in the parotid, and most parotid tumours are benign (pleomorphic adenoma is the commonest). The smaller the gland, the more likely a tumour is malignant: most minor gland tumours (often palate) and sublingual tumours are malignant. Warthin's tumour: older male smoker, tail of parotid, can be bilateral. Adenoid cystic carcinoma spreads along nerves (pain, numbness). Facial nerve weakness with a parotid mass suggests malignancy: refer on a suspected cancer pathway.</p>
`, {
  spot: `Swelling under the jaw at mealtimes (submandibular stone); a soft blue floor-of-mouth swelling (ranula); dry eyes and mouth with anti-Ro positive (Sjögren's).`,
  trap: `Thinking the parotid is the commonest site for stones, or missing lymphoma when a Sjögren's gland enlarges.`,
  src: `NICE CKS Dry mouth; British Society for Rheumatology guideline on primary Sjögren's syndrome (2017); 2016 ACR/EULAR classification criteria for Sjögren's; DBOH v4 (2021) for fluoride in dry mouth.`,
  check: `The proportion of stones in the submandibular gland (commonly quoted as about 80%) varies by source; check a current text before quoting a number. The British Society for Rheumatology 2025 guideline puts the lifetime risk of B-cell lymphoma in Sjögren disease at 5 to 10%.`
});

node('paed', 'clin', 'Paediatric dentistry', `Eruption timings and anomalies, sealing-in caries management and pulp therapy for primary teeth, and IADT 2020 trauma care.`, `
<p>Paediatric questions check that you can tell normal from abnormal development, manage caries in primary teeth with the least invasive option that works, and follow the International Association of Dental Traumatology (IADT) 2020 trauma guidelines.</p>
<ul>
<li><a href="#n-paed-dev">Eruption and developmental anomalies</a>: eruption dates, hypodontia, molar-incisor hypomineralisation, amelogenesis and dentinogenesis imperfecta.</li>
<li><a href="#n-paed-tx">Caries and pulp therapy in primary teeth</a>: the Hall technique, pulpotomy and pulpectomy.</li>
<li><a href="#n-paed-trauma">Dental trauma (IADT)</a>: avulsion, luxations, fractures, splint times and primary tooth injuries.</li>
</ul>
<p>Every child contact is also a chance to spot neglect or abuse: see <a href="#n-exam-safeg">safeguarding</a>. Fluoride and prevention are in <a href="#n-prev-dboh">DBOH</a>.</p>
`, {
  src: `SDCEP Prevention and Management of Dental Caries in Children (3rd ed, 2025); IADT guidelines for the management of traumatic dental injuries (2020); British Society of Paediatric Dentistry (BSPD) guidance; DBOH v4 (2021).`,
  spot: `A child's age plus a dental finding: a missing tooth, a discoloured molar, a carious primary molar, or a knocked-out incisor.`,
  trap: `Replanting an avulsed primary tooth, or choosing a destructive option when sealing-in caries would do.`
});

node('paed-dev', 'paed', 'Eruption and developmental anomalies', `Eruption ages and sequence; hypodontia mostly lower 5s and upper 2s; MIH hits first molars and incisors; AI is enamel, DI dentine.`, `
<div class="scroll"><table class="t">
<tr><th>Primary tooth</th><th>Eruption (approx.)</th><th>Permanent tooth</th><th>Eruption (approx., years)</th></tr>
<tr><td>Central incisor (A)</td><td>6 to 10 months (lowers first)</td><td>Lower 6, lower 1</td><td>6 to 7</td></tr>
<tr><td>Lateral incisor (B)</td><td>7 to 12 months</td><td>Upper 1, lower 2</td><td>7 to 8</td></tr>
<tr><td>First molar (D)</td><td>12 to 16 months</td><td>Upper 2</td><td>8 to 9</td></tr>
<tr><td>Canine (C)</td><td>16 to 20 months</td><td>Lower 3</td><td>9 to 10</td></tr>
<tr><td>Second molar (E)</td><td>20 to 30 months</td><td>4s and 5s, upper 3</td><td>10 to 12</td></tr>
<tr><td></td><td></td><td>7s</td><td>12 to 13</td></tr>
<tr><td></td><td></td><td>8s</td><td>17 to 21</td></tr>
</table></div>
<p><b>Sequence.</b> Primary: A, B, D, C, E. Permanent upper: 6, 1, 2, 4, 3 or 5, then 7. Permanent lower: 6, 1, 2, 3, 4, 5, 7. Variation of several months is normal. Investigate (with a radiograph) if a tooth is very late, if the contralateral tooth erupted more than about 6 months earlier, or if the sequence is disturbed (for example a lateral incisor erupting before the central). An unerupted upper central incisor suggests a supernumerary (often tuberculate), dilaceration after primary trauma, or crowding.</p>
<p><b>Hypodontia</b> (developmental absence of teeth other than third molars). The teeth most often missing are lower second premolars, upper lateral incisors, upper second premolars and lower central incisors. Primary hypodontia is rare and usually predicts absence of the successor. Associations: ectodermal dysplasia (with sparse hair and reduced sweating), Down syndrome, cleft lip and palate. Peg-shaped upper laterals often accompany a missing contralateral lateral. Manage in a multidisciplinary team: keep primary teeth as long as useful, then plan space opening or closing with orthodontics and restore with resin-bonded bridges, or implants after growth stops.</p>
<p><b>Molar-incisor hypomineralisation (MIH).</b> Systemic hypomineralisation of one to four first permanent molars, often with incisors. Demarcated opacities (white, cream, yellow or brown), post-eruptive enamel breakdown, sensitivity and difficulty achieving anaesthesia. Distinguish from fluorosis (diffuse, symmetrical) and amelogenesis imperfecta (all teeth). Manage with fluoride varnish and toothpaste, sealants, glass ionomer or composite, and preformed metal crowns. Plan extraction of poor-prognosis first molars at the right time with orthodontic input (see <a href="#n-ortho-inter">interceptive orthodontics</a>).</p>
<div class="scroll"><table class="t">
<tr><th></th><th>Amelogenesis imperfecta (AI)</th><th>Dentinogenesis imperfecta (DI)</th></tr>
<tr><td>Tissue</td><td>Enamel</td><td>Dentine</td></tr>
<tr><td>Teeth</td><td>Both dentitions, all teeth</td><td>Both dentitions; primary teeth often worse</td></tr>
<tr><td>Types</td><td>Hypoplastic (thin enamel), hypomaturation (mottled, soft), hypocalcified (soft, wears fast)</td><td>Type I with osteogenesis imperfecta (blue sclerae, fractures); type II isolated (DSPP gene); type III Brandywine "shell teeth"</td></tr>
<tr><td>Appearance</td><td>Yellow-brown, rough or pitted; anterior open bite is common</td><td>Amber-grey opalescent; enamel chips off; rapid wear</td></tr>
<tr><td>Radiograph</td><td>Thin or poorly contrasting enamel; normal pulps and roots</td><td>Bulbous crowns, cervical constriction, short roots, pulps obliterated</td></tr>
</table></div>
`, {
  spot: `An 8-year-old with an upper central incisor not erupted 9 months after its partner (supernumerary); yellow-brown first molars that crumble (MIH); a child with frequent fractures and grey-amber teeth (DI type I).`,
  trap: `Calling MIH "fluorosis" (fluorosis is diffuse and symmetrical), or mixing up AI (enamel) and DI (dentine, obliterated pulps).`,
  src: `Standard paediatric dentistry texts; European Academy of Paediatric Dentistry (EAPD) MIH policy (2021); BSPD guidance; RCS England guideline on extraction of first permanent molars.`,
  check: `Eruption ages vary between sources by several months; check against your course text. Hypodontia prevalence (often quoted as about 4 to 6% in the UK) and MIH prevalence vary between studies.`
});

node('paed-tx', 'paed', 'Caries and pulp therapy in primary teeth', `Hall technique when the pulp is healthy; pulpotomy for vital teeth with controllable bleeding; extraction (or, exceptionally, pulpectomy) otherwise.`, `
<p>The SDCEP guidance (3rd edition, 2025) favours prevention plus the least invasive option that controls caries. Choose between three broad strategies: prevent (non-restorative cavity control, fluoride, diet), seal in (fissure sealant, Hall technique, partial caries removal), or remove (conventional restoration, pulp therapy, extraction).</p>
<p><b>Hall technique.</b> A preformed metal crown (PMC) is cemented with glass ionomer cement over a carious primary molar with <b>no local anaesthetic, no caries removal and no tooth preparation</b>. The seal starves the bacteria and lesion progression stops.</p>
<ul>
<li><b>Use when:</b> caries in a primary molar (including occlusal and proximal lesions) with no clinical or radiographic signs of irreversible pulpitis or infection.</li>
<li><b>Avoid when:</b> signs or symptoms of irreversible pulpitis, abscess or sinus; radiographic pulpal involvement or periradicular pathology; too little crown left to retain a crown; or a child who can't cooperate safely (inhalation risk).</li>
<li>Orthodontic separators can open tight contacts a few days before. The bite is slightly propped at first; it usually equilibrates within weeks.</li>
</ul>
<div class="scroll"><table class="t">
<tr><th>Treatment</th><th>Indication</th><th>Method</th></tr>
<tr><td><b>Indirect pulp therapy / selective caries removal</b></td><td>Deep lesion, vital pulp, no irreversible symptoms</td><td>Leave affected dentine over the pulp, seal well (often under a PMC)</td></tr>
<tr><td><b>Pulpotomy</b></td><td>Vital primary molar with irreversible symptoms but no abscess or sinus (SDCEP), or an advanced lesion with no clear band of dentine between lesion and pulp. Not for teeth near exfoliation, unrestorable teeth, or pre-cooperative or immunocompromised children.</td><td>Local anaesthetic, then remove the contents of the pulp chamber. If it still bleeds, hold a pellet dampened in ferric sulphate in the chamber for about 2 minutes. If bleeding can't be stopped or a canal is necrotic, consider pulpectomy or extraction. Place a calcium silicate cement such as mineral trioxide aggregate (MTA), then restore with a PMC at the same visit.</td></tr>
<tr><td><b>Pulpectomy</b></td><td>Not first line. SDCEP: if there is infection (abscess, sinus, inter-radicular radiolucency), extract; consider pulpectomy (which may need referral) only in exceptional circumstances where the tooth is restorable</td><td>Remove all pulp, irrigate, fill with a resorbable paste, then a PMC (check the current BSPD or EAPD guidance for the material). Not for teeth with physiological root resorption.</td></tr>
<tr><td><b>Extraction</b></td><td>Unrestorable tooth, extensive root resorption, near exfoliation, or a child at risk from persistent infection</td><td>Consider space maintenance or balancing extractions (see <a href="#n-ortho-inter">interceptive orthodontics</a>)</td></tr>
</table></div>
<p><b>Formocresol</b> should not be used because of safety concerns (SDCEP). Use ferric sulphate for haemostasis and a calcium silicate cement such as MTA as the dressing.</p>
<p><b>Pulp therapy is contraindicated</b> in immunocompromised children (SDCEP), and is usually avoided in others at higher risk from a persisting infection, such as those at risk of infective endocarditis: discuss with their medical team and favour extraction.</p>
<p><b>Diagnosis</b> in children leans on history: spontaneous pain lasting hours or waking the child suggests irreversible pulpitis; swelling, a sinus, increased mobility or inter-radicular radiolucency suggests infection (abscess). Always pair restorative care with prevention: fluoride varnish, toothpaste strength by age and diet advice (see <a href="#n-prev-dboh">DBOH</a>).</p>
`, {
  spot: `A 6-year-old with a symptom-free carious lower E and an anxious parent (Hall); a carious exposure in a vital D that bleeds briefly from the root stumps (pulpotomy).`,
  trap: `Giving local anaesthetic and preparing the tooth for a Hall crown; or filling a primary molar root canal with gutta-percha.`,
  src: `SDCEP Prevention and Management of Dental Caries in Children (3rd ed, 2025); BSPD clinical guidelines on pulp therapy for primary molars; the Hall Technique guide (University of Dundee).`,
  check: `SDCEP gives about 2 minutes with a ferric sulphate pellet for haemostasis. Check the current BSPD or EAPD pulp therapy guidance for materials used in pulpectomy.`
});

node('paed-trauma', 'paed', 'Dental trauma (IADT)', `Replant avulsed permanent teeth at once or store in milk; splint avulsion 2 weeks, lateral luxation 4 weeks; never replant primary teeth.`, `
<p><b>Avulsion of a permanent tooth.</b> Replant immediately at the scene if possible, holding the crown and rinsing briefly if dirty. If not, store in a physiological medium. IADT 2020 lists, in descending order of preference: <b>milk</b>, Hanks' balanced salt solution (HBSS), saliva (spat into a glass) and saline. If the tooth is dirty, rinse it gently in milk, saline or saliva. Water is a poor medium; it is only better than letting the root air-dry. The critical factor is <b>extra-oral dry time</b>: after 60 minutes dry, the periodontal ligament cells are likely to be non-viable (most are already non-viable by about 30 minutes), and ankylosis and replacement resorption are expected.</p>
<ul>
<li>At the surgery: irrigate the socket, replant with gentle pressure, check position radiographically, flexible splint for <b>2 weeks</b>.</li>
<li>Closed apex: start root canal treatment within 2 weeks (calcium hydroxide or a corticosteroid-antibiotic dressing).</li>
<li>Open apex: revascularisation is possible; monitor and treat only if signs of necrosis.</li>
<li>IADT 2020 advises systemic antibiotics (amoxicillin or penicillin are first choice; tetracyclines such as doxycycline are generally not recommended under 12 years because of tooth discolouration), a tetanus check with a doctor, a soft diet and a 0.12% chlorhexidine rinse twice daily for 2 weeks.</li>
<li>Delayed replantation (dry over 60 minutes) is still usually worthwhile to keep bone and space in a growing child.</li>
</ul>
<div class="scroll"><table class="t">
<tr><th>Injury (permanent tooth)</th><th>Management</th><th>Splint</th></tr>
<tr><td>Concussion</td><td>Monitor</td><td>None</td></tr>
<tr><td>Subluxation</td><td>Monitor</td><td>Up to 2 weeks for comfort</td></tr>
<tr><td>Extrusion</td><td>Reposition</td><td>2 weeks</td></tr>
<tr><td>Lateral luxation</td><td>Reposition (disengage from the bony lock)</td><td>4 weeks</td></tr>
<tr><td>Intrusion</td><td>Immature: let it re-erupt (orthodontic repositioning if no movement in about 4 weeks). Mature: re-erupt if under 3 mm; reposition orthodontically or surgically if 3 to 7 mm; surgically if over 7 mm. Root canal treatment within 2 weeks for mature teeth.</td><td>4 weeks after repositioning</td></tr>
<tr><td>Root fracture</td><td>Reposition</td><td>4 weeks; up to 4 months for cervical-third fractures</td></tr>
<tr><td>Alveolar fracture</td><td>Reposition segment</td><td>4 weeks</td></tr>
<tr><td>Avulsion</td><td>Replant</td><td>2 weeks</td></tr>
</table></div>
<p><b>Crown fractures.</b> Enamel only: smooth or bond. Enamel and dentine: cover dentine with glass ionomer or composite, or reattach the fragment (store it in water or saline to keep it hydrated). Complicated (pulp exposed): in young teeth, preserve pulp with a pulp cap or <b>partial pulpotomy</b> (Cvek), using a calcium silicate cement or calcium hydroxide, then seal. Partial pulpotomy is also acceptable in mature teeth.</p>
<p><b>Primary teeth.</b> Protect the developing successor. <b>Never replant an avulsed primary tooth.</b> Intruded primary teeth are left to re-erupt (usually within 6 months, sometimes up to a year), whichever way the root is displaced: IADT 2020 no longer advises immediate extraction when the apex points towards the tooth germ, and asks for rapid referral to a child-oriented team. Lateral luxation without occlusal interference is left to reposition (usually within 6 months); in severe displacement, gently reposition (flexible splint for 4 weeks if unstable) or extract if there is a risk of aspiration. Splinting is mainly for alveolar fractures (4 weeks). Grey discolouration alone is monitored; treat only if infection appears. Warn parents about effects on the successor (enamel defects, dilaceration).</p>
<p><b>Always</b> record the history, check for head injury and consider non-accidental injury (see <a href="#n-exam-safeg">safeguarding</a>). Follow-up with clinical and radiographic review at set intervals over at least a year.</p>
`, {
  spot: `A 9-year-old's incisor knocked out 30 minutes ago and kept in milk; an incisor displaced palatally and locked (lateral luxation); a 3-year-old's intruded A.`,
  trap: `Storing the tooth in water; replanting a primary incisor; splinting a lateral luxation for 2 weeks instead of 4; starting root canal treatment immediately in an open-apex avulsion.`,
  src: `IADT guidelines for the management of traumatic dental injuries (2020): general introduction; fractures and luxations; avulsion of permanent teeth; injuries in the primary dentition. Dental Trauma Guide (IADT).`,
  check: `Checked against the open-access IADT 2020 guidelines (fractures and luxations; avulsion; primary dentition). Check iadt-dentaltrauma.org for any later update.`

/* ===================== ORTHODONTICS ===================== */

node('ortho', 'clin', 'Orthodontics', `Use IOTN to judge NHS eligibility and refer at the right time; intercept ectopic canines, displacing crossbites, habits and space loss.`, `
<p>General dentists are tested on two orthodontic skills: deciding who needs treatment and when to refer, and recognising problems that simple early action can improve.</p>
<ul>
<li><a href="#n-ortho-iotn">IOTN and when to refer</a>: the Dental Health Component (DHC) using MOCDO, the Aesthetic Component (AC) and the NHS threshold.</li>
<li><a href="#n-ortho-inter">Interceptive orthodontics</a>: palatally ectopic canines, crossbites with displacement, space maintenance, first molar extraction and habits.</li>
</ul>
<p>Most SBA stems give an age, an overjet or crossbite measurement and the stage of the dentition. Decide the IOTN grade first, then whether the problem needs early action or routine referral. Hypodontia and developmental problems are in <a href="#n-paed-dev">eruption and anomalies</a>.</p>
`, {
  src: `Index of Orthodontic Treatment Need (IOTN); NHS England Guide for commissioning orthodontics (2015); British Orthodontic Society (BOS) referral guidance; FDS RCS England guidelines on palatally ectopic canines and first permanent molar extraction.`,
  spot: `An overjet measurement or a crossbite in a child of stated age, with a question about eligibility or the next step.`,
  trap: `Referring too early for crowding alone, or too late for ectopic canines and displacing crossbites.`
});

node('ortho-iotn', 'ortho', 'IOTN and when to refer', `NHS orthodontics in England: under 18 with IOTN DHC 4 or 5, or DHC 3 with AC 6 or more. Grade the DHC with MOCDO.`, `
<p>The Index of Orthodontic Treatment Need (IOTN) has two parts. The <b>Dental Health Component (DHC)</b> grades need from 1 (none) to 5 (very great) using the single worst feature. The <b>Aesthetic Component (AC)</b> compares the patient's front teeth with ten photographs, 1 (most attractive) to 10 (least).</p>
<p><b>NHS eligibility (England):</b> under 18, with DHC 4 or 5, or DHC 3 with AC 6 or above. Adults are only funded in exceptional cases, for example as part of a hospital multidisciplinary plan.</p>
<p>Work through <b>MOCDO</b> in order and take the highest grade: Missing teeth, Overjet, Crossbite, Displacement of contact points, Overbite (and open bite).</p>
<div class="scroll"><table class="t">
<tr><th>Grade</th><th>Key features</th></tr>
<tr><td>5</td><td>5i impeded eruption (except 8s). 5h extensive hypodontia needing pre-restorative orthodontics (more than one tooth missing in any quadrant). 5a overjet over 9 mm. 5m reverse overjet over 3.5 mm with chewing or speech difficulty. 5p cleft lip and palate. 5s submerged primary teeth.</td></tr>
<tr><td>4</td><td>4h less extensive hypodontia. 4a overjet 6.1 to 9 mm. 4b reverse overjet over 3.5 mm, no functional difficulty. 4m reverse overjet 1 to 3.5 mm with functional difficulty. 4c crossbite with over 2 mm discrepancy between retruded contact position and intercuspal position. 4l posterior lingual crossbite with no functional contact in a buccal segment. 4d contact point displacement over 4 mm. 4e open bite over 4 mm. 4f deep overbite with gingival or palatal trauma. 4t partially erupted teeth tipped and impacted against neighbours. 4x supplemental teeth.</td></tr>
<tr><td>3</td><td>3a overjet 3.6 to 6 mm with incompetent lips. 3b reverse overjet 1 to 3.5 mm. 3c crossbite with 1 to 2 mm discrepancy. 3d contact point displacement 2 to 4 mm. 3e open bite 2 to 4 mm. 3f deep overbite complete to gingiva or palate without trauma.</td></tr>
<tr><td>2 and 1</td><td>Minor irregularities; little or no need.</td></tr>
</table></div>
<p><b>When to refer.</b></p>
<ul>
<li><b>Most malocclusions:</b> in the late mixed or early permanent dentition (around 11 to 12 years), when premolars and canines are erupting. Make sure oral hygiene and caries are under control first.</li>
<li><b>Refer earlier</b> for: palatally ectopic canines (not palpable from about 10), crossbites with displacement, Class III problems, large overjets with lips that don't cover the teeth (trauma risk), impacted or unerupted incisors, supernumeraries, hypodontia, cleft, and severe skeletal problems.</li>
<li>Patients over 18 or with DHC below threshold can be told about private treatment.</li>
</ul>
<p>Record the IOTN, the overjet in millimetres and any crossbite or displacement in the referral letter (see <a href="#n-comm-team">referrals and letters</a>).</p>
`, {
  spot: `A 12-year-old with a 7 mm overjet (4a, eligible); a 14-year-old with a 2 mm contact point displacement and AC 7 (3d with AC 6 or more, eligible).`,
  trap: `Forgetting that DHC 3 is eligible only with AC 6 or above, or picking the less severe feature when a worse one (for example impeded eruption, 5i) is present.`,
  src: `IOTN (Brook and Shaw, 1989; Richmond et al.); NHS England Guide for commissioning orthodontics (2015); BOS guidance for referral.`,
  check: `The open-bite cut-off for 4e is given here as over 4 mm (as on the BOS referral sheet) but as over 6 mm on one NHS England quick-reference sheet: confirm against the official IOTN chart. Other cut-offs match the NHS England sheet. Eligibility rules in Scotland, Wales and Northern Ireland are IOTN-based but should be checked locally.`
});

node('ortho-inter', 'ortho', 'Interceptive orthodontics', `Palpate canines from age 10, extract the C for a palatal canine, correct displacing crossbites early, and manage space loss and habits.`, `
<p><b>Palatally ectopic upper canines.</b> Upper canine impaction has a prevalence of about 1.5% (RCS FDS guideline), and most ectopic canines are palatal. Palpate the buccal sulcus for the canine bulge from about age 10. Suspect displacement if the bulge isn't felt by 10 to 11, there is asymmetry, the lateral incisor is proclined or spaced, or the primary canine is retained.</p>
<ul>
<li><b>Localise</b> with parallax: horizontal (two periapicals or a periapical plus occlusal) or vertical (panoramic plus upper standard occlusal). Rule: if the canine appears to move in the same direction as the tube shift it is palatal; if it moves the opposite way it is buccal (SLOB: Same Lingual, Opposite Buccal). Cone beam CT (CBCT) helps when resorption of the incisor roots is suspected.</li>
<li><b>Interceptive extraction of the primary canine</b> improves the chance of the permanent canine erupting when the canine is palatal, the child is roughly 10 to 13, and there is no crowding (or space is created). Review radiographically after about 12 months; if there is no improvement, refer.</li>
<li>Other options: exposure and alignment, removal, or monitoring.</li>
</ul>
<p><b>Crossbites with displacement.</b> A crossbite with a mandibular shift from retruded contact to intercuspal position should be corrected early, to avoid wear, gingival recession and asymmetric growth.</p>
<ul>
<li><b>Anterior crossbite</b> of one or two incisors with displacement: an upper removable appliance with Z-springs and posterior bite planes, provided there is enough overbite to hold the correction.</li>
<li><b>Unilateral posterior crossbite with lateral displacement:</b> upper arch expansion (quad helix or removable appliance with a midline screw). In the primary dentition, grinding the primary canines can remove the interference.</li>
</ul>
<p><b>Space maintenance.</b> Early loss of a primary molar, especially an E, lets the first permanent molar drift forward. Space loss is greatest in a crowded arch and when the E is lost before the 6 erupts. A space maintainer (for example band and loop) is justified only when the space matters and oral hygiene is good. <b>Balancing</b> extraction (same tooth, other side of the same arch) of a primary canine helps preserve the centreline. <b>Compensating</b> extraction is the same tooth in the opposing arch.</p>
<p><b>First permanent molars of poor prognosis</b> (for example severe molar-incisor hypomineralisation (MIH)): extract at the right time so the second molar can drift forward. In the lower arch this is usually when the bifurcation of the lower 7 has begun to calcify. Compensating extraction of the opposing upper 6 is not routine (SDCEP, citing the RCS guideline); consider it only for a clear occlusal need, such as an upper 6 likely to be unopposed for a long time. Take an orthodontic opinion first.</p>
<div class="scroll"><table class="t">
<tr><th>Habit</th><th>Effects</th><th>Management</th></tr>
<tr><td>Digit sucking</td><td>Proclined upper incisors, retroclined lowers, increased overjet, asymmetric anterior open bite, unilateral posterior crossbite with displacement</td><td>Encouragement and rewards, reminders (glove, bitter nail varnish), habit-breaking appliance. Most effects improve if the habit stops before the permanent incisors fully erupt.</td></tr>

</table></div>
<p><b>Increased overjet</b> with incompetent lips raises the risk of incisor trauma; early referral can reduce it.</p>
`, {
  spot: `An 11-year-old with no palpable canine bulge on one side and a retained C; a child whose lower jaw shifts sideways on closing into a unilateral crossbite.`,
  trap: `Extracting the primary canine in a crowded arch without creating space, or waiting until the permanent dentition to treat a crossbite with displacement.`,
  src: `FDS RCS England Management of the palatally ectopic maxillary canine (Husain et al., updated 2016); FDS RCS England guideline on extraction of first permanent molars in children (2014); BOS guidance.`,
  check: `The RCS guideline gives about 1.5% for upper canine impaction. SDCEP, citing the RCS 2023 molar guideline, gives 8 to 10 years (mainly the lower arch) for interceptive extraction of first permanent molars.`
});

/* ===================== RESTORATION OF TEETH ===================== */

node('resto', 'clin', 'Restoration of teeth', `Detect caries with ICDAS and treat minimally; choose materials within the amalgam phase-down; diagnose tooth wear; get endodontics and indirect work right.`, `
<p>Restorative questions run from diagnosis to the final crown. The theme throughout is minimal intervention: prevent, seal and preserve tooth tissue and pulp vitality wherever possible.</p>
<ul>
<li><a href="#n-resto-caries">Caries diagnosis and minimally invasive care</a>: the International Caries Detection and Assessment System (ICDAS), risk and selective caries removal.</li>
<li><a href="#n-resto-mat">Restorative materials</a>: amalgam phase-down, glass ionomer versus composite, bonding.</li>
<li><a href="#n-resto-tsl">Tooth surface loss</a>: erosion, attrition and abrasion, BEWE and the Dahl concept.</li>
<li><a href="#n-resto-endo">Endodontics</a>: diagnosis, working length, irrigants, the hypochlorite incident and quality standards.</li>
<li><a href="#n-resto-ind">Indirect restorations and occlusion</a>: crowns, posts and the shortened dental arch.</li>
</ul>
<p>Fluoride and diet are in <a href="#n-prev-dboh">DBOH</a>; replacing missing teeth is in <a href="#n-prosth">replacement of teeth</a>.</p>
`, {
  src: `SDCEP Prevention and Management of Dental Caries in Children (3rd ed, 2025); DBOH v4 (2021); EU Regulation 2017/852 on mercury (retained in GB law); ESE quality guidelines for endodontic treatment (2006) and ESE S3 guideline (2023); ESE position statement on deep caries (2019).`,
  spot: `A described lesion, a material choice for a named patient group, or a step in root canal treatment.`,
  trap: `Placing amalgam in a pregnant patient or a child without a medical justification; non-selective caries removal into the pulp.`
});

node('resto-caries', 'resto', 'Caries diagnosis and minimally invasive care', `ICDAS grades visual caries 0 to 6; risk drives recall and prevention; selective caries removal protects the pulp in deep lesions.`, `
<p><b>ICDAS</b> (International Caries Detection and Assessment System) scores clean, dried teeth by visual appearance.</p>
<div class="scroll"><table class="t">
<tr><th>Code</th><th>Appearance</th><th>Usual approach</th></tr>
<tr><td>0</td><td>Sound</td><td>Prevention</td></tr>
<tr><td>1</td><td>First visual change in enamel, seen only after drying</td><td>Non-operative: fluoride, diet, sealant</td></tr>
<tr><td>2</td><td>Distinct visual change in enamel, seen wet</td><td>Non-operative or sealant</td></tr>
<tr><td>3</td><td>Localised enamel breakdown, no visible dentine</td><td>Sealant or minimal restoration depending on activity and risk</td></tr>
<tr><td>4</td><td>Dark shadow from underlying dentine</td><td>Usually restore</td></tr>
<tr><td>5</td><td>Distinct cavity with visible dentine</td><td>Restore</td></tr>
<tr><td>6</td><td>Extensive cavity with visible dentine (over half the surface)</td><td>Restore; assess pulp</td></tr>
</table></div>
<p>Also judge <b>activity</b>: active lesions are matt, rough and plaque-covered; arrested lesions are shiny, smooth and hard. Approximal lesions are graded on bitewings by depth (outer and inner enamel, then outer, middle and inner dentine). Lesions confined to enamel can often be arrested; resin infiltration is an option for non-cavitated approximal lesions.</p>
<p><b>Caries risk.</b> Past caries experience is the strongest predictor. Add diet (frequency of sugars), fluoride exposure, plaque control, saliva (medication, radiotherapy, Sjögren's), social factors and medical history. Risk sets the recall interval (NICE CG19: 3 to 24 months for adults, 3 to 12 months under 18) and the prevention package from <a href="#n-prev-dboh">DBOH</a>, such as high-fluoride toothpaste and fluoride varnish.</p>
<p><b>Caries removal in deep lesions.</b> Current consensus (European Society of Endodontology (ESE) 2019, International Caries Consensus Collaboration) favours <b>selective caries removal</b> for deep lesions in teeth with a vital pulp and no signs of irreversible pulpitis:</p>
<ul>
<li>Remove caries fully at the periphery to hard dentine, so the restoration seals.</li>
<li>Over the pulp, avoid exposure: leave dentine that is firm (moderately deep lesions) or, in very deep lesions, soft (selective removal to firm or to soft dentine, per the S3 guideline).</li>
<li>Seal with a durable restoration. Re-entry is not needed after selective removal. The 2025 EFCD-ESE-ORCA S3 guideline suggests selective removal or stepwise removal in preference to non-selective removal; selective removal may be preferred when the lesion reaches the inner third (but not the inner quarter) of dentine.</li>
<li>The S3 guideline suggests against non-selective removal to hard dentine in deep lesions (a weak recommendation), because it raises the risk of pulp exposure.</li>
</ul>
<p>If the pulp is exposed in a vital tooth, ESE supports vital pulp treatment (pulp capping or pulpotomy with a calcium silicate cement under rubber dam) as an alternative to root canal treatment in suitable cases (see <a href="#n-resto-endo">endodontics</a>).</p>
<p><b>Minimal intervention principles:</b> detect early, assess risk, arrest and remineralise, repair rather than replace defective restorations where possible, and recall based on risk. Atraumatic restorative treatment (ART) with high-viscosity glass ionomer suits patients who can't tolerate conventional care.</p>
`, {
  spot: `A brown shadow under intact enamel (ICDAS 4); a deep lesion in a symptom-free vital tooth where the question asks how much caries to remove.`,
  trap: `Choosing complete caries removal to hard dentine over the pulp for a deep lesion; or restoring an arrested, shiny lesion.`,
  src: `ICDAS II criteria; ESE position statement on management of deep caries and the exposed pulp (2019); EFCD-ESE-ORCA S3 guideline on deep caries management (Schwendicke et al., Int Endod J, 2026); International Caries Consensus Collaboration (Schwendicke et al., 2016); NICE CG19 Dental recall (2004); DBOH v4 (2021).`
});

node('resto-mat', 'resto', 'Restorative materials', `Amalgam phase-down limits use in under-15s and pregnancy; GIC bonds chemically and releases fluoride; composite bonds micromechanically and needs isolation.`, `
<p><b>Amalgam phase-down.</b> The UK is a party to the Minamata Convention on Mercury (2013). Since 1 July 2018, under EU Regulation 2017/852 (retained in Great Britain law), dental amalgam should not be used for:</p>
<ul>
<li>deciduous teeth,</li>
<li>children under 15, and</li>
<li>pregnant or breastfeeding women,</li>
</ul>
<p>except when the dentist judges it strictly necessary because of the patient's specific medical needs. Amalgam must be pre-encapsulated, and practices need amalgam separators. Dispose of amalgam waste as hazardous waste. The EU has agreed a wider phase-out of dental amalgam from 2025; Northern Ireland follows EU mercury rules and is reported to hold a derogation, so check the Department of Health NI for the current position. In 2025 the Minamata Convention parties (COP-6) also agreed to end the use of dental amalgam by 2034, with an exemption where the dentist considers it necessary for the patient's needs. Explain to patients that existing sound amalgams don't need removing.</p>
<div class="scroll"><table class="t">
<tr><th></th><th>Glass ionomer cement (GIC)</th><th>Resin composite</th></tr>
<tr><td>Adhesion</td><td>Chemical (ionic) bond to calcium in enamel and dentine; condition with polyacrylic acid</td><td>Micromechanical, via acid etch and adhesive (hybrid layer)</td></tr>
<tr><td>Fluoride</td><td>Releases and recharges fluoride</td><td>Minimal</td></tr>
<tr><td>Strength and wear</td><td>Low; brittle; not for large load-bearing areas</td><td>Good; suitable for load-bearing posterior restorations</td></tr>
<tr><td>Moisture</td><td>Sensitive early (protect the surface); more tolerant at placement</td><td>Needs good isolation, ideally rubber dam</td></tr>
<tr><td>Shrinkage</td><td>Minimal; thermal expansion close to tooth</td><td>Polymerisation shrinkage and stress; place in increments of about 2 mm (bulk-fill materials allow deeper)</td></tr>
<tr><td>Typical uses</td><td>Primary teeth, high caries risk, root caries, cervical lesions, atraumatic restorative treatment (ART), lining (sandwich technique), luting, interim restorations</td><td>Most anterior and posterior restorations where isolation is possible; veneers; bonding indirect work</td></tr>
</table></div>
<p>Resin-modified GIC (RMGIC) adds light-cure, better early strength and less moisture sensitivity.</p>
<p><b>Bonding to tooth.</b></p>
<ul>
<li><b>Etch-and-rinse</b> (total etch): phosphoric acid (about 35 to 37%) on enamel and dentine, rinse, then primer and bond (three-step), or combined primer-bond (two-step). Don't over-dry dentine: collagen collapses.</li>
<li><b>Self-etch:</b> acidic primers that dissolve and incorporate the smear layer. Two-step self-etch systems perform well on dentine. Enamel bonding improves with <b>selective enamel etching</b>.</li>
<li><b>Universal adhesives</b> can be used in either mode.</li>
</ul>
<p>Enamel bonds are the most reliable. Dentine bonds are weaker and degrade over time. The configuration factor (C-factor: bonded to unbonded surfaces) is highest in Class I cavities, so shrinkage stress is greatest there.</p>
<p><b>Other materials:</b> calcium silicate cements such as mineral trioxide aggregate (MTA) and Biodentine for pulp capping, perforation repair and pulpotomy; calcium hydroxide (antibacterial, but soluble and weak); zinc oxide eugenol (sedative; eugenol inhibits composite setting, so avoid it under composite).</p>
`, {
  spot: `A 12-year-old or a pregnant patient needing a posterior restoration; a root caries lesion in an older patient with a dry mouth (GIC).`,
  trap: `Choosing amalgam for a child under 15 "because it lasts longer" when there is no specific medical need; or putting zinc oxide eugenol under a composite.`,
  src: `Minamata Convention on Mercury (2013); EU Regulation 2017/852, Article 10 (retained in GB); Department of Health and Social Care guidance on amalgam use; standard dental materials texts.`,
  check: `The Northern Ireland derogation was not confirmed from a government source; check the Department of Health NI before quoting it. The 2034 date comes from UNEP's summary of Minamata COP-6.`
});

node('resto-tsl', 'resto', 'Tooth surface loss', `Erosion is chemical, attrition tooth-on-tooth, abrasion a foreign object. Screen with BEWE; restore localised anterior wear using the Dahl concept.`, `
<div class="scroll"><table class="t">
<tr><th>Type</th><th>Cause</th><th>Signs</th></tr>
<tr><td><b>Erosion</b></td><td>Acid, not from bacteria. Extrinsic: carbonated and acidic drinks, fruit, wine, some medicines. Intrinsic: gastro-oesophageal reflux disease (GORD), vomiting (bulimia, pregnancy, alcohol misuse).</td><td>Smooth, glazed, shallow concavities; cupped cusps; restorations standing proud. Intrinsic acid hits the palatal surfaces of upper anterior teeth; dietary acid often the labial surfaces.</td></tr>
<tr><td><b>Attrition</b></td><td>Tooth-to-tooth contact, bruxism</td><td>Flat, shiny facets that match on opposing teeth; incisal and occlusal surfaces; fractured cusps</td></tr>
<tr><td><b>Abrasion</b></td><td>Foreign object: toothbrushing technique, abrasive paste, pipe, hair grips</td><td>Notched or V-shaped cervical lesions, often worse on canines and premolars</td></tr>
<tr><td><b>Abfraction</b></td><td>Proposed flexural stress at the neck of the tooth (still debated)</td><td>Sharp wedge-shaped cervical lesions</td></tr>
</table></div>
<p>Most wear is multifactorial, for example erosion softening enamel and brushing then removing it.</p>
<p><b>Basic Erosive Wear Examination (BEWE).</b> Examine all teeth in each sextant, score 0 to 3, and record only the highest score in each sextant: 0 no erosive wear; 1 initial loss of surface texture; 2 distinct defect, hard tissue loss under 50% of the surface area; 3 hard tissue loss of 50% or more. Add the six sextant scores. The total guides management. In the original bands, 2 or less is none, 3 to 8 low, 9 to 13 medium and 14 or more high risk: routine observation and advice at low totals, up to diet analysis, fluoridation and monitoring, ideally avoiding restorations unless wear progresses.</p>
<p><b>Management.</b></p>
<ul>
<li>Diagnose the cause: diet diary, medical and social history. Refer to the GP for suspected reflux or an eating disorder, discussed sensitively with consent.</li>
<li>Prevent: limit acids to mealtimes, drink through a straw, don't brush straight after acid, use a soft brush and fluoride toothpaste (high-fluoride if needed), and consider a night guard for bruxism.</li>
<li>Monitor with study models, photographs or intraoral scans and repeat BEWE scores.</li>
<li>Restore when there is sensitivity, function or aesthetic concern, or progression. Use additive, adhesive approaches first.</li>
</ul>
<p><b>Dahl concept.</b> For localised anterior wear with no space to restore: place direct composite (or an appliance) on the worn anterior teeth at an increased occlusal vertical dimension, leaving posterior teeth apart. Over the following months the anterior teeth intrude and posterior teeth erupt until contacts re-establish. Avoid in active periodontal disease, temporomandibular disorders, posterior implants or ankylosed teeth. Warn about temporary chewing difficulty and a lisp.</p>
`, {
  spot: `Smooth wear on the palatal surfaces of the upper incisors in a young woman (intrinsic erosion); matching flat facets in a bruxist (attrition); a notch at the cervical margin of an upper canine (abrasion).`,
  trap: `Calling cupped cusps and proud restorations "attrition"; or advising brushing straight after an acidic drink.`,
  src: `BEWE (Bartlett, Ganss and Lussi, 2008); Dahl, Krogstad and Karlsen (1975); British Society for Restorative Dentistry guidance on tooth wear; European consensus on erosive tooth wear (2015).`,
  check: `The BEWE bands are the original authors' cut-offs, which they describe as based on experience. The time to re-establish posterior contacts with Dahl (often quoted as 4 to 6 months) is not from a guideline.`
});

node('resto-endo', 'resto', 'Endodontics', `Standard pulpal and apical diagnoses, apex locator plus radiograph for length, hypochlorite under rubber dam, and a calm, recorded response to extrusion.`, `
<p><b>Diagnostic terms</b> (American Association of Endodontists consensus, widely used in the UK):</p>
<div class="scroll"><table class="t">
<tr><th>Pulpal</th><th>Clue</th><th>Apical</th><th>Clue</th></tr>
<tr><td>Normal pulp</td><td>Responds briefly to cold</td><td>Normal apical tissues</td><td>Not tender</td></tr>
<tr><td>Reversible pulpitis</td><td>Sharp pain to cold that stops when the stimulus is removed</td><td>Symptomatic apical periodontitis</td><td>Tender to bite or percussion</td></tr>
<tr><td>Symptomatic irreversible pulpitis</td><td>Lingering pain after cold, spontaneous or night pain, referred pain</td><td>Asymptomatic apical periodontitis</td><td>Apical radiolucency, no symptoms</td></tr>
<tr><td>Asymptomatic irreversible pulpitis</td><td>Deep caries into the pulp but no symptoms</td><td>Acute apical abscess</td><td>Rapid onset, pain, swelling</td></tr>
<tr><td>Pulp necrosis</td><td>No response to sensibility tests</td><td>Chronic apical abscess</td><td>Sinus tract, little discomfort</td></tr>
<tr><td>Previously treated / initiated</td><td>Root filled or pulp partly removed</td><td>Condensing osteitis</td><td>Diffuse apical radiopacity</td></tr>
</table></div>
<p><b>Rubber dam</b> is the expected standard of care for root canal treatment. It protects the airway, controls contamination and allows safe use of irrigants.</p>
<p><b>Working length.</b> Use an electronic apex locator, confirmed with a radiograph. Aim to end instrumentation and the root filling just short of the radiographic apex, close to the apical constriction.</p>
<p><b>Irrigants.</b></p>
<ul>
<li><b>Sodium hypochlorite (NaOCl):</b> main irrigant; dissolves organic tissue and is antimicrobial. The ESE S3 guideline (2023) allows NaOCl at about 1% to 5.25%, followed by EDTA.</li>
<li><b>Ethylenediaminetetraacetic acid (EDTA)</b> (about 17%): a chelator that removes the inorganic smear layer; used after shaping.</li>
<li><b>Chlorhexidine:</b> antimicrobial but doesn't dissolve tissue. Mixing it with NaOCl forms an orange-brown precipitate (parachloroaniline): flush between them with saline or water.</li>
<li>Activate with sonic or ultrasonic agitation. Use calcium hydroxide as an inter-appointment dressing.</li>
</ul>
<p><b>Hypochlorite incident (extrusion beyond the apex).</b> Signs: sudden severe pain, rapid swelling, bleeding from the canal, bruising and sometimes crepitus.</p>
<ol>
<li>Stop. Tell the patient what has happened and reassure them.</li>
<li>Let the canal bleed; irrigate gently with sterile saline if at all. Give local anaesthetic for pain.</li>
<li>Cold compresses first, then warm ones after a day or so. Analgesics. Consider antibiotics if infection risk is high.</li>
<li>Refer urgently to oral and maxillofacial surgery or the emergency department if swelling is extensive or the airway is at risk.</li>
<li>Record it, report it as a patient safety incident, follow the duty of candour (see <a href="#n-prof-concerns">duty of candour</a>) and review the patient.</li>
</ol>
<p><b>Prevention:</b> rubber dam, a side-vented needle placed 1 to 2 mm short of working length, never binding in the canal, gentle pressure, and care with open apices and perforations. Splash to the eye: irrigate with saline and refer to eye casualty.</p>
<p><b>Quality and outcome (ESE).</b> A good root filling is dense, without voids, tapered and ends close to the apical terminus, with a good coronal seal. Review clinically and radiographically at least at 1 year, and up to 4 years if healing is uncertain. The ESE S3 guideline (2023) sets out evidence on treating apical periodontitis, including vital pulp treatment and retreatment.</p>
`, {
  spot: `Pain on cold that lingers for minutes (irreversible pulpitis); sudden severe pain and facial swelling during irrigation (hypochlorite extrusion); orange-brown precipitate in the canal.`,
  trap: `Treating lingering pain as reversible pulpitis; or, after a hypochlorite extrusion, flushing hard with more irrigant or hiding the event from the patient.`,
  src: `ESE Quality guidelines for endodontic treatment (2006); ESE S3 guideline Treatment of pulpal and apical disease (Duncan et al., Int Endod J, 2023); ESE position statement on deep caries (2019); AAE Consensus Conference on diagnostic terminology (2009).`,

node('resto-ind', 'resto', 'Indirect restorations and occlusion', `Posterior root-filled teeth need cuspal coverage; posts retain cores but don't strengthen roots; a ferrule matters most; a shortened dental arch can be enough.`, `
<p><b>Crowns: when and which.</b> Indications include extensive loss of tooth tissue, cuspal coverage of root-filled posterior teeth, aesthetics and support for a bridge or denture. Options: full gold (minimal reduction, durable), metal-ceramic (strong, more reduction), lithium disilicate (aesthetic, can be bonded) and zirconia (strong, versatile).</p>
<div class="scroll"><table class="t">
<tr><th>Principle</th><th>Detail</th></tr>
<tr><td>Preparation taper</td><td>Total occlusal convergence of about 6 to 10 degrees (more in practice); less taper means more retention</td></tr>
<tr><td>Occlusal reduction</td><td>About 1.5 to 2 mm for ceramic and metal-ceramic (functional cusp bevel); less for gold</td></tr>
<tr><td>Ferrule</td><td>A band of sound dentine around the tooth, about 1.5 to 2 mm high; the single biggest factor in survival of root-filled teeth with posts</td></tr>
<tr><td>Post</td><td>Retains the core; does not strengthen the root. Keep about 4 to 5 mm of gutta-percha apically. Parallel posts are more retentive than tapered. Fibre posts have stiffness close to dentine.</td></tr>
<tr><td>Molars</td><td>Often need no post: use the pulp chamber for core retention (Nayyar core)</td></tr>
</table></div>
<p><b>Root-filled teeth.</b> Posterior root-filled teeth survive longer with cuspal coverage (onlay or crown). Anterior teeth with good remaining tissue can often be restored with composite alone. Place a good coronal seal quickly to prevent leakage.</p>
<p><b>Occlusion.</b></p>
<ul>
<li><b>Intercuspal position (ICP):</b> maximum intercuspation. <b>Retruded contact position (RCP):</b> first contact with the condyles in their retruded position. There is usually a small slide between them.</li>
<li><b>Conformative approach:</b> restore within the patient's existing ICP. This suits most single-unit work.</li>
<li><b>Reorganised approach:</b> build a new occlusion, usually at RCP, when the existing one is unsuitable or the vertical dimension must change. This needs facebow records, a semi-adjustable articulator and diagnostic wax-ups.</li>
<li>Lateral guidance: canine guidance or group function. Avoid interferences on the non-working side.</li>
</ul>
<p><b>Shortened dental arch (SDA).</b> Käyser's concept: an arch with intact anterior teeth and premolars (around 20 teeth, in occlusion) usually gives adequate chewing, comfort and appearance, especially in older adults. Replacing missing molars, particularly with a free-end saddle partial denture, often adds little. This fits the World Health Organization goal of keeping a functional natural dentition of at least 20 teeth throughout life. It is a useful option in treatment planning (see <a href="#n-prosth">replacement of teeth</a>).</p>
<p><b>Temporary crowns</b> protect the pulp, keep the tooth from moving and maintain gingival health. Take an impression or scan with good gingival retraction (retraction cord or paste) and record the occlusion before cementation or bonding.</p>
`, {
  spot: `A root-filled lower molar with intact marginal ridges asking about restoration (cuspal coverage); an older patient with premolars to premolars asking about replacing missing molars (SDA).`,
  trap: `Placing a post "to strengthen" a root-filled tooth, or planning a crown without a ferrule.`,
  src: `Käyser, J Oral Rehabil (1981) on the shortened dental arch; British Society for Restorative Dentistry guidance; standard fixed prosthodontics texts.`,
  check: `The figures for preparation taper, reduction and the 4 to 5 mm apical gutta-percha seal are textbook norms rather than guideline values; check your course text.`
});

node('prosth', 'clin', 'Replacement of teeth', `Choose between no replacement, partial or complete dentures, bridges and implants; know Kennedy classes, denture design steps and complications.`, `
<p>Replacing teeth starts with a question: does this gap need filling at all? A shortened dental arch may be enough (see <a href="#n-resto-ind">shortened dental arch</a>). If replacement is needed, weigh the patient's wishes, the health of the abutment teeth, periodontal status, bone, cost and maintenance.</p>
<ul>
<li><a href="#n-prosth-rpd">Removable partial and complete dentures</a>: Kennedy classification, design basics, freeway space and denture problems, denture stomatitis.</li>
<li><a href="#n-prosth-imp">Bridges and implants</a>: bridge types and pontics, implant indications and risks, peri-implant mucositis versus peri-implantitis.</li>
</ul>
<p>Periodontal stability comes first for any prosthesis: see <a href="#n-perio">periodontology</a>.</p>
`, {
  src: `Standard prosthodontics texts; 2017 World Workshop classification (peri-implant diseases); EFP S3 guideline on prevention and treatment of peri-implant diseases (2023); McGill consensus statement on overdentures (2002).`,
