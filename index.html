node('pharm', 'clin', 'Prescribing and pharmacology', 'Antibiotics only when they help, analgesics at safe doses, and the interactions that hurt patients.', `
<p>Prescribing questions test the right drug, dose, duration and the interaction you must spot. Prescribe within the Dental Practitioners' Formulary for NHS prescriptions and check the BNF every time.</p>
<ul>
<li><a href="#n-pharm-abx">Antibiotics and antimicrobial stewardship</a>: when to prescribe, first choices and regimens.</li>
<li><a href="#n-pharm-analg">Analgesics</a>: paracetamol, ibuprofen and combinations, doses and maximums.</li>
<li><a href="#n-pharm-int">Drug interactions and adverse effects</a>: warfarin, statins, azoles and oral side effects of medicines.</li>
</ul>
<p>A legal prescription is legible and includes the patient's details, the drug, strength, form, dose, frequency, duration and quantity, signed and dated.</p>
`, {
  spot: 'Stems describing infection, pain or a patient on a long drug list, asking for the most appropriate prescription.',
  trap: 'Prescribing an antibiotic for pain that needs local measures, or missing a warfarin interaction.',
  src: 'SDCEP Drug Prescribing for Dentistry (3rd ed, with updates); BNF; Dental Practitioners\' Formulary; FGDP(UK) Antimicrobial Prescribing in Dentistry.'
});

node('pharm-abx', 'pharm', 'Antibiotics and antimicrobial stewardship', 'Drain and remove the cause first; antibiotics only for spreading infection or systemic involvement; amoxicillin or phenoxymethylpenicillin first, for 5 days.', `
<p><b>Principle.</b> Most dental infections are treated by local measures: drainage, extraction or pulp extirpation. Antibiotics are an adjunct, not a substitute.</p>
<p><b>Prescribe when</b> there is spreading infection (cellulitis, lymph node involvement, diffuse swelling), systemic involvement (fever, malaise), or drainage is not possible, or the patient is immunocompromised. <b>Do not</b> prescribe for irreversible pulpitis, a localised abscess that can be drained, dry socket, or "just in case".</p>
<div class="scroll"><table class="t">
<tr><th>Drug</th><th>Adult regimen (SDCEP)</th><th>Notes</th></tr>
<tr><td>Phenoxymethylpenicillin</td><td>500 mg four times daily for up to 5 days</td><td>Narrow spectrum; drug of first choice (SDCEP)</td></tr>
<tr><td>Amoxicillin</td><td>500 mg three times daily for up to 5 days</td><td>Alternative first line, mainly where compliance with penicillin V is likely to be hard; 1 g three times daily in severe infection</td></tr>
<tr><td>Metronidazole</td><td>400 mg three times daily for up to 5 days</td><td>Anaerobes; the alternative in penicillin allergy, and an adjunct to penicillin in severe spreading infection or pyrexia; first choice for pericoronitis and necrotising gingivitis/periodontitis (3 days). No alcohol; do not prescribe with warfarin</td></tr>
<tr><td>Clarithromycin</td><td>500 mg twice daily for 5 days</td><td>Second line only (after first-line failure, with specialist advice or referral), not the routine penicillin-allergy choice. Do not prescribe with warfarin or statins (CYP3A4)</td></tr>
<tr><td>Clindamycin</td><td>Second line only: speak to a specialist or refer first (SDCEP regimen is 300 mg four times daily for 5 days)</td><td>High risk of <i>Clostridioides difficile</i> infection</td></tr>
</table></div>
<p><b>Review.</b> Review ideally at 3 days (SDCEP, May 2026 update); if systemic signs have resolved the patient can stop the antibiotic. Safety-net: return if symptoms worsen rapidly or do not improve. Severe infection that is spreading on antibiotics needs referral.</p>
<p><b>Refer urgently (same day, often to hospital)</b> if there are signs of sepsis, swelling threatening the airway, floor-of-mouth swelling or raised tongue (Ludwig's angina), difficulty swallowing or breathing, severe trismus, or periorbital spread. See <a href="#n-surg-inf">odontogenic infections</a>.</p>
<p><b>Children.</b> Dose by age or weight from the BNF for Children (BNFC). Use sugar-free liquids.</p>
<p><b>Stewardship.</b> Antimicrobial resistance is a national priority. Good practice: prescribe only when indicated, use the narrowest effective spectrum, shortest effective course, record the indication and duration, audit your prescribing, and explain to patients why an antibiotic is not needed. Dental prescriptions make up a notable share of UK primary care antibiotic prescribing.</p>
<p><b>Penicillin allergy.</b> Ask what happened. A true allergy (rash, swelling, anaphylaxis) rules out all penicillins; record it clearly. Intolerance (for example mild diarrhoea) is not allergy. In true penicillin allergy, metronidazole is the SDCEP alternative for a dental abscess.</p>
<p>For infective endocarditis prophylaxis see <a href="#n-med-other">medically compromised patients</a>.</p>
`, {
  spot: 'A patient with toothache and no swelling asking for antibiotics; or a diffuse facial swelling with fever where drainage is limited.',
  trap: 'Prescribing antibiotics for irreversible pulpitis; choosing clindamycin as routine penicillin-allergy cover; prescribing for 7 to 10 days by habit.',
  src: 'SDCEP Drug Prescribing for Dentistry (3rd ed, 2016, with later updates); FGDP(UK) Antimicrobial Prescribing in Dentistry (current edition); BNF and BNFC; UK national action plan on antimicrobial resistance.',
  check: 'Checked against the SDCEP Drug Prescribing for Dentistry website (bacterial infections section updated May 2026): adult regimens and the 3-day metronidazole course are confirmed; doxycycline is not an SDCEP option for dental abscess. Confirm age-banded children\'s doses in the BNFC.'
});

node('pharm-analg', 'pharm', 'Analgesics', 'Paracetamol 1 g four times daily (max 4 g), ibuprofen 400 mg four times daily (max 2.4 g); alternate them if one alone is not enough; no codeine under 12.', `
<p><b>Approach.</b> Treat the cause first. Analgesics are best taken regularly for the first day or two after surgery rather than "when needed". If paracetamol or ibuprofen alone is not effective, SDCEP advises alternating them (ibuprofen first, then paracetamol 2 hours later, and so on) within the normal daily dose of each.</p>
<div class="scroll"><table class="t">
<tr><th>Drug</th><th>Adult dose (SDCEP / BNF)</th><th>Key cautions</th></tr>
<tr><td>Paracetamol</td><td>1 g four times daily (at least 4 hours apart), max 4 g in 24 hours</td><td>Reduce dose if body weight under 50 kg, hepatic impairment, chronic alcohol use, malnutrition. Overdose: hepatotoxicity; refer to emergency department</td></tr>
<tr><td>Ibuprofen</td><td>400 mg four times daily after food, max 2.4 g a day (prescription dose)</td><td>Avoid or caution in asthma (NSAID-sensitive), peptic ulcer or GI bleed history, renal impairment, heart failure, anticoagulants, older people, pregnancy (especially third trimester)</td></tr>
<tr><td>Diclofenac</td><td>50 mg three times daily, max 150 mg a day</td><td>Higher cardiovascular risk; contraindicated in ischaemic heart disease, cerebrovascular and peripheral arterial disease, heart failure</td></tr>
<tr><td>Aspirin (analgesic)</td><td>600 mg (up to 900 mg in one dose) every 4 hours, max 4 g a day</td><td>Avoid under 16 (Reye\'s syndrome); do not prescribe after an extraction or other minor surgery; bleeding; NSAID cautions</td></tr>
<tr><td>Dihydrocodeine</td><td>30 mg every 4 to 6 hours</td><td>Little benefit in dental pain; constipation, drowsiness, dependence</td></tr>
</table></div>
<p><b>Children.</b> Paracetamol and ibuprofen are dosed by age band from the BNFC; use sugar-free suspensions. Codeine is contraindicated in children under 12 (MHRA, via the BNF) because of the risk of respiratory side effects; it is also contraindicated in ultra-rapid CYP2D6 metabolisers of any age and in breastfeeding mothers.</p>
<p><b>NSAID interactions.</b> Warfarin and DOACs (bleeding), SSRIs (GI bleeding), ACE inhibitors, angiotensin receptor blockers and diuretics (renal impairment), lithium and methotrexate (reduced excretion, toxicity), low-dose aspirin.</p>
<p><b>Pregnancy.</b> Paracetamol is the analgesic of choice. Avoid NSAIDs in the first and second trimesters unless essential, and avoid them in the third trimester; the MHRA advises extra antenatal monitoring if treatment is considered necessary from week 20 onwards (BNF).</p>
<p><b>Over-the-counter warning.</b> Ask what the patient has already taken. Many cold and flu products contain paracetamol, a common route to accidental overdose.</p>
<p><b>Neuropathic pain</b> (trigeminal neuralgia) does not respond to simple analgesics: carbamazepine is first line, usually started by a GP or specialist. See <a href="#n-omed-pain">orofacial pain</a>.</p>
`, {
  spot: 'A patient with post-extraction pain who has asthma, a history of GI bleeding or takes warfarin; or a child needing post-operative analgesia.',
  trap: 'Giving ibuprofen to a patient on warfarin or with NSAID-sensitive asthma; prescribing codeine for a child; exceeding 4 g of paracetamol by forgetting OTC products.',
  src: 'SDCEP Drug Prescribing for Dentistry; BNF and BNFC; MHRA advice on codeine and on NSAIDs in pregnancy as summarised in the BNF.',
  check: 'Dihydrocodeine 30 mg every 4 to 6 hours and the BNF pregnancy wording for NSAIDs are confirmed; confirm the dihydrocodeine maximum daily dose in the BNF.'
});

node('pharm-int', 'pharm', 'Drug interactions and adverse effects', 'Warfarin with miconazole, metronidazole, macrolides and azoles; clarithromycin with statins; plus drug-induced oral changes.', `
<p><b>Mechanism.</b> Most dangerous interactions in dentistry come from enzyme inhibition. Azole antifungals and macrolides inhibit cytochrome P450 enzymes (CYP3A4, CYP2C9), raising levels of warfarin, statins and other drugs.</p>
<div class="scroll"><table class="t">
<tr><th>Dental drug</th><th>Interacts with</th><th>Effect and action</th></tr>
<tr><td>Miconazole (oral gel or tablets)</td><td>Warfarin</td><td>Marked rise in INR and bleeding, including from oral gel. Avoid; use nystatin instead</td></tr>
<tr><td>Miconazole</td><td>Simvastatin</td><td>Raised statin levels, myopathy. Avoid</td></tr>
<tr><td>Fluconazole</td><td>Warfarin, statins, sulfonylureas, phenytoin, QT-prolonging drugs</td><td>Raised levels and INR rise; SDCEP: do not prescribe azoles to patients taking statins, warfarin or theophylline</td></tr>
<tr><td>Metronidazole</td><td>Warfarin</td><td>Raised INR; SDCEP says do not prescribe (BNF: monitor INR and adjust warfarin dose if unavoidable)</td></tr>
<tr><td>Metronidazole</td><td>Alcohol</td><td>Disulfiram-like reaction; avoid alcohol during and for 48 hours after the course</td></tr>
<tr><td>Clarithromycin / erythromycin</td><td>Statins (simvastatin, atorvastatin)</td><td>Rhabdomyolysis; BNF says avoid with simvastatin (atorvastatin: avoid or adjust dose) and SDCEP says do not prescribe macrolides to patients taking statins. Choose another antibiotic; stopping the statin is a GP decision</td></tr>
<tr><td>Clarithromycin</td><td>Warfarin, DOACs, calcium channel blockers, QT-prolonging drugs</td><td>Raised levels and bleeding or hypotension risk</td></tr>
<tr><td>Amoxicillin / other antibiotics</td><td>Warfarin</td><td>INR can change; advise extra monitoring if long course</td></tr>
<tr><td>NSAIDs</td><td>Warfarin, DOACs, SSRIs, lithium, methotrexate, ACE inhibitors</td><td>Bleeding, toxicity or renal impairment</td></tr>
<tr><td>Adrenaline in local anaesthetic</td><td>Non-selective beta-blockers (propranolol), tricyclic antidepressants</td><td>Hypertension with reflex bradycardia (beta-blockers); arrhythmia risk. Limit dose and aspirate</td></tr>
</table></div>
<p><b>Drug-induced oral adverse effects.</b></p>
<ul>
<li><b>Gingival overgrowth:</b> phenytoin, ciclosporin, calcium channel blockers (nifedipine, amlodipine).</li>
<li><b>Dry mouth:</b> antimuscarinics, tricyclics, antihistamines, diuretics, antipsychotics.</li>
<li><b>Lichenoid reactions:</b> NSAIDs, beta-blockers, ACE inhibitors, antimalarials, gold.</li>
<li><b>Ulceration:</b> nicorandil, methotrexate, NSAIDs, cytotoxics.</li>
<li><b>Angio-oedema:</b> ACE inhibitors (can occur after years).</li>
<li><b>Osteonecrosis:</b> bisphosphonates, denosumab, anti-angiogenics (see <a href="#n-med-mronj">MRONJ</a>).</li>
<li><b>Taste disturbance:</b> metronidazole, clarithromycin; <b>staining:</b> tetracyclines (avoid under 12 and in pregnancy), chlorhexidine.</li>
<li><b>Candidiasis:</b> inhaled steroids (rinse after use), broad-spectrum antibiotics.</li>
</ul>
<p><b>Report</b> suspected adverse drug reactions through the MHRA Yellow Card scheme.</p>
`, {
  spot: 'A patient on warfarin with denture stomatitis, or a patient on simvastatin who needs an antibiotic and is allergic to penicillin.',
  trap: 'Prescribing miconazole oral gel to a warfarin patient because it is "only topical", or clarithromycin to a patient on simvastatin.',
  src: 'BNF Appendix 1 (interactions); MHRA Drug Safety Update on miconazole and warfarin (2016); SDCEP Drug Prescribing for Dentistry; MHRA Yellow Card scheme.'
});

/* ===================== PAIN AND ANXIETY CONTROL ===================== */

node('pain', 'clin', 'Local anaesthesia, sedation and GA', 'Local anaesthetic doses and complications, conscious sedation to IACSD standards, and when to refer for general anaesthesia.', `
<p>This section covers pain and anxiety control from the cartridge to the operating theatre.</p>
<ul>
<li><a href="#n-pain-la">Local anaesthetics: doses and complications</a>: maximum doses, cartridge maths, toxicity, nerve injury.</li>
<li><a href="#n-pain-sed">Conscious sedation and GA referral</a>: IACSD standards, inhalation and IV sedation, reversal, GA setting.</li>
</ul>
<p>Expect at least one calculation question: weight times mg/kg, divided by mg per cartridge. Also expect questions on recognising local anaesthetic toxicity, managing a facial nerve palsy after a block, choosing between inhalation and intravenous sedation, and reversing over-sedation. Part 2 may test consent for sedation or explaining a GA referral to a parent.</p>
`, {
  spot: 'A child\'s weight and a cartridge type with a lead-in asking for the maximum number of cartridges.',
  trap: 'Forgetting that a 2% solution is 20 mg/mL.',
  src: 'BNF; manufacturers\' summaries of product characteristics; IACSD Standards for Conscious Sedation in the Provision of Dental Care.'
});

node('pain-la', 'pain', 'Local anaesthetics: doses and complications', 'Percentage times 10 gives mg/mL; multiply by cartridge volume; compare with weight-based maximum. Know toxicity signs and nerve-injury risks.', `
<p><b>Cartridge maths.</b> A 1% solution contains 10 mg/mL, so 2% = 20 mg/mL, 3% = 30 mg/mL, 4% = 40 mg/mL. Multiply by the cartridge volume (2.2 mL is standard in the UK; some are 1.7 or 1.8 mL: read the cartridge).</p>
<div class="scroll"><table class="t">
<tr><th>Agent</th><th>mg per 2.2 mL cartridge</th><th>Commonly taught maximum</th><th>Notes</th></tr>
<tr><td>Lidocaine 2% with adrenaline 1:80,000</td><td>44 mg</td><td>4.4 mg/kg (absolute max about 300 mg) in many dental texts; the general UK lidocaine SmPC allows up to 7 mg/kg with adrenaline (max 500 mg)</td><td>Amide; standard; used in pregnancy when needed (BNF: benefit outweighs risk)</td></tr>
<tr><td>Articaine 4% with adrenaline 1:100,000</td><td>88 mg</td><td>7 mg/kg (max 500 mg); check the product SmPC</td><td>Thiophene ring and ester side chain; metabolised in plasma; not recommended under 4 years (check SmPC); paraesthesia reports with blocks</td></tr>
<tr><td>Prilocaine 3% with felypressin</td><td>66 mg</td><td>6 mg/kg in some dental texts; the general prilocaine SmPC gives max 400 mg in adults and up to 5 mg/kg in children</td><td>Methaemoglobinaemia (more likely with large doses, anaemia, infants); often avoided in pregnancy (the prilocaine SmPC prefers avoiding it in early pregnancy; felypressin is oxytocic in theory)</td></tr>
<tr><td>Mepivacaine 3% plain</td><td>66 mg</td><td>4.4 mg/kg (max 300 mg) in some dental texts; BNF says consult expert dental sources</td><td>No vasoconstrictor; short duration</td></tr>
</table></div>
<p><b>Worked examples</b> (using the commonly taught figures; in the exam the stem gives the figure to use). 20 kg child, lidocaine 2%: 20 x 4.4 = 88 mg; 88 / 44 = 2 cartridges. 70 kg adult, lidocaine: 70 x 4.4 = 308 mg, capped at about 300 mg; 300 / 44 = about 6.8, so 6 full cartridges. 70 kg adult, prilocaine 3%: 70 x 6 = 420, capped at 400 mg; 400 / 66 = 6 cartridges.</p>
<p><b>Adrenaline.</b> 1:80,000 = 12.5 micrograms/mL, about 27.5 micrograms per 2.2 mL cartridge. Use the smallest effective dose with aspiration in cardiovascular disease and with non-selective beta-blockers or tricyclics.</p>
<p><b>Systemic toxicity.</b> Circumoral tingling, light-headedness, tinnitus, slurred speech, twitching, drowsiness, then seizures, respiratory depression and cardiovascular collapse. Stop, call for help, ABCDE, oxygen, treat seizures; lipid emulsion is given in hospital. Prevent with aspiration, slow injection and dose limits.</p>
<p><b>Local complications.</b></p>
<ul>
<li><b>Failure:</b> wrong technique, anatomical variation, infection (low pH). Try a different technique (Gow-Gates, intraligamentary, articaine buccal infiltration).</li>
<li><b>Facial nerve palsy:</b> inferior alveolar nerve block given too far posteriorly into the parotid. Eye cannot close: protect the cornea with a patch; reassure; resolves within hours.</li>
<li><b>Prolonged numbness (paraesthesia):</b> usually lingual nerve after IANB; record, review, refer if not improving.</li>
<li><b>Haematoma, trismus, needle breakage, self-inflicted bite injury in children</b> (warn parents), intravascular injection.</li>
<li><b>Allergy</b> to amide anaesthetics is very rare; reactions are usually to adrenaline, anxiety, or preservatives (latex in older cartridges).</li>
</ul>
`, {
  spot: 'A child of stated weight needing extractions: lead-in asks the maximum number of cartridges of a named solution.',
  trap: 'Using 2 mg/mL instead of 20 mg/mL for 2%; forgetting the absolute maximum in a heavy adult; giving prilocaine with felypressin to a pregnant patient.',
  src: 'BNF; manufacturers\' summaries of product characteristics (SmPCs); standard UK local anaesthesia texts.',
  check: 'The BNF gives no dental mg/kg limits (it refers to expert dental sources). General UK lidocaine SmPCs give 4.5 mg/kg plain (300 mg) and 7 mg/kg with adrenaline (500 mg); 4.4 mg/kg is a dental-textbook figure. Say which source you use, and in the exam use the figure the stem gives. Confirm against the SmPC of the product you use, and confirm cartridge volume for articaine products (1.7 or 2.2 mL) on the pack.'
});

node('pain-sed', 'pain', 'Conscious sedation and GA referral', 'IACSD standards: verbal contact maintained, standard techniques are N2O/O2 and IV midazolam, flumazenil for reversal, GA only in hospital.', `
<p><b>Definition.</b> Conscious sedation is drug-induced depression of the central nervous system that allows treatment while verbal contact is maintained throughout, with a wide margin of safety that makes loss of consciousness unlikely. If verbal contact is lost, it is no longer conscious sedation.</p>
<p><b>Assessment.</b> Indication (dental anxiety, gag reflex, difficult procedure), medical history and ASA grade (primary care usually ASA I and II), weight and BMI, airway, escort availability, written consent obtained at a separate appointment where practicable.</p>
<div class="scroll"><table class="t">
<tr><th></th><th>Inhalation sedation (IHS)</th><th>IV midazolam</th></tr>
<tr><td>Agent</td><td>Nitrous oxide with oxygen; titrated, typically 20 to 40% N2O; machine delivers at least 30% oxygen</td><td>Midazolam titrated in increments until the sedation end point</td></tr>
<tr><td>Main use</td><td>Children and mildly anxious adults</td><td>Anxious adults (and older adolescents)</td></tr>
<tr><td>Monitoring</td><td>Clinical observation; pulse oximetry as appropriate</td><td>Clinical observation, continuous pulse oximetry, blood pressure before, during and after; cannula left in until discharge</td></tr>
<tr><td>Recovery</td><td>Rapid; 100% oxygen at the end</td><td>Amnesia; residual sedation for hours</td></tr>
<tr><td>Escort</td><td>Children always; adults often not needed</td><td>Responsible adult escort; no driving, machinery, alcohol, or legal decisions for the rest of the day (commonly 24 hours)</td></tr>
<tr><td>Reversal</td><td>Stop N2O, give oxygen</td><td>Flumazenil IV 200 micrograms over 15 seconds, then 100 micrograms at 1-minute intervals if needed. Short half-life: watch for re-sedation</td></tr>
</table></div>
<p><b>IHS contraindications</b> include nasal obstruction or cold, severe respiratory disease, first trimester of pregnancy, recent middle ear or eye surgery with gas, and inability to cooperate with a nasal hood. Use active scavenging to protect staff; chronic N2O exposure affects vitamin B12 metabolism.</p>
<p><b>IACSD essentials.</b> A trained sedation team: the sedationist plus a second appropriately trained person present throughout. Standard techniques are IHS and IV midazolam alone (and oral or transmucosal midazolam); anything else (combinations, propofol, IV sedation in younger children) is "advanced" and needs extra training and setting. Emergency drugs, oxygen, suction and flumazenil must be immediately available. Record drugs, doses, times and monitoring.</p>
<p><b>General anaesthesia.</b> Since the end of 2001, dental GA in the UK may only be given in a hospital with critical care facilities. Refer when sedation is not suitable or has failed: very young or uncooperative children needing extensive treatment, some patients with learning disabilities, complex surgery. Plan comprehensively (with radiographs where possible) so a repeat GA is not needed; consider extraction of poor-prognosis teeth and, with orthodontic advice, balancing or compensating extractions.</p>
`, {
  spot: 'An anxious adult with a medical history asking for sedation; an over-sedated patient after IV midazolam; a child refusing a nasal hood.',
  trap: 'Choosing naloxone instead of flumazenil to reverse midazolam; thinking GA can be given in a dental practice; accepting loss of verbal contact as "deep conscious sedation".',
  src: 'Intercollegiate Advisory Committee for Sedation in Dentistry (IACSD): Standards for Conscious Sedation in the Provision of Dental Care (2015, updated 2020); BNF (midazolam, flumazenil); Department of Health A Conscious Decision (2000); SDCEP Conscious Sedation in Dentistry (Scotland).',
  check: 'Confirm in the current IACSD standards: the age limits for IV midazolam as a standard technique, capnography requirements, fasting advice, post-sedation restrictions (rest of day versus 24 hours), and sedation CPD requirements. Confirm flumazenil dosing in the BNF.'
});

/* ===================== MEDICALLY COMPROMISED ===================== */

node('medcomp', 'clin', 'Medically compromised patients', 'Bleeding risk, antiresorptives, radiotherapy and common conditions: the medical factors that change how you treat.', `
<p>Many SBA stems hinge on one line of the medical history. Know which conditions need a change of plan and which do not.</p>
<ul>
<li><a href="#n-med-bleed">Anticoagulants, antiplatelets, bleeding disorders</a>: SDCEP 2022 rules for warfarin, DOACs and antiplatelets.</li>
<li><a href="#n-med-mronj">Antiresorptives, MRONJ and head and neck radiotherapy</a>: risk groups and prevention.</li>
<li><a href="#n-med-other">Diabetes, cardiac, pregnancy, steroids and more</a>: endocarditis, adrenal crisis, pregnancy and other common conditions.</li>
</ul>
<p>Default rule: most patients are treated in primary care with planning, local measures and good communication with their doctor. Do not stop a medicine without the prescriber's agreement.</p>
`, {
  spot: 'A routine extraction or scale in a patient whose stem lists a drug or condition.',
  trap: 'Stopping antiplatelets or anticoagulants, or giving antibiotic prophylaxis by habit.',
  src: 'SDCEP Management of Dental Patients Taking Anticoagulants or Antiplatelet Drugs (2nd ed, 2022); SDCEP Oral Health Management of Patients at Risk of MRONJ (2017); NICE CG64.'
});

node('med-bleed', 'medcomp', 'Anticoagulants, antiplatelets, bleeding disorders', 'Warfarin: treat if INR below 4. DOACs: miss or delay the morning dose for higher-risk procedures. Never stop antiplatelets.', `
<p><b>SDCEP 2022 principle.</b> For most patients the risk of stopping an anticoagulant (stroke, embolism) is greater than the risk of oral bleeding, which can be managed with local measures.</p>
<p><b>Bleeding risk of procedures.</b></p>
<ul>
<li><b>Unlikely to cause bleeding:</b> local anaesthetic infiltration, BPE, supragingival scaling, restorations with supragingival margins, impressions.</li>
<li><b>Low risk:</b> simple extractions (1 to 3 teeth, small wound), incision and drainage, 6-point pocket charting, root surface debridement, restorations with subgingival margins.</li>
<li><b>Higher risk:</b> complex or adjacent extractions with a large wound, more than 3 extractions at once, flap raising, surgical extractions, periodontal surgery, implant surgery, biopsies.</li>
</ul>
<div class="scroll"><table class="t">
<tr><th>Drug</th><th>What to do</th></tr>
<tr><td>Warfarin (vitamin K antagonist)</td><td>Check INR, ideally within 24 hours before treatment (up to 72 hours if INR is stable). INR below 4: treat without interrupting warfarin, with local measures. INR 4 or above: delay invasive treatment or refer</td></tr>
<tr><td>Twice-daily DOAC (apixaban, dabigatran)</td><td>Low risk: treat without interruption. Higher risk: miss the morning dose, take the evening dose as usual (no earlier than 4 hours after haemostasis)</td></tr>
<tr><td>Once-daily DOAC (rivaroxaban, edoxaban)</td><td>Low risk: treat without interruption. Higher risk: if taken in the morning, delay it until 4 hours after haemostasis; if taken in the evening, take it at the usual time (no earlier than 4 hours after haemostasis)</td></tr>
<tr><td>Antiplatelets (aspirin, clopidogrel, prasugrel, ticagrelor, dipyridamole), single or dual</td><td>Do not stop. Treat with local measures; expect more prolonged bleeding with dual therapy; limit the treatment area</td></tr>
<tr><td>Injectable anticoagulants (low molecular weight heparin)</td><td>Prophylactic (low) dose: treat without interrupting it. Treatment dose, or dose unclear: consult the prescriber before any procedure likely to cause bleeding</td></tr>
</table></div>
<p><b>Practical measures.</b> Treat early in the day and early in the week. Limit the area (staged treatment). Pack sockets with oxidised cellulose or collagen, suture, and use gauze pressure. SDCEP does not advise primary care dentists to prescribe tranexamic acid mouthwash (off-label, not on the NHS dental list); if the patient's doctor prescribes it, use it in addition to local measures. Give written post-operative advice and an out-of-hours contact. Avoid NSAIDs for analgesia (use paracetamol) and watch interactions (see <a href="#n-pharm-int">interactions</a>).</p>
<p><b>Inherited bleeding disorders.</b> Von Willebrand disease is the commonest. Haemophilia A (factor VIII deficiency) and B (factor IX, Christmas disease) are X-linked. Liaise with the patient's haemophilia centre before any invasive treatment. Avoid inferior alveolar nerve blocks without factor cover (risk of haematoma in the pterygomandibular space spreading to the airway); use buccal infiltration (articaine) or intraligamentary injection. Desmopressin may be used in mild haemophilia A and type 1 von Willebrand disease, under specialist direction.</p>
<p><b>Other causes of bleeding.</b> Liver disease, renal failure, thrombocytopenia (chemotherapy, leukaemia), alcohol excess. Unexplained bleeding or petechiae need a full blood count via the GP.</p>
`, {
  spot: 'A patient on apixaban, rivaroxaban or warfarin needing extractions; or a patient on dual antiplatelets after a stent.',
  trap: 'Advising the patient to stop clopidogrel or aspirin for 5 to 7 days; missing the evening apixaban dose; extracting on warfarin without a recent INR.',
  src: 'SDCEP Management of Dental Patients Taking Anticoagulants or Antiplatelet Drugs (2nd ed, 2022); UK Haemophilia Centre Doctors\' Organisation guidance.',
  check: 'The haemophilia and von Willebrand advice above is not covered by SDCEP: agree it with the treating haemophilia centre.'
});

node('med-mronj', 'medcomp', 'Antiresorptives, MRONJ and head and neck radiotherapy', 'MRONJ: exposed bone over 8 weeks after antiresorptive or anti-angiogenic drugs. Cancer patients are higher risk. Prevention and risk communication are key.', `
<p><b>Definition.</b> Medication-related osteonecrosis of the jaw (MRONJ): exposed bone, or bone that can be probed through a fistula, in the maxillofacial region, persisting for more than 8 weeks, in a patient with current or previous antiresorptive or anti-angiogenic treatment and no history of radiotherapy to the jaws or metastatic disease of the jaws.</p>
<p><b>Drugs.</b> Bisphosphonates (oral alendronic acid, risedronate; IV zoledronic acid, ibandronic acid), denosumab (6-monthly for osteoporosis; monthly for bone metastases), anti-angiogenics (for example bevacizumab, sunitinib).</p>
<div class="scroll"><table class="t">
<tr><th>Risk group (SDCEP 2017)</th><th>Who</th></tr>
<tr><td>Low risk</td><td>Osteoporosis or other non-malignant bone disease treated with: oral bisphosphonates for under 5 years, or quarterly or yearly IV bisphosphonates for under 5 years, or denosumab; and not on systemic glucocorticoids</td></tr>
<tr><td>Higher risk</td><td>Non-malignant bone disease with oral or IV bisphosphonates for 5 years or more, or any duration with concurrent systemic glucocorticoids. Anyone treated with antiresorptive or anti-angiogenic drugs for cancer. Anyone with a previous MRONJ diagnosis</td></tr>
</table></div>
<p><b>Management (SDCEP).</b></p>
<ul>
<li>Ideally, get the mouth dentally fit before the drug starts; that is when the prescriber should refer.</li>
<li>Prevention: high-fluoride toothpaste, diet advice, regular review; check dentures for trauma.</li>
<li>Explain the risk honestly, record the conversation, and note it is small for low-risk patients.</li>
<li>If extraction is the best option, do it in primary care with care to minimise trauma. SDCEP found no evidence that a bisphosphonate drug holiday lowers the risk (any holiday is the prescriber's decision), and does not advise antibiotic or antiseptic prophylaxis to prevent MRONJ.</li>
<li>Review healing; refer if bone is exposed at 8 weeks or MRONJ is suspected.</li>
</ul>
<p><b>Osteoradionecrosis (ORN) after head and neck radiotherapy.</b> Irradiated bone becomes hypovascular, hypocellular and hypoxic. ORN is exposed irradiated bone that fails to heal (commonly defined as over 3 months) without residual tumour. Risk is lifelong, higher in the mandible, with higher doses (typically above 50 to 60 Gy to the bone), and with post-radiotherapy extractions, smoking and alcohol.</p>
<ul>
<li><b>Before radiotherapy:</b> urgent dental assessment; extract teeth with poor prognosis early enough to allow healing before treatment starts.</li>
<li><b>After radiotherapy:</b> intensive prevention (5,000 ppm toothpaste, fluoride varnish or trays, diet), manage dry mouth, candida and mucositis, trismus exercises. Avoid extractions where possible; root-treat and decoronate instead. Extractions in irradiated bone are planned with the specialist team.</li>
</ul>
`, {
  spot: 'A woman on alendronic acid for 7 years, or a patient on zoledronic acid for breast cancer, needs an extraction; or a patient post head and neck radiotherapy has a carious lower molar.',
  trap: 'Advising a bisphosphonate "drug holiday" or routine antibiotic prophylaxis; refusing all extractions in low-risk patients; extracting in irradiated mandible in practice when root treatment is possible.',
  src: 'SDCEP Oral Health Management of Patients at Risk of Medication-related Osteonecrosis of the Jaw (2017); AAOMS position paper on MRONJ (2022 update); Restorative Dentistry UK / BAOMS guidance on head and neck cancer dental care.',
  check: 'Confirm the ORN radiation dose threshold and the recommended interval between pre-radiotherapy extractions and the start of radiotherapy (often quoted as about 10 to 14 days) in current head and neck oncology guidance. SDCEP reviewed its 2017 MRONJ guidance in March 2024 and kept it current, with a supplement on incidence and other drugs.'
});

node('med-other', 'medcomp', 'Diabetes, cardiac, pregnancy, steroids and more', 'Diabetes and perio link both ways; NICE CG64 says no routine endocarditis prophylaxis; treat in the second trimester; prevent adrenal crisis.', `
<div class="scroll"><table class="t">
<tr><th>Condition</th><th>Key dental facts</th></tr>
<tr><td>Diabetes</td><td>Two-way link with periodontitis: periodontal treatment can lower HbA1c modestly. HbA1c targets are usually 48 mmol/mol, or 53 mmol/mol if on drugs that cause hypoglycaemia. Book after a meal, keep usual medication, have glucose ready. Poor control: slower healing, infection risk, candida, dry mouth</td></tr>
<tr><td>Infective endocarditis (NICE CG64)</td><td>Antibiotic prophylaxis is not routinely recommended for dental procedures. Chlorhexidine mouthwash is not recommended. NICE still says prophylaxis is not routine, but SDCEP implementation advice (2nd edition, March 2026) now recommends antibiotic prophylaxis for high-risk patients (previous endocarditis; prosthetic valves or valve repair material; transcatheter valve prostheses; untreated or palliated cyanotic congenital heart disease; ventricular assist devices) before extractions and oral surgery, and says to consider it for other procedures that manipulate the gingiva or periapical region, after shared decision-making. It is not needed for moderate-risk groups (for example rheumatic or degenerative valve disease, bicuspid valve, hypertrophic cardiomyopathy) unless their cardiac team asks for it. Record the discussion. Emphasise excellent oral health and prompt treatment of infection</td></tr>
<tr><td>Ischaemic heart disease, hypertension</td><td>Short, low-stress appointments; adequate analgesia; aspirate and limit adrenaline. Defer elective treatment for markedly raised blood pressure or recent MI or unstable angina (seek medical advice)</td></tr>
<tr><td>Pregnancy</td><td>Elective treatment is best in the second trimester. In the third trimester avoid lying flat (supine hypotension): tilt to the left. Lidocaine with adrenaline is safe; avoid prilocaine with felypressin, NSAIDs, tetracyclines, and high-dose metronidazole regimens. Justified radiographs are acceptable. Pregnancy gingivitis and pyogenic granuloma (pregnancy epulis). Free NHS dental care in England during pregnancy and for 12 months after birth</td></tr>
<tr><td>Corticosteroids and adrenal insufficiency</td><td>Risk of adrenal crisis under stress in people with adrenal insufficiency or on long-term steroids. Routine dental treatment under local anaesthetic usually needs no extra steroid; patients should not miss doses. Follow sick-day rules and specialist advice for surgery, GA or infection. Crisis: hypotension, collapse, confusion, vomiting: lie flat, call 999, hydrocortisone 100 mg IM. Patients may carry an NHS Steroid Emergency Card</td></tr>
<tr><td>Epilepsy</td><td>Ask about type, frequency, triggers and control. Gingival overgrowth with phenytoin. Midazolam for prolonged seizures</td></tr>
<tr><td>Renal disease</td><td>Avoid NSAIDs; adjust renally excreted drugs; bleeding tendency; dialysis patients: treat on non-dialysis days (heparin)</td></tr>
<tr><td>Liver disease</td><td>Bleeding risk (clotting factors); reduce paracetamol dose; caution with drugs metabolised by the liver</td></tr>
<tr><td>Immunosuppression (transplant, chemotherapy, HIV)</td><td>Infection risk; check blood counts before invasive treatment during chemotherapy; candidiasis; gingival overgrowth with ciclosporin</td></tr>
<tr><td>Allergy (latex, penicillin, chlorhexidine)</td><td>Record and flag. Chlorhexidine can cause anaphylaxis</td></tr>
</table></div>
<p>When unsure, liaise with the patient's GP or specialist, and record the advice. Fitness for sedation: see <a href="#n-exam-hx">ASA grades</a>.</p>
`, {
  spot: 'A patient with a prosthetic heart valve booked for extraction; a pregnant woman at 34 weeks who feels faint lying back; a patient on long-term prednisolone who collapses.',
  trap: 'Prescribing amoxicillin 3 g prophylaxis routinely for heart conditions; scheduling elective treatment in the first trimester; telling a steroid-dependent patient to skip their dose before treatment.',
  src: 'NICE CG64 Prophylaxis against infective endocarditis (2008, updated 2016); SDCEP Antibiotic Prophylaxis Against Infective Endocarditis implementation advice (2018); NICE NG28 Type 2 diabetes; Society for Endocrinology adrenal crisis and steroid emergency card guidance (2020); BSP/EFP consensus on periodontitis and diabetes.',
  check: 'SDCEP 2026 oral regimen for high-risk adults: amoxicillin 2 g (or the 3 g sachet) 30 to 60 minutes before the procedure; clarithromycin or azithromycin 500 mg if penicillin-allergic (clindamycin is no longer listed). Check the BNF for interactions. Confirm the steroid dose/duration that defines adrenal crisis risk (often prednisolone 5 mg daily or more for 4 weeks or more) in current Society for Endocrinology guidance, and the blood pressure threshold for deferring elective treatment in local guidance.'
});

node('perio', 'clin', 'Periodontology', `Screen with the BPE, diagnose with the 2017 classification (stage, grade, status), then treat in the four S3 steps.`, `
<p>Periodontology questions follow one pathway. You screen with the basic periodontal examination (BPE), you diagnose using the 2017 World Workshop classification as implemented by the British Society of Periodontology (BSP), and you treat using the BSP UK version of the European Federation of Periodontology (EFP) S3 guideline.</p>
<ul>
<li><a href="#n-perio-bpe">BPE and periodontal assessment</a>: codes 0 to 4 and *, what each code triggers, and the simplified BPE for under-18s.</li>
<li><a href="#n-perio-class">2017 classification</a>: health versus gingivitis, the BSP flowchart, staging by bone loss, grading by bone loss divided by age, and current status.</li>
<li><a href="#n-perio-tx">Treatment steps</a>: steps 1 to 4, adjuncts, re-evaluation, supportive care and the role of hygienists and therapists.</li>
</ul>
<p>Most SBA stems give you a BPE grid or a radiograph and the patient's age. Work out the code, the stage and the grade, and then choose the step of care.</p>
`, {
  src: `BSP Basic Periodontal Examination guidance (revised 2019); BSP implementation of the 2017 World Workshop classification (2019); BSP/BSPD guidance on periodontal screening in under-18s (2021); BSP UK version of the EFP S3 treatment guideline (2020).`,
  spot: `A BPE grid, a radiograph showing bone loss with an age, or a question about what to do next for a patient with pockets.`,
  trap: `Mixing up staging (how much bone is lost) with grading (how fast it was lost).`
});

node('perio-bpe', 'perio', 'BPE and periodontal assessment', `BPE codes 0 to 4 and * each carry a set action; under-18s get a simplified BPE on six index teeth.`, `
<p>The basic periodontal examination (BPE) is a screening tool. It tells you whether further assessment is needed. It is not a diagnosis. Use a World Health Organization (WHO) probe with a 0.5 mm ball end and a black band from 3.5 to 5.5 mm. Walk the probe around every tooth in each sextant (upper right 17 to 14, upper anterior 13 to 23, upper left 24 to 27, and the same in the lower arch) and record the highest code per sextant. Third molars count only if the first or second molars are missing. A sextant needs at least two teeth to be recorded. Use a light probing force (20 to 25 g).</p>
<div class="scroll"><table class="t">
<tr><th>Code</th><th>Finding</th><th>Action (BSP 2019)</th></tr>
<tr><td>0</td><td>Pockets under 3.5 mm, no bleeding, no calculus or overhangs. Black band fully visible.</td><td>No periodontal treatment needed.</td></tr>
<tr><td>1</td><td>As 0, but bleeding on probing.</td><td>Oral hygiene instruction (OHI).</td></tr>
<tr><td>2</td><td>Calculus or other plaque-retentive factor (for example an overhang). Black band fully visible.</td><td>OHI and removal of plaque-retentive factors, including supra- and subgingival calculus.</td></tr>
<tr><td>3</td><td>Black band partly visible: pocket 3.5 to 5.5 mm.</td><td>OHI, root surface debridement (RSD) as needed. Radiographs to assess bone levels. After initial therapy, a six-point pocket chart (6PPC) of that sextant.</td></tr>
<tr><td>4</td><td>Black band disappears: pocket 6 mm or more.</td><td>OHI, RSD, radiographs, full-mouth 6PPC. Assess complexity and consider referral.</td></tr>
<tr><td>*</td><td>Furcation involvement (added to the number, for example 3*).</td><td>Treat according to the code it is attached to (so 3* gets the code 3 actions). Assess the need for more complex treatment; specialist referral may be indicated. Only a code 4 triggers a full-mouth 6PPC.</td></tr>
</table></div>
<p><b>Under-18s.</b> The BSP and the British Society of Paediatric Dentistry (BSPD) recommend a simplified BPE from age 7, using six index teeth: UR6, UR1, UL6, LL6, LL1 and LR6.</p>
<ul>
<li><b>Age 7 to 11:</b> use codes 0, 1 and 2 only. False pockets around erupting teeth make deeper codes unreliable.</li>
<li><b>Age 12 to 17:</b> use the full range of codes, 0 to 4 and *.</li>
<li>A code 4 or * in a young person is unusual. Do a full periodontal assessment with a full-mouth 6PPC and consider specialist referral while starting initial therapy. Consider radiographs for code 3, 4 or *.</li>
</ul>
<p><b>Beyond the BPE.</b> A full assessment adds a 6PPC (probing depths, recession, bleeding), mobility, furcation, plaque and bleeding scores, and radiographs selected under FGDP(UK) criteria (see <a href="#n-rad-sel">selection criteria</a>). Record risk factors: smoking (amount), diabetes control, family history and stress. Bleeding on probing below 10% of sites counts as health in an intact periodontium. That figure drives the gingivitis diagnosis in <a href="#n-perio-class">the 2017 classification</a>.</p>
`, {
  spot: `A stem gives you a BPE grid and asks for the next step, or describes a 9-year-old with "pockets" around erupting teeth.`,
  trap: `Charting the whole mouth for a code 3. BSP 2019 asks for a 6PPC of the code 3 sextant after initial therapy; a full-mouth chart is for code 4 (a * follows the code it is attached to). Also, using codes 3 and 4 in a child under 12.`,
  src: `BSP Basic Periodontal Examination (revised 2019); BSP/BSPD Periodontal screening and management of patients under 18 (2021); BSP Good Practitioner's Guide to Periodontology.`,
  check: `Confirm the under-18 age bands (7 to 11: codes 0 to 2; 12 to 17: full codes) against the current BSP/BSPD under-18 guidance.`
});

node('perio-class', 'perio', '2017 classification: staging and grading', `Periodontitis is staged by bone loss at the worst site and graded by percentage bone loss divided by age; add extent, status and risk factors.`, `
<p>The 2017 World Workshop classification was implemented in the UK by the British Society of Periodontology (BSP) with a simple flowchart. A full diagnostic statement reads like this: <i>generalised periodontitis, stage III, grade B, currently unstable, risk factor: smoker (10 a day)</i>.</p>
<p><b>The BSP flowchart.</b></p>
<ol>
<li>Basic periodontal examination (BPE), plus a look for obvious interdental recession. Codes 0 to 2 with no recession: decide between health and gingivitis using bleeding on probing (BOP). Code 3: radiographs, initial therapy, then review at 3 months with a 6PPC of the involved sextants; if pockets of 4 mm or more or bone loss remain, follow the code 4 pathway. Code 4 (or obvious interdental recession): radiographs and a full periodontal assessment, including a full-mouth 6PPC.</li>
<li>Is there interproximal bone loss due to periodontitis? If yes, the patient has periodontitis. If no, think gingivitis (with false pockets) or another condition.</li>
<li><b>Extent:</b> localised (under 30% of teeth), generalised (30% or more), or molar-incisor pattern.</li>
<li><b>Stage</b> from interproximal bone loss at the worst site.</li>
<li><b>Grade</b> from percentage bone loss at the worst site divided by the patient's age.</li>
<li><b>Current status:</b> stable, in remission or unstable.</li>
<li><b>Risk factors:</b> smoking, diabetes control, others.</li>
</ol>
<div class="scroll"><table class="t">
<tr><th>Item</th><th>Category</th><th>Criterion (BSP implementation)</th></tr>
<tr><td>Stage</td><td>I (early)</td><td>Under 15% bone loss, or under 2 mm attachment loss from the cemento-enamel junction</td></tr>
<tr><td></td><td>II (moderate)</td><td>Bone loss in the coronal third of the root</td></tr>
<tr><td></td><td>III (severe)</td><td>Bone loss to the middle third of the root</td></tr>
<tr><td></td><td>IV (very severe)</td><td>As stage III, plus 5 or more teeth lost to periodontitis and/or a need for complex rehabilitation</td></tr>
<tr><td>Grade</td><td>A (slow)</td><td>% bone loss / age under 0.25</td></tr>
<tr><td></td><td>B (moderate)</td><td>0.5 to 1.0</td></tr>
<tr><td></td><td>C (rapid)</td><td>Over 1.0</td></tr>
<tr><td>Status</td><td>Stable</td><td>BOP under 10%, probing depths 4 mm or less, no BOP at 4 mm sites</td></tr>
<tr><td></td><td>In remission</td><td>BOP 10% or more, probing depths 4 mm or less, no BOP at 4 mm sites</td></tr>
<tr><td></td><td>Unstable</td><td>Probing depth 5 mm or more, or 4 mm with BOP</td></tr>
</table></div>
<p><b>Worked grade.</b> A 40-year-old with 50% bone loss at the worst site: 50 / 40 = 1.25, so grade C. A 60-year-old with the same loss: 50 / 60 = 0.83, so grade B.</p>
<p><b>Gingival conditions.</b> On an intact periodontium, health is BOP under 10%. Gingivitis is BOP 10% or more: localised if 10 to 30%, generalised if over 30%. A patient who has been treated for periodontitis remains a "periodontitis patient" for life, even when stable.</p>
<p><b>Other categories</b> in the classification: necrotising periodontal diseases, periodontitis as a manifestation of systemic disease, periodontal abscesses and endo-perio lesions, mucogingival conditions, and peri-implant health and disease (see <a href="#n-prosth-imp">implants</a>). The old terms "chronic" and "aggressive" periodontitis are gone.</p>
`, {
  spot: `A radiograph description with a percentage bone loss and an age, or a set of pocket depths and BOP after treatment, asking for the stage, grade or status.`,
  trap: `Grading by the total amount of bone loss rather than bone loss divided by age, or calling a patient with 4 mm pockets that bleed "stable". Also: in the BSP version, smoking and diabetes are recorded as risk factors in the statement; they do not form the main grading calculation.`,
  src: `BSP implementation of the 2017 World Workshop classification (Dietrich et al., Br Dent J, 2019) and the BSP flowchart; Papapanou et al. and Tonetti et al., 2018 World Workshop consensus reports.`,
  check: `Stage and grade follow the 2017 World Workshop framework (Tonetti et al., J Clin Periodontol 2018, Tables 3 and 4): grade A is a ratio under 0.25, B is 0.25 to 1.0, C is over 1.0, and stage III and IV are separated by tooth loss (4 or fewer versus 5 or more teeth) and complexity. The BSP flowchart (2024 version) presents a simplified version, so check its cut-offs in the flowchart your exam follows.`
});

node('perio-tx', 'perio', 'Periodontal treatment steps', `BSP S3 care runs in four steps: behaviour change and supragingival care, subgingival instrumentation, surgery or re-treatment, then lifelong supportive care.`, `
<p>The British Society of Periodontology (BSP) adapted the European Federation of Periodontology (EFP) S3 guideline for UK practice. It sets out four steps of care for stage I to III periodontitis.</p>
<div class="scroll"><table class="t">
<tr><th>Step</th><th>What it includes</th></tr>
<tr><td><b>1</b> Guide behaviour change and control risk factors</td><td>Explain the disease. Tailored oral hygiene instruction (OHI), including interdental cleaning (interdental brushes where they fit). Smoking cessation and support with diabetes control. Supragingival professional mechanical plaque removal (PMPR). Remove plaque-retentive factors such as overhangs. Applies to every patient, including those with gingivitis.</td></tr>
<tr><td><b>2</b> Subgingival instrumentation</td><td>Subgingival PMPR with hand or powered (sonic or ultrasonic) instruments, quadrant-wise or full-mouth. Adjuncts only in selected cases. Then re-evaluate.</td></tr>
<tr><td><b>3</b> Treat non-responding sites</td><td>For residual pockets: repeat subgingival instrumentation for moderate pockets; consider access flap, regenerative or resective surgery for deep pockets (6 mm or more), usually with specialist referral.</td></tr>
<tr><td><b>4</b> Supportive periodontal care</td><td>Lifelong maintenance at 3 to 12 month intervals tailored to risk: reinforce OHI and risk-factor control, and re-instrument sites that bleed.</td></tr>
</table></div>
<p><b>Re-evaluation.</b> After step 2, reassess with a six-point pocket chart (6PPC). The treatment endpoint is no pockets over 4 mm with bleeding on probing, and no pockets of 6 mm or more. Patients who reach it move to step 4. Patients who don't, and who are engaged, move to step 3.</p>
<p><b>Adjuncts.</b></p>
<ul>
<li><b>Systemic antibiotics:</b> not routine, because of antimicrobial resistance. They may be considered for specific groups, for example generalised stage III periodontitis in young adults, usually in a specialist setting.</li>
<li><b>Local antimicrobials</b> such as sustained-release chlorhexidine may be considered in selected sites.</li>
<li><b>Chlorhexidine mouthwash</b> can be a short-term adjunct to mechanical cleaning, not a replacement. Warn about staining.</li>
<li><b>Not recommended</b> as adjuncts: lasers, photodynamic therapy and probiotics. The evidence is weak.</li>
</ul>
<p><b>Hygienists and therapists.</b> Under the General Dental Council (GDC) Scope of Practice, both can see patients by direct access. They can deliver steps 1, 2 and 4: OHI, risk-factor advice, supragingival and subgingival instrumentation, and supportive care, and they can take radiographs if trained. They can supply and administer specified prescription-only medicines under legal exemptions if trained, competent and indemnified; otherwise a patient-specific direction (PSD) is needed, and the GDC says patient group directions are being phased out for them. They do not carry out periodontal surgery and do not prescribe independently. The dentist keeps responsibility for anything referred outside their scope.</p>
<p><b>Referral.</b> Consider specialist referral for stage IV disease, grade C in a young patient, non-response after good-quality step 2, complex medical history, or furcation lesions (BSP referral guidance, linked to the case complexity levels in the NHS England commissioning guide).</p>
`, {
  spot: `A patient with residual 6 mm pockets after non-surgical care (step 3), a patient asking for antibiotics "to clear the gums" (adjuncts), or a question about what a hygienist may do on direct access.`,
  trap: `Prescribing systemic antibiotics as routine for periodontitis, or jumping to surgery before step 1 and 2 have been done and re-evaluated.`,
  src: `BSP UK version of the EFP S3 Treatment of Stage I to III Periodontitis guideline (West et al., J Clin Periodontol, 2021; BSP UK version 2020); GDC Scope of Practice and Direct Access guidance (updated 1 November 2025); BSP Guidelines for Periodontal Patient Referral (2020).`,
  check: `The BSP S3 flowchart gives re-evaluation 3 months after step 2. Systemic antibiotics are not routine; if a specialist considers them, take the regimen from the BSP guideline and the BNF. The GDC Direct Access page (updated 1 November 2025) says hygienists and therapists can now supply and administer specified prescription-only medicines under exemptions; check the GDC list for which medicines.`
});

node('surg', 'clin', 'Oral surgery', `Third molar indications (NICE TA1), IAN risk and coronectomy, the common extraction complications, and when an odontogenic infection needs same-day referral.`, `
<p>Oral surgery SBAs test judgement more than technique. Know when to remove a tooth, how to spot the risk to the inferior alveolar nerve (IAN), what to do when an extraction goes wrong, and when an infection has become dangerous.</p>
<ul>
<li><a href="#n-surg-m3m">Third molars</a>: NICE TA1 indications, the Rood and Shehab radiographic signs, cone beam CT (CBCT) and coronectomy.</li>
<li><a href="#n-surg-comp">Extraction complications</a>: dry socket, oroantral communication, tuberosity fracture, bleeding and nerve injury.</li>
<li><a href="#n-surg-inf">Odontogenic infections</a>: drainage first, antibiotics only when spreading or systemic, and the red flags for same-day referral.</li>
</ul>
<p>Bleeding risk with anticoagulants is covered in <a href="#n-med-bleed">anticoagulants and antiplatelets</a>, and antibiotic choice in <a href="#n-pharm-abx">antibiotics</a>.</p>
`, {
  src: `NICE TA1 Guidance on the extraction of wisdom teeth (2000); FDS RCS England Parameters of care for patients undergoing mandibular third molar surgery (2020); SDCEP Drug Prescribing for Dentistry; FGDP(UK) Antimicrobial Prescribing in Dentistry.`,
  spot: `An impacted lower 8, a patient in pain three days after an extraction, or a facial swelling with systemic signs.`,
  trap: `Choosing removal of a symptom-free impacted third molar "to prevent problems", or antibiotics instead of drainage.`
});

node('surg-m3m', 'surg', 'Third molars', `NICE TA1: no prophylactic removal of pathology-free third molars; remove for defined disease. Assess IAN risk on radiographs and consider coronectomy.`, `
<p><b>NICE TA1 (2000)</b> says routine prophylactic removal of pathology-free impacted third molars should stop. Removal is indicated for disease:</p>
<ul>
<li>Unrestorable caries.</li>
<li>Non-treatable pulpal or periapical pathology.</li>
<li>Cellulitis, abscess or osteomyelitis.</li>
<li>Internal or external resorption of the third molar or an adjacent tooth.</li>
<li>Fracture of the tooth.</li>
<li>Disease of the follicle, including cyst or tumour.</li>
<li>The tooth impedes surgery or reconstructive jaw surgery, or lies in the field of tumour resection.</li>
<li><b>Pericoronitis:</b> a second or subsequent episode, or one severe episode. A single mild episode is not an indication.</li>
</ul>
<p>The Faculty of Dental Surgery (FDS) of the Royal College of Surgeons of England parameters of care (2020) also support removal when a partially erupted mesioangular or horizontal lower 8 is causing, or likely to cause, distal caries in the second molar. NICE TA1 itself has not been rewritten.</p>
<p><b>Assessment.</b> Classify the impaction (Winter's: mesioangular, the commonest; vertical; distoangular; horizontal). Take a dental panoramic tomograph (DPT) or periapical radiograph when surgery is planned. Look for the Rood and Shehab signs of a close relationship to the inferior alveolar nerve (IAN) canal:</p>
<div class="scroll"><table class="t">
<tr><th>Root signs</th><th>Canal signs</th></tr>
<tr><td>Darkening of the root where the canal crosses it</td><td>Interruption of the white lines (canal cortex)</td></tr>
<tr><td>Deflection of the root</td><td>Diversion of the canal</td></tr>
<tr><td>Narrowing of the root</td><td>Narrowing of the canal</td></tr>
<tr><td>Dark and bifid apex</td><td></td></tr>
</table></div>
<p>Darkening of the root, interruption of the white line and diversion of the canal are the most predictive (the FDS parameters of care name these three). CBCT is not routine: it may be considered in selected cases where conventional films show a close relationship and the result is expected to change management.</p>
<p><b>Consent</b> covers pain, swelling, trismus, bleeding, infection and dry socket, and nerve injury to the IAN (lower lip and chin) and lingual nerve (tongue and taste), temporary or permanent. Give individualised risk based on the radiographs.</p>
<p><b>Coronectomy.</b> The crown is sectioned off and removed, and the roots are left in place below the alveolar crest, with no root treatment. It lowers the risk of IAN injury when roots are intimately related to the canal. It needs a vital, non-infected tooth. Avoid it if the tooth is mobile, the roots are infected or there is periapical disease, or the patient is at higher risk from retained roots (for example immunocompromise or planned head and neck radiotherapy). Warn that roots can migrate and occasionally need removing later.</p>
`, {
  spot: `A 25-year-old with a symptom-free horizontal lower 8 (leave it), or a second episode of pericoronitis (remove it). A DPT report mentioning a dark band across the root.`,
  trap: `Taking out a pathology-free lower 8 "because it might cause crowding" or because the patient is having a general anaesthetic for something else. Also, offering coronectomy for a tooth with periapical infection.`,
  src: `NICE TA1 (2000); FDS RCS England Parameters of care for mandibular third molar surgery (2020); Rood and Shehab, Br J Oral Maxillofac Surg (1990).`,
  check: `The FDS RCS parameters of care use about 1% for nerve injury in its audit template and cite about 2% permanent IAN injury after conventional removal of high-risk teeth (coronectomy appendix). Quoted figures vary, so give individualised risk and check the document.`
});

node('surg-comp', 'surg', 'Extraction complications', `Dry socket at about days 3 to 4; oroantral communication after upper molar extraction; tuberosity fracture with a lone upper molar.`, `
<div class="scroll"><table class="t">
<tr><th>Complication</th><th>Clues</th><th>Management</th></tr>
<tr><td><b>Dry socket</b> (alveolar osteitis)</td><td>Pain starting about 3 to 4 days after extraction (FDS parameters of care; older texts say 2 to 4), worse than expected and radiating to the ear. Empty socket with bare bone, halitosis, bad taste. No fever or swelling.</td><td>Local anaesthetic, irrigate with warm saline, gently remove debris, place a dressing (for example an iodoform-containing paste: check iodine allergy), analgesics. Review. <b>Antibiotics are not indicated.</b></td></tr>
<tr><td><b>Oroantral communication (OAC)</b></td><td>Upper molar or premolar extraction near the sinus. Bubbling of blood, air through the socket, fluid from the nose, a sinus floor fragment on the root.</td><td>Small: let a clot form, suture the gingiva, sinus precautions. Larger: primary closure with a buccal advancement flap. Advise no nose-blowing, sneeze with the mouth open, no straws. Antibiotics and a nasal decongestant are often given. Root in the sinus: refer.</td></tr>
<tr><td><b>Oroantral fistula</b></td><td>OAC that has epithelialised: fluid reflux, sinusitis.</td><td>Refer for surgical closure (buccal advancement flap or buccal fat pad).</td></tr>
<tr><td><b>Tuberosity fracture</b></td><td>Lone-standing upper molar, especially with a large sinus. Tuberosity moves with the tooth, a crack, palatal tear.</td><td>Stop. If the fragment is small, free of attachments: remove and close. If large: stabilise (splint to adjacent teeth), relieve occlusion, delay extraction for several weeks or refer for surgical removal.</td></tr>
<tr><td><b>Haemorrhage</b></td><td>Primary, reactionary (within about 24 hours), secondary (infection, days later).</td><td>Pressure with damp gauze, local anaesthetic with vasoconstrictor, haemostatic agent (oxidised cellulose), sutures, tranexamic acid mouthwash. Check medical history and drugs (see <a href="#n-med-bleed">bleeding</a>).</td></tr>
<tr><td><b>Nerve injury</b></td><td>Numbness or altered sensation after lower 8 removal.</td><td>Record extent, reassure, review; refer early to oral surgery if not resolving, especially lingual nerve injury.</td></tr>
<tr><td><b>Displaced root or tooth</b></td><td>Lost into the sinus, the lingual pouch or infratemporal fossa.</td><td>Don't chase it blind. Radiograph and refer.</td></tr>
</table></div>
<p><b>Dry socket risk factors:</b> smoking, lower teeth (especially third molars), traumatic or long extractions, previous dry socket, female sex and the combined oral contraceptive. Advise no smoking and no vigorous rinsing for 24 hours, then warm salty mouthwashes. Pre-operative chlorhexidine rinse may lower the risk.</p>
<p><b>Preventing complications.</b> Take a radiograph before extracting a lone upper molar or a tooth close to the sinus, and plan a surgical approach (sectioning) rather than forceful luxation. Other complications include fractured roots, damage to adjacent teeth and restorations, mandibular fracture with deeply impacted lower 8s, and dislocation of the temporomandibular joint (reduce downwards and backwards).</p>
`, {
  spot: `Pain three days after a lower molar extraction with halitosis (dry socket). Bubbling from an upper 6 socket (OAC). Upper 7 extraction where the tuberosity moves with the tooth.`,
  trap: `Prescribing antibiotics for dry socket; telling an OAC patient to blow their nose to "test" it; forcing out a tooth when the tuberosity is fractured.`,
  src: `SDCEP Drug Prescribing for Dentistry (dry socket management); oral surgery texts; SDCEP Management of Dental Patients Taking Anticoagulants or Antiplatelet Drugs (2nd ed, 2022).`,
  check: `Antibiotics and decongestants after OAC closure are common practice rather than firm guideline; check local OMFS protocols. Splinting time before delayed removal of a tooth with a fractured tuberosity (often quoted as 6 to 8 weeks) varies by source.`
});

node('surg-inf', 'surg', 'Odontogenic infections', `Drain the source first; antibiotics only for spreading infection or systemic signs. Airway threat, trismus, dysphagia, eye closure or sepsis means same-day referral.`, `
<p><b>Principle.</b> Remove the cause and establish drainage: extraction, pulp extirpation, or incision of a fluctuant swelling. A localised dental abscess without spreading infection or systemic involvement does not need antibiotics. Antibiotics are an adjunct when infection is spreading (cellulitis, lymph node involvement), the patient is systemically unwell (fever, malaise), or drainage cannot be achieved. Any clinical concern in an immunocompromised patient means hospital transfer. Review ideally at 3 days, and stop the antibiotic once systemic signs have resolved.</p>
<div class="scroll"><table class="t">
<tr><th>Antibiotic (SDCEP, only if indicated)</th><th>Adult regimen</th></tr>
<tr><td>Phenoxymethylpenicillin (first choice)</td><td>500 mg four times daily (two 250 mg tablets) for 5 days; suggested duration 3 to 5 days; double the dose in severe infection</td></tr>
<tr><td>Amoxicillin (alternative, mainly where adherence to penicillin V is likely to be hard)</td><td>500 mg three times daily for 5 days; suggested duration 3 to 5 days; double the dose in severe infection</td></tr>
<tr><td>Metronidazole (penicillin allergy, or added to penicillin for severe spreading infection or fever)</td><td>400 mg three times daily for 5 days; suggested duration 3 to 5 days</td></tr>
<tr><td>Clindamycin or clarithromycin</td><td>Second line only, for severe infection after a full first-line course has failed. Review the diagnosis and drainage, and refer or take specialist advice before prescribing (SDCEP).</td></tr>
</table></div>
<p>More detail, including stewardship, is in <a href="#n-pharm-abx">antibiotics</a>.</p>
<p><b>Red flags: transfer to hospital immediately as an emergency (oral and maxillofacial surgery (OMFS) or the emergency department). Call 999 if the airway is compromised or sepsis is suspected (SDCEP).</b></p>
<ul>
<li>Airway: difficulty breathing, stridor, voice change ("hot potato" voice).</li>
<li>Difficulty swallowing (dysphagia), drooling, or unable to swallow fluids.</li>
<li>Raised floor of mouth or tongue; swelling crossing the midline under the jaw.</li>
<li>Marked trismus.</li>
<li>Swelling closing the eye, or periorbital spread.</li>
<li>Systemic signs: fever, tachycardia, rigors, dehydration, confusion. If sepsis is suspected, call 999 for an ambulance; the UK Sepsis Trust provides screening tools for primary dental care.</li>
<li>Rapid progression, or failure to respond to drainage and antibiotics.</li>
<li>Higher-risk patients: immunocompromised, poorly controlled diabetes, very young or frail.</li>
</ul>
<p><b>Named conditions.</b></p>
<ul>
<li><b>Ludwig's angina:</b> bilateral cellulitis of the submandibular, sublingual and submental spaces, usually from lower molars. Brawny swelling, raised tongue, airway threat. Emergency.</li>
<li><b>Cavernous sinus thrombosis:</b> spread from the upper face or canine region via the valveless facial and ophthalmic veins. Proptosis, ptosis, eye movement palsies, headache. Emergency.</li>
<li><b>Necrotising fasciitis</b> and <b>descending mediastinitis</b> are rare but fatal.</li>
</ul>
<p><b>Spread follows anatomy.</b> Roots of the lower second and third molars lie below the mylohyoid line and drain to the submandibular space; first molar and premolar roots lie above it and drain to the sublingual space (so do the incisors)  Upper teeth can spread to the buccal space, the infraorbital region or the palate. Record findings, measurements and observations (temperature, pulse) in the notes.</p>
`, {
  spot: `A swollen face with a temperature of 38.5 C and difficulty swallowing; a patient who cannot open more than one finger-width; a dental abscess with no systemic signs asking for antibiotics.`,
  trap: `Prescribing antibiotics and sending the patient home when there are airway or swallowing signs; or giving antibiotics without drainage for a localised abscess.`,
  src: `SDCEP Drug Prescribing for Dentistry (Dental Prescribing website; bacterial infections section updated May 2026); FGDP(UK) Antimicrobial Prescribing in Dentistry (2020); NICE NG51 Sepsis (updated 2024).`,
  check: `The doses above were read from the SDCEP Dental Prescribing website (bacterial infections section updated May 2026) and match the BNF at the time; recheck if you are reading a later update.`
});
